<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Difference</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='70' font-size='60' font-family='Arial' fill='%23ff6b6b'%3E🔍%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Comic Sans MS', cursive, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; overflow: hidden; }
    #gameContainer { position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #gameCanvas { background: #fff; border: 3px solid #ff6b6b; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    hud { position: absolute; top: 15px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: auto; }
    timer { background: #ff6b6b; color: white; padding: 10px 20px; border-radius: 25px; font-size: 20px; font-weight: bold; }
    level-info { background: #4ecdc4; color: white; padding: 10px 20px; border-radius: 25px; font-size: 18px; }
    controls { display: flex; gap: 15px; position: absolute; bottom: 20px; left: 0; right: 0; justify-content: center; pointer-events: auto; }
    button { background: #ff6b6b; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
    button:hover { background: #ff5252; transform: scale(1.05); }
    #startBtn, #hintBtn, #soundBtn { background: #4ecdc4; }
    #startBtn:hover, #hintBtn:hover, #soundBtn:hover { background: #45b7b1; }
    screen { display: none; }
    active { display: block; }
    #startScreen, #completeScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; z-index: 100; }
    #startScreen h1, #completeScreen h2 { color: white; font-size: 3em; margin-bottom: 20px; }
    #difficultySelect { display: flex; gap: 15px; margin: 20px 0; }
    difficulty-btn { padding: 15px 30px; font-size: 18px; }
    #highScore { margin-top: 20px; color: #ffd93d; font-size: 1.5em; }
    #accuracy { font-size: 2em; color: #69db7c; margin: 20px 0; }
    #stars { font-size: 2.5em; color: #ffd93d; letter-spacing: 5px; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1200" height="700"></canvas>
    <div class="ui-overlay">
      <div class="hud">
        <div class="timer" id="timer">90</div>
        <div class="level-info" id="levelInfo">Level 1</div>
      </div>
      <div class="controls">
        <button id="hintBtn">💡 Hint</button>
        <button id="soundBtn">🔊 Sound</button>
      </div>
    </div>
    <div id="startScreen" class="screen active">
      <h1>🔍 SPOT THE DIFFERENCE</h1>
      <div id="difficultySelect">
        <button class="difficulty-btn" data-diff="easy">Easy</button>
        <button class="difficulty-btn" data-diff="medium">Medium</button>
        <button class="difficulty-btn" data-diff="hard">Hard</button>
      </div>
      <button id="startBtn" style="padding: 15px 40px; font-size: 20px; background: #ff6b6b;">START GAME</button>
    </div>
    <div id="completeScreen" class="screen">
      <h2>🎉 LEVEL COMPLETE!</h2>
      <div id="accuracy">100%</div>
      <div id="stars">★★<span style="color: #555;">★</span></div>
      <button id="nextBtn" style="padding: 12px 30px; font-size: 18px;">NEXT LEVEL</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
