<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alchemical Rhythm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='50' cy='10' r='10' fill='%23ff6b6b'/><text x='50' y='20' text-anchor='middle' fill='%23667a3a' font-size='12'>🧪</text></svg>">
    <link rel="stylesheet" href="src/styles.css">
    <style>
        html,body{margin:0;padding:0;overflow:hidden;background:#1a0a2e;font-family:sans-serif;touch-action:none;user-select:none}
        #wrap{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
        canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100vw;max-height:100vh;width:auto;height:auto}
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    
    <!-- Speedrun Timer (top left) -->
    <div class="speedrun-timer" id="speedrunTimer">
        <span id="timerValue">0</span>s
    </div>
    
    <!-- HUD -->
    <div class="hud">
        <div class="score-display" id="scoreDisplay">Score: 0</div>
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="combo-indicator" id="comboIndicator">Combo: x0</div>
        <div class="level-indicator" id="levelIndicator">Level 1</div>
    </div>
    
    <script src="src/game-state.js"></script>
    <script src="src/game.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/physics.js"></script>
    <script src="src/particle.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/level-manager.js"></script>
</body>
</html>
