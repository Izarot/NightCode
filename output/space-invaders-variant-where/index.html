<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Splinter Command</title>
<link rel href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=ShareMono&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w%27t%27t%27s/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="score-box"><span class="label">SCORE</span><span id="score">0</span></div>
    <div id="wave-box"><span class="label">WAVE</span><span id="wave">1</span><div id="wave-bar"><i id="wave-fill"></i></div></div>
    <div id="threat-box"><span class="label">THREAT</span><span id="threat">0</span></div>
  </div>
  <div id="health-bar"><i id="health-fill"></i></div>
  <div id="timer">00:00</div>
  <div id="pause-overlay" class="hidden">
    <h1>SPLINTER COMMAND</h1>
    <button id="resume-btn">RESUME</button>
    <button id="restart-btn">RESTART</button>
  </div>
  <div id="start-screen">
    <h1>SPLINTER COMMAND</h1>
    <p>Arrow keys / WASD to move · Space / Click to shoot</p>
    <button id="start-btn">LAUNCH</button>
    <p id="best-score">BEST: 0</p>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
