<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TILE-STRAT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='50%' x='50%' dominant-baseline='middle' text-anchor='middle' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E">
<style>
body{margin:0;overflow:hidden;background:#111;color:#fff;font-family:sans-serif}
#canvas{display:block}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center}
#turn{position:absolute;top:10px;right:10px}
#timer{position:absolute;top:10px;right:50px}
#tileTray{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.tile{width:40px;height:40px;background:#222;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.tile:hover{opacity:0.8}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
<div id="turn">Turn 0</div>
<div id="timer">00:00</div>
<div id="tileTray"></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
