<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Line-Turn</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎮</text></svg>'>
<style>
body { margin: 0; background: #0d0d0d; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #0d0d0d; }
</style>
</head>
<body>
<canvas id='game'></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;
const dpr = window.devicePixelRatio || 1;
canvas.width = 800 * dpr;
canvas.height = 600 * dpr;
ctx.scale(dpr, dpr);
const player = { x: 100, y: 100, w: 32, h: 32, vx: 0, vy: 0 };
const obstacles = [];
let turn = 0;
let score = 0;
let lives = 3;
let timer = 5;
let lastTime = 0;
let highScore = localStorage.getItem('lineTurn_highScore') || 0;
function loop(t) {
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
function update(dt) {
  // player movement
player.x += player.vx * dt;
  player.y += player.vy * dt;
  // collisions
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y) {
      lives--;
      if (lives <= 0) {
        // game over
      }
    }
  }
</script>
</body>
</html>
