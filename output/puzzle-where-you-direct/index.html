<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Circuit Puzzle</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; }
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .hud-item { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-item" id="timerDisplay">60s</div>
        <div class="hud-item" id="activeLoadCounter">0/12</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="main.js"></script>
</body>
</html>
