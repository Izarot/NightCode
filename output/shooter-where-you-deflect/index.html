<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deflect Blade</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='80' font-family='Arial' fill='%23FFD700'%3E⚔️%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0D0D0D; }
        canvas { display: block; width: 100%; height: 100%; }
        body { font-family: 'Courier New', monospace; color: #00FFC5; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #hud, #overlay { position: absolute; }
        #hud { top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: auto; }
        #healthBar, #scoreDisplay, #timerDisplay { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        #healthFill { width: 200px; height: 20px; background: linear-gradient(90deg, #FF3B30, #FF9500); border-radius: 3px; }
        #comboBadge { background: #FFD700; color: #0D0D0D; padding: 5px 10px; border-radius: 3px; font-weight: bold; }
        #overlay { display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: auto; }
        button { background: #00FFC5; color: #0D0D0D; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #00FFD5; }
        #touchControls { display: none; position: absolute; bottom: 20px; width: 100%; pointer-events: auto; }
        #joystick, #attackBtn { background: rgba(255,255,255,0.2); border-radius: 50%; }
        #joystick { position: absolute; left: 20px; width: 100px; height: 100px; }
        #attackBtn { position: absolute; right: 20px; width: 80px; height: 80px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="hud">
            <div id="healthBar">
                <div id="healthFill"><span id="healthText">100/100</span></div>
            </div>
            <div id="scoreDisplay">Score: <span id="score">0</span></div>
            <div id="timerDisplay">Time: <span id="timer">0.00</span>s</div>
        </div>
        <div id="overlay">
            <h1 id="overlayTitle">GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>High Score: <span id="highScoreDisplay">0</span></p>
            <button id="restartBtn">Play Again</button>
            <button id="settingsBtn">Settings</button>
            <button id="quitBtn">Quit</button>
        </div>
    </div>
    <div id="touchControls">
        <div id="joystick"></div>
        <div id="attackBtn">⚔️</div>
    </div>
    <script src="main.js"></script>
</body>
</html>
