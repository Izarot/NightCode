<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shape Path Puzzle — Crouton Alpha</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="hud top-hud glass">
    <div class="hud-left">
      <div class="logo">◆ SHAPE<span>PATH</span></div>
      <div id="levelLabel" class="mono">LEVEL 1/3</div>
    </div>
    <div class="hud-center">
      <div id="movesLabel" class="mono">Moves: 0/8</div>
      <div class="progress-wrap"><div id="progressBar"></div></div>
      <div id="statusLabel" class="mono status">Place shapes to connect START → END</div>
    </div>
    <div class="hud-right mono">
      <div id="timerLabel" title="Speedrun Timer">⏱ 00:00.0</div>
      <div id="highScoreLabel" title="High Score">🏆 --</div>
      <div class="btn-row">
        <button id="undoBtn" class="pill">↩ Undo</button>
        <button id="resetBtn" class="pill">Reset</button>
        <button id="hintBtn" class="pill">Hint</button>
        <button id="soundBtn" class="pill">🔊</button>
      </div>
    </div>
  </header>

  <main id="stage">
    <div id="canvasWrap">
      <canvas id="gameCanvas" width="512" height="512"></canvas>
      <div id="dragGhost" class="hidden"></div>
    </div>
    <div id="controls" class="glass">
      <button id="runBtn" class="big-btn">▶ RUN TOKEN</button>
      <button id="rotateBtn" class="big-btn alt">⟳ ROTATE (R)</button>
      <button id="clearBtn" class="big-btn alt">✕ CLEAR CELL</button>
    </div>
  </main>

  <footer class="hud bottom-hud glass">
    <div class="dock-label mono">INVENTORY — tap a shape, then tap grid • drag also works • R rotates</div>
    <div id="dock"></div>
  </footer>

  <div id="modalOverlay" class="hidden">
    <div id="modal" class="glass modal-card">
      <div id="modalEmoji">🎉</div>
      <h2 id="modalTitle">LEVEL COMPLETE!</h2>
      <p id="modalText" class="mono">Time: 0s</p>
      <p id="modalScore" class="mono score-line"></p>
      <button id="modalBtn" class="big-btn">Next Level →</button>
    </div>
  </div>
</div>
<script src="js/levels.js"></script>
<script src="js/board.js"></script>
<script src="js/token.js"></script>
<script src="js/particles.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
