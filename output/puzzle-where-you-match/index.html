<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORBITALIS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FF5D73'/%3E%3Cpath d='M50 15 L85 85 L15 85 Z' fill='%23FFE9A8'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #0B1020, #131A33); }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px; pointer-events: none; }
    .top-left { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; }
    .top-right { position: absolute; top: 10px; right: 10px; }
    .bottom { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
    button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 8px 12px; color: white; cursor: pointer; }
    .timer { position: absolute; top: 10px; right: 10px; color: #4ADE80; font-family: monospace; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud"><div class="top-left" id="levelInfo">LEVEL 01</div><div class="timer" id="timer">00:00</div><div class="top-right"><button id="pauseBtn">⏸</button></div></div>
  <div class="bottom"><button id="undoBtn">↩</button><button id="restartBtn">⟳</button><button id="hintBtn">💡</button><button id="soundBtn">🔊</button></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let dpr = Math.min(window.devicePixelRatio, 2);
    let W, H, RB, S = 8;
    let rings = [];
    let selected = 0;
    let dragging = null;
    let lastTime = 0;
    let accumulator = 0;
    let dt = 1/120;
    let angle = Array(5).fill(0);
    let locked = Array(5).fill().map(() => Array(12).fill(null));
    let moves = 0, par = 5;
    let highScore = 0;
    let soundEnabled = true;
    let timer = 0;
    let running = true;
    const shapes = ['△', '□', '⬟', '⬡', '●'];
    const colors = ['#FF5D73', '#FFC145', '#4ADE80', '#38BDF8', '#C084FC'];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.scale(dpr, dpr);
      RB = Math.min(W, H) * 0.44;
    }
    
    function initRings() {
      for (let r = 0; r < 5; r++) {
        rings[r] = {
          radius: RB * (0.26 + 0.155 * r),
          angle: Math.random() * 2 * Math.PI / S * 10,
          target: null,
          velocity: 0,
          dragging: false,
          drift: false
        };
      }
    }
    
    function genLevel() {
      const solved = [];
      for (let i = 0; i < S; i++) solved.push(i % 5);
      for (let r = 0; r < 5; r++) {
        angle[r] = (Math.floor(Math.random() * S) + 1) * 2 * Math.PI / S;
      }
      moves = 0;
      timer = 0;
    }
    
    function draw() {
      ctx.fillStyle = 'radial-gradient(circle at 50% 50%, #0B1020, #131A33)';
      ctx.fillRect(0, 0, W, H);
      
      ctx.save();
      ctx.translate(W/2, H/2);
      
      for (let r = 0; r < 5; r++) {
        const ring = rings[r];
        ctx.beginPath();
        ctx.arc(0, 0, ring.radius + 3);
        ctx.strokeStyle = '#2A3558';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      
      for (let r = 0; r < 5; r++) {
        const ring = rings[r];
        for (let s = 0; s < S; s++) {
          const a = ring.angle + s * 2 * Math.PI / S;
          const x = Math.cos(a) * ring.radius;
          const y = Math.sin(a) * ring.radius;
          const shape = (s + r + Math.floor(angle[r] * S / (2*Math.PI))) % S;
          const shapeType = shapes[shape % shapes.length];
          const color = colors[shape % colors.length];
          
          ctx.fillStyle = color;
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(shapeType, x, y);
        }
      }
      
      ctx.restore();
    }
    
    function update(dt) {
      if (!running) return;
      timer += dt;
      for (let r = 0; r < 5; r++) {
        if (rings[r].dragging) {
          const mx = (pointer.x - W/2) * dpr;
          const my = (pointer.y - H/2) * dpr;
          const a = Math.atan2(my, mx);
          rings[r].angle = a;
        }
      }
    }
    
    let pointer = {x: 0, y: 0, down: false};
    canvas.addEventListener('pointerdown', e => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.down = true;
      const cx = W/2, cy = H/2;
      const dx = pointer.x - cx, dy = pointer.y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      for (let r = 4; r >= 0; r--) {
        if (dist >= rings[r].radius - 15 && dist <= rings[r].radius + 15) {
          dragging = r;
          rings[r].dragging = true;
          rings[r].velocity = 0;
          return;
        }
      }
    });
    
    canvas.addEventListener('pointermove', e => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });
    
    canvas.addEventListener('pointerup', e => {
      if (dragging !== null) {
        rings[dragging].dragging = false;
        const snap = 2 * Math.PI / S;
        const target = Math.round(rings[dragging].angle / snap) * snap;
        rings[dragging].angle = target;
        playSnap();
        moves++;
      }
      dragging = null;
    });
    
    function playSnap() {
      if (!soundEnabled) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 200 + Math.random() * 100;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }
    
    function loop(ts) {
      const now = ts / 1000;
      const frameDt = now - lastTime;
      lastTime = now;
      accumulator += frameDt;
      
      while (accumulator >= dt) {
        update(dt);
        accumulator -= dt;
      }
      
      draw();
      
      const mins = Math.floor(timer / 60);
      const secs = Math.floor(timer % 60);
      document.getElementById('timer').textContent = 
        mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
      
      requestAnimationFrame(loop);
    }
    
    window.addEventListener('resize', resize);
    resize();
    initRings();
    genLevel();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
