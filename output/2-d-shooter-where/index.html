<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>SPLITSHOT 💥</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💥</text></svg>'>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#050510;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0b0b2a 0%,#050510 70%)}
canvas{display:block;background:#050510;box-shadow:0 0 60px #00f0ff33,0 0 120px #ff2e8833;border:1px solid #00f0ff44;width:min(100vw,177.78vh);height:min(56.25vw,100vh);aspect-ratio:16/9;touch-action:none}
#hint{position:fixed;left:8px;bottom:6px;font-size:11px;color:#00f0ff88;pointer-events:none}
</style>
</head>
<body>
<div id='wrap'><canvas id='c' width='1280' height='720'></canvas></div><div id='hint'>WASD move • Mouse aim • Hold LMB fire • Shift/RMB dash • Space Nova • M mute • ESC pause</div>
<script>
'use strict';
const W=1280,H=720,canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();
// SNEAKY: responsive scaling via CSS width min(100vw,177vh) + DPR canvas, emoji favicon, vibrant palette #00F0FF/#FF6B35/#FF2E88/#B967FF/#39FF6A
let high=+(localStorage.getItem('splitshot_high')||0),muted=localStorage.getItem('splitshot_mute')==='1';
let AC=null;function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function sfx(f,d,type,v,slide){if(muted)return;try{let a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.setValueAtTime(v||0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const keys={},mouse={x:W/2,y:H/2,down:false,rdown:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='KeyM'){muted=!muted;localStorage.setItem('splitshot_mute',muted?'1':'0');}if(e.code==='Escape'||e.code==='KeyP')togglePause();if((e.code==='Space'||e.code==='KeyE')&&state==='play'&&meter>=10)nova();if(state==='upgrade'&&['Digit1','Digit2','Digit3'].includes(e.code))pickUpgrade(+e.code.slice(-1)-1);if(state==='title'&&(e.code==='Enter'||e.code==='Space'))startGame();if(state==='over'&&e.code==='Enter')startGame();});
addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('mousemove',e=>{let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H;});
canvas.addEventListener('mousedown',e=>{audio();if(e.button===0)mouse.down=true;if(e.button===2){mouse.rdown=true;tryDash();}if(state==='title')startGame();else if(state==='over'&&mouse.y>520)startGame();else if(state==='pause'&&mouse.y>380&&mouse.y<560){if(mouse.y<440){state='play';}else if(mouse.y<500){startGame();}else{state='title';}}else if(state==='upgrade'){for(let i=0;i<3;i++){let x=340+i*210,y=300;if(mouse.x>x&&mouse.x<x+190&&mouse.y>y&&mouse.y<y+180)pickUpgrade(i);}}});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.rdown=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// Touch twin stick basic: left half move, right half aim+fire
let touchMove=null,touchAim=null;
canvas.addEventListener('touchstart',e=>{e.preventDefault();audio();if(state==='title'){startGame();return;}for(let t of e.changedTouches){let r=canvas.getBoundingClientRect(),x=(t.clientX-r.left)/r.width*W,y=(t.clientY-r.top)/r.height*H;if(x<W/2)touchMove={id:t.identifier,x,y};else{touchAim={id:t.identifier,x,y};mouse.x=x;mouse.y=y;mouse.down=true;}}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches){let r=canvas.getBoundingClientRect(),x=(t.clientX-r.left)/r.width*W,y=(t.clientY-r.top)/r.height*H;if(touchMove&&t.identifier===touchMove.id)touchMove.x=x,touchMove.y=y;if(touchAim&&t.identifier===touchAim.id){touchAim.x=x;touchAim.y=y;mouse.x=x;mouse.y=y;}}},{passive:false});
canvas.addEventListener('touchend',e=>{for(let t of e.changedTouches){if(touchMove&&t.identifier===touchMove.id)touchMove=null;if(touchAim&&t.identifier===touchAim.id){touchAim=null;mouse.down=false;}}});
// Pools - zero alloc in loop
function makePool(n,f){let a=[];for(let i=0;i<n;i++)a.push(f());return a;}
const carriers=makePool(300,()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,dist:0,dmg:1,r:5,trail:[]}));
const subs=makePool(300,()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,dmg:1,r:3,pierce:0,hit:new Set(),depth:1}));
const micros=makePool(300,()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,dmg:1,r:2}));
const ebullets=makePool(200,()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,r:4}));
const enemies=makePool(150,()=>({on:false,type:0,x:0,y:0,vx:0,vy:0,hp:3,maxhp:3,r:12,speed:100,fire:0,flash:0,spawn:0,strafe:1}));
const parts=makePool(500,()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,max:1,col:'#fff',r:2}));
const rings=makePool(50,()=>({on:false,x:0,y:0,r:0,life:0,col:'#fff'}));
const neb=makePool(40,()=>({x:Math.random()*W,y:Math.random()*H,s:20+Math.random()*60,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,col:['#00F0FF','#FF2E88','#B967FF','#FF6B35'][Math.floor(Math.random()*4)]}));
function getP(a){for(let o of a)if(!o.on)return o;let o=a[0];return o;}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){let p=getP(parts),a=Math.random()*6.283,s=(sp||200)*(0.3+Math.random());p.on=true;p.x=x;p.y=y;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;p.life=p.max=0.3+Math.random()*0.4;p.col=col;p.r=1+Math.random()*3;}}
function ring(x,y,col){let r=getP(rings);r.on=true;r.x=x;r.y=y;r.r=4;r.life=0.35;r.col=col;}
// Game state
let state='title',score=0,mult=1,streakT=0,kills=0,shots=0,hits=0,wave=0,waveLeft=0,spawnQ=[],spawnT=0,meter=0,shake=0,hitstop=0,slowmo=1,runStart=0,runTime=0,shield=0,fracture=false;
let mods={split:4,wide:false,rapid:0,heavy:0,pierce:0};
let player={x:W/2,y:H/2,vx:0,vy:0,ang:0,hp:100,maxhp:100,fireT:0,dashT:0,dashCD:0,inv:0,trail:[]};
function resetPlayer(){player.x=W/2;player.y=H/2;player.vx=player.vy=0;player.hp=100;player.dashCD=0;player.inv=0;shield=0;fracture=false;mods={split:4,wide:false,rapid:0,heavy:0,pierce:0};meter=0;mult=1;}
function startGame(){for(let a of [carriers,subs,micros,ebullets,enemies,parts,rings])for(let o of a)o.on=false;score=0;kills=0;shots=0;hits=0;wave=0;runStart=performance.now();runTime=0;resetPlayer();state='play';nextWave();sfx(440,0.2,'sine',0.15,440);}
function nextWave(){wave++;waveLeft=0;spawnQ=[];let n=6+wave*3;if(wave%5===0){spawnQ.push(9);waveLeft=1;}else{for(let i=0;i<n;i++){let r=Math.random();spawnQ.push(r<0.5?0:r<0.7?1:r<0.85?2:3);waveLeft++;}}spawnT=0;}
function spawnEnemy(type){let e=getP(enemies);let side=Math.floor(Math.random()*4),x,y;if(side===0){x=Math.random()*W;y=-30;}else if(side===1){x=W+30;y=Math.random()*H;}else if(side===2){x=Math.random()*W;y=H+30;}else{x=-30;y=Math.random()*H;}let hpMul=wave>5?1+(wave-5)*0.1:1;e.on=true;e.type=type;e.x=x;e.y=y;e.vx=e.vy=0;e.spawn=0.5;e.flash=0;e.fire=1+Math.random();e.strafe=Math.random()<0.5?-1:1;
if(type===0){e.hp=e.maxhp=Math.round(3*hpMul);e.r=12;e.speed=140;}else if(type===1){e.hp=e.maxhp=Math.round(5*hpMul);e.r=14;e.speed=90;}else if(type===2){e.hp=e.maxhp=Math.round(4*hpMul);e.r=12;e.speed=110;}else if(type===3){e.hp=e.maxhp=Math.round(20*hpMul);e.r=28;e.speed=55;}else{e.hp=e.maxhp=Math.round(150*hpMul);e.r=42;e.speed=70;}}
function togglePause(){if(state==='play')state='pause';else if(state==='pause')state='play';}
function tryDash(){if(state!=='play'||player.dashCD>0)return;let dx=0,dy=0;if(keys.KeyW||keys.ArrowUp)dy-=1;if(keys.KeyS||keys.ArrowDown)dy+=1;if(keys.KeyA||keys.ArrowLeft)dx-=1;if(keys.KeyD||keys.ArrowRight)dx+=1;if(dx===0&&dy===0){dx=Math.cos(player.ang);dy=Math.sin(player.ang);}let l=Math.hypot(dx,dy);player.vx=dx/l*1125;player.vy=dy/l*1125;player.dashT=0.16;player.dashCD=1.2;player.inv=Math.max(player.inv,0.25);sfx(300,0.15,'sine',0.12,600);burst(player.x,player.y,'#00F0FF',8,150);}
function nova(){meter=0;for(let c of carriers)if(c.on)splitCarrier(c);sfx(880,0.3,'sine',0.15,-400);ring(player.x,player.y,'#00F0FF');}
function splitCarrier(c){if(!c.on)return;c.on=false;let base=Math.atan2(c.vy,c.vx);let arc=mods.wide?140:90;let n=mods.split;for(let i=0;i<n;i++){let off=n===1?0:(-arc/2+arc*i/(n-1))*Math.PI/180;let a=base+off+(Math.random()-.5)*0.05;let s=getP(subs);s.on=true;s.x=c.x;s.y=c.y;s.vx=Math.cos(a)*620;s.vy=Math.sin(a)*620;s.life=0.55;s.dmg=c.dmg;s.r=3;s.pierce=mods.pierce;s.depth=1;s.hit=new Set();}burst(c.x,c.y,'#FF6B35',8,220);ring(c.x,c.y,'#FF2E88');meter=Math.min(10,meter+1);sfx(700,0.08,'square',0.06,-200);}
function splitSub(s){s.on=false;let base=Math.atan2(s.vy,s.vx);for(let i=0;i<2;i++){let a=base+(i===0?-0.4:0.4);let m=getP(micros);m.on=true;m.x=s.x;m.y=s.y;m.vx=Math.cos(a)*480;m.vy=Math.sin(a)*480;m.life=0.35;m.dmg=1;m.r=2;}burst(s.x,s.y,'#FF2E88',5,150);}
function damagePlayer(){if(player.inv>0)return;if(shield>0){shield--;player.inv=1;sfx(500,0.15,'sine',0.12,-200);return;}player.hp-=10;player.inv=0.5;shake=4;streakT=0;mult=1;sfx(150,0.2,'sawtooth',0.15,-80);burst(player.x,player.y,'#FF3B3B',12,250);if(player.hp<=0){player.hp=0;gameOver();}}
function gameOver(){state='over';if(score>high){high=score;localStorage.setItem('splitshot_high',high);}sfx(100,0.6,'sawtooth',0.2,-50);}
function killEnemy(e){kills++;streakT=5;mult=Math.min(9,1+Math.floor(kills/8));let pts=(e.type===3?200:e.type===9?1000:e.type===1?80:50)*mult;score+=pts;burst(e.x,e.y,['#FF3B3B','#39FF6A','#B967FF','#FFAA00','#FF2E88'][e.type===9?4:e.type]||'#fff',20,300);ring(e.x,e.y,'#fff');sfx(200,0.25,'sawtooth',0.12,-120);
if(e.type===1){for(let i=0;i<3;i++){let c=getP(enemies);c.on=true;c.type=0;c.x=e.x+(Math.random()-.5)*20;c.y=e.y+(Math.random()-.5)*20;c.hp=c.maxhp=3;c.r=12;c.speed=140;c.spawn=0;c.flash=0;c.fire=1;}}
if(e.type===3){shake=Math.max(shake,2);hitstop=0.03;for(let i=0;i<8;i++){let b=getP(ebullets);let a=i/8*6.283;b.on=true;b.x=e.x;b.y=e.y;b.vx=Math.cos(a)*280;b.vy=Math.sin(a)*280;b.life=3;}}
if(e.type===9){hitstop=0.03;for(let i=0;i<16;i++){let b=getP(ebullets);let a=i/16*6.283;b.on=true;b.x=e.x;b.y=e.y;b.vx=Math.cos(a)*280;b.vy=Math.sin(a)*280;b.life=3;}for(let i=0;i<4;i++)spawnEnemy(0);}
if(Math.random()<0.15)dropPower(e.x,e.y);}
let powers=[];function dropPower(x,y){let r=Math.random();powers.push({x,y,kind:r<0.4?'hp':r<0.7?'frac':'shield',t:8});}
let upgrades=[];function showUpgrades(){state='upgrade';let pool=[{id:'split',name:'SPLIT+1',desc:'+1 sub per split (max 7)'},{id:'wide',name:'WIDE SPLIT',desc:'Split arc 90 to 140 deg'},{id:'rapid',name:'RAPID CARRIER',desc:'+25% fire rate'},{id:'heavy',name:'HEAVY CARRIER',desc:'Carrier dmg 2, -20% rate'},{id:'pierce',name:'PIERCING SUBS',desc:'Subs pierce +1 enemy'},{id:'frac',name:'FRACTURE CORE',desc:'Subs split into micros'},{id:'hp',name:'REPAIR',desc:'+30 Hull'}];upgrades=[];for(let i=0;i<3;i++){let u=pool[Math.floor(Math.random()*pool.length)];if(!upgrades.includes(u))upgrades.push(u);}while(upgrades.length<3)upgrades.push(pool[0]);}
function pickUpgrade(i){let u=upgrades[i];if(!u)return;if(u.id==='split')mods.split=Math.min(7,mods.split+1);if(u.id==='wide')mods.wide=true;if(u.id==='rapid')mods.rapid++;if(u.id==='heavy')mods.heavy++;if(u.id==='pierce')mods.pierce++;if(u.id==='frac')fracture=true;if(u.id==='hp')player.hp=Math.min(player.maxhp,player.hp+30);sfx(660,0.15,'sine',0.12,220);state='play';}
// Spatial hash
let hash=new Map();function buildHash(){hash.clear();for(let e of enemies)if(e.on&&e.spawn<=0){let k=Math.floor(e.x/64)+','+Math.floor(e.y/64);if(!hash.has(k))hash.set(k,[]);hash.get(k).push(e);}}
function query(x,y,r,cb){let cx=Math.floor(x/64),cy=Math.floor(y/64);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){let a=hash.get((cx+i)+','+(cy+j));if(a)for(let e of a)if(e.on&&Math.hypot(e.x-x,e.y-y)<r+e.r)cb(e);}}
function update(dt){runTime=(performance.now()-runStart)/1000;if(hitstop>0){hitstop-=dt;return;}for(let n of neb){n.x+=n.vx*dt;n.y+=n.vy*dt;if(n.x<0)n.x=W;if(n.x>W)n.x=0;if(n.y<0)n.y=H;if(n.y>H)n.y=0;}
if(state!=='play')return;
if(streakT>0){streakT-=dt;if(streakT<=0)mult=1;}
// spawn
spawnT-=dt;if(spawnQ.length&&spawnT<=0){spawnEnemy(spawnQ.shift());spawnT=Math.max(0.3,1.2-wave*0.05);}
if(!spawnQ.length&&!enemies.some(e=>e.on)){showUpgrades();return;}
// player move
let mx=0,my=0;if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
if(touchMove){let dx=touchMove.x-player.x,dy=touchMove.y-player.y,l=Math.hypot(dx,dy);if(l>10){mx=dx/l;my=dy/l;}}
// gamepad
try{let gp=navigator.getGamepads&&navigator.getGamepads()[0];if(gp){if(Math.abs(gp.axes[0])>0.15)mx=gp.axes[0];if(Math.abs(gp.axes[1])>0.15)my=gp.axes[1];if(Math.abs(gp.axes[2])>0.2||Math.abs(gp.axes[3])>0.2){mouse.x=player.x+gp.axes[2]*200;mouse.y=player.y+gp.axes[3]*200;mouse.down=true;}if(gp.buttons[1]&&gp.buttons[1].pressed)tryDash();}}catch(e){}
let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
if(player.dashT>0){player.dashT-=dt;player.trail.push({x:player.x,y:player.y,t:0.3});}
else if(ml>0){player.vx+=mx*2600*dt;player.vy+=my*2600*dt;let sp=Math.hypot(player.vx,player.vy);if(sp>340){player.vx=player.vx/sp*340;player.vy=player.vy/sp*340;}}
else{let f=Math.pow(0.0001,dt);player.vx*=f;player.vy*=f;if(Math.hypot(player.vx,player.vy)<5)player.vx=player.vy=0;}
player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(14,Math.min(W-14,player.x));player.y=Math.max(14,Math.min(H-14,player.y));
let target=Math.atan2(mouse.y-player.y,mouse.x-player.x);let diff=((target-player.ang+Math.PI*3)%(Math.PI*2))-Math.PI;player.ang+=Math.max(-20*dt,Math.min(20*dt,diff));
player.fireT-=dt;player.dashCD=Math.max(0,player.dashCD-dt);player.inv=Math.max(0,player.inv-dt);
if(keys.ShiftLeft||keys.ShiftRight)tryDash();
if(mouse.down&&player.fireT<=0){let rate=(1/6)*(1+mods.rapid*0.25)*(mods.heavy?1.25:1);player.fireT=rate;let c=getP(carriers);c.on=true;c.x=player.x+Math.cos(player.ang)*18;c.y=player.y+Math.sin(player.ang)*18;c.vx=Math.cos(player.ang)*780;c.vy=Math.sin(player.ang)*780;c.life=0.85;c.dist=0;c.dmg=mods.heavy?2:1;c.r=5;c.trail=[];shots++;sfx(900,0.05,'square',0.05,-300);burst(c.x,c.y,'#00F0FF',2,80);}
// carriers
for(let c of carriers)if(c.on){c.life-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.dist+=780*dt;c.trail.push({x:c.x,y:c.y});if(c.trail.length>8)c.trail.shift();if(c.life<=0||c.dist>=280||c.x<0||c.x>W||c.y<0||c.y>H){splitCarrier(c);continue;}let hit=false;query(c.x,c.y,c.r,e=>{if(!hit){hit=true;e.hp-=c.dmg;e.flash=0.08;hits++;burst(c.x,c.y,'#fff',5,150);sfx(400,0.05,'square',0.05,-100);if(e.hp<=0)killEnemy(e);}});if(hit)splitCarrier(c);}
for(let s of subs)if(s.on){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H){s.on=false;continue;}let dead=false;query(s.x,s.y,s.r,e=>{if(dead||s.hit.has(e))return;s.hit.add(e);e.hp-=s.dmg;e.flash=0.08;hits++;burst(s.x,s.y,'#FF6B35',4,120);sfx(600,0.04,'square',0.04,-150);if(e.hp<=0)killEnemy(e);if(s.pierce>0){s.pierce--;}else{dead=true;}});if(dead){if(fracture)splitSub(s);else s.on=false;}}
for(let m of micros)if(m.on){m.life-=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.life<=0){m.on=false;continue;}query(m.x,m.y,m.r,e=>{if(m.on){e.hp-=1;e.flash=0.08;hits++;m.on=false;burst(m.x,m.y,'#FF2E88',3,100);if(e.hp<=0)killEnemy(e);}});}
// enemies AI
for(let e of enemies)if(e.on){if(e.spawn>0){e.spawn-=dt;continue;}e.flash=Math.max(0,e.flash-dt);let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
if(e.type===0){e.vx+=dx*600*dt;e.vy+=dy*600*dt;}
else if(e.type===1){e.vx=dx*e.speed;e.vy=dy*e.speed;}
else if(e.type===2){let want=d>320?1:d<280?-1:0;e.vx=dx*e.speed*want+ -dy*e.strafe*60;e.vy=dy*e.speed*want+ dx*e.strafe*60;e.fire-=dt;if(e.fire<=0){e.fire=2;let b=getP(ebullets);b.on=true;b.x=e.x;b.y=e.y;b.vx=dx*280;b.vy=dy*280;b.life=3;sfx(300,0.08,'square',0.04,-100);}}
else if(e.type===3){e.vx=dx*e.speed;e.vy=dy*e.speed;}
else{e.vx=dx*e.speed;e.vy=dy*e.speed;e.fire-=dt;if(e.fire<=0){e.fire=1.5;for(let i=0;i<8;i++){let b=getP(ebullets);let a=Math.random()*6.283;b.on=true;b.x=e.x;b.y=e.y;b.vx=Math.cos(a)*280;b.vy=Math.sin(a)*280;b.life=3;}if(Math.random()<0.5)spawnEnemy(0);}}
let sp=Math.hypot(e.vx,e.vy),max=e.speed*(e.type===0?1.4:1);if(sp>max){e.vx=e.vx/sp*max;e.vy=e.vy/sp*max;}e.x+=e.vx*dt;e.y+=e.vy*dt;e.x=Math.max(e.r,Math.min(W-e.r,e.x));e.y=Math.max(e.r,Math.min(H-e.r,e.y));if(d<e.r+14)damagePlayer();}
for(let b of ebullets)if(b.on){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)b.on=false;else if(Math.hypot(b.x-player.x,b.y-player.y)<b.r+12){b.on=false;damagePlayer();}}
for(let i=powers.length-1;i>=0;i--){let p=powers[i];p.t-=dt;if(p.t<=0){powers.splice(i,1);continue;}if(Math.hypot(p.x-player.x,p.y-player.y)<26){if(p.kind==='hp')player.hp=Math.min(player.maxhp,player.hp+20);else if(p.kind==='shield')shield++;else fracture=true;sfx(660,0.15,'sine',0.12,220);powers.splice(i,1);}}
for(let p of parts)if(p.on){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;if(p.life<=0)p.on=false;}
for(let r of rings)if(r.on){r.life-=dt;r.r+=600*dt;if(r.life<=0)r.on=false;}
for(let t of player.trail)t.t-=dt;player.trail=player.trail.filter(t=>t.t>0);
shake=Math.max(0,shake-20*dt);
}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
ctx.fillStyle='#050510';ctx.fillRect(-20,-20,W+40,H+40);
for(let n of neb){ctx.globalAlpha=0.12;ctx.fillStyle=n.col;ctx.beginPath();ctx.arc(n.x,n.y,n.s,0,6.283);ctx.fill();}
ctx.globalAlpha=1;ctx.strokeStyle='#00f0ff11';ctx.lineWidth=1;for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
for(let p of powers){ctx.fillStyle=p.kind==='hp'?'#39FF6A':p.kind==='shield'?'#00F0FF':'#B967FF';ctx.beginPath();ctx.arc(p.x,p.y,10+Math.sin(runTime*6)*2,0,6.283);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(p.kind==='hp'?'+':p.kind==='shield'?'S':'F',p.x,p.y+4);}
for(let e of enemies)if(e.on){ctx.save();ctx.translate(e.x,e.y);if(e.spawn>0)ctx.globalAlpha=0.4;ctx.fillStyle=e.flash>0?'#fff':['#FF3B3B','#39FF6A','#B967FF','#FFAA00','#FF2E88'][e.type===9?4:e.type]||'#fff';ctx.beginPath();if(e.type===0){ctx.arc(0,0,e.r,0,6.283);}else if(e.type===1){ctx.rect(-e.r,-e.r,e.r*2,e.r*2);}else if(e.type===2){ctx.moveTo(0,-e.r);ctx.lineTo(e.r,e.r);ctx.lineTo(-e.r,e.r);ctx.closePath();}else{ctx.arc(0,0,e.r,0,6.283);}ctx.fill();ctx.fillStyle='#000';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(e.type===9?'BOSS':''+e.type,0,3);ctx.restore();if(e.maxhp>5){ctx.fillStyle='#222';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);ctx.fillStyle='#39FF6A';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.maxhp),4);}}
for(let c of carriers)if(c.on){ctx.strokeStyle='#00F0FF';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<c.trail.length;i++){let t=c.trail[i];i?ctx.lineTo(t.x,t.y):ctx.moveTo(t.x,t.y);}ctx.stroke();ctx.fillStyle='#00F0FF';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,6.283);ctx.fill();}
for(let s of subs)if(s.on){ctx.fillStyle='#FF6B35';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
for(let m of micros)if(m.on){ctx.fillStyle='#FF2E88';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,6.283);ctx.fill();}
for(let b of ebullets)if(b.on){ctx.fillStyle='#FFAA00';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();}
if(state!=='title'){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.ang);if(player.inv>0&&Math.floor(runTime*20)%2===0)ctx.globalAlpha=0.4;ctx.fillStyle='#00F0FF';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,10);ctx.lineTo(-6,0);ctx.lineTo(-10,-10);ctx.closePath();ctx.fill();ctx.restore();if(shield>0){ctx.strokeStyle='#00F0FF88';ctx.beginPath();ctx.arc(player.x,player.y,22,0,6.283);ctx.stroke();}}
for(let p of parts)if(p.on){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}ctx.globalAlpha=1;
for(let r of rings)if(r.on){ctx.globalAlpha=r.life/0.35;ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();}ctx.globalAlpha=1;
ctx.restore();
ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='left';ctx.fillText('SCORE '+score,16,28);ctx.font='14px sans-serif';ctx.fillText('WAVE '+wave+'  x'+mult+'  KILLS '+kills,16,50);ctx.fillText('HIGH '+high,16,70);
ctx.fillStyle='#222';ctx.fillRect(16,82,200,12);ctx.fillStyle='#39FF6A';ctx.fillRect(16,82,200*Math.max(0,player.hp/player.maxhp),12);ctx.fillStyle='#fff';ctx.fillText('HULL '+Math.ceil(player.hp),16,108);
ctx.fillStyle='#222';ctx.fillRect(W-216,16,200,12);ctx.fillStyle='#00F0FF';ctx.fillRect(W-216,16,200*meter/10,12);ctx.fillStyle='#fff';ctx.fillText('NOVA [SPACE] '+Math.floor(meter*10)+'%',W-216,44);
if(shield>0)ctx.fillText('SHIELD '+shield,16,130);
let acc=shots?Math.round(hits/shots*100):0;ctx.fillText('ACC '+acc+'%  TIME '+runTime.toFixed(1)+'s',16,150);
if(state==='title'){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#00F0FF';ctx.font='bold 72px sans-serif';ctx.textAlign='center';ctx.fillText('SPLITSHOT',W/2,240);ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('WASD move - Mouse aim - Hold LMB fire - Shift/RMB dash - Space Nova',W/2,300);ctx.fillText('Split carriers into subs. Survive waves. Click or Enter to start',W/2,340);}
else if(state==='pause'){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,300);ctx.font='20px sans-serif';ctx.fillText('Resume / Restart / Title',W/2,400);ctx.strokeStyle='#00F0FF';ctx.strokeRect(340,380,600,50);ctx.strokeRect(340,440,600,50);ctx.strokeRect(340,500,600,50);}
else if(state==='upgrade'){ctx.fillStyle='#000c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.textAlign='center';ctx.fillText('WAVE '+wave+' CLEAR - CHOOSE UPGRADE',W/2,200);for(let i=0;i<3;i++){let x=340+i*210,y=300;ctx.fillStyle='#0b0b2a';ctx.fillRect(x,y,190,180);ctx.strokeStyle='#00F0FF';ctx.strokeRect(x,y,190,180);ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.fillText(upgrades[i]?upgrades[i].name:'',x+95,y+60);ctx.font='14px sans-serif';ctx.fillText(upgrades[i]?upgrades[i].desc:'',x+95,y+100);ctx.fillText('[ '+(i+1)+' ]',x+95,y+150);}}
else if(state==='over'){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#FF2E88';ctx.font='bold 64px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,260);ctx.fillStyle='#fff';ctx.font='24px sans-serif';ctx.fillText('SCORE '+score+'  WAVE '+wave+'  KILLS '+kills,W/2,320);ctx.fillText('HIGH '+high,W/2,360);ctx.font='18px sans-serif';ctx.fillText('Click or Enter to restart',W/2,540);}
}
let last=performance.now();function loop(now){let dt=Math.min(0.033,(now-last)/1000);last=now;buildHash();update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
