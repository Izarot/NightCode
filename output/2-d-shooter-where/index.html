<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>SPLITFIRE</title><link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>'><link rel='stylesheet' href='style.css'></head><body><div id='wrap'><canvas id='game' width='1280' height='720'></canvas><div id='timer'>⏱ 00:00</div><div id='titleScreen' class='overlay'><div class='panel'><h1 class='logo'>SPLIT<span>FIRE</span></h1><p class='tag'>Every bullet splits. Survive the exponential.</p><p id='highScore' class='hs'>HIGH SCORE: 0</p><button id='startBtn' class='btn'>▶ CLICK TO START</button><div class='controls'><b>WASD</b> Move &nbsp; <b>Mouse</b> Aim &nbsp; <b>Hold LMB</b> Fire<br><b>Space / RMB</b> Dash &nbsp; <b>P/Esc</b> Pause &nbsp; <b>M</b> Mute &nbsp; <b>1/2/3</b> Upgrade</div><p class='hint'>Defeat Wave 10 Boss • Collect Split Cores • Choose upgrades</p></div></div><div id='upgradeScreen' class='overlay hidden'><div class='panel wide'><h2>⚡ CHOOSE UPGRADE ⚡</h2><div id='cards'></div></div></div><div id='pauseScreen' class='overlay hidden'><div class='panel'><h2>PAUSED</h2><button id='resumeBtn' class='btn'>RESUME</button><button id='restartBtn' class='btn'>RESTART</button><button id='quitBtn' class='btn'>QUIT TO TITLE</button></div></div><div id='endScreen' class='overlay hidden'><div class='panel'><h2 id='endTitle'>GAME OVER</h2><div id='endStats'></div><button id='retryBtn' class='btn'>RETRY</button><button id='titleBtn' class='btn'>TITLE</button></div></div></div><script src='game.js'></script></body></html>
