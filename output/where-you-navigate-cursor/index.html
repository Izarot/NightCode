<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Window Maze Navigator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪟</text></svg>">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="touch-controls">
        <div id="dpad">
            <button id="btn-up" class="dpad-btn"></button>
            <button id="btn-left" class="dpad-btn"></button>
            <button id="btn-down" class="dpad-btn"></button>
            <button id="btn-right" class="dpad-btn"></button>
        </div>
        <div id="action-buttons">
            <button id="btn-dash" class="action-btn">DASH</button>
            <button id="btn-interact" class="action-btn">ACT</button>
        </div>
    </div>
    <div id="menu-screen" class="overlay">
        <div class="menu-content">
            <h1>🪟 WINDOW MAZE NAVIGATOR</h1>
            <p class="subtitle">Navigate the maze of windows to find the exit</p>
            <button id="start-btn" class="menu-btn">START GAME</button>
            <div class="high-score">Best Time: <span id="best-time">--</span></div>
        </div>
    </div>
    <div id="pause-screen" class="overlay hidden">
        <div class="menu-content">
            <h1>PAUSED</h1>
            <button id="resume-btn" class="menu-btn">RESUME</button>
            <button id="restart-btn" class="menu-btn">RESTART</button>
            <button id="quit-btn" class="menu-btn">QUIT</button>
        </div>
    </div>
    <div id="gameover-screen" class="overlay hidden">
        <div class="menu-content">
            <h1 id="gameover-text">GAME OVER</h1>
            <p id="gameover-reason"></p>
            <p id="final-time"></p>
            <button id="retry-btn" class="menu-btn">TRY AGAIN</button>
            <button id="menu-btn" class="menu-btn">MENU</button>
        </div>
    </div>
    <div id="victory-screen" class="overlay hidden">
        <div class="menu-content">
            <h1>🎉 LEVEL COMPLETE!</h1>
            <p id="victory-time"></p>
            <p id="victory-level"></p>
            <button id="next-level-btn" class="menu-btn">NEXT LEVEL</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
