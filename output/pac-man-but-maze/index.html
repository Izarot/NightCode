<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pac-Man: The Breathing Labyrinth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d1a; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; touch-action: none; }
    #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
    .hud-item { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px; border: 2px solid #ff6b6b; font-size: 14px; }
    .hud-item span { color: #ffd700; font-weight: bold; }
    #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 20; }
    #message h1 { font-size: 48px; color: #ff6b6b; text-shadow: 0 0 20px #ff6b6b; margin-bottom: 10px; }
    #message p { font-size: 18px; color: #4ecdc4; }
    #message.hidden { display: none; }
    @media (max-width: 600px) { .hud-item { font-size: 12px; padding: 6px 8px; } #message h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="hud-item">SCORE: <span id="score">0</span></div>
      <div class="hud-item">HI-SCORE: <span id="hiScore">0</span></div>
      <div class="hud-item">TIME: <span id="timer">0.00</span></div>
      <div class="hud-item">LIVES: <span id="lives">3</span></div>
    </div>
    <div id="message" class="hidden">
      <h1 id="msgTitle"></h1>
      <p id="msgText"></p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
