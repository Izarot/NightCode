<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Dodge - Web Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="score-board">Score: <span id="score">0</span></div>
            <div id="high-score-board">High Score: <span id="high-score">0</span></div>
            <div id="speedrun-timer">Time: <span id="timer">0.00</span>s</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="start-screen" class="screen">
            <h1>Emoji Dodge</h1>
            <p>Avoid the falling emojis for as long as you can!</p>
            <button id="start-button">Start Game</button>
        </div>
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p>High Score: <span id="final-high-score">0</span></p>
            <button id="restart-button">Play Again</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
