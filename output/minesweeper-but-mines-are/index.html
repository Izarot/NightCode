<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💣 Moving Minesweeper</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="hud-top">
            <div class="hud-item" id="mineCounter">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                    <circle cx="12" cy="12" r="6"/>
                    <line x1="12" y1="2" x2="12" y2="6"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="6" y2="12"/>
                    <line x1="18" y1="12" x2="22" y2="12"/>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
                </svg>
                <span id="mineCount">40</span>
            </div>
            <div class="game-title">MOVING MINESWEEPER</div>
            <div class="hud-item" id="timer">
                <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12,6 12,12 16,14"/>
                </svg>
                <span id="timerDisplay">00:00</span>
            </div>
        </div>

        <div class="speedrun-timer">
            <span class="speedrun-label">⚡ SPEEDRUN</span>
            <span id="speedrunDisplay">00:00.00</span>
            <span id="highScoreBadge">🏆 Best: --</span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <button class="btn btn-restart" id="restartBtn">🔄 NEW GAME</button>
            <div class="difficulty-btns">
                <button class="btn btn-difficulty" data-difficulty="easy">EASY</button>
                <button class="btn btn-difficulty active" data-difficulty="medium">MEDIUM</button>
                <button class="btn btn-difficulty" data-difficulty="hard">HARD</button>
            </div>
            <div class="speed-control">
                <span>⚡ SPEED:</span>
                <div class="speed-btns">
                    <button class="btn btn-speed" data-speed="slow">4s</button>
                    <button class="btn btn-speed active" data-speed="normal">3s</button>
                    <button class="btn btn-speed" data-speed="fast">2s</button>
                </div>
            </div>
        </div>

        <div class="instructions">
            Left Click: Reveal | Right Click: Flag | Mines move every few seconds!
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">GAME OVER</div>
            <div class="modal-stats" id="modalStats">Time: 00:00 | Cells: 0/0</div>
            <div class="modal-highscore" id="modalHighScore"></div>
            <button class="btn btn-play-again" id="playAgainBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
