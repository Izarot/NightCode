<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RHYTHM ASSEMBLER</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐻</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div id="hud-score">
                <div class="hud-label">SCORE</div>
                <div class="hud-value" id="score-display">0</div>
                <div class="hud-label" style="font-size: 0.6rem; margin-top: 4px; opacity: 0.6;">HI: <span id="highscore-display">0</span></div>
            </div>
            <div id="hud-timer">
                <div class="hud-label">SPEEDRUN</div>
                <div class="hud-value" id="timer-display">00:00.00</div>
            </div>
            <div id="hud-combo">
                <div class="hud-label">COMBO</div>
                <div class="hud-value" id="combo-display">0</div>
            </div>
        </div>
        <div id="overlay" class="hidden">
            <h1 id="overlay-title">GAME OVER</h1>
            <p id="overlay-stats">Final Score: 0</p>
            <button id="restart-btn">REASSEMBLE</button>
        </div>
        <div id="start-screen">
            <h1>RHYTHM ASSEMBLER</h1>
            <p>WASD / Arrows to Move</p>
            <p>Click & Drag Components to Slots</p>
            <button id="start-btn">INITIALIZE SEQUENCE</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
