<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON DODGE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; max-width: 100vw; max-height: 100vh; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.5); background: #16213e; }
        #ui-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
        .stat-box { background: rgba(26, 26, 46, 0.8); backdrop-filter: blur(5px); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(0, 255, 255, 0.3); color: #fff; font-weight: 700; font-size: 1rem; text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; min-width: 120px; text-align: center; }
        @media (max-width: 600px) { .stat-box { font-size: 0.85rem; padding: 6px 12px; min-width: 90px; } }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div class="stat-box" id="timer">TIME: 0.00s</div>
        <div class="stat-box" id="score">SCORE: 0</div>
        <div class="stat-box" id="highscore">BEST: 0</div>
    </div>
    <canvas id="game"></canvas>
    <script src="game.js"></script>
</body>
</html>
