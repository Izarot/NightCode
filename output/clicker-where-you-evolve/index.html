<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genetic Clicker: Evolution Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='65'>🧬</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0220; font-family: 'Segoe UI', sans-serif; }
    #gameCanvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a0933 0%, #0d0220 100%); }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .stat { position: absolute; color: #ff6ec7; font-size: 18px; text-shadow: 0 0 6px #fff; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div id="geDisplay" class="stat" style="top:10px; left:10px;">GE: 0</div>
    <div id="stageDisplay" class="stat" style="top:10px; right:10px;">Stage: Juvenile</div>
    <div id="timerDisplay" class="stat" style="bottom:10px; left:10px;">Time: 0.00s</div>
    <div id="highScoreDisplay" class="stat" style="bottom:10px; right:10px;">High Score: 0</div>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
