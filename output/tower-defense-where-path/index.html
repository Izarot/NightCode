<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TRAILBLAZE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0E27;
      font-family: 'Share Tech Mono', monospace;
      color: #00F0FF;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #game-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      background: #0A0E27;
      display: block;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="1920" height="1080"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
