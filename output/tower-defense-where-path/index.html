<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Path-Painter Tower Defense</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>🎨</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0f0f2a; color: #e0e0ff; overflow: hidden; }
canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; background: #1a1a3a; }
#hud { position: absolute; top: 10px; left: 10px; display: flex; gap: 15px; align-items: center; }
#hud div { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
#timer { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: bold; color: #ffcc00; }
#shop { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 10px; flex-wrap: wrap; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }
.tower-btn { width: 50px; height: 50px; border: 2px solid #4a9; border-radius: 8px; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; background: #2a2a5a; transition: all 0.2s; }
.tower-btn:hover { transform: scale(1.1); border-color: #ffcc00; }
.tower-btn.selected { border-color: #ff6b6b; box-shadow: 0 0 10px #ff6b6b; }
#gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; text-align: center; display: none; color: #fff; }
button { padding: 10px 20px; margin-top: 15px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; background: #4a9; color: white; }
button:hover { background: #6bb; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="1280" height="720"></canvas>
<div id="hud">
  <div>Coins: <span id="coins">1000</span></div>
  <div>Health: <span id="health">100</span>/100</div>
  <div>Wave: <span id="wave">1</span>/5</div>
</div>
<div id="timer">Time: <span id="time">30.00</span></div>
<div id="shop">
  <div class="tower-btn" data-type="archer" style="background:#4a9;">🏹</div>
  <div class="tower-btn" data-type="mage" style="background:#94a;">🔮</div>
  <div class="tower-btn" data-type="cannon" style="background:#a44;">💣</div>
  <div class="tower-btn" data-type="support" style="background:#4a4;">✨</div>
</div>
<div id="gameOver">
  <h1 id="gameOverTitle">Game Over</h1>
  <p id="finalScore"></p>
  <button onclick="location.reload()">Play Again</button>
</div>
<script src="game.js"></script>
</body>
</html>
