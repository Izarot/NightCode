<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bactaria</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
            <div id="top-left" class="hud-panel">
                <div id="nutrients">🌱 <span id="nutrient-count">0</span></div>
                <div id="mp">🧬 <span id="mp-count">0</span>/100</div>
            </div>
            <div id="top-center" class="hud-panel">
                <div id="timer">⏱️ <span id="time-display">00:00</span></div>
            </div>
            <div id="top-right" class="hud-panel">
                <div id="colony-health">❤️ <span id="health-percent">100%</span></div>
            </div>
            <div id="bottom-left" class="hud-panel">
                <button id="spawn-btn">Spawn</button>
                <button id="split-btn">Split</button>
                <button id="mutate-btn">Mutate</button>
            </div>
            <div id="bottom-right" class="hud-panel">
                <div id="mutation-pool">Mutation Pool</div>
            </div>
        </div>
        <div id="high-score">High Score: <span id="high-score-display">0</span></div>
    </div>
    <script src="game.js" type="module"></script>
</body>
</html>
