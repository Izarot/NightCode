<!DOCTYPE html><html><head><title>Neon Dash</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" /><style>body { margin: 0; padding: 0; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; } canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; } #ui { position: absolute; top: 10px; left: 10px; color: #00f2ff; font-size: 18px; text-shadow: 0 0 5px #00f2ff; pointer-events: none; } #timer { position: absolute; top: 10px; right: 10px; color: #ff00ff; text-shadow: 0 0 5px #ff00ff; } #overlay { position: absolute; color: white; text-align: center; display: none; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; } button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #ff00ff; border: none; color: white; border-radius: 5px; }</style></head><body><div id="ui">Score: <span id="score">0</span> | High: <span id="high">0</span></div><div id="timer">0.00s</div><div id="overlay"><h1 id="msg">GAME OVER</h1><p>Final Score: <span id="finalScore">0</span></p><button onclick="resetGame()">PLAY AGAIN</button></div><canvas id="gameCanvas"></canvas><script src="game.js"></script></body></html>
