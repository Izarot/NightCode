<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wire Connection Puzzle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>🔌</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: 'Roboto', sans-serif; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #0a0a1a; }
    .hud { position: absolute; top: 10px; left: 10px; color: #00ffea; font-size: 16px; z-index: 10; }
    .timer { position: absolute; top: 10px; right: 10px; color: #ff00ea; font-size: 16px; z-index: 10; }
    .controls { position: absolute; bottom: 10px; right: 10px; z-index: 10; }
    button { background: #1a1a2e; color: #00ffea; border: 1px solid #00ffea; padding: 8px 12px; margin: 4px; font-size: 14px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #00ffea; color: #0a0a1a; }
    .progress-container { position: absolute; bottom: 50px; left: 10px; width: 200px; height: 12px; background: #1a1a2e; border: 1px solid #00ffea; border-radius: 6px; overflow: hidden; z-index: 10; }
    .progress-bar { height: 100%; width: 0%; background: #00ffea; transition: width 0.3s ease; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="hud" id="levelDisplay">Level 1/10</div>
  <div class="timer" id="timerDisplay">Time: 0.00s</div>
  <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
  <div class="controls">
    <button onclick="restartLevel()">Restart</button>
    <button onclick="skipLevel()">Skip</button>
    <button onclick="togglePause()">Pause</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
