<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Dodge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f2a; overflow: hidden; font-family: Arial, sans-serif; }
canvas { display: block; margin: 0 auto; background: #1a1a3e; }
hud { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 2px 2px 4px #000; }
#score { position: absolute; top: 10px; right: 10px; color: #fff; font-size: 18px; text-shadow: 2px 2px 4px #000; }
button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 24px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; background: #ff6b6b; color: #fff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">Time: <span id="timer">0.00</span>s</div>
<div id="score">Score: <span id="scoreVal">0</span></div>
<button id="startBtn">Start Game</button>
<script src="src/game.js"></script>
</body>
</html>
