<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E"><title>LOCKSMITH</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:Georgia,serif;color:#f5f5dc}canvas{display:block;position:absolute;top:0;left:0}#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}#menu,#pause,#complete,#settings{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,10,10,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;z-index:10}.hidden{display:none!important}h1{font-size:3em;color:#d4a017;text-shadow:0 0 20px #b8860b;letter-spacing:0.2em;margin-bottom:0.3em}h2{color:#b8860b;margin-bottom:1em;font-weight:normal}.btn{background:linear-gradient(135deg,#3a3a3a,#5a5a5a);color:#f5f5dc;border:2px solid #b8860b;padding:12px 30px;margin:8px;font-family:inherit;font-size:1em;cursor:pointer;letter-spacing:0.1em;border-radius:4px;transition:all 0.2s;min-width:200px}.btn:hover{background:linear-gradient(135deg,#5a5a5a,#7a7a7a);box-shadow:0 0 15px #b8860b}.row{display:flex;align-items:center;margin:8px;color:#f5f5dc}.row label{width:150px}.row input[type=range]{width:200px;accent-color:#b8860b}.toggle{margin:8px;color:#f5f5dc}.toggle input{accent-color:#b8860b;margin-right:8px}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:0.9em;opacity:0.8;pointer-events:none;text-shadow:0 1px 2px #000}#hud>div{background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:4px;border:1px solid rgba(184,134,11,0.3)}#speedrun{color:#d4a017;font-weight:bold;font-family:monospace}#bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;font-size:0.85em;pointer-events:none}#bottom>div{background:rgba(0,0,0,0.4);padding:8px 12px;border-radius:4px;border:1px solid rgba(184,134,11,0.3)}#hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:0.8em;opacity:0.6;text-align:center;transition:opacity 1s}#stats{color:#b8860b;margin:15px 0;text-align:center;line-height:1.8}#highscore{color:#d4a017;font-size:1.2em;margin:10px}@media(max-width:600px){h1{font-size:2em}.btn{padding:10px 20px;font-size:0.9em;min-width:160px}#hud{font-size:0.7em}#bottom{font-size:0.7em}}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="menu"><h1>LOCKSMITH</h1><h2>The Art of the Silent Pick</h2><div id="highscore"></div><button class="btn" onclick="startJob()">NEW JOB</button><button class="btn" onclick="startPractice()">PRACTICE MODE</button><button class="btn" onclick="showSettings()">SETTINGS</button></div><div id="settings" class="hidden"><h2>SETTINGS</h2><div class="row"><label>Master Volume</label><input type="range" min="0" max="100" value="70" id="volMaster" oninput="updateSettings()"></div><div class="row"><label>SFX Volume</label><input type="range" min="0" max="100" value="80" id="volSfx" oninput="updateSettings()"></div><div class="row"><label>Ambient Volume</label><input type="range" min="0" max="100" value="40" id="volAmb" oninput="updateSettings()"></div><div class="row"><label>Pick Sensitivity</label><input type="range" min="50" max="200" value="100" id="sensitivity" oninput="updateSettings()"></div><div class="toggle"><input type="checkbox" id="hintsToggle" onchange="updateSettings()">Show Tutorial Hints</div><button class="btn" onclick="hideSettings()">BACK</button></div><div id="pause" class="hidden"><h2>PAUSED</h2><div id="stats"></div><button class="btn" onclick="resume()">RESUME</button><button class="btn" onclick="restartLock()">RESTART LOCK</button><button class="btn" onclick="quitToMenu()">QUIT TO MENU</button></div><div id="complete" class="hidden"><h2>UNLOCKED</h2><div id="stats"></div><button class="btn" onclick="nextLock()">NEXT LOCK</button><button class="btn" onclick="restartLock()">REPLAY</button><button class="btn" onclick="quitToMenu()">MENU</button></div><div id="hud" class="hidden"><div id="lockname">PRACTICE LOCK</div><div id="locknum">1 of 12</div><div id="speedrun">00:00</div></div><div id="bottom" class="hidden"><div id="feel">FEEL: --</div><div id="pindepth">PINS: -----</div><div id="tension">TENSION: 0%</div></div><div id="hint" class="hidden">WASD: Move | W/S: Depth | Scroll: Tension | Shift: Precision | ESC: Pause</div></div><script>const cv=document.getElementById('c');const ctx=cv.getContext('2d');let W,H,dpr=1;function resize(){dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
let audioCtx=null,masterGain=null,sfxGain=null,ambGain=null,settings={master:0.7,sfx:0.8,amb:0.4,sensitivity:100,hints:true};let scrapeNode=null,scrapeGain=null,tensionNode=null,tensionGain=null,ambientNodes=[];function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=settings.master;masterGain.connect(audioCtx.destination);sfxGain=audioCtx.createGain();sfxGain.gain.value=settings.sfx;sfxGain.connect(masterGain);ambGain=audioCtx.createGain();ambGain.gain.value=settings.amb;ambGain.connect(masterGain);startAmbient()}function updateSettings(){settings.master=document.getElementById('volMaster').value/100;settings.sfx=document.getElementById('volSfx').value/100;settings.amb=document.getElementById('volAmb').value/100;settings.sensitivity=parseInt(document.getElementById('sensitivity').value);settings.hints=document.getElementById('hintsToggle').checked;if(masterGain)masterGain.gain.value=settings.master;if(sfxGain)sfxGain.gain.value=settings.sfx;if(ambGain)ambGain.gain.value=settings.amb;localStorage.setItem('locksmith_settings',JSON.stringify(settings))}function showSettings(){document.getElementById('menu').classList.add('hidden');document.getElementById('settings').classList.remove('hidden')}function hideSettings(){document.getElementById('settings').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}function startAmbient(){if(!audioCtx)return;const lfo=audioCtx.createOscillator();lfo.frequency.value=0.3;const lfoGain=audioCtx.createGain();lfoGain.gain.value=0.02;lfo.connect(lfoGain);const noise=audioCtx.createBufferSource();const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.02;noise.buffer=buf;noise.loop=true;lfoGain.connect(noise.gain);noise.connect(ambGain);lfo.start();noise.start();ambientNodes.push(lfo,noise)}
function playTone(freq,dur,type,vol,pan){if(!audioCtx)return;type=type||'sine';vol=vol||0.3;const o=audioCtx.createOscillator();const g=audioCtx.createGain();const p=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+0.005);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);if(p){p.pan.value=pan||0;g.connect(p);p.connect(sfxGain)}else g.connect(sfxGain);o.start();o.stop(audioCtx.currentTime+dur)}function playClick(isSet){const f=isSet?800+Math.random()*400:400+Math.random()*200;playTone(f,0.08,'sine',0.25)}function playSuccess(){[523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sine',0.2),i*120))}function playFail(){playTone(80,0.5,'sawtooth',0.3);playTone(60,0.4,'sawtooth',0.2)}function playUnlock(){playTone(150,0.15,'square',0.4);setTimeout(()=>playTone(200,0.1,'square',0.3),150);setTimeout(()=>playTone(120,0.4,'sine',0.3),300)}function startScrape(){if(!audioCtx||scrapeNode)return;scrapeNode=audioCtx.createBufferSource();const buf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;scrapeNode.buffer=buf;scrapeNode.loop=true;scrapeGain=audioCtx.createGain();scrapeGain.gain.value=0;const filt=audioCtx.createBiquadFilter();filt.type='highpass';filt.frequency.value=2000;scrapeNode.connect(filt);filt.connect(scrapeGain);scrapeGain.connect(sfxGain);scrapeNode.start()}function updateScrape(vol,pitch){if(!scrapeGain)return;scrapeGain.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+0.05)}
const TIERS=[{name:'Practice Padlock',pins:3,tol:0.15,reset:0.1},{name:'Bedroom Door',pins:4,tol:0.12,reset:0.2},{name:'Office Lock',pins:5,tol:0.08,reset:0.3},{name:'Safe Deposit',pins:5,tol:0.06,reset:0.4},{name:'Master Lock',pins:6,tol:0.05,reset:0.5},{name:'High Security',pins:6,tol:0.04,reset:0.5},{name:'Vault',pins:7,tol:0.03,reset:0.6},{name:'Grand Master',pins:7,tol:0.02,reset:0.7}];let game={mode:'menu',lockIdx:0,jobLocks:[],pins:[],pickX:0,pickY:0.5,tension:0,targetTension:0.4,time:0,lockTime:0,paused:false,success:false,fail:false,cylRot:0,resets:0,setCount:0,precision:false,highScore:0};function genPins(tier){const n=tier.pins;const pins=[];for(let i=0;i<n;i++)pins.push({x:(i+1)/(n+1),setHeight:0.3+Math.random()*0.4,tolerance:tier.tol*(0.7+Math.random()*0.6),resetChance:tier.reset*(0.5+Math.random()),set:false,setTime:0,scraped:0,locked:false,clickFlash:0});return pins}function getTier(idx){if(game.mode==='practice')return TIERS[Math.min(idx,TIERS.length-1)];return TIERS[Math.min(idx,TIERS.length-1)]}function startJob(){initAudio();game.mode='job';game.lockIdx=0;game.jobLocks=[];for(let i=0;i<12;i++)game.jobLocks.push(i%TIERS.length);startLock()}
function startPractice(){initAudio();game.mode='practice';game.lockIdx=0;startLock()}function startLock(){const tier=getTier(game.lockIdx);game.pins=genPins(tier);game.pickX=game.pins[0].x;game.pickY=0.5;game.tension=0;game.targetTension=0.4;game.lockTime=0;game.success=false;game.fail=false;game.cylRot=0;game.resets=0;game.setCount=0;game.paused=false;document.getElementById('menu').classList.add('hidden');document.getElementById('pause').classList.add('hidden');document.getElementById('complete').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('bottom').classList.remove('hidden');if(settings.hints)document.getElementById('hint').classList.remove('hidden');document.getElementById('lockname').textContent=tier.name;document.getElementById('locknum').textContent=(game.lockIdx+1)+' of 12';updateHUD();if(scrapeGain)scrapeGain.gain.value=0}function updateHUD(){document.getElementById('speedrun').textContent=formatTime(game.lockTime);const t=Math.round(game.tension*100);const tCol=game.tension<0.3?'#4488ff':game.tension<0.7?'#44cc44':'#cc4444';document.getElementById('tension').innerHTML='TENSION: <span style="color:'+tCol+'">'+t+'%</span>';let pinStr='';game.pins.forEach(p=>{pinStr+=p.set?'●':'○';});document.getElementById('pindepth').textContent='PINS: '+pinStr;let feel=0;game.pins.forEach(p=>{if(Math.abs(game.pickX-p.x)<0.05){const dist=Math.abs(game.pickY-p.setHeight);if(dist<p.tolerance*1.5)feel=Math.max(feel,1-dist/(p.tolerance*1.5))}});document.getElementById('feel').textContent='FEEL: '+['--','~','≈','≈≈','≈≈≈'][Math.round(feel*4)]}function formatTime(s){const m=Math.floor(s/60);const sec=Math.floor(s%60);return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec}
function nextLock(){game.lockIdx++;if(game.lockIdx>=12){alert('Job Complete! Total time: '+formatTime(game.time));quitToMenu();return}startLock()}function restartLock(){startLock()}function resume(){game.paused=false;document.getElementById('pause').classList.add('hidden')}function quitToMenu(){document.getElementById('hud').classList.add('hidden');document.getElementById('bottom').classList.add('hidden');document.getElementById('hint').classList.add('hidden');document.getElementById('pause').classList.add('hidden');document.getElementById('complete').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');if(scrapeGain)scrapeGain.gain.value=0;updateHighScore()}function updateHighScore(){const hs=localStorage.getItem('locksmith_high');if(hs&&(!game.highScore||hs<game.highScore))game.highScore=parseFloat(hs);document.getElementById('highscore').textContent=game.highScore?'Best Time: '+formatTime(game.highScore):''}function showStats(elId){document.getElementById(elId).innerHTML='Time: '+formatTime(game.lockTime)+'<br>Pins Reset: '+game.resets+'<br>Difficulty: '+'★'.repeat(Math.min(5,game.lockIdx+1))+'☆'.repeat(5-Math.min(5,game.lockIdx+1))}
const keys={};window.addEventListener('keydown',e=>{if(game.mode==='menu'||game.paused)return;keys[e.key.toLowerCase()]=true;if(e.key==='Escape'){if(game.paused){resume()}else{game.paused=true;document.getElementById('pause').classList.remove('hidden');showStats('stats')}}if(e.key==='r'||e.key==='R')restartLock();if(e.key==='Shift')game.precision=true;if(document.getElementById('hint')&&!document.getElementById('hint').classList.contains('hidden')&&game.lockTime>3){document.getElementById('hint').classList.add('hidden')}});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')game.precision=false});window.addEventListener('wheel',e=>{if(game.mode==='menu'||game.paused)return;game.targetTension+=e.deltaY*-0.0005;game.targetTension=Math.max(0,Math.min(1,game.targetTension));e.preventDefault()},{passive:false});
let lastT=performance.now();function loop(t){const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;if(game.mode==='job'||game.mode==='practice'){if(!game.paused&&!game.success&&!game.fail){update(dt);game.lockTime+=dt;if(game.mode==='job')game.time+=dt}render()}requestAnimationFrame(loop)}function update(dt){const spd=settings.sensitivity/100*(game.precision?0.5:1)*0.3;if(keys['a']||keys['arrowleft']){let nx=game.pickX-spd*dt;game.pickX=Math.max(0.05,nx)}if(keys['d']||keys['arrowright']){let nx=game.pickX+spd*dt;game.pickX=Math.min(0.95,nx)}if(keys['w']||keys['arrowup']){game.pickY=Math.min(0.95,game.pickY+spd*dt)}if(keys['s']||keys['arrowdown']){game.pickY=Math.max(0.05,game.pickY-spd*dt)}game.tension+=(game.targetTension-game.tension)*dt*5;const allSet=game.pins.every(p=>p.set);const currentPin=game.pins.reduce((acc,p)=>{const d=Math.abs(game.pickX-p.x);return d<Math.abs(game.pickX-acc.x)?p:acc},game.pins[0]);let closestD=1;game.pins.forEach(p=>{const d=Math.abs(game.pickX-p.x);const hD=Math.abs(game.pickY-p.setHeight);if(d<0.04&&hD<closestD)closestD=hD});const scrapeVol=Math.max(0,(0.04-Math.abs(game.pickX-currentPin.x))*15);updateScrape(scrapeVol*0.15,1);if(game.tension>0.2){const rotSpeed=(game.tension-0.2)*0.3;game.cylRot+=(allSet?rotSpeed*3:rotSpeed)*dt}
game.pins.forEach(p=>{p.clickFlash*=0.9;if(p.set){p.setTime-=dt*1000;if(game.tension>0.7&&Math.random()<p.resetChance*dt*2){p.set=false;p.scraped=0;game.resets++;game.setCount--;playClick(false)}else if(p.setTime<-2000&&!allSet&&game.tension>0.3){if(Math.random()<p.resetChance*dt*0.3){p.set=false;p.scraped=0;game.resets++;game.setCount--;playClick(false)}}if(p.setTime<-3000)p.locked=true}else{if(game.tension>0.3&&game.tension<0.7&&Math.abs(game.pickX-p.x)<0.04){const hD=Math.abs(game.pickY-p.setHeight);if(hD<p.tolerance){if(Math.random()<0.05){p.set=true;p.setTime=1500;p.scraped=1;game.setCount++;playClick(true);p.clickFlash=1}}}});if(allSet&&game.tension>0.4&&!game.success){game.success=true;setTimeout(()=>{playUnlock();setTimeout(()=>{showStats('stats');document.getElementById('complete').classList.remove('hidden');if(game.mode==='job'){const cur=parseFloat(localStorage.getItem('locksmith_high')||999999);if(game.lockTime<cur)localStorage.setItem('locksmith_high',game.lockTime.toString())}},1500)},1000)}if(game.resets>30&&!game.success){game.fail=true;playFail();setTimeout(()=>{showStats('stats');document.getElementById('complete').classList.remove('hidden')},1000)}updateHUD()}
function render(){const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'#1a1a1a');g.addColorStop(1,'#050505');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2;const scale=Math.min(W/800,H/600);const lw=600*scale,lh=500*scale;const lx=cx-lw/2,ly=cy-lh/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(game.cylRot*0.15);ctx.translate(-cx,-cy);const bg=ctx.createLinearGradient(lx,ly,lx+lw,ly+lh);bg.addColorStop(0,'#3a3a3a');bg.addColorStop(0.5,'#5a5a5a');bg.addColorStop(1,'#3a3a3a');ctx.fillStyle=bg;ctx.strokeStyle='#b8860b';ctx.lineWidth=2;roundRect(lx,ly,lw,lh,20);ctx.fill();ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(lx+10,ly+10,lw-20,lh-20);ctx.clip();const cylG=ctx.createLinearGradient(lx+lw*0.25,ly,lx+lw*0.75,ly+lh);cylG.addColorStop(0,'#2a2a2a');cylG.addColorStop(0.5,'#4a4a4a');cylG.addColorStop(1,'#2a2a2a');ctx.fillStyle=cylG;roundRect(lx+lw*0.25,ly+lh*0.1,lw*0.5,lh*0.85,15);ctx.fill();const pinAreaX=lx+lw*0.27,pinAreaY=ly+lh*0.15,pinAreaW=lw*0.46,pinAreaH=lh*0.7;const n=game.pins.length;const pinSpacing=pinAreaW/n;game.pins.forEach((p,i)=>{const px=pinAreaX+pinSpacing*(i+0.5);const shearY=pinAreaY+pinAreaH*0.55;const setY=pinAreaY+pinAreaH*(1-p.setHeight);ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(pinAreaX,shearY);ctx.lineTo(pinAreaX+pinAreaW,shearY);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.beginPath();const sw=pinAreaH*0.08;for(let j=0;j<5;j++){ctx.moveTo(px-15+Math.sin(j*0.5)*3,pinAreaY-pinAreaH*0.1+j*5);ctx.lineTo(px+15+Math.cos(j*0.5)*3,pinAreaY-pinAreaH*0.1+j*5)}ctx.stroke();const pinY=p.set?setY-pinAreaH*0.08:setY;const pinH=pinAreaH*0.12;const pinGrad=ctx.createLinearGradient(px-12,pinY,px+12,pinY+pinH);pinGrad.addColorStop(0,'#b8860b');pinGrad.addColorStop(0.5,'#d4a017');pinGrad.addColorStop(1,'#8b6914');ctx.fillStyle=pinGrad;roundRect(px-12,pinY,24,pinH,3);ctx.fill();ctx.strokeStyle=p.set?'#ffeb3b':'#000';ctx.lineWidth=p.set?2:1;ctx.stroke();const kpinY=pinY+pinH;const kpinH=pinAreaH*0.12;const kGrad=ctx.createLinearGradient(px-12,kpinY,px+12,kpinY+kpinH);kGrad.addColorStop(0,'#a0a0a0');kGrad.addColorStop(1,'#c0c0c0');ctx.fillStyle=kGrad;roundRect(px-12,kpinY,24,kpinH,3);ctx.fill();ctx.stroke();if(p.clickFlash>0.1){ctx.fillStyle='rgba(255,235,59,'+p.clickFlash+')';roundRect(px-14,pinY-2,28,pinH+kpinH+4,4);ctx.fill()}});
ctx.restore();ctx.save();ctx.beginPath();ctx.rect(lx+10,ly+10,lw-20,lh-20);ctx.clip();const pickX=cx+lw*0.3*(game.pickX-0.5);const pickY=ly+lh*(0.15+game.pickY*0.7);ctx.strokeStyle='#e8e8e8';ctx.lineWidth=3;ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(pickX-100,pickY);ctx.lineTo(pickX,pickY-5);ctx.lineTo(pickX,pickY+5);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#b8860b';ctx.beginPath();ctx.arc(pickX,pickY,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pickX,ly+lh-30);ctx.lineTo(pickX+20,ly+lh-30);ctx.lineTo(pickX+20,ly+lh-10);ctx.stroke();ctx.restore();if(game.fail){ctx.fillStyle='rgba(139,0,0,0.3)';ctx.fillRect(0,0,W,H)}ctx.strokeStyle='rgba(184,134,11,0.3)';ctx.lineWidth=1;roundRect(lx,ly,lw,lh,20);ctx.stroke();requestAnimationFrame(loop)}function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
const saved=localStorage.getItem('locksmith_settings');if(saved){const s=JSON.parse(saved);settings=s;document.getElementById('volMaster').value=s.master*100;document.getElementById('volSfx').value=s.sfx*100;document.getElementById('volAmb').value=s.amb*100;document.getElementById('sensitivity').value=s.sensitivity;document.getElementById('hintsToggle').checked=s.hints}updateHighScore();requestAnimationFrame(loop);</script></body></html>
