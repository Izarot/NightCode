<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERLOAD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div id="level">LVL 00</div>
    <div id="moves">MOVES: 0</div>
    <div id="timer">00:00</div>
    <div id="pause" title="Pause">❚❚</div>
  </div>
  <div id="start-menu" class="menu">
    <h1>OVERLOAD</h1>
    <button id="start-btn">New Game</button>
    <button id="settings-btn">Settings</button>
    <button id="credits-btn">Credits</button>
  </div>
  <div id="victory-menu" class="menu">
    <h1>Level Complete!</h1>
    <div id="score">Time: <span id="victory-time">00:00</span></div>
    <button id="next-btn">Next Level</button>
    <button id="replay-btn">Replay</button>
    <button id="menu-btn">Menu</button>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
