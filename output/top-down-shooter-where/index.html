<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slow Burn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%220.9em%22 font-size=%2232%22>🚀</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div id="healthBar"><div id="healthFill"></div></div>
  <div id="ammo">Ammo: <span id="ammoCount">30</span>/30</div>
  <div id="dashCooldown"></div>
  <div id="fieldsCount">Fields: <span id="fieldsNum">0</span>/5</div>
  <div id="score">Score: <span id="scoreVal">0</span></div>
  <div id="timer">Time: <span id="timerVal">0s</span></div>
  <div id="highScore">Best: <span id="highScoreVal">0s</span></div>
</div>
<div id="gameOver" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;">
  <h2>Game Over</h2>
  <p>Score: <span id="finalScore"></span></p>
  <p>Time: <span id="finalTime"></span></p>
  <button id="restartBtn">Restart</button>
</div>
<script src="game.js"></script>
</body>
</html>
