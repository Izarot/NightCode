<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shieldstorm Arena</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='80' fill='%2300ffcc'%3E🛡️%3C/text%3E%3C/svg%3E">
  <style>body{margin:0;overflow:hidden;background:#0a0a0a;}
canvas{display:block;}
.hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;}
.pause-menu{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;gap:20px;z-index:20;}
button{background:#333;color:#fff;border:2px solid #00ffcc;padding:15px 30px;font-size:18px;cursor:pointer;border-radius:5px;}
button:hover{transform:scale(1.1);box-shadow:0 0 20px #00ffcc;}
.tooltip{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 20px;border-radius:5px;font-size:14px;z-index:30;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div id="health-bar" style="position:absolute;top:10px;left:10px;width:200px;height:8px;background:rgba(0,0,0,0.4);border:1px solid #fff;overflow:hidden"><div style="width:100%;height:100%;background:#ff4d4d"></div></div>
  <div id="shield-indicator" style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:80px;height:80px;border:2px solid #00ffcc;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" style="width:70px;height:70px"><path id="shield-arc" d="M50 50 L50 10 A90 90 0 0 1 90 50 Z" fill="none" stroke="#00ffcc" stroke-width="3" stroke-dasharray="283" stroke-dashoffset="283"></path></svg></div>
  <div id="score-wave" style="position:absolute;top:10px;right:10px;color:#fff;font-family:sans-serif;text-align:right"><div id="wave-label" style="font-size:14px">Wave 1</div><div id="score" style="font-size:24px;font-weight:bold">0</div></div>
  <div id="timer" style="position:absolute;top:10px;right:150px;color:#fff;font-family:sans-serif;font-size:16px">00:00</div>
</div>
<div class="pause-menu" id="pause-menu" style="display:none">
  <div style="display:flex;gap:15px"><button id="resume-btn">Resume</button><button id="restart-btn">Restart</button><button id="quit-btn">Quit</button></div>
</div>
<div class="tooltip" id="tooltip" style="display:none">WASD to move | F to deploy shield | Click to shoot</div>
<script src="game.js"></script>
</body>
</html>
