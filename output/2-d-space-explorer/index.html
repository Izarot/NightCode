<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>Asteroid Drift</title>
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:monospace;color:#0ff}
#game{display:block;width:100vw;height:100vh;background:#050510;touch-action:none}
.hud{position:fixed;pointer-events:none;z-index:5;text-shadow:0 0 8px #0ff}
#score{top:10px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;color:#fff}
#timer{top:10px;right:12px;font-size:16px;color:#ff2ea6}
#wave{top:38px;right:12px;font-size:14px;color:#ffe600}
#bars{bottom:16px;left:16px;width:220px}
.bar{height:14px;border:1px solid #0ff;margin:4px 0;background:rgba(0,0,0,.5)}
#shieldBar{height:100%;background:linear-gradient(90deg,#00f5ff,#ff2ea6);width:100%}
#hullBar{height:100%;background:linear-gradient(90deg,#ff004c,#ffe600);width:100%}
#notif{bottom:70px;left:50%;transform:translateX(-50%);font-size:18px;color:#ffe600;opacity:0;transition:.3s}
#help{bottom:8px;right:10px;font-size:11px;color:#aaa;text-align:right}
#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:10;flex-direction:column}
#pause h1{color:#ff2ea6;font-size:36px}button{pointer-events:auto;background:#00f5ff;border:0;padding:10px 24px;font-family:monospace;font-weight:bold;cursor:pointer;margin-top:12px}
#touch{position:fixed;bottom:70px;right:10px;display:none;gap:8px;z-index:6}
#touch button{width:56px;height:56px;border-radius:50%;opacity:.7}
@media(pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id='game'></canvas>
<div class='hud' id='score'>0</div>
<div class='hud' id='timer'>⏱ 00:00.0</div>
<div class='hud' id='wave'>WAVE 1</div>
<div class='hud' id='bars'><div>SHIELD</div><div class='bar'><div id='shieldBar'></div></div><div>HULL</div><div class='bar'><div id='hullBar'></div></div></div>
<div class='hud' id='notif'></div>
<div class='hud' id='help'>W/SPACE Thrust | A/D Rotate | S Brake | X/Click Shoot | P Pause<br>Collect 💎 cores for boost+i-frames</div>
<div id='touch'><button id='tL'>◀</button><button id='tR'>▶</button><button id='tT'>▲</button><button id='tF'>●</button></div>
<div id='pause'><h1>PAUSED</h1><p>Asteroid Drift</p><button onclick='togglePause()'>RESUME</button></div>
<script src='main.js'></script>
</body>
</html>
