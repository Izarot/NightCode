<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dodge Dot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="score">00:00</div>
      <div id="highScore">HS: 00:00</div>
      <div id="timer">Time: 00:00</div>
    </div>
    <div id="menu" class="screen">
      <h1>Dodge Dot</h1>
      <p>Avoid the shapes. Survive as long as possible.</p>
      <button id="startBtn">Play</button>
      <button id="settingsBtn">Settings</button>
      <button id="highScoresBtn">High Scores</button>
    </div>
    <div id="pauseOverlay" class="screen overlay">
      <div class="panel">
        <h2>PAUSED</h2>
        <button id="resumeBtn">Resume</button>
        <button id="menuFromPauseBtn">Main Menu</button>
      </div>
    </div>
    <div id="gameOverOverlay" class="screen overlay">
      <div class="panel">
        <h2>GAME OVER</h2>
        <div id="finalScore">00:00</div>
        <button id="retryBtn">Retry</button>
        <button id="mainMenuBtn">Main Menu</button>
        <button id="shareBtn">Share</button>
      </div>
    </div>
    <div id="settingsOverlay" class="screen overlay">
      <div class="panel">
        <h2>Settings</h2>
        <label>Volume: <input type="range" id="volumeSlider" min="0" max="100" value="80" /></label>
        <label>Graphics: <select id="graphicsSelect"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
        <label>Controls: <select id="controlsSelect"><option selected>Auto</option><option>Keyboard</option><option>Touch</option></select></label>
        <button id="closeSettingsBtn">Close</button>
      </div>
    </div>
    <div id="highScoresOverlay" class="screen overlay">
      <div class="panel">
        <h2>High Scores</h2>
        <ul id="highScoreList"></ul>
        <button id="closeHighScoresBtn">Close</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
