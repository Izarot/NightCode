<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Bounce - Speedrun Edition</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <header id="hud">
            <div class="hud-item">
                <span class="hud-label">TIME</span>
                <span id="timer" class="hud-value">00:00.00</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <span id="score" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">BEST</span>
                <span id="high-score" class="hud-value">0</span>
            </div>
        </header>
        <canvas id="game-canvas"></canvas>
        <div id="start-screen" class="overlay">
            <h1>NEON BOUNCE</h1>
            <p>Arrow Keys / WASD / Touch to Move</p>
            <p class="subtitle">Survive. Score. Speedrun.</p>
            <button id="start-btn" class="btn">START RUN</button>
        </div>
        <div id="game-over-screen" class="overlay hidden">
            <h1>GAME OVER</h1>
            <div class="result-grid">
                <div><span>Final Score</span><strong id="final-score">0</strong></div>
                <div><span>Run Time</span><strong id="final-time">00:00.00</strong></div>
                <div><span>New Best?</span><strong id="new-best">-</strong></div>
            </div>
            <button id="restart-btn" class="btn">RETRY</button>
        </div>
    </div>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
