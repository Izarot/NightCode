<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
<title>Pursuit Snake - Crouton Alpha</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>'>
<link rel='stylesheet' href='styles/main.css'>
</head>
<body>
<div id='app'>
<header><h1>🐍 PURSUIT SNAKE</h1><div id='timer'>⏱ 00:00.0</div></header>
<div id='hud'><div id='score'>SCORE: 00000</div><div id='lagbar'>LAG: 0.60 | SPD: 3.2</div><div id='hi'>HI: 00000</div></div>
<div id='wrap'><canvas id='game' width='800' height='600'></canvas>
<div id='overlay' class='hidden'><div id='panel'><h2 id='panelTitle'>PAUSED</h2><p id='panelText'></p>
<div id='menuBtns'><button id='btnResume'>Resume</button><button id='btnRestart'>Restart</button><button id='btnSettings'>Settings</button><button id='btnQuit'>Quit</button><button id='btnAgain' class='hidden'>Play Again</button><button id='btnShare' class='hidden'>Share Score</button></div>
<div id='settings' class='hidden'><label>Pursuit Lag <span id='lagVal'>0.60</span></label><input id='lagSlider' type='range' min='0.4' max='0.8' step='0.01' value='0.6'><label><input id='speedToggle' type='checkbox'> Speed Multiplier</label><div id='themes'><button data-theme='volt'>🌴 Tropical Volt</button><button data-theme='neon'>⚡ Cyber Neon</button><button data-theme='mono'>◐ Monochrome</button><button data-theme='pastel'>🌸 Pastel</button></div><label><input id='muteToggle' type='checkbox'> Mute</label><button id='btnResetHi'>Reset High Score</button><button id='btnSaveSettings'>Save</button><button id='btnCancelSettings'>Cancel</button></div>
</div></div></div>
<div id='dpad'><button data-dir='up'>▲</button><button data-dir='left'>◀</button><button data-dir='down'>▼</button><button data-dir='right'>▶</button></div>
<p class='hint'>WASD / Arrows / Swipe • Esc Pause • Eat • Survive</p>
</div>
<script src='src/audio.js'></script>
<script src='src/particles.js'></script>
<script src='src/input.js'></script>
<script src='src/ui.js'></script>
<script src='src/game.js'></script>
</body>
</html>
