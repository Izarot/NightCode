<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Depth of Song</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐋%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="sonar" class="bar"><div id="sonarFill"></div></div>
  <div id="fragCount">0/8</div>
  <div id="timer">00:00</div>
  <div id="depthGauge"><div id="depthMarker"></div></div>
  <div id="prompt"></div>
  <div id="menu" class="hidden">
    <h1>DEPTH OF SONG</h1>
    <p>Arrows/WASD to move • SPACE to pulse • E to interact</p>
    <button id="resumeBtn">Resume</button>
    <button id="restartBtn">Restart</button>
    <button id="settingsBtn">Settings</button>
  </div>
  <div id="touchLeft" class="touch"></div>
  <div id="touchRight" class="touch pulseBtn"></div>
</div>
<script src="game.js"></script>
</body>
</html>
