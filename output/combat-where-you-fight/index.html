<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wind Blade</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050d18;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }
        #gameCanvas {
            background: #0a1628;
            touch-action: none;
            max-width: 100vw;
            max-height: 100vh;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
// ==================== CONFIG ====================
const CONFIG = {
    WIDTH: 1280, HEIGHT: 800,
    COLORS: {
        BG: '#0a1628', ARENA: '#1a2744', PLAYER: '#e0f7ff',
        WIND: '#7fdbff', WIND_CORE: '#00ffff', EMBER: '#ff6b35',
        GOLEM: '#5d4e37', WISP: '#ffaa00', DRAKE: '#8b5cf6',
        GOLD: '#ffd700', HEALTH: '#22c55e', DAMAGE: '#dc2626'
    },
    PLAYER: { RADIUS: 18, SPEED: 280, DASH_SPEED: 400, ACCEL: 0.15, IFRAMES: 0.3, MAX_HP: 100 },
    ENEMIES: {
        EMBER: { hp: 1, speed: 120, radius: 14, score: 100, mass: 1 },
        GOLEM: { hp: 5, speed: 60, radius: 28, score: 250, mass: 5, fireRate: 2.5 },
        WISP: { hp: 1, speed: 180, radius: 10, score: 150, mass: 0.5 },
        DRAKE: { hp: 8, speed: 90, radius: 32, score: 400, mass: 3 }
    },
    ABILITIES: { PULSE_CD: 0.3, PULL_CD: 1.2, CYCLONE_CD: 4, SHIELD_CD: 6 }
};

// ==================== AUDIO ====================
class AudioManager {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { this.enabled = false; }
    }
    resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
    play(type) {
        if (!this.enabled || !this.ctx) return;
        const ctx = this.ctx, now = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        switch(type) {
            case 'gust':
                osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.type = 'sawtooth'; osc.start(now); osc.stop(now + 0.1); break;
            case 'pull':
                osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.type = 'sine'; osc.start(now); osc.stop(now + 0.2); break;
            case 'stream':
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.type = 'triangle'; osc.start(now); osc.stop(now + 0.05); break;
            case 'cyclone':
                osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(300, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.type = 'sawtooth'; osc.start(now); osc.stop(now + 0.4); break;
            case 'shield':
                osc.frequency.setValueAtTime(600, now); osc.frequency.linearRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.type = 'sine'; osc.start(now); osc.stop(now + 0.2); break;
            case 'hit':
                osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.type = 'square'; osc.start(now); osc.stop(now + 0.15); break;
            case 'kill':
                osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.type = 'square'; osc.start(now); osc.stop(now + 0.1); break;
            case 'wave':
                [0, 0.1, 0.2].forEach((t, i) => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.connect(g); g.connect(ctx.destination);
                    o.frequency.value = [300, 400, 500][i];
                    g.gain.setValueAtTime(0.08, now + t); g.gain.exponentialRampToValueAtTime(0.01, now + t + 0.15);
                    o.type = 'sine'; o.start(now + t); o.stop(now + t + 0.15);
                }); break;
        }
    }
}

// ==================== UTILS ====================
const Utils = {
    dist: (a, b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2),
    angle: (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
    lerp: (a, b, t) => a + (b - a) * t,
    clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
    rand: (min, max) => Math.random() * (max - min) + min,
    randInt: (min, max) => Math.floor(Utils.rand(min, max + 1))
};

// ==================== INPUT ====================
class Input {
    constructor(canvas) {
        this.keys = {}; this.mouse = { x: 640, y: 400, down: false, shift: false };
        this.canvas = canvas;
        window.addEventListener('keydown', e => { this.keys[e.code] = true; e.preventDefault(); });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });
        canvas.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            this.mouse.x = (e.clientX - r.left) * (CONFIG.WIDTH / r.width);
            this.mouse.y = (e.clientY - r.top) * (CONFIG.HEIGHT / r.height);
        });
        canvas.addEventListener('mousedown', e => { this.mouse.down = true; this.mouse.shift = e.shiftKey; });
        canvas.addEventListener('mouseup', () => { this.mouse.down = false; });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); const t = e.touches[0];
            const r = canvas.getBoundingClientRect();
            this.mouse.x = (t.clientX - r.left) * (CONFIG.WIDTH / r.width);
            this.mouse.y = (t.clientY - r.top) * (CONFIG.HEIGHT / r.height);
            this.mouse.down = true;
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault(); const t = e.touches[0];
            const r = canvas.getBoundingClientRect();
            this.mouse.x = (t.clientX - r.left) * (CONFIG.WIDTH / r.width);
            this.mouse.y = (t.clientY - r.top) * (CONFIG.HEIGHT / r.height);
        });
        canvas.addEventListener('touchend', () => { this.mouse.down = false; });
    }
}

// ==================== PARTICLES ====================
class ParticleSystem {
    constructor() {
        this.pool = [];
        for (let i = 0; i < 500; i++) this.pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, color: '#fff', size: 3, type: 'spark', alpha: 1 });
    }
    spawn(x, y, vx, vy, color, size, life, type = 'spark') {
        const p = this.pool.find(p => !p.active);
        if (!p) return;
        Object.assign(p, { active: true, x, y, vx, vy, color, size, life, maxLife: life, type, alpha: 1 });
    }
    burst(x, y, count, speed, color, size, life, type = 'spark') {
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i + Math.random() * 0.5;
            const s = speed * (0.5 + Math.random() * 0.5);
            this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s, color, size * (0.5 + Math.random()), life, type);
        }
    }
    update(dt) {
        this.pool.forEach(p => {
            if (!p.active) return;
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vx *= 0.98; p.vy *= 0.98;
            p.life -= dt; p.alpha = p.life / p.maxLife;
            if (p.life <= 0) p.active = false;
        });
    }
    draw(ctx) {
        this.pool.forEach(p => {
            if (!p.active) return;
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            if (p.type === 'spark') {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.alpha, 0, Math.PI * 2);
                ctx.fill();
            } else if (p.type === 'ring') {
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.size;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        });
    }
}

// ==================== PLAYER ====================
class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.hp = CONFIG.PLAYER.MAX_HP;
        this.radius = CONFIG.PLAYER.RADIUS;
        this.cooldowns = { pulse: 0, pull: 0, cyclone: 0, shield: 0 };
        this.iframes = 0;
        this.shieldActive = false;
        this.shieldTime = 0;
        this.trail = [];
        this.streamHold = 0;
    }
    update(dt, input, audio) {
        // Movement
        let mx = 0, my = 0;
        if (input.keys['KeyW'] || input.keys['ArrowUp']) my -= 1;
        if (input.keys['KeyS'] || input.keys['ArrowDown']) my += 1;
        if (input.keys['KeyA'] || input.keys['ArrowLeft']) mx -= 1;
        if (input.keys['KeyD'] || input.keys['ArrowRight']) mx += 1;
        if (mx || my) { const len = Math.sqrt(mx*mx + my*my); mx /= len; my /= len; }
        const speed = CONFIG.PLAYER.SPEED;
        this.vx += mx * speed * CONFIG.PLAYER.ACCEL;
        this.vy += my * speed * CONFIG.PLAYER.ACCEL;
        this.vx *= 0.9; this.vy *= 0.9;
        const vel = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (vel > speed) { this.vx = (this.vx/vel) * speed; this.vy = (this.vy/vel) * speed; }
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.x = Utils.clamp(this.x, this.radius, CONFIG.WIDTH - this.radius);
        this.y = Utils.clamp(this.y, this.radius, CONFIG.HEIGHT - this.radius);
        // Trail
        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > 5) this.trail.pop();
        // Cooldowns
        for (let k in this.cooldowns) if (this.cooldowns[k] > 0) this.cooldowns[k] -= dt;
        if (this.iframes > 0) this.iframes -= dt;
        // Shield
        if (this.shieldActive) {
            this.shieldTime -= dt;
            if (this.shieldTime <= 0) { this.shieldActive = false; this.cooldowns.shield = CONFIG.ABILITIES.SHIELD_CD; }
        }
        // Stream hold
        if (input.mouse.down && !input.mouse.shift) this.streamHold += dt;
        else this.streamHold = 0;
    }
    takeDamage(amount, audio, particles) {
        if (this.iframes > 0 || this.shieldActive) return false;
        this.hp -= amount; this.iframes = CONFIG.PLAYER.IFRAMES;
        audio.play('hit');
        particles.burst(this.x, this.y, 8, 200, CONFIG.COLORS.DAMAGE, 4, 0.5);
        return true;
    }
    activateShield(audio) {
        if (this.cooldowns.shield <= 0) {
            this.shieldActive = true; this.shieldTime = 1.5;
            audio.play('shield'); return true;
        }
        return false;
    }
}

// ==================== ENEMIES ====================
class Enemy {
    constructor(type, x, y) {
        this.type = type;
        const stats = CONFIG.ENEMIES[type];
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.hp = stats.hp; this.maxHp = stats.hp;
        this.speed = stats.speed; this.radius = stats.radius;
        this.score = stats.score; this.mass = stats.mass;
        this.stunTime = 0; this.flashTime = 0;
        this.fireTimer = stats.fireRate || 0;
        this.immuneTimer = 0;
        this.phase = Math.random() * Math.PI * 2;
    }
    update(dt, player, fireballs) {
        this.phase += dt * 3;
        if (this.stunTime > 0) { this.stunTime -= dt; this.vx *= 0.9; this.vy *= 0.9; }
        else {
            const angle = Utils.angle(this, player);
            switch(this.type) {
                case 'EMBER': this.vx += Math.cos(angle) * this.speed * 0.1; this.vy += Math.sin(angle) * this.speed * 0.1; break;
                case 'GOLEM':
                    this.vx += Math.cos(angle) * this.speed * 0.05; this.vy += Math.sin(angle) * this.speed * 0.05;
                    this.fireTimer -= dt;
                    if (this.fireTimer <= 0) {
                        this.fireTimer = CONFIG.ENEMIES.GOLEM.fireRate;
                        fireballs.push({ x: this.x, y: this.y, vx: Math.cos(angle) * 200, vy: Math.sin(angle) * 200, life: 3 });
                    }
                    break;
                case 'WISP':
                    this.vx += Math.cos(this.phase * 2) * this.speed * 0.15; this.vy += Math.sin(this.phase * 2) * this.speed * 0.15;
                    break;
                case 'DRAKE':
                    this.vx += Math.cos(angle) * this.speed * 0.08; this.vy += Math.sin(angle) * this.speed * 0.08;
                    this.immuneTimer -= dt;
                    break;
            }
        }
        this.vx *= 0.95; this.vy *= 0.95;
        const vel = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (vel > this.speed) { this.vx = (this.vx/vel) * this.speed; this.vy = (this.vy/vel) * this.speed; }
        this.x += this.vx * dt; this.y += this.vy * dt;
        if (this.x < -50) this.x = CONFIG.WIDTH + 50; if (this.x > CONFIG.WIDTH + 50) this.x = -50;
        if (this.y < -50) this.y = CONFIG.HEIGHT + 50; if (this.y > CONFIG.HEIGHT + 50) this.y = -50;
        if (this.flashTime > 0) this.flashTime -= dt;
    }
    applyForce(fx, fy) {
        if (this.type === 'DRAKE' && this.immuneTimer > 0) return;
        this.vx += fx / this.mass; this.vy += fy / this.mass;
        const vel = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (vel > 500) { this.vx = (this.vx/vel) * 500; this.vy = (this.vy/vel) * 500; }
        this.stunTime = 0.5; this.flashTime = 0.15;
    }
    hit() { this.hp--; this.flashTime = 0.2; return this.hp <= 0; }
}

// ==================== CYCLONE ====================
class Cyclone {
    constructor(x, y) {
        this.x = x; this.y = y; this.life = 3; this.radius = 120; this.rotation = 0;
    }
    update(dt, enemies) {
        this.life -= dt; this.rotation += dt * 8;
        enemies.forEach(e => {
            const d = Utils.dist(this, e);
            if (d < this.radius) {
                const a = Utils.angle(e, this);
                const force = 400 * (1 - d / this.radius);
                e.vx += Math.cos(a) * force * dt;
                e.vy += Math.sin(a) * force * dt;
                e.stunTime = 0.3;
            }
        });
        return this.life <= 0;
    }
}

// ==================== GAME ====================
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = CONFIG.WIDTH; this.canvas.height = CONFIG.HEIGHT;
        this.audio = new AudioManager();
        this.input = new Input(this.canvas);
        this.particles = new ParticleSystem();
        this.state = 'TITLE';
        this.highScore = parseInt(localStorage.getItem('windblade_highscore') || '0');
        this.scale = 1;
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.lastTime = performance.now();
        requestAnimationFrame(t => this.loop(t));
    }
    resize() {
        const ratio = CONFIG.WIDTH / CONFIG.HEIGHT;
        let w = window.innerWidth, h = window.innerHeight;
        if (w / h > ratio) w = h * ratio; else h = w / ratio;
        this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
        this.scale = w / CONFIG.WIDTH;
    }
    start() {
        this.player = new Player(CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2);
        this.enemies = []; this.fireballs = []; this.cyclones = [];
        this.score = 0; this.combo = 1; this.comboTimer = 0;
        this.wave = 0; this.waveTimer = 0; this.waveEnemies = 0; this.spawnTimer = 0;
        this.waveBanner = 0; this.noDamage = true;
        this.gameTime = 0; this.startTime = performance.now();
        this.screenShake = 0; this.damageFlash = 0;
        this.state = 'PLAYING';
        this.nextWave();
    }
    nextWave() {
        this.wave++;
        this.noDamage = true;
        const waveCfg = [
            { ember: 5 }, { ember: 8 }, { ember: 12 },
            { ember: 10, golem: 1 }, { ember: 12, golem: 2 },
            { ember: 8, golem: 2, wisp: 3 }, { ember: 10, golem: 3, wisp: 5 },
            { ember: 8, golem: 2, wisp: 4, drake: 1 }, { ember: 10, golem: 3, wisp: 5, drake: 2 }
        ];
        const cfg = waveCfg[Math.min(this.wave - 1, waveCfg.length - 1)];
        const scale = this.wave > 10 ? 1 + (this.wave - 10) * 0.2 : 1;
        this.spawnQueue = [];
        for (let t of ['EMBER', 'GOLEM', 'WISP', 'DRAKE']) {
            const count = Math.floor((cfg[t.toLowerCase()] || 0) * scale);
            for (let i = 0; i < count; i++) this.spawnQueue.push(t);
        }
        this.waveBanner = 3; this.audio.play('wave');
    }
    spawnEnemy(type) {
        const side = Utils.randInt(0, 3);
        let x, y;
        switch(side) {
            case 0: x = Utils.rand(0, CONFIG.WIDTH); y = -50; break;
            case 1: x = CONFIG.WIDTH + 50; y = Utils.rand(0, CONFIG.HEIGHT); break;
            case 2: x = Utils.rand(0, CONFIG.WIDTH); y = CONFIG.HEIGHT + 50; break;
            case 3: x = -50; y = Utils.rand(0, CONFIG.HEIGHT); break;
        }
        this.enemies.push(new Enemy(type, x, y));
    }
    applyWind(x, y, radius, force, push = true, audio) {
        this.enemies.forEach(e => {
            const d = Utils.dist({ x, y }, e);
            if (d < radius) {
                const strength = force * (1 - d / radius);
                const a = Utils.angle({ x, y }, e);
                const fx = push ? Math.cos(a) * strength : -Math.cos(a) * strength;
                const fy = push ? Math.sin(a) * strength : -Math.sin(a) * strength;
                e.applyForce(fx, fy);
            }
        });
        if (audio) audio.play(push ? 'gust' : 'pull');
    }
    update(dt) {
        if (this.state === 'TITLE') {
            this.particles.update(dt);
            if (this.input.mouse.down) { this.audio.resume(); this.start(); }
            return;
        }
        if (this.state === 'PAUSED') {
            if (this.input.keys['Escape']) { this.state = 'PLAYING'; this.input.keys['Escape'] = false; }
            return;
        }
        if (this.state === 'GAMEOVER') {
            this.particles.update(dt);
            if (this.input.keys['KeyR']) this.start();
            return;
        }
        if (this.input.keys['Escape']) { this.state = 'PAUSED'; this.input.keys['Escape'] = false; }
        this.gameTime += dt;
        // Wave banner
        if (this.waveBanner > 0) this.waveBanner -= dt;
        // Spawning
        if (this.spawnQueue.length > 0) {
            this.spawnTimer -= dt;
            if (this.spawnTimer <= 0) {
                this.spawnTimer = 0.5;
                this.spawnEnemy(this.spawnQueue.shift());
            }
        }
        // Wave complete check
        if (this.spawnQueue.length === 0 && this.enemies.length === 0 && this.waveBanner <= 0) {
            this.waveTimer += dt;
            if (this.waveTimer >= 3) { this.waveTimer = 0; this.nextWave(); }
        }
        // Player
        this.player.update(dt, this.input, this.audio);
        // Abilities
        if (this.input.mouse.down) {
            if (this.input.mouse.shift && this.player.cooldowns.pull <= 0) {
                this.applyWind(this.player.x, this.player.y, 300, 600, false, this.audio);
                this.particles.burst(this.player.x, this.player.y, 12, 150, CONFIG.COLORS.WIND, 3, 0.4, 'ring');
                this.player.cooldowns.pull = CONFIG.ABILITIES.PULL_CD;
            } else if (this.streamHold >= 0.1 && this.player.cooldowns.pulse <= 0) {
                const a = Utils.angle(this.player, this.input.mouse);
                const dist = Utils.dist(this.player, this.input.mouse);
                this.enemies.forEach(e => {
                    const de = Utils.dist(this.player, e);
                    if (de < 250) {
                        const ea = Utils.angle(this.player, e);
                        const diff = Math.abs(ea - a);
                        if (diff < 0.4 || diff > Math.PI * 2 - 0.4) {
                            e.vx += Math.cos(a) * 400 * dt; e.vy += Math.sin(a) * 400 * dt;
                        }
                    }
                });
                if (Math.random() < 0.3) this.audio.play('stream');
            }
        }
        if (this.input.keys['KeyE'] && this.player.cooldowns.cyclone <= 0) {
            this.cyclones.push(new Cyclone(this.input.mouse.x, this.input.mouse.y));
            this.player.cooldowns.cyclone = CONFIG.ABILITIES.CYCLONE_CD;
            this.audio.play('cyclone');
            this.input.keys['KeyE'] = false;
        }
        if (this.input.keys['Space']) {
            if (!this.player.shieldActive) this.player.activateShield(this.audio);
            this.input.keys['Space'] = false;
        }
        // Click for pulse
        if (this.input.mouse.down && !this.input.mouse.shift && this.streamHold < 0.15 && this.player.cooldowns.pulse <= 0) {
            this.applyWind(this.player.x, this.player.y, 180, 600, true, this.audio);
            this.particles.burst(this.player.x, this.player.y, 12, 250, CONFIG.COLORS.WIND, 4, 0.15);
            this.player.cooldowns.pulse = CONFIG.ABILITIES.PULSE_CD;
        }
        // Enemies
        this.enemies.forEach(e => e.update(dt, this.player, this.fireballs));
        // Cyclones
        this.cyclones = this.cyclones.filter(c => !c.update(dt, this.enemies));
        // Fireballs
        this.fireballs = this.fireballs.filter(f => {
            f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
            this.enemies.forEach(e => {
                const d = Utils.dist(f, e);
                if (d < e.radius + 10) {
                    f.vx *= -0.5; f.vy *= -0.5;
                }
            });
            return f.life > 0 && f.x > 0 && f.x < CONFIG.WIDTH && f.y > 0 && f.y < CONFIG.HEIGHT;
        });
        // Collision
        this.enemies = this.enemies.filter(e => {
            const d = Utils.dist(e, this.player);
            if (d < e.radius + this.player.radius) {
                if (this.player.takeDamage(e.type === 'WISP' ? 1 : 1, this.audio, this.particles)) {
                    this.noDamage = false; this.screenShake = 0.3; this.damageFlash = 0.3;
                }
                if (e.type === 'WISP') {
                    this.particles.burst(e.x, e.y, 8, 150, CONFIG.COLORS.WISP, 4, 0.3);
                    return false;
                }
            }
            return e.hp > 0;
        });
        // Fireball collision with player
        this.fireballs = this.fireballs.filter(f => {
            if (Utils.dist(f, this.player) < this.player.radius + 10) {
                if (this.player.shieldActive) {
                    const a = Utils.angle(f, this.player);
                    f.vx = Math.cos(a) * 300; f.vy = Math.sin(a) * 300;
                    return true;
                }
                if (this.player.takeDamage(1, this.audio, this.particles)) {
                    this.noDamage = false; this.screenShake = 0.3; this.damageFlash = 0.3;
                }
                return false;
            }
            return true;
        });
        // Combo
        if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 1; }
        // Particles
        this.particles.update(dt);
        // Screen shake
        if (this.screenShake > 0) this.screenShake -= dt;
        if (this.damageFlash > 0) this.damageFlash -= dt;
        // Game over
        if (this.player.hp <= 0) {
            this.state = 'GAMEOVER';
            if (this.score > this.highScore) {
                this.highScore = this.score;
                localStorage.setItem('windblade_highscore', this.highScore);
            }
        }
    }
    scoreKill(e) {
        const points = Math.floor(e.score * this.combo);
        this.score += points; this.combo = Math.min(this.combo + 0.2, 5); this.comboTimer = 2;
        this.particles.burst(e.x, e.y, 15, 200, e.type === 'WISP' ? CONFIG.COLORS.WISP : CONFIG.COLORS.GOLD, 5, 0.6);
        this.audio.play('kill');
    }
    drawTitle() {
        const ctx = this.ctx;
        // Background particles
        this.particles.draw(ctx);
        // Background gradient
        const grad = ctx.createRadialGradient(CONFIG.WIDTH/2, CONFIG.HEIGHT/2, 0, CONFIG.WIDTH/2, CONFIG.HEIGHT/2, 600);
        grad.addColorStop(0, 'rgba(127, 219, 255, 0.1)'); grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
        // Title
        ctx.textAlign = 'center';
        ctx.fillStyle = CONFIG.COLORS.WIND_CORE;
        ctx.font = '900 96px Orbitron';
        ctx.shadowColor = CONFIG.COLORS.WIND; ctx.shadowBlur = 30;
        ctx.fillText('WIND BLADE', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 - 50);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#7fdbff';
        ctx.font = '400 24px Orbitron';
        ctx.fillText('Master the Storm', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 10);
        // Instructions
        ctx.fillStyle = '#ffffff';
        ctx.font = '400 18px Orbitron';
        ctx.fillText('WASD / Arrows: Move   |   Click: Wind Gust   |   Shift+Click: Wind Pull', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 80);
        ctx.fillText('E: Cyclone   |   Space: Shield', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 110);
        ctx.fillText('CLICK TO START', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 180);
        if (this.highScore > 0) {
            ctx.fillStyle = CONFIG.COLORS.GOLD;
            ctx.fillText('High Score: ' + this.highScore, CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 220);
        }
    }
    drawHUD() {
        const ctx = this.ctx;
        // HP bar
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(20, 20, 200, 20);
        ctx.fillStyle = CONFIG.COLORS.HEALTH;
        ctx.fillRect(20, 20, 200 * (this.player.hp / CONFIG.PLAYER.MAX_HP), 20);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(20, 20, 200, 20);
        // Cooldowns
        const cds = [
            { key: 'Q', cd: this.player.cooldowns.pulse, max: CONFIG.ABILITIES.PULSE_CD, label: 'GUST' },
            { key: 'SHIFT', cd: this.player.cooldowns.pull, max: CONFIG.ABILITIES.PULL_CD, label: 'PULL' },
            { key: 'E', cd: this.player.cooldowns.cyclone, max: CONFIG.ABILITIES.CYCLONE_CD, label: 'CYCLONE' },
            { key: 'SPACE', cd: this.player.shieldActive ? 0 : this.player.cooldowns.shield, max: CONFIG.ABILITIES.SHIELD_CD, label: 'SHIELD', active: this.player.shieldActive }
        ];
        cds.forEach((c, i) => {
            const x = 20 + i * 80, y = 50;
            ctx.fillStyle = c.active ? CONFIG.COLORS.WIND_CORE : 'rgba(0,0,0,0.5)';
            ctx.fillRect(x, y, 70, 30);
            if (c.cd > 0 && !c.active) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(x, y, 70 * (c.cd / c.max), 30);
            }
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(x, y, 70, 30);
            ctx.fillStyle = '#fff'; ctx.font = '700 10px Orbitron'; ctx.textAlign = 'center';
            ctx.fillText(c.label, x + 35, y + 12);
            ctx.fillText(c.key, x + 35, y + 25);
        });
        // Score
        ctx.textAlign = 'right'; ctx.fillStyle = CONFIG.COLORS.GOLD; ctx.font = '700 32px Orbitron';
        ctx.fillText(this.score, CONFIG.WIDTH - 20, 40);
        // Wave
        ctx.fillStyle = '#fff'; ctx.font = '400 16px Orbitron';
        ctx.fillText('WAVE ' + this.wave, CONFIG.WIDTH - 20, 65);
        // Combo
        if (this.combo > 1) {
            ctx.fillStyle = CONFIG.COLORS.EMBER; ctx.font = '700 20px Orbitron';
            ctx.fillText('x' + this.combo.toFixed(1), CONFIG.WIDTH - 20, 90);
        }
        // Enemies remaining
        ctx.fillStyle = '#aaa'; ctx.font = '400 14px Orbitron';
        ctx.fillText('Enemies: ' + (this.enemies.length + this.spawnQueue.length), CONFIG.WIDTH - 20, 110);
        // Wave banner
        if (this.waveBanner > 0) {
            ctx.textAlign = 'center'; ctx.fillStyle = CONFIG.COLORS.WIND_CORE; ctx.font = '900 64px Orbitron';
            ctx.shadowColor = CONFIG.COLORS.WIND; ctx.shadowBlur = 20;
            ctx.fillText('WAVE ' + this.wave, CONFIG.WIDTH/2, CONFIG.HEIGHT/2);
            ctx.shadowBlur = 0;
        }
    }
    draw() {
        const ctx = this.ctx;
        ctx.save();
        // Screen shake
        let sx = 0, sy = 0;
        if (this.screenShake > 0) {
            sx = (Math.random() - 0.5) * 10 * this.screenShake;
            sy = (Math.random() - 0.5) * 10 * this.screenShake;
        }
        ctx.translate(sx, sy);
        // Background
        ctx.fillStyle = CONFIG.COLORS.BG;
        ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
        // Arena
        ctx.strokeStyle = CONFIG.COLORS.ARENA; ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, CONFIG.WIDTH - 4, CONFIG.HEIGHT - 4);
        // Grid
        ctx.strokeStyle = 'rgba(127, 219, 255, 0.05)'; ctx.lineWidth = 1;
        for (let i = 0; i < CONFIG.WIDTH; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CONFIG.HEIGHT); ctx.stroke(); }
        for (let i = 0; i < CONFIG.HEIGHT; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CONFIG.WIDTH, i); ctx.stroke(); }
        if (this.state === 'TITLE') {
            this.drawTitle();
            ctx.restore();
            return;
        }
        // Damage flash
        if (this.damageFlash > 0) {
            ctx.fillStyle = 'rgba(220, 38, 38, ' + (this.damageFlash * 0.5) + ')';
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
        }
        // Player trail
        this.player.trail.forEach((t, i) => {
            ctx.globalAlpha = i / this.player.trail.length * 0.5;
            ctx.fillStyle = CONFIG.COLORS.WIND;
            ctx.beginPath();
            ctx.arc(t.x, t.y, this.player.radius * (i / this.player.trail.length), 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        // Cyclones
        this.cyclones.forEach(c => {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.rotation);
            ctx.globalAlpha = c.life / 3;
            for (let i = 0; i < 3; i++) {
                ctx.strokeStyle = CONFIG.COLORS.WIND; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, c.radius * (0.3 + i * 0.3), 0, Math.PI * 1.5);
                ctx.stroke();
            }
            ctx.restore();
        });
        // Fireballs
        this.fireballs.forEach(f => {
            ctx.fillStyle = CONFIG.COLORS.EMBER;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 8, 0, Math.PI * 2);
            ctx.fill();
        });
        // Enemies
        this.enemies.forEach(e => {
            const color = CONFIG.COLORS[e.type];
            ctx.fillStyle = e.flashTime > 0 ? '#fff' : color;
            if (e.type === 'EMBER') {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                // Glowing eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(e.x - 4, e.y - 2, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(e.x + 4, e.y - 2, 2, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'GOLEM') {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                // Cracks
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(e.x - 10, e.y); ctx.lineTo(e.x + 10, e.y);
                ctx.stroke();
            } else if (e.type === 'WISP') {
                ctx.globalAlpha = 0.7 + Math.sin(e.phase) * 0.3;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (e.type === 'DRAKE') {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                // Wings
                ctx.fillStyle = e.flashTime > 0 ? '#fff' : '#6d28d9';
                ctx.beginPath();
                ctx.ellipse(e.x - 20, e.y, 15, 8, Math.PI/4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(e.x + 20, e.y, 15, 8, -Math.PI/4, 0, Math.PI*2); ctx.fill();
            }
            // HP bar
            if (e.hp < e.maxHp) {
                ctx.fillStyle = '#000'; ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, e.radius*2, 4);
                ctx.fillStyle = CONFIG.COLORS.HEALTH;
                ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, e.radius*2 * (e.hp/e.maxHp), 4);
            }
        });
        // Player
        ctx.save();
        ctx.translate(this.player.x, this.player.y);
        if (this.player.iframes > 0 && Math.floor(this.player.iframes * 10) % 2) ctx.globalAlpha = 0.5;
        // Shield
        if (this.player.shieldActive) {
            ctx.strokeStyle = CONFIG.COLORS.WIND_CORE; ctx.lineWidth = 3;
            ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 100) * 0.3;
            ctx.beginPath(); ctx.arc(0, 0, this.player.radius + 10, 0, Math.PI * 2); ctx.stroke();
            ctx.globalAlpha = 1;
        }
        ctx.fillStyle = CONFIG.COLORS.PLAYER;
        ctx.beginPath(); ctx.arc(0, 0, this.player.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = CONFIG.COLORS.WIND_CORE;
        ctx.beginPath(); ctx.arc(0, 0, this.player.radius * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        // Wind aim line
        if (this.input.mouse.down && !this.input.mouse.shift) {
            const a = Utils.angle(this.player, this.input.mouse);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.player.x, this.player.y);
            ctx.lineTo(this.player.x + Math.cos(a) * 250, this.player.y + Math.sin(a) * 250);
            ctx.stroke();
        }
        // Particles
        this.particles.draw(ctx);
        // HUD
        if (this.state === 'PLAYING') this.drawHUD();
        if (this.state === 'PAUSED') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '900 64px Orbitron';
            ctx.fillText('PAUSED', CONFIG.WIDTH/2, CONFIG.HEIGHT/2);
            ctx.font = '400 18px Orbitron';
            ctx.fillText('Press ESC to resume', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 40);
        }
        if (this.state === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
            ctx.fillStyle = CONFIG.COLORS.DAMAGE; ctx.textAlign = 'center'; ctx.font = '900 80px Orbitron';
            ctx.fillText('DEFEATED', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 - 50);
            ctx.fillStyle = CONFIG.COLORS.GOLD; ctx.font = '700 36px Orbitron';
            ctx.fillText('Score: ' + this.score, CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 20);
            if (this.score >= this.highScore && this.score > 0) {
                ctx.fillStyle = CONFIG.COLORS.WIND_CORE; ctx.font = '400 20px Orbitron';
                ctx.fillText('★ NEW HIGH SCORE ★', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 60);
            }
            ctx.fillStyle = '#fff'; ctx.font = '400 18px Orbitron';
            ctx.fillText('Wave: ' + this.wave + '   |   Press R to restart', CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 100);
        }
        ctx.restore();
    }
    loop(time) {
        const dt = Math.min((time - this.lastTime) / 1000, 0.05);
        this.lastTime = time;
        this.update(dt);
        this.draw();
        requestAnimationFrame(t => this.loop(t));
    }
}

// ==================== SPAWN ENEMIES ON KILL ====================
// Hook into game to award score on enemy kill
const origUpdate = Game.prototype.update;
Game.prototype.update = function(dt) {
    if (this.state === 'PLAYING') {
        // Check enemies for kill
        const before = this.enemies.length;
        origUpdate.call(this, dt);
        // Award scores for killed enemies (enemies removed during update)
        // We track via a different approach - check hp
        this.enemies.forEach(e => {
            if (!e._scored && e.hp <= 0) {
                e._scored = true;
                this.scoreKill(e);
            }
        });
    } else {
        origUpdate.call(this, dt);
    }
};

// ==================== START ====================
window.addEventListener('load', () => {
    new Game();
});
    </script>
