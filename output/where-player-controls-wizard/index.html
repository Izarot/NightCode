<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>Wizard Duel - Dodge the Dark Arts</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙</text></svg>'>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#0b0618;color:#fff;font-family:Orbitron,Arial,sans-serif;overflow:hidden;height:100%}
#wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a1450,#07030f 70%)}
#c{width:min(100vw,150vh);height:auto;aspect-ratio:3/2;max-height:100vh;background:#120a24;border:2px solid #a855f7;border-radius:12px;box-shadow:0 0 40px #7c3aed,0 0 90px #ec4899;display:block;touch-action:none}
</style>
</head>
<body>
<div id='wrap'><canvas id='c' width='960' height='640'></canvas></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=960,H=640;
let state='MENU',last=0,elapsed=0,score=0,high=+(localStorage.getItem('wd_high')||0),shake=0,flash=0,muted=false,phase=1,phaseT=0,castT=1,crystalT=10,slowT=0;
let keys={},spells=[],parts=[],picks=[],tels=[],floats=[],trail=[];
let P,E;
function reset(){P={x:480,y:480,vx:0,vy:0,hp:100,st:100,face:1,ifr:0,dash:0,dashCd:0,stDelay:0,r:16,bob:0};E={x:480,y:90,hp:100,dir:1,charge:0};spells=[];parts=[];picks=[];tels=[];floats=[];trail=[];elapsed=0;score=0;phase=1;phaseT=0;castT=1;crystalT=10;shake=0;flash=0;counter=0;}
let counter=0;
let AC=null;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function sfx(f,d,type,v){if(muted)return;try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
function boom(f){sfx(f,0.25,'sawtooth',0.15);sfx(f/2,0.3,'square',0.08);}
function burst(px,py,col,n,sp){for(let i=0;i<n;i++){if(parts.length>200)break;let a=Math.random()*6.28,s=(sp||120)*(0.3+Math.random());parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.5,col:col,r:2+Math.random()*3});}}
function addFloat(px,py,txt,col){floats.push({x:px,y:py,txt:txt,col:col||'#fff',life:1});}
function fmt(t){let m=Math.floor(t/60),s=Math.floor(t%60);return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyM')muted=!muted;if(e.code==='Enter'){if(state==='MENU'||state==='GAMEOVER'||state==='VICTORY'){reset();state='PLAYING';}}if((e.code==='KeyP'||e.code==='Escape')&&state==='PLAYING')state='PAUSED';else if((e.code==='KeyP'||e.code==='Escape')&&state==='PAUSED')state='PLAYING';if(e.code==='KeyE'&&state==='PLAYING'&&counter>=100){counter=0;spells=[];tels=[];burst(P.x,P.y,'#f0f',60,300);shake=8;boom(200);if(phase===5){E.hp-=25;addFloat(E.x,E.y-30,'-25','#f0f');}sfx(600,0.4,'sine',0.2);}});
addEventListener('keyup',e=>keys[e.code]=false);
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;if(state==='MENU'){if(mx>330&&mx<630&&my>300&&my<350){reset();state='PLAYING';}if(mx>330&&mx<630&&my>370&&my<420)state='HOW';if(mx>330&&mx<630&&my>440&&my<490)muted=!muted;}else if(state==='HOW'&&my>500){state='MENU';}else if(state==='PAUSED'){if(my>300&&my<350){state='PLAYING';}if(my>370&&my<420){reset();state='PLAYING';}}else if(state==='GAMEOVER'||state==='VICTORY'){if(my>380&&my<430){reset();state='PLAYING';}}});
function spawnSpell(px,py,vx,vy,r,dmg,col,type){if(spells.length>200)return;spells.push({x:px,y:py,vx:vx,vy:vy,r:r,dmg:dmg,col:col,type:type,life:type==='orb'?4:6,near:false,passed:false});}
function cast(){let sp=1+ (phase-1)*0.1;E.charge=1;sfx(300+phase*80,0.15,'sine',0.1);
 if(phase===1){let a=Math.atan2(P.y-E.y,P.x-E.x);spawnSpell(E.x,E.y+20,Math.cos(a)*220*sp,Math.sin(a)*220*sp,12,15,'#ff7a18','fire');}
 if(phase===2){for(let i=-1;i<=1;i++){let a=Math.atan2(P.y-E.y,P.x-E.x)+i*0.25;spawnSpell(E.x,E.y+20,Math.cos(a)*260*sp,Math.sin(a)*260*sp,8,10,'#22d3ee','frost');}}
 if(phase===3){tels.push({x:P.x,y:P.y,t:0.7,r:50});sfx(900,0.1,'square',0.08);}
 if(phase===4){let a=Math.atan2(P.y-E.y,P.x-E.x);spawnSpell(E.x,E.y+20,Math.cos(a)*180*sp,Math.sin(a)*180*sp,14,15,'#e879f9','orb');}
 if(phase===5){let a=Math.atan2(P.y-E.y,P.x-E.x);spawnSpell(E.x,E.y+20,Math.cos(a)*240*sp,Math.sin(a)*240*sp,12,15,'#ff7a18','fire');for(let i=-1;i<=1;i++){let aa=a+i*0.25;spawnSpell(E.x,E.y+20,Math.cos(aa)*280*sp,Math.sin(aa)*280*sp,8,10,'#22d3ee','frost');}tels.push({x:P.x,y:P.y,t:0.7,r:50});spawnSpell(E.x,E.y+20,Math.cos(a)*200*sp,Math.sin(a)*200*sp,14,15,'#e879f9','orb');}
}
function update(dt){elapsed+=dt;phaseT+=dt;score+=10*dt;if(P.ifr>0)P.ifr-=dt;if(P.dashCd>0)P.dashCd-=dt;if(P.dash>0)P.dash-=dt;if(slowT>0)slowT-=dt;
 let need=phase===5?30:18;if(phaseT>=need){if(phase<5){phase++;phaseT=0;score+=50;addFloat(480,300,'PHASE '+phase,'#f0f');burst(E.x,E.y,'#a855f7',40,200);}else{state='VICTORY';if(score>high){high=Math.floor(score);localStorage.setItem('wd_high',high);}}}
 E.x+=E.dir*40*dt;if(E.x<200||E.x>760)E.dir*=-1;if(E.charge>0)E.charge-=dt*3;
 castT-=dt;if(castT<=0){cast();let base=[1.4,1.8,2.0,2.2,1.1][phase-1];castT=base/(1+(phase-1)*0.1)*(phase===5?0.77:1);}
 crystalT-=dt;if(crystalT<=0){crystalT=10;picks.push({x:100+Math.random()*760,y:150+Math.random()*400,r:12});}
 let mx=0,my=0;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;let len=Math.hypot(mx,my)||1;mx/=len;my/=len;
 let dashKey=keys.Space||keys.ShiftLeft||keys.ShiftRight;
 if(dashKey&&P.dashCd<=0&&P.st>=25&&P.dash<=0){P.st-=25;P.stDelay=0.5;P.dash=0.12;P.dashCd=1.2;P.ifr=Math.max(P.ifr,0.25);let dx=mx||P.face,dy=my||0;let dl=Math.hypot(dx,dy)||1;P.vx=dx/dl*140/0.12;P.vy=dy/dl*140/0.12;sfx(500,0.15,'sine',0.12);burst(P.x,P.y,'#60a5fa',12,150);}
 if(P.dash<=0){let acc=2400;if(mx||my){P.vx+=mx*acc*dt;P.vy+=my*acc*dt;}else{let f=1800;P.vx-=Math.sign(P.vx)*Math.min(Math.abs(P.vx),f*dt);P.vy-=Math.sign(P.vy)*Math.min(Math.abs(P.vy),f*dt);}let sp=Math.hypot(P.vx,P.vy),max=320*(slowT>0?0.5:1);if(sp>max){P.vx*=max/sp;P.vy*=max/sp;}}
 P.x+=P.vx*dt;P.y+=P.vy*dt;P.x=Math.max(24,Math.min(W-24,P.x));P.y=Math.max(24,Math.min(H-24,P.y));if(mx)P.face=mx;P.bob+=dt*6;
 if(P.stDelay>0)P.stDelay-=dt;else P.st=Math.min(100,P.st+30*dt);
 if(P.dash>0)trail.push({x:P.x,y:P.y,life:0.3});
 for(let i=trail.length-1;i>=0;i--){trail[i].life-=dt;if(trail[i].life<=0)trail.splice(i,1);}
 for(let i=spells.length-1;i>=0;i--){let s=spells[i];s.life-=dt;if(s.type==='orb'){let a=Math.atan2(P.y-s.y,P.x-s.x),ca=Math.atan2(s.vy,s.vx),d=a-ca;while(d>3.14)d-=6.28;while(d<-3.14)d+=6.28;d=Math.max(-1.57*dt,Math.min(1.57*dt,d));let na=ca+d,sp2=Math.hypot(s.vx,s.vy);s.vx=Math.cos(na)*sp2;s.vy=Math.sin(na)*sp2;}
  s.x+=s.vx*dt;s.y+=s.vy*dt;if(Math.random()<0.6)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:0.3,col:s.col,r:3});
  if(s.x<0||s.x>W||s.y<0||s.y>H){burst(s.x,s.y,s.col,8,100);spells.splice(i,1);continue;}
  if(s.life<=0){spells.splice(i,1);continue;}
  let d=Math.hypot(P.x-s.x,P.y-s.y);
  if(d<40&&!s.near){s.near=true;}
  if(d>40&&s.near&&!s.passed){s.passed=true;score+=100;addFloat(P.x,P.y-30,'NEAR MISS +100','#fde047');}
  if(P.dash>0&&s.type==='orb'&&d<P.r+s.r+10){burst(s.x,s.y,s.col,20,200);picks.push({x:s.x,y:s.y,r:12});spells.splice(i,1);sfx(700,0.2,'sine',0.15);continue;}
  if(d<P.r+s.r&&P.ifr<=0){P.hp-=s.dmg;P.ifr=0.8;shake=4;flash=1;boom(150);addFloat(P.x,P.y-30,'-'+s.dmg,'#f87171');burst(P.x,P.y,'#ef4444',20,200);if(s.type==='frost')slowT=1.5;spells.splice(i,1);if(P.hp<=0){P.hp=0;state='GAMEOVER';if(score>high){high=Math.floor(score);localStorage.setItem('wd_high',high);}}continue;}
 }
 for(let i=tels.length-1;i>=0;i--){let t=tels[i];t.t-=dt;if(t.t<=0){shake=8;boom(80);burst(t.x,t.y,'#fde047',30,250);if(Math.hypot(P.x-t.x,P.y-t.y)<t.r&&P.ifr<=0){P.hp-=20;P.ifr=0.8;flash=1;addFloat(P.x,P.y-30,'-20','#f87171');if(P.hp<=0){P.hp=0;state='GAMEOVER';if(score>high){high=Math.floor(score);localStorage.setItem('wd_high',high);}}}tels.splice(i,1);}}
 for(let i=picks.length-1;i>=0;i--){let p=picks[i];if(Math.hypot(P.x-p.x,P.y-p.y)<P.r+p.r){counter=Math.min(100,counter+25);burst(p.x,p.y,'#22d3ee',15,150);sfx(800,0.2,'sine',0.15);addFloat(p.x,p.y,'+MANA','#22d3ee');picks.splice(i,1);}}
 for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;if(p.life<=0)parts.splice(i,1);}
 for(let i=floats.length-1;i>=0;i--){floats[i].life-=dt;floats[i].y-=40*dt;if(floats[i].life<=0)floats.splice(i,1);}
 if(shake>0)shake=Math.max(0,shake-20*dt);if(flash>0)flash-=dt*2;
}
function bar(px,py,w,h,frac,col1,col2){x.fillStyle='rgba(0,0,0,0.6)';x.fillRect(px,py,w,h);let g=x.createLinearGradient(px,0,px+w,0);g.addColorStop(0,col1);g.addColorStop(1,col2);x.fillStyle=g;x.fillRect(px+1,py+1,(w-2)*Math.max(0,Math.min(1,frac)),h-2);x.strokeStyle='#fff';x.lineWidth=1;x.strokeRect(px,py,w,h);}
function drawWizard(px,py,robe,hat,flip,bob,charge){x.save();x.translate(px,py+Math.sin(bob)*4);x.scale(flip,1);x.fillStyle=robe;x.beginPath();x.moveTo(0,-10);x.lineTo(-22,28);x.lineTo(22,28);x.closePath();x.fill();x.fillStyle=hat;x.beginPath();x.moveTo(-14,-8);x.lineTo(0,-38);x.lineTo(14,-8);x.closePath();x.fill();x.fillStyle='#fcd9b8';x.beginPath();x.arc(0,-6,10,0,6.28);x.fill();x.fillStyle=charge>0?'#f0f':'#fff';x.fillRect(-6,-8,4,3);x.fillRect(2,-8,4,3);x.strokeStyle='#92400e';x.lineWidth=3;x.beginPath();x.moveTo(16,0);x.lineTo(28,-22);x.stroke();x.fillStyle=charge>0?'#e879f9':'#fde047';x.beginPath();x.arc(28,-24,charge>0?10:6,0,6.28);x.fill();x.restore();}
function draw(){x.save();if(shake>0)x.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e1038');g.addColorStop(1,'#0f2a1a');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(168,85,247,0.3)';for(let i=0;i<8;i++){x.beginPath();x.arc(120+i*100,320,40,0,6.28);x.stroke();}
 x.fillStyle='rgba(255,255,255,0.15)';for(let i=0;i<30;i++){x.fillRect((i*97+elapsed*10)%W,(i*61)%H,2,2);}
 if(state==='MENU'||state==='HOW'){x.fillStyle='rgba(0,0,0,0.7)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#f0abfc';x.font='bold 52px Arial';x.fillText('WIZARD DUEL',480,140);x.fillStyle='#67e8f9';x.font='20px Arial';x.fillText('DODGE THE DARK ARTS',480,175);x.fillStyle='#fff';x.font='18px Arial';x.fillText('HIGH SCORE: '+high,480,220);
  if(state==='MENU'){let btns=[['PLAY',300],['HOW TO PLAY',370],['SOUND: '+(muted?'OFF':'ON'),440]];for(let b of btns){x.fillStyle='rgba(88,28,135,0.9)';x.fillRect(330,b[1],300,50);x.strokeStyle='#e879f9';x.strokeRect(330,b[1],300,50);x.fillStyle='#fff';x.fillText(b[0],480,b[1]+32);}}
  else{x.font='16px Arial';x.fillText('WASD / Arrows Move  |  Space Dash  |  E Counter  |  P Pause  |  M Mute',480,280);x.fillText('Survive 5 phases. Phase 5: survive 30s or use Counter-Spell.',480,310);x.fillText('Collect mana crystals. Dash through arcane orbs.',480,340);x.fillStyle='#fde047';x.fillText('Click BACK or press Enter',480,520);x.fillStyle='#fff';x.fillRect(330,500,300,50);x.fillStyle='#000';x.fillText('BACK',480,532);}
  x.restore();return;}
 if(state==='PAUSED'||state==='GAMEOVER'||state==='VICTORY'){drawScene();x.fillStyle='rgba(0,0,0,0.7)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='bold 42px Arial';x.fillText(state,480,250);x.font='20px Arial';x.fillText('Score: '+Math.floor(score)+'  Time: '+fmt(elapsed)+'  High: '+high,480,290);if(state==='PAUSED'){x.fillText('Click RESUME area / P to resume',480,330);x.fillStyle='#7c3aed';x.fillRect(330,300,300,50);x.fillStyle='#fff';x.fillText('RESUME',480,332);x.fillStyle='#7c3aed';x.fillRect(330,370,300,50);x.fillText('RESTART',480,402);}else{x.fillStyle='#7c3aed';x.fillRect(330,380,300,50);x.fillStyle='#fff';x.fillText('PLAY AGAIN (Enter)',480,412);}x.restore();return;}
 drawScene();x.restore();}
function drawScene(){
 for(let t of trail){x.globalAlpha=t.life;x.fillStyle='#60a5fa';x.beginPath();x.arc(t.x,t.y,16,0,6.28);x.fill();}x.globalAlpha=1;
 drawWizard(E.x,E.y,'#3b0764','#1e1b4b',E.dir>0?1:-1,elapsed*2,E.charge);
 for(let t of tels){x.globalAlpha=0.4+0.3*Math.sin(elapsed*20);x.fillStyle='#fde047';x.beginPath();x.arc(t.x,t.y,t.r,0,6.28);x.fill();x.globalAlpha=1;x.strokeStyle='#fff';x.stroke();}
 for(let s of spells){x.fillStyle=s.col;x.shadowColor=s.col;x.shadowBlur=12;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();x.shadowBlur=0;}
 for(let p of picks){x.fillStyle='#22d3ee';x.shadowColor='#22d3ee';x.shadowBlur=10;x.save();x.translate(p.x,p.y+Math.sin(elapsed*4)*4);x.rotate(elapsed);x.fillRect(-8,-8,16,16);x.restore();x.shadowBlur=0;}
 for(let p of parts){x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill();}x.globalAlpha=1;
 let hurt=P.ifr>0&&Math.floor(elapsed*20)%2===0;if(!hurt)drawWizard(P.x,P.y,'#1d4ed8','#1e3a8a',P.face, P.bob,0);
 for(let f of floats){x.globalAlpha=f.life;x.fillStyle=f.col;x.font='bold 16px Arial';x.textAlign='center';x.fillText(f.txt,f.x,f.y);}x.globalAlpha=1;
 // HUD
 x.textAlign='left';x.fillStyle='rgba(0,0,0,0.5)';x.fillRect(10,10,230,70);x.strokeStyle='#a855f7';x.strokeRect(10,10,230,70);
 bar(20,20,200,18,P.hp/100,'#22c55e','#ef4444');x.fillStyle='#fff';x.font='bold 13px Arial';x.fillText('HP '+Math.ceil(P.hp),25,34);
 bar(20,45,200,10,P.st/100,'#22d3ee','#3b82f6');x.fillStyle='#fff';x.font='11px Arial';x.fillText('STAMINA',25,54);
 x.textAlign='right';x.fillStyle='rgba(0,0,0,0.5)';x.fillRect(W-240,10,230,70);x.strokeStyle='#a855f7';x.strokeRect(W-240,10,230,70);x.fillStyle='#fff';x.font='bold 16px Arial';x.fillText('SCORE '+Math.floor(score),W-20,32);x.fillText('TIME '+fmt(elapsed),W-20,54);x.fillStyle='#f0abfc';x.fillText('PHASE '+phase+'/5',W-20,74);
 x.textAlign='left';x.fillStyle='#fde047';x.font='bold 13px Arial';x.fillText('SPEEDRUN '+fmt(elapsed),10,H-10);
 if(phase===5){bar(280,15,400,14,E.hp/100,'#a855f7','#ec4899');x.fillStyle='#fff';x.font='12px Arial';x.textAlign='center';x.fillText('EVIL WIZARD',480,12);}
 bar(330,H-35,300,12,counter/100,'#22d3ee','#e879f9');x.fillStyle='#fff';x.font='12px Arial';x.textAlign='center';x.fillText(counter>=100?'E - COUNTER READY!':'COUNTER '+counter+'%  |  DASH '+(P.dashCd>0?P.dashCd.toFixed(1):'READY'),480,H-40);
 if(P.hp<30){x.globalAlpha=0.3+0.2*Math.sin(elapsed*8);x.fillStyle='#ef4444';x.fillRect(0,0,W,6);x.fillRect(0,H-6,W,6);x.globalAlpha=1;}
 if(flash>0){x.globalAlpha=flash*0.4;x.fillStyle='#ef4444';x.fillRect(0,0,W,H);x.globalAlpha=1;}
 let vg=x.createRadialGradient(480,320,200,480,320,600);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.6)');x.fillStyle=vg;x.fillRect(0,0,W,H);
}
function loop(ts){requestAnimationFrame(loop);let dt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;if(state==='PLAYING')update(dt);draw();}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
