<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Autumn Storm</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍂</text></svg>"><style>html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;font-family:'Courier New',monospace}canvas{display:block;position:absolute;top:0;left:0}#touchZones{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:5}#touchZones.show{display:block}.touchBtn{position:absolute;width:25%;height:25%;opacity:0.15;background:#fff;border-radius:10px}#btnUp{top:0;left:37.5%}#btnDown{bottom:0;left:37.5%}#btnLeft{top:37.5%;left:0}#btnRight{top:37.5%;right:0}#btnPause{top:5px;right:5px;width:50px;height:50px;opacity:0.3;border-radius:50%;font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center}</style></head><body><canvas id="game"></canvas><div id="touchZones"><div class="touchBtn" id="btnUp">▲</div><div class="touchBtn" id="btnDown">▼</div><div class="touchBtn" id="btnLeft">◀</div><div class="touchBtn" id="btnRight">▶</div><div class="touchBtn" id="btnPause">II</div></div><script src="game.js"></script></body></html>
