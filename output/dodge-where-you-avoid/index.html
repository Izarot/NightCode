<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autumn Storm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>\uD83C\uDF42</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive canvas sizing
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Audio Context for sound effects
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'gameOver') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Game constants
const COLORS = {
    sky1: '#1a1a2e',
    sky2: '#16213e',
    ground: '#0f0f1a',
    rain: 'rgba(200, 220, 255, 0.3)',
    playerCoat: '#e67e22',
    playerPants: '#2c3e50',
    playerGlow: 'rgba(255, 200, 100, 0.3)',
    leafRed: '#c0392b',
    leafOrange: '#d35400',
    leafYellow: '#f1c40f',
    hudText: '#ecf0f1',
    healthFull: '#e74c3c',
    healthEmpty: '#4a1a1a'
};

// Game state
let gameState = 'start';
let gameTime = 0;
let lastTime = 0;
let highScore = parseInt(localStorage.getItem('autumnStormHighScore')) || 0;
let screenFlash = 0;

// Input handling
const keys = {};
const touch = { active: false, x: 0, y: 0 };

document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (gameState === 'start') {
        initAudio();
        startGame();
    } else if (gameState === 'gameOver' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    } else if (gameState === 'playing' && e.code === 'KeyP') {
        gameState = 'paused';
    } else if (gameState === 'paused' && e.code === 'KeyP') {
        gameState = 'playing';
        lastTime = performance.now();
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touch.active = true;
    touch.x = e.touches[0].clientX;
    touch.y = e.touches[0].clientY;
    if (gameState === 'start') {
        initAudio();
        startGame();
    } else if (gameState === 'gameOver') {
        startGame();
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    touch.x = e.touches[0].clientX;
    touch.y = e.touches[0].clientY;
});

canvas.addEventListener('touchend', () => {
    touch.active = false;
});

// Player class
class Player {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = canvas.width / 2;
        this.y = canvas.height - 100;
        this.vx = 0;
        this.vy = 0;
        this.width = 30;
        this.height = 50;
        this.radius = 20;
        this.hp = 3;
        this.maxHp = 3;
        this.invulnerable = 0;
        this.glowIntensity = 1;
    }
    
    update(dt) {
        const accel = 0.8;
        const friction = 0.85;
        const maxSpeed = 6;
        
        // Input
        let inputX = 0, inputY = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) inputX -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) inputX += 1;
        if (keys['ArrowUp'] || keys['KeyW']) inputY -= 1;
        if (keys['ArrowDown'] || keys['KeyS']) inputY += 1;
        
        // Touch input
        if (touch.active && gameState === 'playing') {
            const dx = touch.x - this.x;
            const dy = touch.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 30) {
                inputX = dx / dist;
                inputY = dy / dist;
            }
        }
        
        // Apply acceleration
        this.vx += inputX * accel;
        this.vy += inputY * accel;
        
        // Apply friction
        this.vx *= friction;
        this.vy *= friction;
        
        // Clamp velocity
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
        }
        
        // Update position
        this.x += this.vx;
        this.y += this.vy;
        
        // Bounds
        this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, this.x));
        this.y = Math.max(this.height / 2, Math.min(canvas.height - canvas.height * 0.1 - this.height / 2, this.y));
        
        // Invulnerability timer
        if (this.invulnerable > 0) {
            this.invulnerable -= dt;
        }
        
        // Glow based on health
        this.glowIntensity = 0.3 + (this.hp / this.maxHp) * 0.7;
    }
    
    takeDamage() {
        if (this.invulnerable <= 0) {
            this.hp--;
            this.invulnerable = 1;
            screenFlash = 0.1;
            playSound('hit');
            if (this.hp <= 0) {
                gameOver();
            }
        }
    }
    
    draw() {
        const blinkRate = this.invulnerable > 0 ? Math.sin(this.invulnerable * 30) > 0 : true;
        if (!blinkRate) return;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Glow aura
        const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 50);
        gradient.addColorStop(0, `rgba(255, 200, 100, ${this.glowIntensity * 0.5})`);
        gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 50, 0, Math.PI * 2);
        ctx.fill();
        
        // Raincoat body
        ctx.fillStyle = COLORS.playerCoat;
        ctx.beginPath();
        ctx.moveTo(-15, -10);
        ctx.lineTo(-12, 20);
        ctx.lineTo(12, 20);
        ctx.lineTo(15, -10);
        ctx.lineTo(10, -15);
        ctx.lineTo(-10, -15);
        ctx.closePath();
        ctx.fill();
        
        // Hood
        ctx.fillStyle = COLORS.playerCoat;
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Face (dark)
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(0, -15, 8, 0, Math.PI * 2);
        ctx.fill();
        
        // Pants
        ctx.fillStyle = COLORS.playerPants;
        ctx.fillRect(-10, 20, 8, 15);
        ctx.fillRect(2, 20, 8, 15);
        
        // Boots
        ctx.fillStyle = '#2c2c2c';
        ctx.fillRect(-11, 32, 10, 5);
        ctx.fillRect(1, 32, 10, 5);
        
        ctx.restore();
    }
}

// Leaf class
class Leaf {
    constructor(type) {
        this.type = type || Math.floor(Math.random() * 3);
        this.setProperties();
        this.reset();
    }
    
    setProperties() {
        if (this.type === 0) {
            this.color = COLORS.leafRed;
            this.radius = 10;
            this.speed = 3 + Math.random() * 2;
        } else if (this.type === 1) {
            this.color = COLORS.leafOrange;
            this.radius = 15;
            this.speed = 2 + Math.random() * 1.5;
        } else {
            this.color = COLORS.leafYellow;
            this.radius = 20;
            this.speed = 1.5 + Math.random() * 1;
        }
        this.baseSpeed = this.speed;
    }
    
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = -50;
        this.vx = 0;
        this.vy = 0;
        this.rotation = Math.random() * Math.PI * 2;
        this.angularVel = (Math.random() - 0.5) * 0.1;
        this.wobbleOffset = Math.random() * Math.PI * 2;
        this.active = true;
    }
    
    update(dt, windForce, windGust) {
        // Gravity
        this.vy += 0.05;
        
        // Wind
        this.vx += windForce + windGust + Math.sin(gameTime * 0.02 + this.wobbleOffset) * 0.2;
        
        // Speed based on type
        if (this.vy < this.speed) {
            this.vy += 0.02;
        }
        
        // Apply velocity
        this.x += this.vx;
        this.y += this.vy;
        
        // Rotation
        this.rotation += this.angularVel;
        
        // Bounds check
        if (this.x < -50 || this.x > canvas.width + 50 || this.y > canvas.height + 50) {
            this.active = false;
        }
    }
    
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        // Draw maple leaf
        ctx.fillStyle = this.color;
        ctx.beginPath();
        
        const r = this.radius;
        // Maple leaf shape
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(r * 0.3, -r * 0.5, r * 0.8, -r * 0.3);
        ctx.quadraticCurveTo(r * 0.5, 0, r, 0);
        ctx.quadraticCurveTo(r * 0.6, r * 0.3, r * 0.3, r * 0.6);
        ctx.quadraticCurveTo(r * 0.1, r * 0.3, 0, r);
        ctx.quadraticCurveTo(-r * 0.1, r * 0.3, -r * 0.3, r * 0.6);
        ctx.quadraticCurveTo(-r * 0.6, r * 0.3, -r, 0);
        ctx.quadraticCurveTo(-r * 0.5, 0, -r * 0.8, -r * 0.3);
        ctx.quadraticCurveTo(-r * 0.3, -r * 0.5, 0, -r);
        
        ctx.closePath();
        ctx.fill();
        
        // Stem
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, r * 0.3);
        ctx.stroke();
        
        ctx.restore();
    }
}

// Raindrop class
class Raindrop {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = Math.random() * (canvas.width + 200) - 100;
        this.y = Math.random() * canvas.height - canvas.height;
        this.length = 10 + Math.random() * 20;
        this.speed = 15 + Math.random() * 10;
        this.opacity = 0.1 + Math.random() * 0.2;
    }
    
    update() {
        this.y += this.speed;
        this.x += 3;
        if (this.y > canvas.height || this.x > canvas.width + 100) {
            this.reset();
        }
    }
    
    draw() {
        ctx.strokeStyle = `rgba(200, 220, 255, ${this.opacity})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + 5, this.y + this.length);
        ctx.stroke();
    }
}

// Wind particle class
class WindParticle {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = -50;
        this.y = Math.random() * canvas.height;
        this.speed = 10 + Math.random() * 15;
        this.length = 20 + Math.random() * 30;
    }
    
    update() {
        this.x += this.speed;
        if (this.x > canvas.width + 50) {
            this.reset();
        }
    }
    
    draw() {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.length, this.y);
        ctx.stroke();
    }
}

// Game objects
let player;
let leaves = [];
let raindrops = [];
let windParticles = [];
let spawnTimer = 0;
let spawnRate = 1;
let windIntensity = 1;
let windGustTimer = 0;
let currentWindGust = 0;

function initGame() {
    player = new Player();
    leaves = [];
    raindrops = [];
    windParticles = [];
    
    // Initialize rain
    for (let i = 0; i < 100; i++) {
        raindrops.push(new Raindrop());
    }
    
    // Initialize wind particles
    for (let i = 0; i < 30; i++) {
        const p = new WindParticle();
        p.x = Math.random() * canvas.width;
        windParticles.push(p);
    }
    
    gameTime = 0;
    spawnTimer = 0;
    spawnRate = 1;
    windIntensity = 1;
    windGustTimer = 0;
    currentWindGust = 0;
    screenFlash = 0;
}

function startGame() {
    initGame();
    player.reset();
    gameState = 'playing';
    lastTime = performance.now();
    playSound('start');
}

function gameOver() {
    gameState = 'gameOver';
    playSound('gameOver');
    
    // Update high score
    if (gameTime > highScore) {
        highScore = gameTime;
        localStorage.setItem('autumnStormHighScore', Math.floor(highScore));
    }
}

function spawnLeaf() {
    const type = Math.random() < 0.3 ? 0 : (Math.random() < 0.6 ? 1 : 2);
    leaves.push(new Leaf(type));
}

function checkCollisions() {
    for (const leaf of leaves) {
        if (!leaf.active) continue;
        
        const dx = player.x - leaf.x;
        const dy = player.y - leaf.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < player.radius + leaf.radius * 0.7) {
            player.takeDamage();
            leaf.active = false;
        }
    }
}

function updateDifficulty(dt) {
    // Increase spawn rate every 10 seconds
    spawnRate = 1 + Math.floor(gameTime / 10) * 0.5;
    
    // Increase wind intensity every 30 seconds
    windIntensity = 1 + Math.floor(gameTime / 30) * 0.1;
    
    // Random wind gusts
    windGustTimer -= dt;
    if (windGustTimer <= 0) {
        currentWindGust = (Math.random() - 0.5) * 2 * windIntensity;
        windGustTimer = 2 + Math.random() * 3;
    }
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function drawBackground() {
    // Sky gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, COLORS.sky1);
    gradient.addColorStop(1, COLORS.sky2);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Ground
    const groundY = canvas.height - canvas.height * 0.1;
    ctx.fillStyle = COLORS.ground;
    ctx.fillRect(0, groundY, canvas.width, canvas.height * 0.1);
    
    // Grass silhouettes
    ctx.fillStyle = '#0a0a12';
    for (let i = 0; i < canvas.width; i += 20) {
        const h = 5 + Math.sin(i * 0.1) * 3;
        ctx.beginPath();
        ctx.moveTo(i, groundY);
        ctx.lineTo(i + 5, groundY - h);
        ctx.lineTo(i + 10, groundY);
        ctx.fill();
    }
}

function drawHUD() {
    ctx.fillStyle = COLORS.hudText;
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center';
    
    // Survival time (top center)
    ctx.fillText(`SURVIVAL TIME: ${formatTime(gameTime)}`, canvas.width / 2, 30);
    
    // Storm intensity meter (top right)
    const meterWidth = 100;
    const meterHeight = 15;
    const meterX = canvas.width - meterWidth - 20;
    const meterY = 20;
    const intensity = Math.min((gameTime / 120) * 100, 100); // Max at 2 minutes
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(meterX, meterY, meterWidth, meterHeight);
    
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(meterX, meterY, meterWidth * (intensity / 100), meterHeight);
    
    ctx.strokeStyle = COLORS.hudText;
    ctx.lineWidth = 1;
    ctx.strokeRect(meterX, meterY, meterWidth, meterHeight);
    
    ctx.fillStyle = COLORS.hudText;
    ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('STORM', meterX - 5, meterY + 12);
    
    // Health (bottom left)
    const heartSize = 20;
    const heartY = canvas.height - 40;
    ctx.textAlign = 'left';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('WARMTH', 20, heartY - 5);
    
    for (let i = 0; i < player.maxHp; i++) {
        const hx = 20 + i * (heartSize + 5);
        if (i < player.hp) {
            ctx.fillStyle = COLORS.healthFull;
        } else {
            ctx.fillStyle = COLORS.healthEmpty;
        }
        // Draw heart shape
        ctx.beginPath();
        ctx.moveTo(hx + heartSize / 2, heartY + heartSize * 0.3);
        ctx.bezierCurveTo(hx + heartSize / 2, heartY, hx, heartY, hx, heartY + heartSize * 0.3);
        ctx.bezierCurveTo(hx, heartY + heartSize * 0.6, hx + heartSize / 2, heartY + heartSize, hx + heartSize / 2, heartY + heartSize);
        ctx.bezierCurveTo(hx + heartSize / 2, heartY + heartSize, hx + heartSize, heartY + heartSize * 0.6, hx + heartSize, heartY + heartSize * 0.3);
        ctx.bezierCurveTo(hx + heartSize, heartY, hx + heartSize / 2, heartY, hx + heartSize / 2, heartY + heartSize * 0.3);
        ctx.fill();
    }
    
    // High score
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.font = '12px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`BEST: ${formatTime(highScore)}`, 20, canvas.height - 10);
}

function drawStartScreen() {
    drawBackground();
    
    // Darken overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Title
    ctx.fillStyle = '#e67e22';
    ctx.font = 'bold 48px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('AUTUMN STORM', canvas.width / 2, canvas.height / 2 - 50);
    
    // Subtitle
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('Survive the falling leaves', canvas.width / 2, canvas.height / 2);
    
    // Instructions
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('Arrow Keys / WASD to move', canvas.width / 2, canvas.height / 2 + 50);
    ctx.fillText('P to pause', canvas.width / 2, canvas.height / 2 + 70);
    
    // Start prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
    ctx.fillStyle = `rgba(230, 126, 34, ${pulse})`;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText('Press any key to start', canvas.width / 2, canvas.height / 2 + 120);
    
    // High score
    if (highScore > 0) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.font = '16px "Courier New", monospace';
        ctx.fillText(`Best Time: ${formatTime(highScore)}`, canvas.width / 2, canvas.height / 2 + 160);
    }
}

function drawPauseScreen() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#ecf0f1';
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('Press P to resume', canvas.width / 2, canvas.height / 2 + 40);
}

function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#c0392b';
    ctx.font = 'bold 48px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);
    
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '24px "Courier New", monospace';
    ctx.fillText(`Time Survived: ${formatTime(gameTime)}`, canvas.width / 2, canvas.height / 2);
    
    if (gameTime >= highScore && gameTime > 0) {
        ctx.fillStyle = '#f1c40f';
        ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, canvas.height / 2 + 35);
    }
    
    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
    ctx.fillStyle = `rgba(230, 126, 34, ${pulse})`;
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 80);
}

function update(dt) {
    if (gameState !== 'playing') return;
    
    gameTime += dt;
    
    // Update difficulty
    updateDifficulty(dt);
    
    // Wind force
    const windForce = Math.sin(gameTime * 0.02) * 0.2 * windIntensity;
    
    // Update player
    player.update(dt);
    
    // Spawn leaves
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnLeaf();
        spawnTimer = 1 / spawnRate;
    }
    
    // Update leaves
    for (const leaf of leaves) {
        if (leaf.active) {
            leaf.update(dt, windForce, currentWindGust);
        }
    }
    
    // Remove inactive leaves
    leaves = leaves.filter(l => l.active);
    
    // Update rain
    for (const drop of raindrops) {
        drop.update();
    }
    
    // Update wind particles
    for (const p of windParticles) {
        p.update();
    }
    
    // Check collisions
    checkCollisions();
    
    // Screen flash decay
    if (screenFlash > 0) {
        screenFlash -= dt;
    }
}

function draw() {
    // Clear
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw background
    drawBackground();
    
    // Draw rain (behind everything)
    for (const drop of raindrops) {
        drop.draw();
    }
    
    // Draw wind particles
    for (const p of windParticles) {
        p.draw();
    }
    
    // Draw leaves
    for (const leaf of leaves) {
        leaf.draw();
    }
    
    // Draw player
    player.draw();
    
    // Screen flash effect
    if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${screenFlash * 3})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    
    // Draw HUD
    drawHUD();
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'playing') {
        update(dt);
        draw();
    } else if (gameState === 'paused') {
        draw();
        drawPauseScreen();
    } else if (gameState === 'gameOver') {
        draw();
        drawGameOverScreen();
    }
    
    requestAnimationFrame(gameLoop);
}

// Start the game loop
initGame();
requestAnimationFrame(gameLoop);
    </script>
