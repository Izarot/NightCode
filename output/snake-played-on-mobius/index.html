<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake on a Möbius Strip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden;color:#eee}
#wrap{position:relative;width:min(400px,90vw);height:min(400px,90vw)}
canvas{width:100%;height:100%;display:block;border-radius:8px;box-shadow:0 0 40px rgba(0,255,200,0.15)}
.hud{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.6);border-radius:8px;padding:8px 12px;font-size:clamp(10px,2.5vw,14px);line-height:1.6;backdrop-filter:blur(4px);border:1px solid rgba(0,255,200,0.15)}
.hud span{color:#00ffcc;font-weight:600}.hud .timer{color:#ffcc00}.hud .hi{color:#ff8800}
.controls{position:absolute;bottom:8px;right:8px;display:flex;gap:6px}
.controls button{width:44px;height:44px;border:none;border-radius:8px;background:rgba(0,0,0,0.6);color:#00ffcc;font-size:18px;cursor:pointer;border:1px solid rgba(0,255,200,0.2);display:flex;align-items:center;justify-content:center;transition:background .2s}
.controls button:hover{background:rgba(0,255,200,0.15)}
.controls button:focus{outline:2px solid #00ffcc;outline-offset:2px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.overlay.active{opacity:1;pointer-events:auto}
.overlay h1{font-size:clamp(18px,5vw,28px);color:#00ffcc;margin-bottom:8px;text-shadow:0 0 20px rgba(0,255,200,0.4)}
.overlay p{font-size:clamp(11px,2.5vw,14px);color:#aaa;margin-bottom:4px;text-align:center;padding:0 20px}
.overlay .stats{color:#ffcc00;font-size:clamp(13px,3vw,16px);margin:12px 0;line-height:1.8}
.overlay button{margin:6px;padding:12px 28px;border:none;border-radius:8px;font-size:clamp(13px,3vw,16px);cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s;min-height:44px}
.overlay button:hover{transform:scale(1.05)}
.overlay button:focus{outline:2px solid #00ffcc;outline-offset:2px}
.btn-start{background:#00ff88;color:#111;box-shadow:0 0 20px rgba(0,255,136,0.3)}
.btn-restart{background:#ff6600;color:#fff;box-shadow:0 0 20px rgba(255,102,0,0.3)}
.btn-menu{background:#333;color:#ccc;border:1px solid #555!important}
#dpad{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:none;z-index:5}
#dpad .row{display:flex;justify-content:center;gap:4px}
#dpad button{width:50px;height:50px;border:none;border-radius:10px;background:rgba(0,0,0,0.5);color:#00ffcc;font-size:22px;cursor:pointer;border:1px solid rgba(0,255,200,0.2)}
@media(hover:none)and(pointer:coarse){#dpad{display:block}.controls{bottom:120px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="400" height="400"></canvas>
<div class="hud" id="hud" style="display:none">
<div>Score: <span id="hudScore">0</span> &nbsp; Len: <span id="hudLen">3</span></div>
<div>Level: <span id="hudLevel">1</span> &nbsp; Hi: <span class="hi" id="hudHi">0</span></div>
<div class="timer">⏱ <span id="hudTimer">00:00</span></div>
</div>
<div class="controls">
<button id="btnPause" aria-label="Pause">⏸</button>
<button id="btnMute" aria-label="Mute">🔊</button>
<button id="btnRestart" aria-label="Restart">↻</button>
</div>
<div id="dpad">
<div class="row"><button data-dir="up">▲</button></div>
<div class="row"><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
</div>
<div class="overlay active" id="menuScreen">
<h1>🐍 Snake on a Möbius Strip</h1>
<p>Use Arrow Keys or WASD to move.<br>Eat food, grow, avoid yourself.<br>Grid wraps top↔bottom, left↔right.</p>
<button class="btn-start" id="btnStart">Start Game</button>
</div>
<div class="overlay" id="pauseScreen"><h1>⏸ Paused</h1><p>Press P or click to resume</p><button class="btn-start" id="btnResume">Resume</button></div>
<div class="overlay" id="overScreen">
<h1>💀 Game Over</h1>
<div class="stats" id="overStats"></div>
<button class="btn-restart" id="btnOverRestart">Restart</button>
<button class="btn-menu" id="btnOverMenu">Menu</button>
</div>
</div>
<script>
// ===== Constants =====
const GRID=20,CELL=20,BASE_TICK=120,MIN_TICK=60;
const DIR={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
const OPP={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};
const SNAKE_HEAD='#00ffcc',SNAKE_TAIL='#006666',FOOD_COL='#ff6600';

// ===== State =====
let state='menu',snake=[],dir='RIGHT',nextDir='RIGHT',food=null;
let score=0,level=1,tickInterval=BASE_TICK,foodDelay=0;
let startTime=0,elapsed=0,pausedTime=0,pauseStart=0;
let muted=false,audioCtx=null;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

// ===== Audio =====
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(freq,dur,type='square',vol=0.12){
  if(muted)return;initAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function eatSound(){beep(600,0.1);setTimeout(()=>beep(900,0.1),60)}
function dieSound(){beep(200,0.3,'sawtooth',0.2);setTimeout(()=>beep(150,0.4,'sawtooth',0.15),150)}

// ===== High Score =====
function getHi(){return parseInt(localStorage.getItem('snakeMobiusHi')||'0')}
function setHi(v){localStorage.setItem('snakeMobiusHi',v)}

// ===== Game Init =====
function initGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir='RIGHT';nextDir='RIGHT';score=0;level=1;tickInterval=BASE_TICK;
  elapsed=0;startTime=performance.now();pausedTime=0;foodDelay=0;
  spawnFood();updateHUD();
}
function spawnFood(){
  const occupied=new Set(snake.map(s=>s.x+','+s.y));
  let free=[];
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)if(!occupied.has(x+','+y))free.push({x,y});
  if(free.length)food=free[Math.floor(Math.random()*free.length)];
}

// ===== Game Tick =====
function tick(){
  dir=nextDir;
  const head=snake[0];
  const d=DIR[dir];
  let nx=(head.x+d.x+GRID)%GRID,ny=(head.y+d.y+GRID)%GRID;
  // Self-collision: check all segments except tail (which will move away unless growing)
  const willGrow=food&&food.x===nx&&food.y===ny;
  for(let i=0;i<snake.length-(willGrow?0:1);i++){
    if(snake[i].x===nx&&snake[i].y===ny){gameOver();return}
  }
  snake.unshift({x:nx,y:ny});
  if(food&&food.x===nx&&food.y===ny){
    score+=10;
    if(snake.length%20===0)score+=50;
    eatSound();
    foodDelay=500;
    spawnFood();
    if(snake.length>3){
      level=Math.floor((snake.length-3)/5)+1;
      tickInterval=Math.max(MIN_TICK,BASE_TICK-(level-1)*10);
    }
  } else {
    snake.pop();
  }
  updateHUD();
}

// ===== Game Over =====
function gameOver(){
  state='gameover';dieSound();
  const hi=getHi();
  if(score>hi)setHi(score);
  document.getElementById('overStats').innerHTML=
    `Score: ${score}<br>Length: ${snake.length}<br>High Score: ${Math.max(score,hi)}<br>Time: ${fmtTime(elapsed)}`;
  showOverlay('overScreen');
  document.getElementById('hud').style.display='none';
}

// ===== Render =====
function render(){
  ctx.clearRect(0,0,400,400);
  // Background
  const bg=ctx.createLinearGradient(0,0,400,400);
  bg.addColorStop(0,'#111');bg.addColorStop(1,'#222');
  ctx.fillStyle=bg;ctx.fillRect(0,0,400,400);
  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  for(let i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(400,i*CELL);ctx.stroke()}
  // Möbius indicators
  ctx.strokeStyle='rgba(0,255,200,0.12)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(400,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,400);ctx.lineTo(400,400);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,400);ctx.stroke();
  ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,400);ctx.stroke();
  ctx.setLineDash([]);
  // Food
  if(food){
    const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
    const pulse=1+0.15*Math.sin(performance.now()/300);
    const r=8*pulse;
    const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,r*2);
    fg.addColorStop(0,'#ffaa00');fg.addColorStop(0.5,'#ff6600');fg.addColorStop(1,'rgba(255,102,0,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(fx,fy,r*2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff8833';ctx.beginPath();ctx.arc(fx,fy,r*0.6,0,Math.PI*2);ctx.fill();
  }
  // Snake
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i];
    const t=i/Math.max(1,snake.length-1);
    const rx=s.x*CELL+1,ry=s.y*CELL+1,rw=CELL-2,rh=CELL-2;
    const cr=4;
    const col=lerpColor(SNAKE_TAIL,SNAKE_HEAD,t);
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(rx+cr,ry);
    ctx.lineTo(rx+rw-cr,ry);ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+cr);
    ctx.lineTo(rx+rw,ry+rh-cr);ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-cr,ry+rh);
    ctx.lineTo(rx+cr,ry+rh);ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-cr);
    ctx.lineTo(rx,ry+cr);ctx.quadraticCurveTo(rx,ry,rx+cr,ry);
    ctx.closePath();ctx.fill();
    if(i===0){
      ctx.shadowColor=SNAKE_HEAD;ctx.shadowBlur=12;
      ctx.fillStyle=SNAKE_HEAD;ctx.fill();
      ctx.shadowBlur=0;
      // Eyes
      ctx.fillStyle='#111';
      const ex=s.x*CELL+CELL/2,ey=s.y*CELL+CELL/2;
      let e1,e2;
      if(dir==='RIGHT'){e1={x:ex+4,y:ey-4};e2={x:ex+4,y:ey+4}}
      else if(dir==='LEFT'){e1={x:ex-4,y:ey-4};e2={x:ex-4,y:ey+4}}
      else if(dir==='UP'){e1={x:ex-4,y:ey-4};e2={x:ex+4,y:ey-4}}
      else{e1={x:ex-4,y:ey+4};e2={x:ex+4,y:ey+4}}
      ctx.beginPath();ctx.arc(e1.x,e1.y,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e2.x,e2.y,2.5,0,Math.PI*2);ctx.fill();
    }
  }
}
function lerpColor(a,b,t){
  const pa=hexToRgb(a),pb=hexToRgb(b);
  return `rgb(${Math.round(pa.r+(pb.r-pa.r)*t)},${Math.round(pa.g+(pb.g-pa.g)*t)},${Math.round(pa.b+(pb.b-pa.b)*t)})`;
}
function hexToRgb(h){const v=parseInt(h.slice(1),16);return{r:(v>>16)&255,g:(v>>8)&255,b:v&255}}

// ===== HUD =====
function updateHUD(){
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudLen').textContent=snake.length;
  document.getElementById('hudLevel').textContent=level;
  document.getElementById('hudHi').textContent=Math.max(score,getHi());
}
function fmtTime(ms){
  const s=Math.floor(ms/1000);const m=Math.floor(s/60);
  return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function updateTimer(){
  if(state==='playing')elapsed=performance.now()-startTime-pausedTime;
  document.getElementById('hudTimer').textContent=fmtTime(elapsed);
}

// ===== Overlays =====
function showOverlay(id){
  document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function hideAllOverlays(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('active'))}

// ===== Input =====
function setDir(d){
  if(OPP[d]===dir)return;
  nextDir=d;
}
const keyMap={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',w:'UP',s:'DOWN',a:'LEFT',d:'RIGHT',W:'UP',S:'DOWN',A:'LEFT',D:'RIGHT'};
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(state==='menu'&&(k==='Enter'||k===' ')){startGame();return}
  if(state==='gameover'&&(k==='Enter'||k==='r'||k==='R')){startGame();return}
  if(k==='p'||k==='P'){togglePause();return}
  if(k==='r'||k==='R'){if(state!=='menu')startGame();return}
  if(k==='m'||k==='M'){muted=!muted;document.getElementById('btnMute').textContent=muted?'🔇':'🔊';return}
  if(state==='playing'&&keyMap[k]){e.preventDefault();setDir(keyMap[k])}
});
// DPad
document.querySelectorAll('#dpad button').forEach(b=>{
  b.addEventListener('click',()=>{if(state==='playing')setDir(b.dataset.dir)});
});
// Buttons
document.getElementById('btnStart').addEventListener('click',startGame);
document.getElementById('btnResume').addEventListener('click',togglePause);
document.getElementById('btnPause').addEventListener('click',togglePause);
document.getElementById('btnMute').addEventListener('click',()=>{muted=!muted;document.getElementById('btnMute').textContent=muted?'🔇':'🔊'});
document.getElementById('btnRestart').addEventListener('click',()=>{if(state!=='menu')startGame()});
document.getElementById('btnOverRestart').addEventListener('click',startGame);
document.getElementById('btnOverMenu').addEventListener('click',goMenu);
document.getElementById('pauseScreen').addEventListener('click',e=>{if(e.target===document.getElementById('pauseScreen'))togglePause()});

// ===== State Transitions =====
function startGame(){
  initGame();state='playing';hideAllOverlays();document.getElementById('hud').style.display='block';
  pausedTime=0;startTime=performance.now();
}
function togglePause(){
  if(state==='playing'){
    state='paused';pauseStart=performance.now();showOverlay('pauseScreen');
  }else if(state==='paused'){
    state='playing';pausedTime+=performance.now()-pauseStart;hideAllOverlays();
  }
}
function goMenu(){
  state='menu';showOverlay('menuScreen');document.getElementById('hud').style.display='none';
}

// ===== Main Loop =====
let lastTime=0,accumulator=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTime)lastTime=ts;
  let delta=ts-lastTime;lastTime=ts;
  if(state==='playing'){
    accumulator+=delta;
    while(accumulator>=tickInterval){tick();accumulator-=tickInterval}
  }else if(state==='menu'||state==='gameover'){
    accumulator=0;
  }
  if(state==='playing')updateTimer();
  render();
}
requestAnimationFrame(loop);
</script>
</body>
</html
