<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARBOUND DEVOURER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='64' text-anchor='middle'%3E🚀%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;background:#050a1a;overflow:hidden;font-family:sans-serif;color:#c0d8ff}
canvas{display:block;background:#000}
#ui{position:absolute;inset:0;pointer-events:none}
button{cursor:pointer;padding:12px 24px;border:none;border-radius:8px;background:#1a2a4a;color:#c0d8ff;font-size:16px;transition:.2s}
button:hover{background:#2a3a5a}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
#title h1{font-size:48px;margin-bottom:30px}
#title button{margin:10px}
.hud{position:absolute;top:10px;left:10px,right:10px;display:flex;justify-content:space-between;pointer-events:auto}
.hud div{background:rgba(10,20,40,.7);padding:10px;border-radius:8px}
#massBar{width:200px;height:20px;background:#333;border-radius:4px;overflow:hidden;position:relative}
#massFill{height:100%;background:#00d4ff;transition:.3s}
#timer{font-size:24px;font-weight:bold}
#score{font-size:18px}
#stage{font-size:14px;color:#00ffaa}
#minimap{width:120px;height:120px;border:2px solid #00d4ff;border-radius:50%;position:relative}
#minimap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.pause-menu,.title-screen,.results{display:none;position:absolute;inset:0;background:rgba(0,0,0,.9);align-items:center;justify-content:center;flex-direction:column}
.pause-menu.active,.title-screen.active,.results.active{display:flex}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud">
    <div id="stage">STAGE 1: INTERCEPTOR</div>
    <div id="timer">00:00</div>
    <div id="score">0</div>
  </div>
  <div class="hud">
    <div id="massBar"><div id="massFill" style="width:0%"></div></div>
  </div>
  <div id="minimap"><canvas id="mini"></canvas></div>
</div>
<div id="title" class="title-screen">
  <h1>STARBOUND DEVOURER</h1>
  <button id="startBtn">START</button>
  <button id="howBtn">HOW TO PLAY</button>
  <button id="settingsBtn">SETTINGS</button>
</div>
<div id="pause" class="pause-menu">
  <button>RESUME</button>
  <button>RESTART</button>
  <button>SETTINGS</button>
  <button>QUIT</button>
</div>
<div id="results" class="results">
  <h1 id="resultText">VICTORY</h1>
  <div id="resultDetails"></div>
  <button>RETRY</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
