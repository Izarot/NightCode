<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speedrun Canvas Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:monospace; color:#eaeaea; }
#gameCanvas { border:2px solid #0f3460; border-radius:8px; background:#16213e; display:block; max-width:100%; max-height:100vh; }
#ui { position:fixed; top:10px; right:10px; display:flex; gap:15px; font-size:1.2rem; z-index:10; }
@media (max-width:600px) { #ui { font-size:1rem; top:5px; right:5px; gap:10px; } }
</style>
</head>
<body>
<div id="ui">
  <div>Time: <span id="timer">0.00</span>s</div>
  <div>High: <span id="highScore">0</span></div>
</div>
<canvas id="gameCanvas"></canvas>
<script src="game.js"></script>
</body>
</html>
