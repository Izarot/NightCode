<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Sculptor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui-overlay">
    <div id="top-toolbar" class="toolbar">
      <button class="tool-btn active" data-tool="select" title="Select (1)">🖱️</button>
      <button class="tool-btn" data-tool="sculpt" title="Sculpt (2)">➕</button>
      <button class="tool-btn" data-tool="erase" title="Erase (3)">🗑️</button>
      <button class="tool-btn" data-tool="paint" title="Paint (4)">🎨</button>
      <button class="tool-btn" data-tool="eyedropper" title="Eyedropper (5)">💧</button>
      <button class="tool-btn" data-tool="orbit" title="Orbit (Q/E)">🔄</button>
    </div>
    <div id="left-sidebar" class="sidebar">
      <div id="material-palette"></div>
    </div>
    <div id="right-sidebar" class="sidebar">
      <div id="properties-panel">Selection: None</div>
      <div id="layers-panel"><strong>Layers</strong><br><button id="layer-vis">👁 Layer 1</button></div>
      <div id="history-panel"><button id="undo-btn" title="Undo (Ctrl+Z)">↩️</button><button id="redo-btn" title="Redo (Ctrl+Y)">↪️</button></div>
    </div>
    <div id="bottom-status" class="statusbar">
      <span id="coords">X:0 Y:0 Z:0</span>
      <span id="zoom-level">100%</span>
      <span id="voxel-count">Voxels: 0/32768</span>
      <span id="score">Score: 0</span>
      <span id="high-score">Best: 0</span>
      <span id="timer">Time: 0.0s</span>
      <button id="export-png">📸 PNG</button>
      <button id="save-project">💾 Save</button>
    </div>
  </div>
  <canvas id="game-canvas"></canvas>
  <script src="main.js"></script>
</body>
</html>
