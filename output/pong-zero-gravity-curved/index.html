<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Curved Void Pong</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="uiOverlay">
        <div id="menuScreen" class="screen active">
            <h1>CURVED VOID PONG</h1>
            <div class="stats">High Score: <span id="highScoreDisplay">0</span></div>
            <button id="btnStart">START MATCH</button>
            <button id="btnControls">CONTROLS</button>
        </div>

        <div id="controlsScreen" class="screen">
            <h1>CONTROLS</h1>
            <div class="control-group">
                <h2>Player 1 (Left)</h2>
                <p>W / S / A / D : Thrust</p>
            </div>
            <div class="control-group">
                <h2>Player 2 (Right)</h2>
                <p>Arrow Keys : Thrust</p>
            </div>
            <div class="control-group">
                <h2>System</h2>
                <p>SPACE : Serve</p>
                <p>P : Pause</p>
            </div>
            <button id="btnBack">BACK</button>
        </div>

        <div id="hudScreen" class="screen">
            <div id="timer">00:00.0</div>
            <div id="score">0 - 0</div>
            <div id="speedMeter">SPEED: 100%</div>
        </div>

        <div id="pauseScreen" class="screen">
            <h1>PAUSED</h1>
            <button id="btnResume">RESUME</button>
        </div>

        <div id="gameOverScreen" class="screen">
            <h1 id="winnerText">PLAYER 1 VICTORY</h1>
            <div id="finalScore">Time: 00:00.0</div>
            <div id="newHighScore" style="color: #00f3ff; display: none;">NEW HIGH SCORE!</div>
            <button id="btnPlayAgain">PLAY AGAIN</button>
            <button id="btnMenu">MAIN MENU</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
