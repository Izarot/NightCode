<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>NEXUS FLUX</title>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div id="fluxTimer">FLUX <span id="timerValue">0.00</span></div>
  <div id="bestScore">BEST <span id="bestValue">0.00</span></div>
  <div id="speedrunTimer">RUN <span id="runValue">0.00</span></div>
  <div id="nearMissCounter">NEAR-MISS <span id="missValue">0</span></div>
</div>
<div id="reticle"></div>
<div id="overlay" class="overlay visible">
  <div class="panel">
    <h1 class="title">NEXUS FLUX</h1>
    <p class="subtitle">NAVIGATE THE CHAOS</p>
    <div class="instructions">WASD / ARROWS TO MOVE — SURVIVE</div>
    <button id="startBtn" class="cta">[ PRESS SPACE TO BEGIN ]</button>
    <div class="seed-input">SEED: <input id="seedInput" type="text" placeholder="(empty = random)" maxlength="12"></div>
  </div>
</div>
<div id="deathOverlay" class="overlay">
  <div class="panel">
    <h1 class="title death-title">FLUX TERMINATED</h1>
    <div class="stats">
      <div>DURATION: <span id="deathDuration">0.00</span>s</div>
      <div>BEST: <span id="deathBest">0.00</span>s</div>
      <div>NEAR-MISSES: <span id="deathMisses">0</span></div>
      <div>MILESTONES: <span id="deathMilestones">0</span></div>
    </div>
    <button id="retryBtn" class="cta">[ RETRY — SPACE ]</button>
  </div>
  <div class="leaderboard"><h3>TOP RUNS</h3><ol id="leaderList"></ol></div>
</div>
<div id="pauseOverlay" class="overlay">
  <div class="panel"><h1 class="title">PAUSED</h1><p>PRESS ESC TO RESUME</p></div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
