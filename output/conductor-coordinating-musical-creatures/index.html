<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNCOPATION - Maestro Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.7em' font-size='90' font-family='Arial'%3E🎵%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg, #0a0a1a, #1a0a2a); }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #08080c; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .speedrun-timer { position: absolute; top: 20px; right: 20px; font-family: 'Courier New', monospace; font-size: 24px; color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .high-score { position: absolute; top: 60px; right: 20px; font-family: 'Courier New', monospace; font-size: 18px; color: #ff6b6b; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div class="speedrun-timer" id="speedrunTimer">00:00.00</div>
        <div class="high-score" id="highScoreDisplay">HI: 000000</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
