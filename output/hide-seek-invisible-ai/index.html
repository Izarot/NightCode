<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Phantom Hide</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22 font-size=%2248%22>%F0%9F%91%BB</text></svg>"><style>*{margin:0;overflow:hidden}body{background:#050505;color:#0ff;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh}canvas{max-width:100vw;max-height:100vh;display:block}#ui{position:absolute;top:10px;left:10px;right:10px;pointer-events:none}#t{position:absolute;top:10px;right:10px;font-size:24px;color:#f0f}#b{position:absolute;bottom:10px;right:10px;font-size:14px;color:#ff0}#m{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none}button{padding:10px 20px;font-size:18px;background:#0ff;border:none;cursor:pointer}.bar{height:6px;background:#222;border:1px solid #0ff;width:300px;position:absolute;top:50px;left:50%;transform:translateX(-50%)}.fill{height:100%;background:#0ff;width:0%}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="t">00:00</div><div class="bar"><div id="d" class="fill"></div></div><div id="b">Best: 00:00</div></div><div id="m"><h1 id="mt">Phantom Hide</h1><p id="md">Click to Start</p><button onclick="r()">Start</button></div><script>const C=document.getElementById('c'),X=C.getContext('2d'),T=document.getElementById('t'),D=document.getElementById('d'),M=document.getElementById('m'),MT=document.getElementById('mt'),MD=document.getElementById('md'),B=document.getElementById('b');function sz(){C.width=innerWidth;C.height=innerHeight}window.onresize=sz;sz();const A=new(AudioContext||webkitAudioContext)();function s(f,t=.1){if(A.state==='suspended')A.resume();const o=A.createOscillator(),g=A.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.1,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+t);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+t)}let st='MENU',tm=0,hs=localStorage.getItem('phBest')||'00:00',K={};B.textContent='Best: '+hs;onkeydown=e=>K[e.code]=1;onkeyup=e=>K[e.code]=0;const P={x:100,y:100,vx:0,vy:0,r:10,r:10,ax:0,ay:0};let E=[],sp=2,fr=0;function r(){st='PLAY';tm=0;fr=0;sp=2;E=[];P.x=100;P.y=100;P.vx=0;P.vy=0;M.style.display='none';T.textContent='00:00';D.style.width='0%';g()}function g(){if(st!=='PLAY')return;fr++;tm+=1/60;let mm=Math.floor(tm/60),ss=Math.floor(tm%60);T.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;D.style.width=Math.min(tm*10,100)+'%';if(fr%90===0){E.push({x:Math.random()*C.width,y:Math.random()*C.height,r:15,s:sp+Math.random()*2})}for(let i=E.length-1;i>=0;i--){let e=E[i];let dx=P.x-e.x,dy=P.y-e.y;let d=Math.hypot(dx,dy);if(d<P.r+e.r){st='OVER';if(tm>parseFloat(hs)){hs=tm.toFixed(2);localStorage.setItem('phBest',hs);B.textContent='Best: '+hs}MT.textContent='Caught';MD.textContent='Survived: '+tm.toFixed(2)+'s';M.style.display='block';return}e.x+=dx/d*e.s;e.y+=dy/d*e.s}if(K['ArrowLeft']||K['KeyA'])P.ax=-0.4;if(K['ArrowRight']||K['KeyD'])P.ax=0.4;if(K['ArrowUp']||K['KeyW'])P.ay=-0.4;if(K['ArrowDown']||K['KeyS'])P.ay=0.4;P.vx+=P.ax;P.vy+=P.ay;P.vx*=0.92;P.vy*=0.92;P.x+=P.vx;P.y+=P.vy;if(P.x<P.r)P.x=P.r;if(P.x>C.width-P.r)P.x=C.width-P.r;if(P.y<P.r)P.y=P.r;if(P.y>C.height-P.r)P.y=C.height-P.r;P.ax=0;P.ay=0;X.fillStyle='#050505';X.fillRect(0,0,C.width,C.height);X.fillStyle='#0ff';X.beginPath();X.arc(P.x,P.y,P.r,0,Math.PI*2);X.fill();X.strokeStyle='#f0f';for(let e of E){X.beginPath();X.arc(e.x,e.y,e.r,0,Math.PI*2);X.stroke()}requestAnimationFrame(g)}onmousedown=()=>{if(st==='MENU'||st==='OVER')r()};g()</script></body></html>
