<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Stellar Archive</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:monospace;color:#f5f0e6}canvas{display:block;position:absolute;top:0;left:0}.overlay{position:absolute;pointer-events:none}.hud{font-size:12px;text-shadow:0 0 8px #d4af37}#coords{top:10px;left:10px;background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:8px 12px;border-radius:4px;color:#d4af37}#catalog-hud{top:10px;right:10px;background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:8px 12px;border-radius:4px;text-align:right;color:#f5f0e6}#scan-ind{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:10px 20px;border-radius:4px;color:#d4af37;display:none;text-align:center}#scan-ind.show{display:block}#vel{position:absolute;bottom:10px;left:10px;background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:6px 10px;border-radius:4px;color:#d4af37;font-size:11px}#timer{position:absolute;top:50px;right:10px;background:rgba(26,26,46,.85);border:1px solid #67e8f9;padding:6px 10px;border-radius:4px;color:#67e8f9;font-size:12px}#panel{position:absolute;top:10%;left:-340px;width:320px;height:80%;background:rgba(26,26,46,.92);border:2px solid #d4af37;padding:15px;color:#f5f0e6;font-size:11px;overflow-y:auto;transition:left .3s;border-radius:4px}#panel.open{left:10px}.bar{height:8px;background:#0f0f1a;border:1px solid #444;margin:4px 0;border-radius:2px;overflow:hidden}.fill{height:100%;transition:width .3s}.title{text-align:center;color:#d4af37;font-size:18px;margin-bottom:10px}#pause{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;flex-direction:column}#pause.show{display:flex}#pause h1{color:#d4af37;margin-bottom:20px}.btnmenu{background:#1a1a2e;border:1px solid #d4af37;color:#d4af37;padding:10px 30px;margin:5px;cursor:pointer;border-radius:4px}#title-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#050510,#0f0f1a);display:flex;flex-direction:column;justify-content:center;align-items:center}#title-screen h1{font-size:48px;color:#d4af37;text-shadow:0 0 20px #d4af37;margin-bottom:30px}#title-screen p{color:#f5f0e6;margin-bottom:10px}#title-screen .start{color:#67e8f9;font-size:14px;animation:blink 1.5s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}</style></head><body><div id="title-screen"><h1>✧ STELLAR ARCHIVE ✧</h1><p>A Celestial Cataloging Experience</p><p class="start">Press ENTER to begin</p></div><div id="coords" class="overlay hud">SECTOR: 0.00<br>CELESTIAL: 0.00</div><div id="catalog-hud" class="overlay hud">CATALOG: 0<br>SCORE: 0</div><div id="timer" class="overlay hud">⏱ 00:00</div><div id="vel" class="overlay hud">VEL ▶ 0.0</div><div id="scan-ind">◈ STAR IN RANGE — [SPACE] TO CATALOG</div><div id="panel"><div class="title">✧ STELLAR ARCHIVE ✧</div><div id="panel-content"></div></div><div id="pause"><h1>PAUSED</h1><button class="btnmenu" onclick="resumeGame()">Resume</button><button class="btnmenu" onclick="quitGame()">Quit</button></div><canvas id="game"></canvas><script>const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=Math.max(800,window.innerWidth);H=canvas.height=Math.max(600,window.innerHeight)}resize();window.addEventListener('resize',resize);const COL={voidD:'#050510',voidM:'#0f0f1a',white:'#f0f4ff',blue:'#6eb5ff',cyan:'#67e8f9',yellow:'#fcd34d',orange:'#fb923c',red:'#ef4444',pink:'#f472b6',purple:'#a78bfa',gold:'#d4af37',cream:'#f5f0e6',dark:'#1a1a2e'};const CLASSES={O:{color:'#6eb5ff',sym:'◆',temp:'>30,000K',pts:100,w:2},B:{color:'#93c5fd',sym:'◇',temp:'10-30K',pts:50,w:5},A:{color:'#67e8f9',sym:'○',temp:'7.5-10K',pts:25,w:8},F:{color:'#fde68a',sym:'◐',temp:'6-7.5K',pts:10,w:10},G:{color:'#fcd34d',sym:'◑',temp:'5.2-6K',pts:5,w:15},K:{color:'#fb923c',sym:'●',temp:'3.7-5.2K',pts:2,w:25},M:{color:'#ef4444',sym:'◉',temp:'2.4-3.7K',pts:1,w:35}};const audioCtx=new (window.AudioContext||window.webkitAudioContext)();function beep(f,d,t){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d/1000);o.start();o.stop(audioCtx.currentTime+d/1000)}function playScan(){beep(440,100);setTimeout(()=>beep(660,150),100)}function playRare(){beep(523,150);setTimeout(()=>beep(659,150),150);setTimeout(()=>beep(784,200),300)}const rand=(a,b)=>a+Math.random()*(b-a);const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const keys={};document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(state==='PLAYING')tryScan()}if(e.key==='Tab'){e.preventDefault();togglePanel()}if(e.key==='Escape'){e.preventDefault();togglePause()}if(e.key==='Enter'&&state==='TITLE')startGame()});document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});let state='TITLE';let gameTime=0;let timerStart=0;const player={x:0,y:0,vx:0,vy:0,trail:[]};const camera={x:0,y:0};let stars=[];let particles=[];let dust=[];let nebulae=[];let starCount=0;let score=0;let highScore=parseInt(localStorage.getItem('sa_high')||'0');let catalogData={O:0,B:0,A:0,F:0,G:0,K:0,M:0,gold:0,binary:0,pulsar:0};let scanning=null;let panelOpen=false;let paused=false;function loadSave(){try{const d=JSON.parse(localStorage.getItem('sa_save')||'{}');if(d.score)score=d.score;if(d.catalog)catalogData={...catalogData,...d.catalog};if(d.time)gameTime=d.time}catch(e){}}function saveSave(){localStorage.setItem('sa_save',JSON.stringify({score,catalog:catalogData,time:gameTime}))}function initDust(){for(let i=0;i<200;i++){dust.push({x:rand(-W,W),y:rand(-H,H),s:rand(1,2),sp:rand(.2,.5)})}for(let i=0;i<4;i++)nebulae.push({x:rand(-2000,2000),y:rand(-2000,2000),r:rand(300,500),c:[COL.pink,COL.purple][i%2]})}function initStars(){stars=[];for(let i=0;i<280;i++)spawnStar(player.x+rand(-W,W*1.5),player.y+rand(-H,H*1.5))}function pickClass(){const r=Math.random()*100;let cum=0;for(const k in CLASSES){cum+=CLASSES[k].w;if(r<=cum)return k}return 'M'}function spawnStar(x,y){const cls=pickClass();const mag=rand(1,10);const special=Math.random()<.05;let type=null;if(special){const t=Math.random();if(t<.4)type='gold';else if(t<.7)type='binary';else type='pulsar'}stars.push({x,y,class:cls,magnitude:mag,size:2+(10-mag)*.6,pulseRate:rand(.5,2),pulsePhase:rand(0,Math.PI*2),cataloged:false,type,angle:0,beam:0})}function update(){if(state!=='PLAYING'||paused)return;gameTime=(Date.now()-timerStart)/1000;const boost=keys['shift']?2:1;const acc=.15*boost;if(keys['w']||keys['arrowup'])player.vy-=acc;if(keys['s']||keys['arrowdown'])player.vy+=acc;if(keys['a']||keys['arrowleft'])player.vx-=acc;if(keys['d']||keys['right'])player.vx+=acc;player.vx*=0.985;player.vy*=0.985;if(Math.abs(player.vx)<.01)player.vx=0;if(Math.abs(player.vy)<.01)player.vy=0;const maxV=4*boost;const sp=Math.hypot(player.vx,player.vy);if(sp>maxV){player.vx*=maxV/sp;player.vy*=maxV/sp}player.x+=player.vx;player.y+=player.vy;player.trail.push({x:player.x,y:player.y});if(player.trail.length>15)player.trail.shift();camera.x+=(player.x-camera.x-W/2)*.1;camera.y+=(player.y-camera.y-H/2)*.1;for(let i=0;i<dust.length;i++){const d=dust[i];const dx=d.x-player.x,dy=d.y-player.y;if(dx>W)d.x=player.x-W;if(dx<-W)d.x=player.x+W;if(dy>H)d.y=player.y-H;if(dy<-H)d.y=player.y+H}for(let i=0;i<nebulae.length;i++){const n=nebulae[i];const dx=n.x-player.x;if(dx>W*2)n.x=player.x-W*2;if(dx<-W*2)n.x=player.x+W*2}for(let i=stars.length-1;i>=0;i--){const s=stars[i];const dx=s.x-player.x,dy=s.y-player.y;const d=Math.hypot(dx,dy);if(d>1500){stars.splice(i,1);continue}if(s.type==='binary'){s.angle+=.02;s.x+=Math.cos(s.angle)*.5}if(s.type==='pulsar'){s.beam=(s.beam+1)%60}if(scanning&&scanning.star===s){scanning.t+=16;if(scanning.t>=1500){catalogStar(s);scanning=null}}}const buffer=500;for(let i=0;i<3;i++){if(Math.random()<.3){let sx=player.x+rand(-W/2-buffer,W/2+buffer);let sy=player.y+rand(-H/2-buffer,H/2+buffer);if(!stars.find(s=>dist(s,{x:sx,y:sy})<80))spawnStar(sx,sy)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}updateStars();updateScanUI()}function updateStars(){let nearest=null,nearDist=80;for(const s of stars){if(s.cataloged)continue;const d=dist(s,player);if(d<nearDist){nearest=s;nearDist=d}if(d<150&&!s.cataloged)s.hover=true;else s.hover=false}const ind=document.getElementById('scan-ind');if(scanning){ind.classList.add('show');ind.innerHTML='◈ SCANNING... '+Math.floor(scanning.t/15)+'%';ind.style.borderColor='#67e8f9'}else if(nearest){ind.classList.add('show');ind.innerHTML='◈ STAR IN RANGE — [SPACE] TO CATALOG';ind.style.borderColor=COL.gold}else{ind.classList.remove('show')}}function tryScan(){for(const s of stars){if(s.cataloged)continue;if(dist(s,player)<80){scanning={star:s,t:0};beep(300,50);return}}}function catalogStar(s){if(s.cataloged)return;s.cataloged=true;starCount++;const pts=CLASSES[s.class].pts;if(s.type==='gold'){score+=pts*2}else{score+=pts}catalogData[s.class]++;if(s.type==='gold')catalogData.gold++;if(s.type==='binary')catalogData.binary++;if(s.type==='pulsar')catalogData.pulsar++;if(score>highScore){highScore=score;localStorage.setItem('sa_high',highScore)}for(let i=0;i<12;i++){const a=i/12*Math.PI*2;particles.push({x:s.x,y:s.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,life:30,color:CLASSES[s.class].color})}if(s.type)playRare();else playScan();saveSave();updatePanel();updateHUD()}function updateHUD(){const sx=(player.x/100).toFixed(2),sy=(player.y/100).toFixed(2);document.getElementById('coords').innerHTML='SECTOR: '+sx+'<br>CELESTIAL: '+sy;document.getElementById('catalog-hud').innerHTML='CATALOG: '+starCount+'<br>SCORE: '+score;document.getElementById('vel').innerHTML='VEL ▶ '+Math.hypot(player.vx,player.vy).toFixed(1);const m=Math.floor(gameTime/60),sec=Math.floor(gameTime%60);document.getElementById('timer').innerHTML='⏱ '+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,COL.voidD);g.addColorStop(.5,COL.voidM);g.addColorStop(1,COL.voidD);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();for(let i=0;i<nebulae.length;i++){const n=nebulae[i];const sx=n.x-camera.x*.1,sy=n.y-camera.y*.1;const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,n.r);sg.addColorStop(0,n.c+'40');sg.addColorStop(1,n.c+'00');ctx.fillStyle=sg;ctx.fillRect(sx-n.r,sy-n.r,n.r*2,n.r*2)}ctx.restore();for(const p of dust){const sx=(p.x-camera.x*.2)%W,sy=(p.y-camera.y*.2)%H;ctx.fillStyle='rgba(240,244,255,.2)';ctx.fillRect(sx,sy,p.s,p.s)}}function drawStars(){for(const s of stars){const sx=s.x-camera.x,sy=s.y-camera.y;if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;const c=CLASSES[s.class].color;const pulse=1+Math.sin(Date.now()*.001*s.pulseRate+s.pulsePhase)*.15;const size=s.size*pulse*(s.hover?1.3:1);const g=ctx.createRadialGradient(sx,sy,0,sx,sy,size*3);g.addColorStop(0,c+'ff');g.addColorStop(.3,c+'aa');g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,size*3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,size*.5,0,Math.PI*2);ctx.fill();if(s.type==='pulsar'&&s.beam<30){ctx.strokeStyle='rgba(103,232,249,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx-size*5,sy);ctx.lineTo(sx+size*5,sy);ctx.moveTo(sx,sy-size*5);ctx.lineTo(sx,sy+size*5);ctx.stroke()}if(s.type==='gold'){ctx.strokeStyle=COL.gold;ctx.lineWidth=1;ctx.strokeRect(sx-size*2,sy-size*2,size*4,size*4)}if(scanning&&scanning.star===s){ctx.strokeStyle=COL.gold;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,size*4,0,Math.PI*2*(scanning.t/1500));ctx.stroke()}}}function drawParticles(){for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=p.life/30;ctx.beginPath();ctx.arc(p.x-camera.x,p.y-camera.y,2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function drawPlayer(){ctx.save();for(let i=0;i<player.trail.length;i++){const t=player.trail[i];const a=i/player.trail.length*.4;ctx.fillStyle='rgba(212,175,55,'+a+')';ctx.beginPath();ctx.arc(t.x-camera.x,t.y-camera.y,3,0,Math.PI*2);ctx.fill()}const px=player.x-camera.x,py=player.y-camera.y;const g=ctx.createRadialGradient(px,py,0,px,py,20);g.addColorStop(0,'#fff');g.addColorStop(.3,'#d4af37');g.addColorStop(1,'#d4af3700');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();ctx.restore()}function render(){update();ctx.clearRect(0,0,W,H);drawBg();drawStars();drawParticles();drawPlayer();updateHUD();if(panelOpen)updatePanel();requestAnimationFrame(render)}function updatePanel(){let html='<div style="color:#d4af37;margin:5px 0">SPECTRAL INDEX</div>';const max={O:10,B:25,A:50,F:100,G:150,K:200,M:500};for(const k in CLASSES){const c=CLASSES[k];const v=catalogData[k]||0;const m=max[k];const pct=Math.min(100,v/m*100);html+='<div style="display:flex;justify-content:space-between"><span style="color:'+c.color+'">'+c.sym+' '+k+'</span><span>'+v+'/'+m+'</span></div><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+c.color+'"></div></div>'}html+='<div style="color:#d4af37;margin:10px 0 5px">SPECIAL</div>';html+='<div>☆ Golden: '+catalogData.gold+'</div>';html+='<div>◎ Binary: '+catalogData.binary+'</div>';html+='<div>⊕ Pulsar: '+catalogData.pulsar+'</div>';html+='<div style="border-top:1px solid #444;margin-top:10px;padding-top:10px">TOTAL: '+starCount+'</div>';html+='<div>SCORE: '+score+'</div>';html+='<div style="color:#67e8f9">HIGH: '+highScore+'</div>';html+='<div style="color:#67e8f9;margin-top:10px">⏱ '+Math.floor(gameTime/60)+':'+String(Math.floor(gameTime%60)).padStart(2,'0')+'</div>';document.getElementById('panel-content').innerHTML=html}function togglePanel(){panelOpen=!panelOpen;document.getElementById('panel').classList.toggle('open',panelOpen)}function togglePause(){if(state!=='PLAYING')return;paused=!paused;document.getElementById('pause').classList.toggle('show',paused)}function resumeGame(){paused=false;document.getElementById('pause').classList.remove('show')}function quitGame(){state='TITLE';document.getElementById('title-screen').style.display='flex';document.getElementById('pause').classList.remove('show')}function startGame(){state='PLAYING';timerStart=Date.now()-gameTime*1000;document.getElementById('title-screen').style.display='none';audioCtx.resume();if(stars.length===0){loadSave();initDust();initStars()}}initDust();initStars();render();</script></body></html>
