<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Stellar Archive</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:monospace;color:#f5f0e6}canvas{display:block;position:absolute;top:0;left:0}.overlay{position:absolute;pointer-events:none}.hud{font-size:12px;text-shadow:0 0 8px #d4af37}#coords{top:10px;left:10px;background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:8px 12px;border-radius:4px;color:#d4af37}#catalog-hud{top:10px;right:10px;background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:8px 12px;border-radius:4px;text-align:right;color:#f5f0e6}#scan-ind{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:10px 20px;border-radius:4px;color:#d4af37;display:none;text-align:center}#scan-ind.show{display:block}#vel{position:absolute;bottom:10px;left:10px;background:rgba(26,26,46,.85);border:1px solid #d4af37;padding:6px 10px;border-radius:4px;color:#d4af37;font-size:11px}#timer{position:absolute;top:50px;right:10px;background:rgba(26,26,46,.85);border:1px solid #67e8f9;padding:6px 10px;border-radius:4px;color:#67e8f9;font-size:12px}#panel{position:absolute;top:10%;left:-340px;width:320px;height:80%;background:rgba(26,26,46,.92);border:2px solid #d4af37;padding:15px;color:#f5f0e6;font-size:11px;overflow-y:auto;transition:left .3s;border-radius:4px}#panel.open{left:10px}.bar{height:8px;background:#0f0f1a;border:1px solid #444;margin:4px 0;border-radius:2px;overflow:hidden}.fill{height:100%;transition:width .3s}.title{text-align:center;color:#d4af37;font-size:18px;margin-bottom:10px}#pause{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;flex-direction:column}#pause.show{display:flex}#pause h1{color:#d4af37;margin-bottom:20px}.btnmenu{background:#1a1a2e;border:1px solid #d4af37;color:#d4af37;padding:10px 30px;margin:5px;cursor:pointer;border-radius:4px}#title-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#050510,#0f0f1a);display:flex;flex-direction:column;justify-content:center;align-items:center}#title-screen h1{font-size:48px;color:#d4af37;text-shadow:0 0 20px #d4af37;margin-bottom:30px}#title-screen p{color:#f5f0e6;margin-bottom:10px}#title-screen .start{color:#67e8f9;font-size:14px;animation:blink 1.5s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}</style></head><body><div id="title-screen"><h1>✧ STELLAR ARCHIVE ✧</h1><p>A Celestial Cataloging Experience</p><p class="start">Press ENTER to begin</p></div><div id="coords" class="overlay hud">SECTOR: 0.00<br>CELESTIAL: 0.00</div><div id="catalog-hud" class="overlay hud">CATALOG: 0<br>SCORE: 0</div><div id="timer" class="overlay hud">⏱ 00:00</div><div id="vel" class="overlay hud">VEL ▶ 0.0</div><div id="scan-ind">◈ STAR IN RANGE — [SPACE] TO CATALOG</div><div id="panel"><div class="title">✧ STELLAR ARCHIVE ✧</div><div id="panel-content"></div></div><div id="pause"><h1>PAUSED</h1><button class="btnmenu" onclick="resumeGame()">Resume</button><button class="btnmenu" onclick="quitGame()">Quit</button></div><canvas id="game"></canvas><script>const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=Math.max(800,window.innerWidth);H=canvas.height=Math.max(600,window.innerHeight)}resize();window.addEventListener('resize',resize);const COL={voidD:'#050510',voidM:'#0f0f1a',white:'#f0f4ff',blue:'#6eb5ff',cyan:'#67e8f9',yellow:'#fcd34d',orange:'#fb923c',red:'#ef4444',pink:'#f472b6',purple:'#a78bfa',gold:'#d4af37',cream:'#f5f0e6',dark:'#1a1a2e'};const CLASSES={O:{color:'#6eb5ff',sym:'◆',temp:'>30,000K',pts:100,w:2},B:{color:'#93c5fd',sym:'◇',temp:'10-30K',pts:50,w:5},A:{color:'#67e8f9',sym:'○',temp:'7.5-10K',pts:25,w:8},F:{color:'#fde68a',sym:'◐',temp:'6-7.5K',pts:10,w:10},G:{color:'#fcd34d',sym:'◑',temp:'5.2-6K',pts:5,w:15},K:{color:'#fb923c',sym:'●',temp:'3.7-5.2K',pts:2,w:25},M:{color:'#ef4444',sym:'◉',temp:'2.4-3.7K',pts:1,w:35}};const audioCtx=new (window.AudioContext||window.webkitAudioContext)();function beep(f,d,t){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d/1000);o.start();o.stop(audioCtx.currentTime+d/1000)}function playScan(){beep(440,100);setTimeout(()=>beep(660,150),100)}function playRare(){beep(523,150);setTimeout(()=>beep(659,150),150);setTimeout(()=>beep(784,200),300)}const rand=(a,b)=>a+Math.random()*(b-a);const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const keys={};document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(state==='PLAYING')tryScan()}if(e.key==='Tab'){e.preventDefault();togglePanel()}if(e.key==='Escape'){e.preventDefault();togglePause()}if(e.key==='Enter'&&state==='TITLE')startGame()});document.addEventListener('keyup',e=>{keys[e.key.toLower()]=false});let state='TITLE';let gameTime=0;let timerStart=0;const player={x:0,y:0,vx:0,vy:0,trail:[]};const camera={x:0,y:0};let stars=[];let particles=[];let dust=[];let nebulae=[];let starCount=0;let score=0;let highScore=parseInt(localStorage.getItem('sa_high')||'0');let catalogData={O:0,B:0,A:0,F:0,G:0,K:0,M:0,gold:0,binary:0,pulsar:0};let scanning=null;let panelOpen=false;let paused=false;function loadSave(){try{const d=JSON.parse(localStorage.getItem('sa_save')||'{}');if(d.score)score=d.score;if(d.catalog)catalogData={...catalogData,...d.catalog};if(d.time)gameTime=d.time}catch(e){}}function saveSave(){localStorage.setItem('sa_save',JSON.stringify({score,catalog:catalogData,time:gameTime}))}function initDust(){for(let i=0;i<200;i++){dust.push({x:rand(-W,W),y:rand(-H,H),s:rand(1,2),sp:rand(.2,.5)})}for(let i=0;i<4;i++)nebulae.push({x:rand(-2000,2000),y:rand(-2000,2000),r:rand(300,500),c:[COL.pink,COL.purple][i%2]})}function initStars(){stars=[];for(let i=0;i<280;i++)spawnStar(player.x+rand(-W,W*1.5),player.y+rand(-H,H*1.5))}function pickClass(){const r=Math.random()*100;let cum=0;for(const k in CLASSES){cum+=CLASSES[k].w;if(r<=cum)return k}return 'M'}function spawnStar(x,y){const cls=pickClass();const mag=rand(1,10);const special=Math.random()<.05;let type=null;if(special){const t=Math.random();if(t<.4)type='gold';else if(t<.7)type='binary';else type='pulsar'}stars.push({x,y,class:cls,magnitude:mag,size:2+(10-mag)*.6,pulseRate:rand(.5,2),pulsePhase:rand(0,Math.PI*2),cataloged:false,type,angle:0,beam:0})}
