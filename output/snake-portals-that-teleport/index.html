<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Portal Snake</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a20;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',monospace;overflow:hidden}
    #game-container{position:relative;width:100%;max-width:100vw;height:100vh;max-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
    canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
    #ui-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:flex;flex-direction:column}
    .hud{display:flex;justify-content:space-between;padding:10px 15px;color:#fff;font-size:14px;text-shadow:0 0 8px currentColor}
    .hud .score{color:#00ff00}
    .hud .hi-score{color:#888}
    .hud .level{color:#00f5ff}
    .hud .timer{color:#ff00c8}
    .hud .multiplier{color:#ffaa00}
    #overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:10}
    #overlay.active{display:flex}
    #overlay h1{font-size:2.5rem;color:#ff00c8;text-shadow:0 0 20px #ff00c8;margin-bottom:10px}
    #overlay p{color:#fff;font-size:1.2rem}
    .btn{background:linear-gradient(135deg,#00f5ff,#00aaff);border:none;color:#0a0a20;padding:12px 32px;font-size:1rem;font-family:inherit;font-weight:700;border-radius:4px;cursor:pointer;transition:transform .1s,box-shadow .1s;box-shadow:0 0 15px #00f5ff}
    .btn:active{transform:scale(0.95);box-shadow:0 0 5px #00f5ff}
    .btn.secondary{background:linear-gradient(135deg,#ff00c8,#aa00ff);box-shadow:0 0 15px #ff00c8}
    #touch-controls{display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);gap:10px;z-index:5}
    .touch-row{display:flex;gap:10px}
    .touch-btn{width:50px;height:50px;background:rgba(0,245,255,0.2);border:2px solid #00f5ff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#00f5ff;font-size:1.5rem;touch-action:none;user-select:none}
    .touch-btn:active{background:#00f5ff;color:#0a0a20}
    @media (max-width:600px){#touch-controls{display:flex}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui-overlay">
      <div class="hud">
        <span class="score" id="scoreEl">SCORE: 0</span>
        <span class="level" id="levelEl">LVL: 1</span>
        <span class="timer" id="timerEl">TIME: 0.00s</span>
      </div>
      <div class="hud" style="justify-content:flex-end;padding-top:0">
        <span class="hi-score" id="hiScoreEl">HI: 0</span>
        <span class="multiplier" id="multEl">×1.0</span>
      </div>
    </div>
    <div id="overlay">
      <h1 id="overlayTitle">PORTAL SNAKE</h1>
      <p id="overlayText">Press any key or tap to start</p>
      <button class="btn" id="startBtn">START</button>
      <button class="btn secondary" id="highContrastBtn">High Contrast</button>
    </div>
    <div id="touch-controls">
      <div class="touch-row"><div class="touch-btn" data-dir="0,-1">↑</div></div>
      <div class="touch-row"><div class="touch-btn" data-dir="-1,0">←</div><div class="touch-btn" data-dir="1,0">→</div></div>
      <div class="touch-row"><div class="touch-btn" data-dir="0,1">↓</div></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
