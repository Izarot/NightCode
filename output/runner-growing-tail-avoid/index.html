<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner with Growing Tail</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(180deg, #4B0082, #00008B); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #gameContainer { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #000; display: block; }
        #hud { position: absolute; top: 10px; left: 10px; color: #00FFFF; text-shadow: 0 0 5px rgba(0,255,255,0.7); font-size: 1.2rem; }
        #timer { position: absolute; top: 10px; right: 10px; color: #FF0040; text-shadow: 0 0 5px rgba(255,0,64,0.7); font-size: 1.2rem; }
        #menu, #gameOver { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        #menu h1, #gameOver h1 { font-size: 3rem; margin-bottom: 20px; color: #00FFFF; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        #menu p, #gameOver p { font-size: 1.5rem; margin: 10px 0; }
        button { background: linear-gradient(45deg, #00FFFF, #FF00FF); border: none; color: white; padding: 12px 24px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
        #scoreBar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 600px; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; }
        #scoreFill { height: 100%; background: linear-gradient(90deg, #00FFFF, #FF00FF); width: 0%; transition: width 0.3s; }
        #segmentMarkers { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80%; max-width: 600px; display: flex; justify-content: space-between; }
        .segment { width: 4px; height: 10px; background: #00FFFF; margin: 0 2px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="hud">Distance: <span id="distance">0m</span></div>
    <div id="timer">Time: <span id="time">0s</span></div>
    <div id="menu">
        <h1>RUNNER WITH GROWING TAIL</h1>
        <p>Tap Space or Click to Start</p>
        <p>High Score: <span id="highScore">0m</span></div>
        <button id="startBtn">Start Game</button>
    </div>
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Distance: <span id="finalDistance">0m</span></p>
        <p>Tail Length: <span id="finalTail">0</span></p>
        <button id="restartBtn">Play Again</button>
    </div>
    <div id="scoreBar"><div id="scoreFill"></div></div>
    <div id="segmentMarkers"></div>
    <script src="game.js"></script>
</body>
</html>
