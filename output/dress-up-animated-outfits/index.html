<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Bloom</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22 font-size=%2240%22>%F0%9F%8C%B8</text></svg>">
<style>
:root{--bg:#0a0a12;--panel:rgba(255,255,255,0.06);--accent:#ff00ff;--accent2:#00ffff;--text:#fff;--muted:#aaa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
#canvas{display:block;margin:0 auto;background:#000;max-width:100vw;max-height:100vh;width:100%;height:auto}
.ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding:10px}
.ui *{pointer-events:auto}
.bar{display:flex;justify-content:space-between;width:100%;max-width:500px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.bar b{color:var(--accent2)}
#brief{background:var(--panel);border:1px solid var(--accent);padding:12px;border-radius:12px;max-width:500px;text-align:center;margin-bottom:8px}
#brief h2{color:var(--accent);margin-bottom:4px}
.tags{font-size:12px;color:var(--muted);margin-bottom:6px}
.controls{display:flex;gap:8px;}
button{background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s}
button:hover{background:var(--accent);color:#000}
button:active{transform:scale(.95)}
#status{margin-top:8px;font-size:12px;color:var(--muted);min-height:16px}
canvas{image-rendering:pixelated}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:auto}
#overlay h1{color:var(--accent);font-size:32px;margin-bottom:16px}
#overlay p{color:var(--text);max-width:400px;text-align:center;margin-bottom:24px}
#restart{padding:12px 24px;font-size:16px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
<div class="bar"><span>Bloom Stage</span><b id="stage">0</b></div>
<div class="bar"><span>Petals</span><b id="petals">0</b></div>
<div id="brief"><h2>Atelier Bloom</h2><div class="tags">Generative Flora • Click to Grow • Drag to Shape</div></div>
<div class="controls">
<button id="btnGrow">Grow</button>
<button id="btnScatter">Scatter</button>
<button id="btnReset">Reset</button>
</div>
<div id="status">Ready</div>
</div>
<div id="overlay"><h1>Bloom Complete</h1><p>Your garden has flourished.</p><button id="restart">Start Again</button></div>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script>
let flowers = [];
let stage = 0;
let petals = 0;
let mode = 'grow';

function setup() {
  const c = createCanvas(windowWidth, windowHeight);
  c.parent('canvas');
  colorMode(HSB, 360, 100, 100, 100);
  noStroke();
  reset();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function reset() {
  flowers = [];
  stage = 0;
  petals = 0;
  updateUI();
  document.getElementById('status').textContent = 'Reset';
  document.getElementById('overlay').style.display = 'none';
}

function updateUI() {
  document.getElementById('stage').textContent = stage;
  document.getElementById('petals').textContent = petals;
}

function mousePressed() {
  if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;
  growFlower(mouseX, mouseY);
}

function growFlower(x, y) {
  const hue = random(280, 340);
  flowers.push(new Flower(x, y, hue));
  stage++;
  petals += 5;
  updateUI();
  document.getElementById('status').textContent = 'Grew at ' + x + ',' + y;
  if (stage >= 10) {
    document.getElementById('overlay').style.display = 'flex';
  }
}

function mouseDragged() {
  growFlower(mouseX, mouseY);
}

function draw() {
  background(0, 0, 5, 30);
  for (let f of flowers) {
    f.update();
    f.display();
  }
  if (frameCount % 60 === 0) {
    for (let f of flowers) f.age++;
  }
}

class Flower {
  constructor(x, y, hue) {
    this.pos = createVector(x, y);
    this.hue = hue;
    this.age = 0;
    this.maxAge = random(100, 300);
    this.scale = 0;
    this.targetScale = random(20, 60);
    this.petalCount = int(random(5, 10));
    this.angleOffset = random(TWO_PI);
    this.wobble = random(0.02, 0.08);
  }
  update() {
    this.scale = lerp(this.scale, this.targetScale, 0.05);
    this.age++;
    if (this.age > this.maxAge) {
      this.targetScale *= 0.95;
    }
  }
  display() {
    push();
    translate(this.pos.x, this.pos.y);
    let s = this.scale * (1 + sin(frameCount * this.wobble) * 0.1);
    for (let i = 0; i < this.petalCount; i++) {
      let a = (TWO_PI / this.petalCount) * i + this.angleOffset + sin(frameCount * 0.005 + i) * 0.2;
      let x = cos(a) * s * 0.5;
      let y = sin(a) * s * 0.5;
      fill(this.hue, 80, 90, 0.8);
      ellipse(x, y, s * 0.6, s);
    }
    fill(60, 100, 50, 0.9);
    ellipse(0, 0, s * 0.4, s * 0.4);
    pop();
  }
}

document.getElementById('btnGrow').onclick = () => growFlower(random(width), random(height));
document.getElementById('btnScatter').onclick = () => {
  for (let i = 0; i < 5; i++) growFlower(random(width), random(height));
};
document.getElementById('btnReset').onclick = reset;
document.getElementById('restart').onclick = reset;
</script>
</body>
</html>
