<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Dash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; border-radius: 8px; box-shadow: 0 0 30px #00ffea44; }
    #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; color: #00ffea; text-shadow: 0 0 5px #00ffea; font-size: 1.2rem; font-weight: bold; pointer-events: none; z-index: 10; }
    #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 10px #ff00ff; }
    #msg.visible { opacity: 1; }
    @media (max-width: 600px) { #ui { font-size: 1rem; } }
  </style>
</head>
<body>
  <div id="ui"><span id="score">SCORE: 0</span><span id="timer">TIME: 0.00s</span><span id="hi">BEST: 0</span></div>
  <canvas id="game"></canvas>
  <div id="msg">TAP TO START</div>
  <script src="game.js"></script>
</body>
</html>
