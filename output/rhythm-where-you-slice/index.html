<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rhythm Slice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
  <style>
    html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f0f2a;font-family:'Segoe UI',sans-serif}
    #gameCanvas{display:block;width:100%;height:100%;background:#0f0f2a}
    .hidden{visibility:hidden}
    button{background:#ff6ec7;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:18px;cursor:pointer;transition:.2s}
    button:hover{transform:scale(1.05)}
    .menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
    .menu h1{font-size:48px;color:#fff;margin-bottom:20px}
    .hidden{visibility:hidden}
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div id="menu" class="menu">
    <h1>Rhythm Slice</h1>
    <button id="playBtn">Play</button>
    <button id="settingsBtn">Settings</button>
  </div>
  <div id="settings" class="menu hidden">
    <h2>Settings</h2>
    <label>Music Volume: <input type="range" id="musicVol" min="0" max="100" value="80"></label><br>
    <label>SFX Volume: <input type="range" id="sfxVol" min="0" max="100" value="80"></label><br>
    <button id="backBtn">Back</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
