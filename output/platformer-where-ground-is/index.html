<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Sandfall 🏜️</title><link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏜️</text></svg>'><style>body{margin:0;background:#0a0618;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#1a0b2e,#0a0618)}.hud{position:absolute;backdrop-filter:blur(10px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px}#timer{top:10px;left:10px;color:#00f5ff;font-weight:700}#hs{top:10px;right:10px;color:#ffb703}#barWrap{top:10px;left:50%;transform:translateX(-50%);width:40vw;height:12px}#bar{height:100%;width:0%;background:linear-gradient(90deg,#00f5ff,#ff2ea6);border-radius:8px}#dust{bottom:12px;right:12px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffb703;font-weight:800}#ability{bottom:12px;left:12px;color:#a3ff12}#hint{top:60px;left:50%;transform:translateX(-50%);transition:opacity 1s}#death{inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.85);position:absolute}button{background:#ff2ea6;color:#fff;border:0;padding:12px 24px;border-radius:999px;font-size:18px;cursor:pointer}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}</style></head><body><canvas id='cv'></canvas><div id='timer' class='hud'>⏱️ 0:00</div><div id='hs' class='hud'>🏆 0</div><div id='barWrap' class='hud'><div id='bar'></div></div><div id='dust' class='hud'>0</div><div id='ability' class='hud'>BUILD</div><div id='hint' class='hud'>[SPACE] Build | [SHIFT] Dig | [ARROWS] Move</div><div id='flash'></div><div id='death'><h1>💀 BURIED</h1><p id='final'></p><button id='btn'>Re-bury</button></div><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=0,H=0,CELL=16,COLS=120,ROWS=80,grid=new Uint8Array(COLS*ROWS);function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;CELL=Math.max(8,Math.floor(Math.min(W/COLS,H/ROWS)));}addEventListener('resize',resize);resize();let keys={},mouse={x:0,y:0};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});addEventListener('keyup',e=>keys[e.code]=false);cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});cv.addEventListener('mousedown',e=>{if(e.button===0)build();if(e.button===2)dig();});cv.addEventListener('contextmenu',e=>e.preventDefault());let AC;function beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}let hs=+localStorage.getItem('sandfall_high')||0;document.getElementById('hs').textContent='🏆 '+hs;let p,cam,start,dead,burial,dust,score,coyote,jbuf,motes=[];function reset(){grid.fill(0);for(let c=0;c<COLS;c++){if(c%20<6){grid[(ROWS-1)*COLS+c]=2;grid[(ROWS-2)*COLS+c]=2;}}for(let i=0;i<40;i++)motes.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,v:Math.random()*.5+.1});p={x:200,y:100,w:22,h:28,vx:0,vy:0,face:1};cam={x:0,y:0};start=Date.now();dead=false;burial=0;dust=0;score=0;coyote=0;jbuf=0;document.getElementById('death').style.display='none';setTimeout(()=>document.getElementById('hint').style.opacity='0',5000);document.getElementById('hint').style.opacity='1';}function idx(c,r){return r*COLS+c;}function solid(c,r){if(c<0||c>=COLS||r<0||r>=ROWS)return true;return grid[idx(c,r)]!==0;}function build(){let c=Math.floor((mouse.x+cam.x)/CELL),r=Math.floor((mouse.y+cam.y)/CELL);if(!mouse.x){c=Math.floor((p.x+p.w/2+p.face*30)/CELL);r=Math.floor(p.y/CELL);}for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let cc=c+dc,rr=r+dr;if(cc>=0&&cc<COLS&&rr>=0&&rr<ROWS&&grid[idx(cc,rr)]===0)grid[idx(cc,rr)]=1;}beep(600,.08);document.getElementById('ability').textContent='BUILD ✨';}function dig(){let pc=Math.floor((p.x+p.w/2)/CELL),pr=Math.floor((p.y+p.h/2)/CELL);for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++){let cc=pc+dc,rr=pr+dr;if(cc>=0&&cc<COLS&&rr>=0&&rr<ROWS&&grid[idx(cc,rr)]===1)grid[idx(cc,rr)]=0;}beep(200,.1);document.getElementById('ability').textContent='DIG ⛏️';}function die(){if(dead)return;dead=true;beep(80,.5);let f=document.getElementById('flash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',150);score=Math.floor(score+dust*10);if(score>hs){hs=score;localStorage.setItem('sandfall_high',hs);}document.getElementById('hs').textContent='🏆 '+hs;document.getElementById('final').textContent='Score '+score+' | Dust '+dust+' | High '+hs;document.getElementById('death').style.display='flex';}document.getElementById('btn').onclick=reset;function updateSand(){for(let i=0;i<6;i++){let c=Math.floor(Math.random()*6);if(grid[idx(c,0)]===0)grid[idx(c,0)]=1;}for(let r=ROWS-2;r>=0;r--){let dir=Math.random()<.5?1:-1;for(let ci=0;ci<COLS;ci++){let c=dir===1?ci:COLS-1-ci;let id=idx(c,r);if(grid[id]!==1)continue;let b=idx(c,r+1);if(grid[b]===0){grid[b]=1;grid[id]=0;}else{let dc=c+dir;if(dc>=0&&dc<COLS&&grid[idx(dc,r+1)]===0&&grid[idx(dc,r)]===0){grid[idx(dc,r+1)]=1;grid[id]=0;}}}}}function update(){if(dead)return;updateSand();let L=keys.ArrowLeft||keys.KeyA,R=keys.ArrowRight||keys.KeyD;if(L){p.vx-=0.6;p.face=-1;}if(R){p.vx+=0.6;p.face=1;}p.vx*=0.85;p.vy+=0.5;if(p.vy>15)p.vy=15;if(keys.Space)jbuf=8;else if(jbuf>0)jbuf--;if(coyote>0)coyote--;if(jbuf>0&&coyote>0){p.vy=-12;jbuf=0;coyote=0;beep(900,.12);}if(keys.ShiftLeft||keys.ShiftRight)dig();if(keys.Space&&Math.random()<.3)build();p.x+=p.vx;let pc=Math.floor(p.x/CELL),pr=Math.floor(p.y/CELL);if(solid(pc,pr)||solid(pc,pr+1)){p.x-=p.vx;p.vx=0;}p.y+=p.vy;pc=Math.floor(p.x/CELL);pr=Math.floor(p.y/CELL);let grounded=false;if(p.vy>=0&&solid(pc,pr+2)){p.y=Math.floor(p.y/CELL)*CELL;p.vy=0;grounded=true;}if(grounded)coyote=8;let pcx=Math.floor((p.x+p.w/2)/CELL),pry=Math.floor((p.y+p.h/2)/CELL);let around=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(grid[idx(Math.max(0,Math.min(COLS-1,pcx+dc)),Math.max(0,Math.min(ROWS-1,pry+dr)))]===1)around++;}if(around>4){burial+=2;dust+=1;if(Math.random()<.1)beep(1200,.05);}else burial=Math.max(0,burial-1);if(burial>=100)die();if(grid[idx(pcx,pry)]===2)die();if(p.y>ROWS*CELL)die();score+=Math.abs(p.vx)*.1;cam.x+=(p.x-W/2-cam.x)*.08;cam.y+=(p.y-H/2-cam.y)*.08;cam.x=Math.max(0,Math.min(COLS*CELL-W,cam.x));cam.y=Math.max(0,Math.min(ROWS*CELL-H,cam.y));let t=Math.floor((Date.now()-start)/1000);document.getElementById('timer').textContent='⏱️ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');document.getElementById('bar').style.width=burial+'%';document.getElementById('dust').textContent=dust;}function draw(){ctx.fillStyle='#1a0b2e';ctx.fillRect(0,0,W,H);let c0=Math.max(0,Math.floor(cam.x/CELL)),c1=Math.min(COLS-1,c0+Math.ceil(W/CELL)+1),r0=Math.max(0,Math.floor(cam.y/CELL)),r1=Math.min(ROWS-1,r0+Math.ceil(H/CELL)+1);for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){let v=grid[idx(c,r)];if(!v)continue;ctx.fillStyle=v===1?'#e8c872':'#8b5a2b';ctx.fillRect(c*CELL-cam.x,r*CELL-cam.y,CELL,CELL);}ctx.fillStyle='#00f5ff';ctx.fillRect(p.x-cam.x,p.y-cam.y,p.w,p.h);ctx.fillStyle='#fff';ctx.fillRect(p.x-cam.x+(p.face>0?p.w-8:4),p.y-cam.y+6,4,4);ctx.fillStyle='rgba(255,255,255,.6)';for(let m of motes){m.y+=m.v;m.x+=Math.sin(m.y*.02)*.3;if(m.y>H){m.y=0;m.x=Math.random()*W;}ctx.fillRect(m.x,m.y,m.s,m.s);}}function loop(){update();draw();requestAnimationFrame(loop);}reset();loop();</script></body></html>
