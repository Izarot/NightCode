<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦌</text></svg>" />
<title>Crimson Trail: The Hunt for the Hollow Stag</title>
<link rel="stylesheet" href="css/hud.css" />
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="compass"></div>
  <div id="tools"></div>
  <div id="stats">
    <div id="noiseBar"></div>
    <div id="staminaBar"></div>
  </div>
  <div id="detect"></div>
  <div id="timer">00:00</div>
  <div id="highscore">Best: --</div>
  <div id="prompt"></div>
</div>
<div id="menu">
  <h1>Crimson Trail</h1>
<p>The Hunt for the Hollow Stag</p>
<button id="start">Begin Hunt</button>
</div>
<div id="endscreen" class="hidden">
  <h2>Encounter Complete</h2>
  <p id="endstats"></p>
  <button id="restart">Hunt Again</button>
</div>
<script src="js/main.js"></script>
</body>
</html>
