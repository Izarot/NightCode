<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GRAVITY'S PAW</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
:root { --bg:#1A1A2E; --mint:#00FFAA; --tuna:#FF6B35; --text:#E0E0E0; --card:#16213E; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'JetBrains Mono',monospace;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);overflow:hidden;touch-action:none;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 50% 0%, #16213E 0%, #1A1A2E 50%, #0F0F1A 100%);}
#gameCanvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 40px rgba(0,255,170,0.1), inset 0 0 60px rgba(0,0,0,0.5);border-radius:4px;}
#uiLayer{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding:10px;z-index:10;}
.hudTop{display:flex;justify-content:space-between;width:100%;max-width:1920px;padding:0 20px;}
.hudBox{background:rgba(22,33,62,0.85);border:1px solid rgba(0,255,170,0.3);padding:8px 16px;border-radius:6px;backdrop-filter:blur(4px);box-shadow:0 4px 20px rgba(0,0,0,0.3);}
#scoreDisplay{font-size:1.5rem;font-weight:bold;color:var(--mint);text-shadow:0 0 10px var(--mint);letter-spacing:2px;}
#timerDisplay{font-size:1.5rem;font-weight:bold;color:var(--tuna);text-shadow:0 0 10px var(--tuna);font-variant-numeric:tabular-nums;}
#comboDisplay{font-size:1.2rem;color:var(--tuna);min-width:60px;text-align:center;animation:pulse 0.5s infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}
#highScoreDisplay{font-size:0.8rem;color:#889;text-align:right;}
#msgOverlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(26,26,46,0.98);border:2px solid var(--mint);padding:40px 60px;border-radius:12px;text-align:center;z-index:100;display:none;flex-direction:column;gap:20px;max-width:90vw;box-shadow:0 0 60px rgba(0,255,170,0.2);}
#msgOverlay h1{font-family:'Bangers',cursive;font-size:3rem;color:var(--mint);letter-spacing:4px;text-shadow:0 0 20px var(--mint);margin:0;}
#msgOverlay p{font-size:1.2rem;line-height:1.6;}
#msgOverlay .stat{color:var(--tuna);font-weight:bold;}
#msgOverlay button{background:linear-gradient(135deg,var(--mint),#00cc88);border:none;color:#000;padding:12px 30px;font-size:1.1rem;font-weight:bold;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:transform 0.1s,box-shadow 0.1s;box-shadow:0 4px 0 #008866;}
#msgOverlay button:active{transform:translateY(2px);box-shadow:0 2px 0 #008866;}
#msgOverlay input{background:var(--bg);border:2px solid var(--mint);color:var(--text);padding:10px;font-size:1.5rem;text-align:center;text-transform:uppercase;letter-spacing:8px;width:80px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
@font-face{font-family:'JetBrains Mono';src:local('JetBrains Mono'),url('https://fonts.gstatic.com/s/jetbrainsmono/v23/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKk.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Bangers';src:local('Bangers'),url('https://fonts.gstatic.com/s/bangers/v31/5UaMzayiIfR9zR9r1p2HxQ.woff2') format('woff2');font-display:swap;}
@media (prefers-reduced-motion:reduce){* {animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="uiLayer">
<div class="hudTop">
<div class="hudBox"><div id="highScoreDisplay">BEST: 0</div><div id="scoreDisplay">000,000</div></div>
<div class="hudBox" style="text-align:center;"><div id="timerDisplay">03:00.00</div><div style="font-size:0.7rem;color:#667;">ZOOMIES TIMER</div></div>
<div class="hudBox" style="text-align:right;"><div id="comboDisplay">x1</div><div style="font-size:0.7rem;color:#667;">COMBO</div></div>
</div>
</div>
<div id="msgOverlay"><h1>GRAVITY'S PAW</h1><p>Knock stuff off shelves.<br>Mouse/Touch: Hold & Drag to Aim, Release to Swipe.<br>WASD/Arrows: Move | Space: Jump | Shift: Run</p><p>High Score: <span class="stat" id="finalScore">0</span></p><input type="text" id="nameInput" maxlength="3" placeholder="AAA"><button id="restartBtn">ANOTHER ROUND</button></div>
<script>
// --- CONSTANTS & CONFIG ---
const CFG = {
W:1920,H:1080,G:980,DT:1/60,SUB:4,
P_W:28,P_H:48,P_R:14,
WALK:280,RUN:520,ACC:2200,DEC:3500,AIR_ACC:800,JUMP:-480,
COYOTE:0.08,JBUF:0.12,WALL_SLIDE:120,WALL_JUMP_X:350,WALL_JUMP_Y:-420,
SWIPE_MAX_C:0.6,SWIPE_MIN_F:400,SWIPE_MAX_F:1800,SWIPE_RANGE:180,RECOIL:0.15,RECOVERY:0.25,
COMBO_WIN:1.5,MAX_COMBO:5,
PROP_TYPES:[
{id:'vase',col:'#E8C547',w:30,h:50,m:1.5,r:0.1,hp:1,sc:150,shatter:true},
{id:'mug',col:'#C0392B',w:28,h:36,m:1.0,r:0.2,hp:2,sc:100},
{id:'book',col:'#2C3E50',w:40,h:30,m:0.8,r:0.05,hp:3,sc:50},
{id:'plant',col:'#27AE60',w:40,h:60,m:3.0,r:0.0,hp:1,sc:300,heavy:true},
{id:'phone',col:'#2C2C2C',w:30,h:55,m:0.3,r:0.3,hp:1,sc:500,hv:true},
{id:'toy',col:'#E74C3C',w:20,h:15,m:0.1,r:0.6,hp:999,sc:10,bouncy:true},
{id:'candle',col:'#F39C12',w:16,h:40,m:0.5,r:0.1,hp:1,sc:200}
],
SHELVES:[{x:100,y:900,w:1700,h:20},{x:100,y:550,w:1700,h:20},{x:100,y:200,w:1700,h:20}]
};

// --- CORE ENGINE ---
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let scale=1,offsetX=0,offsetY=0;
function resize(){
const r=Math.min(window.innerWidth/CFG.W,window.innerHeight/CFG.H);
scale=r;canvas.width=CFG.W;canvas.height=CFG.H;
canvas.style.width=(CFG.W*r)+'px';canvas.style.height=(CFG.H*r)+'px';
offsetX=(window.innerWidth-CFG.W*r)/2;offsetY=(window.innerHeight-CFG.H*r)/2;
}
window.addEventListener('resize',resize);resize();

// --- AUDIO (Web Audio API) ---
const AC=new (window.AudioContext||window.webkitAudioContext)();
const gainNode=AC.createGain();gainNode.connect(AC.destination);gainNode.gain.value=0.3;
function playTone(freq,dur,type='sine',vol=0.1,start=0){if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(gainNode);o.start(AC.currentTime+start);o.stop(AC.currentTime+start+dur);}
function sfxSwipe(c){playTone(200+1000*c,0.1,'sawtooth',0.05);playTone(400+500*c,0.05,'square',0.03,0.05);}
function sfxBreak(t){if(t.shatter){playTone(2000,0.05,'square',0.1);playTone(3000,0.1,'sawtooth',0.05);}else if(t.bouncy){playTone(800,0.05,'sine',0.1);}else{playTone(300,0.1,'triangle',0.1);}}
function sfxJump(){playTone(400,0.05,'sine',0.05);}
function sfxLand(){playTone(150,0.05,'sine',0.05);}
function sfxCombo(l){playTone(440*Math.pow(1.059,l),0.1,'sine',0.1);}
function sfxTimer(){playTone(880,0.05,'sine',0.1);}

// --- INPUT ---
const Input={keys:{},mouse:{x:0,y:0,down:false,wx:0,wy:0},gp:null};
window.addEventListener('keydown',e=>Input.keys[e.code]=true);
window.addEventListener('keyup',e=>Input.keys[e.code]=false);
canvas.addEventListener('mousedown',e=>{Input.mouse.down=true;updateMouse(e);});
canvas.addEventListener('mousemove',updateMouse);
canvas.addEventListener('mouseup',e=>{Input.mouse.down=false;updateMouse(e);});
canvas.addEventListener('touchstart',e=>{e.preventDefault();Input.mouse.down=true;updateTouch(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();updateTouch(e);},{passive:false});
canvas.addEventListener('touchend',e=>{Input.mouse.down=false;},{passive:false});
function updateMouse(e){const r=canvas.getBoundingClientRect();Input.mouse.x=(e.clientX-r.left)/scale;Input.mouse.y=(e.clientY-r.top)/scale;Input.mouse.wx=Input.mouse.x;Input.mouse.wy=Input.mouse.y;}
function updateTouch(e){const r=canvas.getBoundingClientRect();const t=e.touches[0]||e.changedTouches[0];Input.mouse.x=(t.clientX-r.left)/scale;Input.mouse.y=(t.clientY-r.top)/scale;Input.mouse.wx=Input.mouse.x;Input.mouse.wy=Input.mouse.y;}
window.addEventListener('gamepadconnected',e=>Input.gp=e.gamepad);
window.addEventListener('gamepaddisconnected',()=>Input.gp=null);
function pollGamepad(){if(!Input.gp)return;const gp=navigator.getGamepads()[Input.gp.index];if(gp)Input.gp=gp;}

// --- ENTITIES ---
const Entities=[];
function addEnt(e){Entities.push(e);return e;}
function clearEnts(){Entities.length=0;}

// --- PLAYER ---
const Player=addEnt({
x:200,y:800,vx:0,vy:0,state:'idle',dir:1,
animT:0,onGround:false,coyote:0,jumpBuf:0,wallDir:0,
swipeC:0,swipeAim:{x:0,y:0},swiping:false,recoilT:0,
score:0,combo:1,comboT:0,propsBroken:0,
update(dt){
if(this.recoilT>0){this.recoilT-=dt;return;}
// Input
let moveX=0;if(Input.keys['ArrowLeft']||Input.keys['KeyA'])moveX-=1;if(Input.keys['ArrowRight']||Input.keys['KeyD'])moveX+=1;
if(Input.gp){const gp=Input.gp;moveX+=gp.axes[0];if(gp.buttons[0].pressed)this.jumpBuf=CFG.JBUF;}
const runHeld=Input.keys['ShiftLeft']||Input.keys['ShiftRight']||(Input.gp&&Input.gp.buttons[7].pressed);
const maxSpd=runHeld?CFG.RUN:CFG.WALK;
const acc=this.onGround?CFG.ACC:CFG.AIR_ACC;
const dec=this.onGround?CFG.DEC:0;
// Horizontal
if(moveX!==0){this.vx+=moveX*acc*dt;this.dir=moveX>0?1:-1;}else if(this.onGround){this.vx*=Math.max(0,1-dec*dt);}
this.vx=Math.max(-maxSpd,Math.min(maxSpd,this.vx));
// Jump Buffer/Coyote
if(this.onGround)this.coyote=CFG.COYOTE;else this.coyote-=dt;
if(Input.keys['Space']||Input.keys['ArrowUp']||Input.keys['KeyW'])this.jumpBuf=CFG.JBUF;else this.jumpBuf-=dt;
if(this.jumpBuf>0&&this.coyote>0){this.vy=CFG.JUMP;this.onGround=false;this.coyote=0;jumpBuf=0;sfxJump();this.state='jump';}
// Variable Jump Cutoff
if((!Input.keys['Space']&&!Input.keys['ArrowUp']&&!Input.keys['KeyW'])&&this.vy<0)this.vy*=0.5;
// Gravity
this.vy+=CFG.G*dt;
// Wall Slide
let hitWall=false;
for(const s of CFG.SHELVES){if(this.x+CFG.P_R>s.x&&this.x-CFG.P_R<s.x+s.w&&this.y+CFG.P_H/2>s.y&&this.y-CFG.P_H/2<s.y+s.h){
if(this.vx>0&&this.x+CFG.P_R>s.x&&this.x+CFG.P_R<s.x+10){this.x=s.x-CFG.P_R;this.vx=0;hitWall=true;this.wallDir=-1;}
if(this.vx<0&&this.x-CFG.P_R<s.x+s.w&&this.x-CFG.P_R>s.x+s.w-10){this.x=s.x+s.w+CFG.P_R;this.vx=0;hitWall=true;this.wallDir=1;}
}}
if(hitWall&&this.vy>0&&!this.onGround){this.vy=Math.min(this.vy,CFG.WALL_SLIDE);this.state='wall';}
else this.wallDir=0;
// Wall Jump
if(this.wallDir!==0&&this.jumpBuf>0){this.vx=this.wallDir*CFG.WALL_JUMP_X;this.vy=CFG.WALL_JUMP_Y;this.onGround=false;this.jumpBuf=0;this.wallDir=0;sfxJump();this.state='jump';}
// Swipe Logic
const aiming=Input.mouse.down;
if(aiming&&this.onGround&&this.state!=='swipe'&&this.state!=='recovery'){
this.swipeC=Math.min(CFG.SWIPE_MAX_C,this.swipeC+dt);
this.state='windup';
const dx=Input.mouse.wx-this.x;const dy=Input.mouse.wy-(this.y-10);
const dist=Math.hypot(dx,dy);
this.swipeAim.x=dx/dist;this.swipeAim.y=dy/dist;
}else if(!aiming&&this.swipeC>0){
this.executeSwipe();
}
// Physics Integration
this.x+=this.vx*dt;
this.y+=this.vy*dt;
// Ground Check
this.onGround=false;
for(const s of CFG.SHELVES){
if(this.vy>=0&&this.x+CFG.P_R>s.x&&this.x-CFG.P_R<s.x+s.w){
const footY=this.y+CFG.P_H/2;
if(footY>=s.y&&footY<=s.y+this.vy*dt+10){
this.y=s.y-CFG.P_H/2;this.vy=0;this.onGround=true;
if(this.state==='jump'||this.state==='fall'||this.state==='wall'){this.state='land';sfxLand();}
}
}
}
if(!this.onGround&&this.vy>0)this.state='fall';
if(this.onGround&&Math.abs(this.vx)<10)this.state='idle';
else if(this.onGround)this.state='run';
// Combo Decay
if(this.comboT>0){this.comboT-=dt;if(this.comboT<=0){this.combo=1;sfxCombo(0);}}
this.animT+=dt;
},
executeSwipe(){
const force=CFG.SWIPE_MIN_F+(CFG.SWIPE_MAX_F-CFG.SWIPE_MIN_F)*(this.swipeC/CFG.SWIPE_MAX_C);
const px=this.x+this.dir*CFG.P_R;
const py=this.y-10;
const vx=this.swipeAim.x*force;
const vy=this.swipeAim.y*force;
let hit=false;
for(const p of Entities){
if(p.type==='prop'&&!p.broken){
const dx=p.x-px,dy=p.y-py;const dist=Math.hypot(dx,dy);
if(dist<CFG.SWIPE_RANGE&&Math.random()<0.5){ // Simple hit check
p.vx+=vx/p.mass;p.vy+=vy/p.mass;
p.angVel+=(Math.random()-0.5)*10*(this.swipeC/CFG.SWIPE_MAX_C);
p.wake=true;
hit=true;
this.vx-=vx*CFG.RECOIL;this.vy-=vy*CFG.RECOIL;
}
}
}
sfxSwipe(this.swipeC/CFG.SWIPE_MAX_C);
this.swipeC=0;this.state='swipe';this.recoilT=CFG.RECOVERY;
if(!hit){screenShake(0.15);}
},
render(){
ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.dir,1);
// Body
ctx.fillStyle='#2D2D44';ctx.beginPath();ctx.roundRect(-14,-24,28,48,8);ctx.fill();
// Ears
ctx.fillStyle='#2D2D44';ctx.beginPath();ctx.moveTo(-12,-24);ctx.lineTo(-20,-40);ctx.lineTo(-4,-30);ctx.fill();
ctx.beginPath();ctx.moveTo(12,-24);ctx.lineTo(20,-40);ctx.lineTo(4,-30);ctx.fill();
// Tail
const tailWag=Math.sin(this.animT*15)*0.3*(Math.abs(this.vx)/CFG.RUN);
ctx.strokeStyle='#2D2D44';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(14,10);ctx.quadraticCurveTo(30+tailWag*20,15,35+tailWag*30,30);ctx.stroke();
// Eyes
const eyeX=this.dir===1?4:-4;ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(eyeX,-10,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(eyeX+Math.sin(this.animT*2)*1,-10,3,0,Math.PI*2);ctx.fill();
// Swipe Charge
if(this.state==='windup'){
const pct=this.swipeC/CFG.SWIPE_MAX_C;
ctx.strokeStyle=pct>0.7?'#FF6B35':'#00FFAA';ctx.lineWidth=3;ctx.setLineDash([6,4]);
ctx.beginPath();ctx.arc(0,0,40, -Math.PI/2, -Math.PI/2+Math.PI*2*pct);ctx.stroke();
ctx.setLineDash([]);
// Aim Line
ctx.strokeStyle='#00FFAA';ctx.lineWidth=2;ctx.setLineDash([8,4]);
ctx.beginPath();ctx.moveTo(this.dir*14,-10);ctx.lineTo(this.dir*14+this.swipeAim.x*CFG.SWIPE_RANGE,-10+this.swipeAim.y*CFG.SWIPE_RANGE);ctx.stroke();
ctx.setLineDash([]);
}
ctx.restore();
}
});

// --- PROPS ---
function spawnProps(){
for(const s of CFG.SHELVES){
const slots=Math.floor(s.w/200);
for(let i=0;i<slots;i++){
const t=CFG.PROP_TYPES[Math.floor(Math.random()*CFG.PROP_TYPES.length)];
const px=s.x+50+i*200+(Math.random()-0.5)*40;
const py=s.y-t.h/2;
addEnt({type:'prop',...t,x:px,y:py,vx:0,vy:0,ang:0,angVel:0,mass:t.m,rest:t.r,broken:false,wake:true,health:t.hp,teeter:0});
}
}
}

// --- PHYSICS SYSTEM ---
function physicsStep(dt){
const subDt=dt/CFG.SUB;
for(let s=0;s<CFG.SUB;s++){
for(const e of Entities){
if(e.type!=='prop'||e.broken||!e.wake)continue;
e.vy+=CFG.G*subDt;
e.x+=e.vx*subDt;
e.y+=e.vy*subDt;
e.ang+=e.angVel*subDt;
e.vx*=0.99;e.vy*=0.99;e.angVel*=0.98;
// Shelf Collision
for(const sh of CFG.SHELVES){
if(e.x+e.w/2>sh.x&&e.x-e.w/2<sh.x+sh.w&&e.y+e.h/2>sh.y&&e.y-e.h/2<sh.y+sh.h){
if(e.vy>0&&e.y+e.h/2-sh.y<20){e.y=sh.y-e.h/2;e.vy*=-e.rest;e.vx*=e.rest===0?0.5:0.9;e.angVel*=0.9;if(Math.abs(e.vy)<5)e.vy=0;}
if(e.vx>0&&e.x+e.w/2-sh.x<10){e.x=sh.x-e.w/2;e.vx*=-e.rest;}
if(e.vx<0&&e.x-e.w/2-sh.x-sh.w>-10){e.x=sh.x+sh.w+e.w/2;e.vx*=-e.rest;}
}
// Teeter check
if(e.y===sh.y-e.h/2){
const cx=e.x;if(cx<sh.x||cx>sh.x+sh.w){e.teeter+=(cx<sh.x?sh.x-cx:cx-sh.x-sh.w)*0.01;e.angVel+=e.teeter*0.5;}
else e.teeter=0;
}
}
// Floor
if(e.y+e.h/2>CFG.H-50){e.y=CFG.H-50-e.h/2;e.vy*=-e.rest*0.5;e.vx*=0.9;e.angVel*=0.9;if(Math.abs(e.vy)<5){e.vy=0;e.wake=false;}}
// Prop-Prop Collision (Simple AABB)
for(const o of Entities){
if(o===e||o.type!=='prop'||o.broken)continue;
const dx=o.x-e.x,dy=o.y-e.y;
const mw=(e.w+o.w)/2,mh=(e.h+o.h)/2;
if(Math.abs(dx)<mw&&Math.abs(dy)<mh){
const ox=mw-Math.abs(dx),oy=mh-Math.abs(dy);
if(ox<oy){e.x-=Math.sign(dx)*ox/2;o.x+=Math.sign(dx)*ox/2;const av=(e.vx-o.vx)*0.5;e.vx-=av;o.vx+=av;}else{e.y-=Math.sign(dy)*oy/2;o.y+=Math.sign(dy)*oy/2;const av=(e.vy-o.vy)*0.5;e.vy-=av;o.vy+=av;}
e.wake=o.wake=true;
}
}
// Sleep
if(Math.abs(e.vx)<0.5&&Math.abs(e.vy)<0.5&&Math.abs(e.angVel)<0.1)e.wake=false;
// Break Check (Impact)
if(e.vy!==0&&Math.abs(e.vy)>10&&e.y+e.h/2>=CFG.H-50){
const ke=0.5*e.mass*e.vy*e.vy;
if(ke>200||e.health<=1)breakProp(e);
else{e.health--;e.vy*=-0.3;sfxBreak(e);}
}
}
}
}
function breakProp(p){
if(p.broken)return;p.broken=true;
sfxBreak(p);
Player.propsBroken++;
Player.comboT=CFG.COMBO_WIN;
Player.combo=Math.min(CFG.MAX_COMBO,Player.combo+1);
sfxCombo(Player.combo);
const hBonus=1+(Math.max(0,CFG.H-p.y)/CFG.H)*0.5;
const pts=Math.floor(p.sc*Player.combo*hBonus);
Player.score+=pts;
spawnParticles(p.x,p.y,p.col,pts);
screenShake(0.3);
}

// --- PARTICLES ---
const Particles=[];
function spawnParticles(x,y,col,score){
for(let i=0;i<15;i++){
Particles.push({x,y,vx:(Math.random()-0.5)*200,vy:Math.random()*-200-50,life:1,col,size:Math.random()*4+2,score:score>0?score:0});
}
}
function updateParticles(dt){
for(let i=Particles.length-1;i>=0;i--){
const p=Particles[i];p.life-=dt;p.vy+=CFG.G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
if(p.life<=0)Particles.splice(i,1);
}
}
function renderParticles(){
for(const p of Particles){
ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
if(p.score&&p.life>0.5){ctx.fillStyle='#FFF';ctx.font='bold 16px Bangers';ctx.fillText('+'+p.score,p.x,p.y);}
}
ctx.globalAlpha=1;
}

// --- RENDER ---
let shakeX=0,shakeY=0,trauma=0;
function screenShake(t){trauma=Math.min(1,trauma+t);}
function updateShake(dt){trauma=Math.max(0,trauma-dt);const t=trauma*trauma;shakeX=(Math.random()-0.5)*t*20;shakeY=(Math.random()-0.5)*t*20;}

function render(){
ctx.save();ctx.translate(shakeX,shakeY);
ctx.clearRect(0,0,CFG.W,CFG.H);
// BG Gradient
const grad=ctx.createLinearGradient(0,0,0,CFG.H);grad.addColorStop(0,'#0F0F1A');grad.addColorStop(1,'#1A1A2E');ctx.fillStyle=grad;ctx.fillRect(0,0,CFG.W,CFG.H);
// Sunbeams
ctx.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const g=ctx.createRadialGradient(300+i*600,0,0,300+i*600,0,CFG.H);g.addColorStop(0,'rgba(255,255,200,0.03)');g.addColorStop(1,'rgba(255,255,200,0)');ctx.fillStyle=g;ctx.fillRect(0,0,CFG.W,CFG.H);}ctx.globalCompositeOperation='source-over';
// Floor
ctx.fillStyle='#16213E';ctx.fillRect(0,CFG.H-50);
// Shelves
ctx.fillStyle='#0D1B2A';
for(const s of CFG.SHELVES){
ctx.fillRect(s.x,s.y,s.w,s.h);
ctx.strokeStyle='#00FFAA';ctx.lineWidth=1;ctx.globalAlpha=0.3;
ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+s.w,s.y);ctx.stroke();
ctx.globalAlpha=1;
}
// Props
for(const e of Entities){
if(e.type==='prop'&&!e.broken){
ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.ang);
ctx.fillStyle=e.col;
if(e.id==='vase'){ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,8);ctx.fill();ctx.fillStyle='#D4A843';ctx.fillRect(-e.w/2+4,-e.h/2,e.w-8,8);}
else if(e.id==='mug'){ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,4);ctx.fill();ctx.strokeStyle='#8B2500';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.w/2,0,8,-Math.PI/2,Math.PI/2);ctx.stroke();}
else if(e.id==='book'){ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);ctx.fillStyle='#1A252F';ctx.fillRect(-e.w/2+2,-e.h/2+2,e.w-4,4);ctx.fillRect(-e.w/2+2,-e.h/2+10,e.w-4,4);}
else if(e.id==='plant'){ctx.fillStyle='#1B4D3E';ctx.fillRect(-6,-e.h/2,12,e.h);ctx.fillStyle=e.col;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(0,-e.h/2+i*12,18,8,0,0,Math.PI*2);ctx.fill();}}
else if(e.id==='phone'){ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,6);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-e.w/2+3,-e.h/2+5,e.w-6,e.h-10);}
else if(e.id==='toy'){ctx.beginPath();ctx.arc(0,0,e.w/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF6B6B';ctx.beginPath();ctx.arc(-4,-3,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-3,3,0,Math.PI*2);ctx.fill();}
else if(e.id==='candle'){ctx.fillStyle='#8B4513';ctx.fillRect(-3,-e.h/2,6,e.h);ctx.fillStyle='#FFF8DC';ctx.fillRect(-4,-e.h/2-8,8,8);ctx.fillStyle='#FFD700';ctx.beginPath();ctx.moveTo(0,-e.h/2-8);ctx.lineTo(-3,-e.h/2-18);ctx.lineTo(3,-e.h/2-18);ctx.fill();}
ctx.restore();
}
}
// Player
Player.render();
// Particles
renderParticles();
// UI Debug
ctx.restore();
}

// --- GAME LOOP ---
let lastTime=0,gameTime=180,running=false;
function gameLoop(time){
if(!running)return;
const dt=Math.min(0.05,(time-lastTime)/1000);
lastTime=time;
updateShake(dt);
Player.update(dt);
physicsStep(dt);
updateParticles(dt);
gameTime-=dt;
if(gameTime<=0){gameTime=0;endGame();}
render();
updateHUD();
requestAnimationFrame(gameLoop);
}
function updateHUD(){
document.getElementById('scoreDisplay').textContent=Player.score.toLocaleString('en-US',{minimumDigits:6});
const m=Math.floor(gameTime/60),s=(gameTime%60).toFixed(2).padStart(5,'0');
document.getElementById('timerDisplay').textContent=`${m}:${s}`;
document.getElementById('comboDisplay').textContent=`x${Player.combo}`;
const hs=parseInt(localStorage.getItem('gravityPawHS')||'0');
document.getElementById('highScoreDisplay').textContent=`BEST: ${hs.toLocaleString()}`;
}
function startGame(){
clearEnts();
Player.x=200;Player.y=800;Player.vx=0;Player.vy=0;Player.score=0;Player.combo=1;Player.comboT=0;Player.propsBroken=0;Player.state='idle';
spawnProps();
gameTime=180;running=true;
document.getElementById('msgOverlay').style.display='none';
lastTime=performance.now();
requestAnimationFrame(gameLoop);
}
function endGame(){
running=false;
const hs=parseInt(localStorage.getItem('gravityPawHS')||'0');
if(Player.score>hs){localStorage.setItem('gravityPawHS',Player.score);}
document.getElementById('finalScore').textContent=Player.score.toLocaleString();
document.getElementById('msgOverlay').style.display='flex';
document.getElementById('msgOverlay').querySelector('h1').textContent='TIME'S UP!';
document.getElementById('msgOverlay').querySelector('p').innerHTML=`You knocked <span class="stat">${Player.propsBroken}</span> items off!<br>Max Combo: <span class="stat">x${Player.combo}</span>`;
}

// --- INIT ---
document.getElementById('restartBtn').addEventListener('click',()=>{
const name=document.getElementById('nameInput').value.toUpperCase().slice(0,3)||'AAA';
startGame();
});

// Start on any interaction
function initStart(){
window.removeEventListener('pointerdown',initStart);
window.removeEventListener('keydown',initStart);
if(AC.state==='suspended')AC.resume();
startGame();
}
window.addEventListener('pointerdown',initStart);
window.addEventListener('keydown',initStart);

// Initial render
render();
updateHUD();
</script>
</body>
