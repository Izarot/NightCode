<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SNAIL SPRINT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐌</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; }
    #gameCanvas { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: #fff; font-size: 14px; }
    .hud-panel { position: absolute; background: rgba(26,26,46,0.85); border: 2px solid #e94560; border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(4px); }
    #topBar { top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; align-items: center; }
    #energyMeter { bottom: 10px; left: 10px; display: flex; align-items: center; gap: 8px; }
    #energyBar { width: 180px; height: 18px; background: linear-gradient(90deg, #00ff88, #ffd700, #e94560); border-radius: 9px; overflow: hidden; position: relative; box-shadow: 0 0 10px #00ff88; }
    #energyFill { height: 100%; background: rgba(255,255,255,0.3); transition: width 0.1s; }
    #minimap { bottom: 10px; right: 10px; width: 150px; height: 150px; background: #0f3460; border: 2px solid #4ecdc4; border-radius: 8px; overflow: hidden; }
    #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: bold; text-shadow: 0 0 20px #e94560, 0 0 40px #ffd700; opacity: 0; pointer-events: none; z-index: 10; }
    #speedrunTimer { top: 10px; right: 10px; font-family: monospace; font-size: 18px; color: #00ff88; text-shadow: 0 0 10px #00ff88; }
    #finishOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 20; }
    #finishOverlay h1 { font-size: 48px; color: #ffd700; text-shadow: 0 0 20px #e94560; }
    .podium { display: flex; gap: 20px; }
    .podium-place { text-align: center; }
    .podium-place .place { font-size: 24px; font-weight: bold; }
    .podium-place .snail { font-size: 48px; }
    .podium-place .time { font-size: 14px; color: #aaa; }
    #restartBtn { padding: 12px 32px; font-size: 18px; background: linear-gradient(90deg, #e94560, #ff6b6b); border: none; border-radius: 30px; color: #fff; cursor: pointer; box-shadow: 0 0 20px #e94560; transition: transform 0.1s; }
    #restartBtn:active { transform: scale(0.95); }
    @media (max-width: 600px) { #energyBar { width: 120px; } #minimap { width: 100px; height: 100px; } #topBar { font-size: 12px; gap: 10px; } }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="topBar" class="hud-panel">
      <span id="position">1st</span>
      <span id="lap">Lap 1/3</span>
      <span id="raceTime">00:00.00</span>
    </div>
    <div id="speedrunTimer" class="hud-panel">Best: <span id="bestTime">--:--.--</span></div>
    <div id="energyMeter" class="hud-panel">
      <span>🐌</span>
      <div id="energyBar"><div id="energyFill" style="width: 100%"></div></div>
    </div>
    <div id="minimap" class="hud-panel"><canvas id="minimapCanvas" width="150" height="150"></canvas></div>
    <div id="countdown"></div>
    <div id="finishOverlay">
      <h1>RACE COMPLETE</h1>
      <div class="podium" id="podium"></div>
      <button id="restartBtn">RACE AGAIN</button>
    </div>
  </div>
  <script>
    // ============ CONSTANTS & PALETTE ============
    const PALETTE = {
      bg: '#1a1a2e',
      track: '#16213e',
      grass: '#0f3460',
      dirt: '#8b6914',
      mud: '#5d4037',
      ice: '#80d8ff',
      mushroom: '#ff6b6b',
      rock: '#757575',
      flower: '#f06292',
      pebble: '#a1887f',
      slime: '#00ff88',
      slimeDark: '#00cc6a',
      playerShell: '#e94560',
      playerBody: '#4ecdc4',
      aiShells: ['#ffd700', '#ff6b6b', '#4ecdc4'],
      aiBodies: ['#fff3e0', '#ffccbc', '#b2dfdb'],
      boost: '#ffd700',
      particle: '#ffffff',
      text: '#ffffff',
      uiAccent: '#e94560',
      uiGold: '#ffd700'
    };
    const TRACK_WIDTH = 200;
    const TRACK_CENTER = { x: 0, y: 0 };
    const LAPS = 3;
    const CHECKPOINTS = 3;
    const MAX_ENERGY = 100;
    const BASE_SPEED = 40;
    const MIN_SPEED = 10;
    const ENERGY_DRAIN = 2;
    const ENERGY_REGEN = 1;
    const DASH_COST = 15;
    const DASH_COOLDOWN = 4000;
    const DASH_MULT = 3;
    const DASH_DURATION = 300;
    const SLIME_BOMB_COOLDOWN = 3000;
    const SLIME_TRAIL_LIFE = 3000;
    const SLIME_SLIP_DURATION = 800;
    const SLIME_SLIP_MULT = 0.6;
    const FRICTION = { dirt: 1.0, mud: 1.15, ice: 0.92 };
    const ACCEL_CURVE = 0.3;
    const MAX_TILT = 15 * Math.PI / 180;
    const CANVAS_W = 1200;
    const CANVAS_H = 800;
    
    // ============ UTILITIES ============
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
    const angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
    const deg = (rad) => rad * 180 / Math.PI;
    const rad = (deg) => deg * Math.PI / 180;
    
    // ============ WEB AUDIO ============
    const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (freq, dur, type='sine', vol=0.3, start=0) => {
      const o = AudioCtx.createOscillator();
      const g = AudioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g).connect(AudioCtx.destination);
      const t = AudioCtx.currentTime + start;
      o.start(t); o.stop(t + dur);
    };
    const sfx = {
      slurp: () => { playTone(200, 0.05, 'square', 0.1); playTone(150, 0.08, 'sawtooth', 0.05); },
      boost: () => { playTone(400, 0.1, 'square', 0.2); playTone(800, 0.15, 'sine', 0.15); },
      dash: () => { playTone(600, 0.05, 'square', 0.3); playTone(1200, 0.2, 'sine', 0.2); },
      slimeHit: () => { playTone(100, 0.2, 'sawtooth', 0.3); playTone(80, 0.3, 'triangle', 0.2); },
      flower: () => { playTone(800, 0.1, 'sine', 0.2); playTone(1000, 0.15, 'sine', 0.15); },
      rock: () => { playTone(150, 0.1, 'square', 0.4); },
      cheer: () => { [600,800,1000].forEach((f,i)=>playTone(f,0.1,'sine',0.15,i*0.05)); },
      victory: () => { [523,659,784,1047].forEach((f,i)=>playTone(f,0.2,'sine',0.2,i*0.15)); },
      countdown: (n) => playTone(n===1?800:600, 0.2, 'square', 0.3),
      go: () => { playTone(400,0.1,'sine',0.3); playTone(600,0.1,'sine',0.3,0.1); playTone(800,0.3,'sine',0.4,0.2); }
    };
    
    // ============ TRACK DEFINITION ============
    // Define track as a series of points forming a closed loop with terrain zones
    const trackPath = [];
    const numPoints = 60;
    for (let i = 0; i < numPoints; i++) {
      const a = (i / numPoints) * Math.PI * 2;
      const r = 250 + Math.sin(a * 3) * 40 + Math.cos(a * 5) * 20;
      trackPath.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    // Terrain zones: each segment between points has a terrain type
    const terrains = ['dirt', 'mud', 'ice', 'mushroom'];
    const trackTerrain = [];
    for (let i = 0; i < numPoints; i++) {
      // Assign terrain in sectors
      const sector = Math.floor(i / (numPoints / 8)) % 4;
      trackTerrain.push(terrains[sector]);
    }
    // Obstacles: randomly placed along track
    const obstacles = [];
    for (let i = 0; i < 30; i++) {
      const idx = Math.floor(Math.random() * numPoints);
      const t = Math.random();
      const p1 = trackPath[idx];
      const p2 = trackPath[(idx + 1) % numPoints];
      const ox = lerp(p1.x, p2.x, t) + (Math.random() - 0.5) * TRACK_WIDTH * 0.6;
      const oy = lerp(p1.y, p2.y, t) + (Math.random() - 0.5) * TRACK_WIDTH * 0.6;
      const types = ['rock', 'flower', 'pebble'];
      obstacles.push({ x: ox, y: oy, type: types[Math.floor(Math.random() * types.length)], radius: 15 + Math.random() * 10 });
    }
    // Checkpoints at 1/3 intervals
    const checkpoints = [];
    for (let i = 0; i < CHECKPOINTS; i++) {
      const idx = Math.floor(i * numPoints / CHECKPOINTS);
      checkpoints.push({ ...trackPath[idx], index: idx, passed: false });
    }
    
    // ============ PARTICLE SYSTEM ============
    class ParticleSystem {
      constructor() { this.particles = []; }
      add(x, y, type, count = 1) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 2;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.01 + Math.random() * 0.02,
            size: 2 + Math.random() * 4,
            color: type === 'slime' ? PALETTE.slime : type === 'boost' ? PALETTE.boost : PALETTE.particle,
            gravity: type === 'slime' ? 0.02 : 0
          });
        }
      }
      update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx; p.y += p.vy;
          p.vy += p.gravity;
          p.life -= p.decay;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
      }
      draw(ctx) {
        ctx.save();
        this.particles.forEach(p => {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    }
    
    // ============ SLIME TRAIL ============
    class SlimeTrail {
      constructor() { this.trails = []; }
      add(x, y, owner) { this.trails.push({ x, y, owner, life: SLIME_TRAIL_LIFE, size: 20 + Math.random() * 10 }); }
      update(dt) {
        for (let i = this.trails.length - 1; i >= 0; i--) {
          this.trails[i].life -= dt;
          if (this.trails[i].life <= 0) this.trails.splice(i, 1);
        }
      }
      checkSlip(snail) {
        for (const trail of this.trails) {
          if (trail.owner !== snail && dist(snail.x, snail.y, trail.x, trail.y) < trail.size + snail.radius) {
            return true;
          }
        }
        return false;
      }
      draw(ctx) {
        ctx.save();
        this.trails.forEach(t => {
          const alpha = t.life / SLIME_TRAIL_LIFE * 0.5;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = PALETTE.slime;
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.size * (t.life / SLIME_TRAIL_LIFE), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    }
    
    // ============ SNAIL BASE CLASS ============
    class Snail {
      constructor(x, y, colorBody, colorShell, isPlayer = false) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.angle = 0;
        this.targetAngle = 0;
        this.speed = 0;
        this.maxSpeed = BASE_SPEED;
        this.radius = 24;
        this.colorBody = colorBody;
        this.colorShell = colorShell;
        this.isPlayer = isPlayer;
        this.energy = MAX_ENERGY;
        this.boosting = false;
        this.boostTime = 0;
        this.dashCooldown = 0;
        this.slimeBombCooldown = 0;
        this.slipTime = 0;
        this.tilt = 0;
        this.lap = 0;
        this.checkpoint = 0;
        this.progress = 0; // 0-1 along track
        this.raceTime = 0;
        this.finished = false;
        this.place = 0;
        this.name = '';
      }
      update(dt, input, track, slimeTrail, particles) {}
      applyPhysics(dt, terrain, slimeTrail) {
        // Friction
        let friction = FRICTION[terrain] || 1.0;
        if (this.slipTime > 0) { friction *= 1 / SLIME_SLIP_MULT; this.slipTime -= dt; }
        this.speed *= friction;
        // Clamp speed
        const energyRatio = this.energy / MAX_ENERGY;
        this.maxSpeed = lerp(MIN_SPEED, BASE_SPEED, energyRatio);
        if (this.boosting) this.maxSpeed *= DASH_MULT;
        this.speed = clamp(this.speed, 0, this.maxSpeed);
        // Move
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        // Tilt visual
        const turnDiff = this.targetAngle - this.angle;
        const normalized = ((turnDiff + Math.PI) % (Math.PI * 2)) - Math.PI;
        this.tilt = lerp(this.tilt, clamp(normalized * 0.5, -MAX_TILT, MAX_TILT), 0.1);
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle + this.tilt);
        // Body
        ctx.fillStyle = this.colorBody;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius, this.radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        // Shell
        ctx.fillStyle = this.colorShell;
        ctx.beginPath();
        ctx.ellipse(-this.radius * 0.2, -this.radius * 0.1, this.radius * 0.8, this.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Shell pattern
        ctx.strokeStyle = '#fff3';
        ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.arc(-this.radius * 0.2, -this.radius * 0.1, this.radius * 0.3 * (i + 2) / 3, 0, Math.PI * 2);
          ctx.stroke();
        }
        // Eyes
        ctx.fillStyle = '#1a1a2e';
        const eyeOffset = this.radius * 0.5;
        ctx.beginPath(); ctx.arc(eyeOffset, -this.radius * 0.3, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(eyeOffset, this.radius * 0.3, 4, 0, Math.PI * 2); ctx.fill();
        // Antennae
        ctx.strokeStyle = this.colorBody;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(this.radius * 0.7, -this.radius * 0.4); ctx.lineTo(this.radius * 1.2, -this.radius * 0.8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(this.radius * 0.7, this.radius * 0.4); ctx.lineTo(this.radius * 1.2, this.radius * 0.8); ctx.stroke();
        // Boost effect
        if (this.boosting) {
          ctx.fillStyle = PALETTE.boost;
          ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;
          ctx.beginPath();
          ctx.ellipse(-this.radius * 1.2, 0, this.radius * 0.8, this.radius * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      drawMinimap(ctx, scale, offsetX, offsetY) {
        ctx.fillStyle = this.colorShell;
        ctx.beginPath();
        ctx.arc(this.x * scale + offsetX, this.y * scale + offsetY, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // ============ PLAYER ============
    class Player extends Snail {
      constructor(x, y) {
        super(x, y, PALETTE.playerBody, PALETTE.playerShell, true);
        this.name = 'YOU';
        this.input = { accelerate: false, dash: false, slimeBomb: false, steer: 0 };
      }
      update(dt, input, track, slimeTrail, particles) {
        this.input = input;
        // Steering
        this.targetAngle += input.steer * dt * 0.003;
        // Acceleration
        if (input.accelerate && this.energy > 0) {
          this.speed += (this.maxSpeed - this.speed) * ACCEL_CURVE;
          this.energy = clamp(this.energy - ENERGY_DRAIN * dt / 16, 0, MAX_ENERGY);
          if (Math.random() < 0.3) sfx.slurp();
          // Leave slime trail
          if (Math.random() < 0.2) slimeTrail.add(this.x, this.y, this);
          particles.add(this.x - Math.cos(this.angle) * this.radius, this.y - Math.sin(this.angle) * this.radius, 'slime', 1);
        } else {
          this.energy = clamp(this.energy + ENERGY_REGEN * dt / 16, 0, MAX_ENERGY);
        }
        // Dash
        if (input.dash && this.dashCooldown <= 0 && this.energy >= DASH_COST) {
          this.boosting = true;
          this.boostTime = DASH_DURATION;
          this.energy -= DASH_COST;
          this.dashCooldown = DASH_COOLDOWN;
          sfx.dash();
          particles.add(this.x, this.y, 'boost', 10);
        }
        if (this.boosting) {
          this.boostTime -= dt;
          if (this.boostTime <= 0) this.boosting = false;
        }
        if (this.dashCooldown > 0) this.dashCooldown -= dt;
        // Slime bomb
        if (input.slimeBomb && this.slimeBombCooldown <= 0) {
          // Drop large slime puddle behind
          for (let i = 0; i < 5; i++) {
            const a = this.angle + Math.PI + (Math.random() - 0.5) * 0.5;
            const d = this.radius + Math.random() * 30;
            slimeTrail.add(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d, this);
          }
          this.slimeBombCooldown = SLIME_BOMB_COOLDOWN;
          sfx.slimeHit();
          particles.add(this.x, this.y, 'slime', 15);
        }
        if (this.slimeBombCooldown > 0) this.slimeBombCooldown -= dt;
        // Physics
        const terrain = track.getTerrainAt(this.x, this.y);
        this.applyPhysics(dt, terrain, slimeTrail);
        // Check slime slip
        if (slimeTrail.checkSlip(this)) {
          this.slipTime = SLIME_SLIP_DURATION;
          sfx.slimeHit();
        }
        // Track bounds
        track.constrain(this);
        // Checkpoints & laps
        track.updateProgress(this);
        // Race time
        if (!this.finished) this.raceTime += dt;
      }
    }
    
    // ============ AI SNAILS ============
    class AISnail extends Snail {
      constructor(x, y, type, colorBody, colorShell) {
        super(x, y, colorBody, colorShell, false);
        this.type = type; // 'speedy', 'tank', 'tricky'
        this.name = type.toUpperCase();
        this.behaviorTimer = 0;
        this.targetPoint = 0;
        this.aggression = 0.5;
        this.setStats();
      }
      setStats() {
        switch (this.type) {
          case 'speedy': this.maxSpeed = BASE_SPEED * 1.2; this.energy = MAX_ENERGY * 0.7; this.aggression = 0.8; break;
          case 'tank': this.maxSpeed = BASE_SPEED * 0.8; this.energy = MAX_ENERGY * 1.5; this.aggression = 0.3; break;
          case 'tricky': this.maxSpeed = BASE_SPEED; this.energy = MAX_ENERGY; this.aggression = 0.6; break;
        }
      }
      update(dt, track, slimeTrail, particles, player) {
        // Simple path following with noise
        const nextIdx = (Math.floor(this.progress * trackPath.length) + 5) % trackPath.length;
        const target = trackPath[nextIdx];
        const desiredAngle = angle(this.x, this.y, target.x, target.y);
        let diff = desiredAngle - this.angle;
        diff = ((diff + Math.PI) % (Math.PI * 2)) - Math.PI;
        this.targetAngle += diff * 0.02 * (1 + this.aggression);
        // Energy management
        if (this.energy > 20 && Math.random() < 0.02 * this.aggression) {
          this.speed += (this.maxSpeed - this.speed) * ACCEL_CURVE;
          this.energy -= ENERGY_DRAIN * dt / 16;
        } else {
          this.energy = clamp(this.energy + ENERGY_REGEN * dt / 16, 0, MAX_ENERGY);
        }
        // Dash usage
        if (this.dashCooldown <= 0 && this.energy >= DASH_COST && Math.random() < 0.001 * this.aggression) {
          this.boosting = true; this.boostTime = DASH_DURATION;
          this.energy -= DASH_COST;
          this.dashCooldown = DASH_COOLDOWN;
          particles.add(this.x, this.y, 'boost', 5);
        }
        if (this.boosting) {
          this.boostTime -= dt;
          if (this.boostTime <= 0) this.boosting = false;
        }
        if (this.dashCooldown > 0) this.dashCooldown -= dt;
        // Slime bomb usage
        if (this.slimeBombCooldown <= 0 && Math.random() < 0.0005 * this.aggression) {
          for (let i = 0; i < 3; i++) {
            const a = this.angle + Math.PI + (Math.random() - 0.5) * 0.5;
            const d = this.radius + Math.random() * 20;
            slimeTrail.add(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d, this);
          }
          this.slimeBombCooldown = SLIME_BOMB_COOLDOWN;
          particles.add(this.x, this.y, 'slime', 8);
        }
        if (this.slimeBombCooldown > 0) this.slimeBombCooldown -= dt;
        // Physics
        const terrain = track.getTerrainAt(this.x, this.y);
        this.applyPhysics(dt, terrain, slimeTrail);
        // Check slime slip
        if (slimeTrail.checkSlip(this)) {
          this.slipTime = SLIME_SLIP_DURATION;
        }
        // Track bounds
        track.constrain(this);
        // Checkpoints & laps
        track.updateProgress(this);
        // Race time
        if (!this.finished) this.raceTime += dt;
      }
    }
    
    // ============ TRACK CLASS ============
    class Track {
      constructor() {
        this.path = trackPath;
        this.terrain = trackTerrain;
        this.obstacles = obstacles;
        this.checkpoints = checkpoints.map(c => ({ ...c, passed: false }));
      }
      getTerrainAt(x, y) {
        // Find closest path point
        let minDist = Infinity, idx = 0;
        for (let i = 0; i < this.path.length; i++) {
          const d = dist(x, y, this.path[i].x, this.path[i].y);
          if (d < minDist) { minDist = d; idx = i; }
        }
        return this.terrain[idx] || 'dirt';
      }
      constrain(snail) {
        // Find closest point on track centerline
        let minDist = Infinity, closestIdx = 0;
        for (let i = 0; i < this.path.length; i++) {
          const d = dist(snail.x, snail.y, this.path[i].x, this.path[i].y);
          if (d < minDist) { minDist = d; closestIdx = i; }
        }
        const center = this.path[closestIdx];
        const d = dist(snail.x, snail.y, center.x, center.y);
        const maxDist = TRACK_WIDTH * 0.5 - snail.radius;
        if (d > maxDist) {
          const a = angle(center.x, center.y, snail.x, snail.y);
          snail.x = center.x + Math.cos(a) * maxDist;
          snail.y = center.y + Math.sin(a) * maxDist;
          snail.speed *= 0.5;
        }
      }
      updateProgress(snail) {
        // Find progress along track (0-1)
        let minDist = Infinity, closestIdx = 0;
        for (let i = 0; i < this.path.length; i++) {
          const d = dist(snail.x, snail.y, this.path[i].x, this.path[i].y);
          if (d < minDist) { minDist = d; closestIdx = i; }
        }
        snail.progress = closestIdx / this.path.length;
        // Check checkpoints
        for (const cp of this.checkpoints) {
          if (!cp.passed && dist(snail.x, snail.y, cp.x, cp.y) < 50) {
            cp.passed = true;
            snail.checkpoint = (snail.checkpoint + 1) % CHECKPOINTS;
            if (snail.checkpoint === 0) {
              snail.lap++;
              if (snail.lap >= LAPS && !snail.finished) {
                snail.finished = true;
                sfx.cheer();
              }
            }
          }
        }
        // Reset checkpoint passed for next lap
        if (snail.checkpoint === 0 && snail.lap > 0) {
          this.checkpoints.forEach(cp => cp.passed = false);
        }
      }
      draw(ctx) {
        // Draw track surface
        ctx.save();
        // Grass background
        ctx.fillStyle = PALETTE.grass;
        ctx.fillRect(-2000, -2000, 4000, 4000);
        // Track segments
        for (let i = 0; i < this.path.length; i++) {
          const p1 = this.path[i];
          const p2 = this.path[(i + 1) % this.path.length];
          const terrain = this.terrain[i];
          let color = PALETTE.dirt;
          switch (terrain) {
            case 'mud': color = PALETTE.mud; break;
            case 'ice': color = PALETTE.ice; break;
            case 'mushroom': color = PALETTE.mushroom; break;
          }
          ctx.fillStyle = color;
          ctx.strokeStyle = color;
          ctx.lineWidth = TRACK_WIDTH;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
        // Track edges
        ctx.strokeStyle = '#0a0a1a';
        ctx.lineWidth = TRACK_WIDTH + 10;
        ctx.beginPath();
        for (let i = 0; i <= this.path.length; i++) {
          const p = this.path[i % this.path.length];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.strokeStyle = '#2a2a4a';
        ctx.lineWidth = TRACK_WIDTH - 10;
        ctx.beginPath();
        for (let i = 0; i <= this.path.length; i++) {
          const p = this.path[i % this.path.length];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        // Checkpoints
        this.checkpoints.forEach((cp, i) => {
          ctx.fillStyle = cp.passed ? '#00ff88' : '#ffd700';
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.arc(cp.x, cp.y, 30, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 16px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(i + 1, cp.x, cp.y);
        });
        // Obstacles
        this.obstacles.forEach(obs => {
          ctx.save();
          ctx.translate(obs.x, obs.y);
          switch (obs.type) {
            case 'rock':
              ctx.fillStyle = PALETTE.rock;
              ctx.beginPath();
              for (let j = 0; j < 6; j++) {
                const a = (j / 6) * Math.PI * 2;
                const r = obs.radius * (0.8 + Math.random() * 0.2);
                if (j === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
              }
              ctx.closePath();
              ctx.fill();
              break;
            case 'flower':
              ctx.fillStyle = PALETTE.flower;
              for (let j = 0; j < 5; j++) {
                const a = (j / 5) * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * obs.radius * 0.4, Math.sin(a) * obs.radius * 0.4, obs.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.fillStyle = '#ffd700';
              ctx.beginPath();
              ctx.arc(0, 0, obs.radius * 0.2, 0, Math.PI * 2);
              ctx.fill();
              break;
            case 'pebble':
              ctx.fillStyle = PALETTE.pebble;
              ctx.beginPath();
              ctx.arc(0, 0, obs.radius * 0.5, 0, Math.PI * 2);
              ctx.fill();
              break;
          }
          ctx.restore();
        });
        ctx.restore();
      }
      drawMinimap(ctx, scale) {
        // Background
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(0, 0, 150, 150);
        // Track
        ctx.strokeStyle = '#16213e';
        ctx.lineWidth = TRACK_WIDTH * scale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i <= this.path.length; i++) {
          const p = this.path[i % this.path.length];
          const x = p.x * scale + 75;
          const y = p.y * scale + 75;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        // Checkpoints
        this.checkpoints.forEach(cp => {
          ctx.fillStyle = cp.passed ? '#00ff88' : '#ffd700';
          ctx.beginPath();
          ctx.arc(cp.x * scale + 75, cp.y * scale + 75, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }
    
    // ============ GAME CLASS ============
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.minimapCanvas = document.getElementById('minimapCanvas');
        this.minimapCtx = this.minimapCanvas.getContext('2d');
        this.track = new Track();
        this.particles = new ParticleSystem();
        this.slimeTrail = new SlimeTrail();
        this.snails = [];
        this.player = null;
        this.camera = { x: 0, y: 0 };
        this.scale = 1;
        this.running = false;
        this.countdown = 3;
        this.countdownTime = 0;
        this.input = { accelerate: false, dash: false, slimeBomb: false, steer: 0 };
        this.keys = {};
        this.touch = { active: false, startX: 0, startY: 0 };
        this.bestTime = localStorage.getItem('snailSprintBest') || null;
        this.finishedSnails = [];
        this.init();
      }
      init() {
        // Resize canvas
        const resize = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const aspect = CANVAS_W / CANVAS_H;
          if (w / h > aspect) {
            this.canvas.width = h * aspect;
            this.canvas.height = h;
          } else {
            this.canvas.width = w;
            this.canvas.height = w / aspect;
          }
          this.scale = this.canvas.width / CANVAS_W;
        };
        window.addEventListener('resize', resize);
        resize();
        // Input
        window.addEventListener('keydown', e => {
          this.keys[e.code] = true;
          if (e.code === 'Space') e.preventDefault();
        });
        window.addEventListener('keyup', e => this.keys[e.code] = false);
        // Touch
        this.canvas.addEventListener('touchstart', e => {
          e.preventDefault();
          const t = e.touches[0];
          this.touch.active = true;
          this.touch.startX = t.clientX;
          this.touch.startY = t.clientY;
        }, { passive: false });
        this.canvas.addEventListener('touchmove', e => {
          e.preventDefault();
          if (!this.touch.active) return;
          const t = e.touches[0];
          const dx = t.clientX - this.touch.startX;
          const dy = t.clientY - this.touch.startY;
          this.input.steer = clamp(dx * 0.01, -1, 1);
          this.input.accelerate = dy < -20;
        }, { passive: false });
        this.canvas.addEventListener('touchend', e => {
          this.touch.active = false;
          this.input.steer = 0;
          this.input.accelerate = false;
        });
        // Buttons
        document.getElementById('restartBtn').addEventListener('click', () => this.restart());
        // Start
        this.startRace();
        requestAnimationFrame(this.loop.bind(this));
      }
      startRace() {
        this.snails = [];
        this.finishedSnails = [];
        const startPos = this.track.path[0];
        this.player = new Player(startPos.x, startPos.y);
        this.snails.push(this.player);
        // AI snails
        const aiTypes = ['speedy', 'tank', 'tricky'];
        aiTypes.forEach((type, i) => {
          const angle = (i + 1) * Math.PI * 2 / 4;
          const x = startPos.x + Math.cos(angle) * 40;
          const y = startPos.y + Math.sin(angle) * 40;
          const colors = [
            { body: PALETTE.aiBodies[0], shell: PALETTE.aiShells[0] },
            { body: PALETTE.aiBodies[1], shell: PALETTE.aiShells[1] },
            { body: PALETTE.aiBodies[2], shell: PALETTE.aiShells[2] }
          ];
          const ai = new AISnail(x, y, type, colors[i].body, colors[i].shell);
          this.snails.push(ai);
        });
        this.running = true;
        this.countdown = 3;
        this.countdownTime = 3000;
        this.particles = new ParticleSystem();
        this.slimeTrail = new SlimeTrail();
        this.track.checkpoints.forEach(cp => cp.passed = false);
        this.updateBestTimeDisplay();
      }
      restart() {
        document.getElementById('finishOverlay').style.display = 'none';
        this.startRace();
      }
      updateBestTimeDisplay() {
        document.getElementById('bestTime').textContent = this.bestTime ? this.formatTime(this.bestTime) : '--:--.--';
      }
      formatTime(ms) {
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        const cs = Math.floor((ms % 1000) / 10);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
      }
      updateCountdown(dt) {
        const el = document.getElementById('countdown');
        this.countdownTime -= dt;
        if (this.countdownTime <= 0) {
          this.countdown--;
          this.countdownTime = 1000;
          if (this.countdown > 0) {
            el.textContent = this.countdown;
            el.style.opacity = 1;
            sfx.countdown(this.countdown);
          } else {
            el.textContent = 'GO!';
            sfx.go();
            setTimeout(() => { el.style.opacity = 0; }, 500);
          }
        }
      }
      processInput() {
        if (this.countdown > 0) return;
        this.input.accelerate = this.keys['ArrowUp'] || this.keys['KeyW'] || this.keys['Space'];
        this.input.dash = this.keys['ShiftLeft'] || this.keys['ShiftRight'];
        this.input.slimeBomb = this.keys['KeyE'] || this.keys['KeyQ'];
        this.input.steer = 0;
        if (this.keys['ArrowLeft'] || this.keys['KeyA']) this.input.steer -= 1;
        if (this.keys['ArrowRight'] || this.keys['KeyD']) this.input.steer += 1;
      }
      update(dt) {
        if (this.countdown > 0) {
          this.updateCountdown(dt);
          return;
        }
        this.processInput();
        // Update snails
        this.snails.forEach(snail => {
          if (snail.isPlayer) {
            snail.update(dt, this.input, this.track, this.slimeTrail, this.particles);
          } else {
            snail.update(dt, this.track, this.slimeTrail, this.particles, this.player);
          }
        });
        this.slimeTrail.update(dt);
        this.particles.update();
        // Camera follow player
        this.camera.x = lerp(this.camera.x, this.player.x, 0.1);
        this.camera.y = lerp(this.camera.y, this.player.y, 0.1);
        // Check finish
        const finished = this.snails.filter(s => s.finished);
        if (finished.length > 0) {
          finished.forEach(s => {
            if (!this.finishedSnails.includes(s)) {
              this.finishedSnails.push(s);
              s.place = this.finishedSnails.length;
              if (s.isPlayer) {
                if (!this.bestTime || s.raceTime < this.bestTime) {
                  this.bestTime = s.raceTime;
                  localStorage.setItem('snailSprintBest', this.bestTime);
                  this.updateBestTimeDisplay();
                }
                sfx.victory();
                setTimeout(() => this.showFinish(), 1000);
              }
            }
          });
        }
        // Update HUD
        this.updateHUD();
      }
      updateHUD() {
        // Position
        const sorted = [...this.snails].sort((a, b) => {
          if (a.lap !== b.lap) return b.lap - a.lap;
          if (a.checkpoint !== b.checkpoint) return b.checkpoint - a.checkpoint;
          return b.progress - a.progress;
        });
        const playerPos = sorted.findIndex(s => s.isPlayer) + 1;
        const suffixes = ['th', 'st', 'nd', 'rd'];
        const suffix = playerPos <= 3 ? suffixes[playerPos] : 'th';
        document.getElementById('position').textContent = `${playerPos}${suffix}`;
        // Lap
        document.getElementById('lap').textContent = `Lap ${clamp(this.player.lap + 1, 1, LAPS)}/${LAPS}`;
        // Race time
        document.getElementById('raceTime').textContent = this.formatTime(this.player.raceTime);
        // Energy
        document.getElementById('energyFill').style.width = `${(this.player.energy / MAX_ENERGY) * 100}%`;
        // Dash cooldown visual
        if (this.player.dashCooldown > 0) {
          document.getElementById('energyBar').style.boxShadow = '0 0 10px #ff6b6b';
        } else {
          document.getElementById('energyBar').style.boxShadow = '0 0 10px #00ff88';
        }
      }
      showFinish() {
        const overlay = document.getElementById('finishOverlay');
        const podium = document.getElementById('podium');
        podium.innerHTML = '';
        // Sort by finish order
        const finished = [...this.finishedSnails].sort((a, b) => a.place - b.place);
        // Add unfinished snails by progress
        const unfinished = this.snails.filter(s => !s.finished).sort((a, b) => {
          if (a.lap !== b.lap) return b.lap - a.lap;
          if (a.checkpoint !== b.checkpoint) return b.checkpoint - a.checkpoint;
          return b.progress - a.progress;
        });
        const all = [...finished, ...unfinished];
        all.forEach((snail, i) => {
          const place = i + 1;
          const div = document.createElement('div');
          div.className = 'podium-place';
          div.innerHTML = `
            <div class="place">${place}${place<=3?['st','nd','rd'][place-1]:'th'}</div>
            <div class="snail">${snail.isPlayer ? '🐌' : '🐌'}</div>
            <div class="time">${snail.finished ? this.formatTime(snail.raceTime) : 'DNF'}</div>
          `;
          if (snail.isPlayer) div.style.transform = 'scale(1.1)'; div.style.zIndex = 10;
          podium.appendChild(div);
        });
        overlay.style.display = 'flex';
      }
      draw() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.scale, this.scale);
        ctx.translate(CANVAS_W / 2 - this.camera.x, CANVAS_H / 2 - this.camera.y);
        // Draw track
        this.track.draw(ctx);
        // Draw slime trails
        this.slimeTrail.draw(ctx);
        // Draw particles
        this.particles.draw(ctx);
        // Draw snails (player last)
        this.snails.filter(s => !s.isPlayer).forEach(s => s.draw(ctx));
        this.player.draw(ctx);
        ctx.restore();
        // Minimap
        this.track.drawMinimap(this.minimapCtx, 150 / (500 * 2));
        this.snails.forEach(s => s.drawMinimap(this.minimapCtx, 150 / (500 * 2), 75, 75));
      }
      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = timestamp - this.lastTime;
        this.lastTime = timestamp;
        this.update(dt);
        this.draw();
        requestAnimationFrame(this.loop.bind(this));
      }
    }
    
    // ============ START GAME ============
    let game;
    window.addEventListener('load', () => {
      game = new Game();
    });
  </script>
