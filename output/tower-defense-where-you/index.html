<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SANDFALL - Tower Defense</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏜️</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0D0D12;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  color: #E8E4D9;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas { display: block; cursor: crosshair; }
#ui {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
.panel {
  background: rgba(13,13,18,0.85);
  border: 1px solid #B8860B;
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
}
#integrity-panel {
  position: absolute;
  top: 20px; left: 20px;
  width: 70px;
}
#integrity-bar-bg {
  width: 100%; height: 180px;
  background: #2a1a0a;
  border: 1px solid #B8860B;
  position: relative;
  margin-top: 8px;
}
#integrity-bar {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  background: linear-gradient(to top, #00CED1, #D4A574, #8B0000);
  transition: height 0.3s;
}
#wave-panel {
  position: absolute;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
}
#wave-num { font-size: 18px; color: #D4A574; font-weight: bold; }
#wave-bar-bg {
  width: 200px; height: 6px;
  background: #2a1a0a;
  margin-top: 6px;
}
#wave-bar {
  height: 100%;
  background: #B8860B;
  width: 0%;
  transition: width 0.2s;
}
#sp-panel {
  position: absolute;
  top: 20px; right: 20px;
  text-align: right;
}
#sp-amount { font-size: 22px; color: #D4A574; font-weight: bold; }
#sp-rate { font-size: 10px; color: #8A7A5A; margin-top: 2px; }
#build-bar {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  pointer-events: auto;
}
.build-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid #B8860B;
  background: rgba(13,13,18,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-direction: column;
  font-size: 9px;
  transition: all 0.15s;
}
.build-btn.active {
  border-color: #D4A574;
  background: rgba(212,165,116,0.25);
  box-shadow: 0 0 12px #D4A574;
}
.build-btn .ic { font-size: 18px; }
#minimap {
  position: absolute;
  bottom: 20px; left: 20px;
  width: 180px; height: 130px;
  border: 1px solid #B8860B;
  background: rgba(13,13,18,0.85);
}
#intel {
  position: absolute;
  bottom: 20px; right: 20px;
  width: 180px;
  font-size: 11px;
}
#intel h3 { color: #D4A574; margin-bottom: 6px; font-size: 12px; }
.intel-row { display: flex; justify-content: space-between; margin: 3px 0; }
#timer {
  position: absolute;
  top: 70px; left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: #B8860B;
  letter-spacing: 2px;
}
#speed-timer {
  position: absolute;
  top: 20px; right: 100px;
  font-size: 12px;
  color: #00CED1;
}
#highscore {
  position: absolute;
  top: 50px; left: 20px;
  font-size: 10px;
  color: #8A7A5A;
}
#menu {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(13,13,18,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: auto;
  z-index: 20;
}
#menu h1 {
  font-size: 64px;
  color: #D4A574;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #B8860B;
  margin-bottom: 10px;
}
#menu .sub { color: #8A7A5A; margin-bottom: 40px; font-size: 14px; letter-spacing: 4px; }
#start-btn {
  padding: 14px 40px;
  font-size: 16px;
  background: transparent;
  color: #D4A574;
  border: 2px solid #B8860B;
  cursor: pointer;
  letter-spacing: 4px;
  font-family: inherit;
  transition: all 0.2s;
}
#start-btn:hover { background: rgba(212,165,116,0.2); box-shadow: 0 0 20px #B8860B; }
#menu .hs { margin-top: 30px; color: #B8860B; font-size: 12px; }
#wave-end {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 30px 50px;
  text-align: center;
  pointer-events: auto;
  display: none;
}
#wave-end h2 { color: #D4A574; margin-bottom: 14px; font-size: 24px; }
#wave-end button {
  margin-top: 18px;
  padding: 10px 30px;
  background: transparent;
  color: #D4A574;
  border: 2px solid #B8860B;
  cursor: pointer;
  letter-spacing: 3px;
  font-family: inherit;
  font-size: 13px;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="integrity-panel" class="panel">
    <div>INTEGRITY</div>
    <div id="integrity-bar-bg"><div id="integrity-bar" style="height:100%"></div></div>
  </div>
  <div id="highscore">HIGH: <span id="hs-val">0</span></div>
  <div id="wave-panel" class="panel">
    <div id="wave-num">WAVE 0</div>
    <div id="wave-bar-bg"><div id="wave-bar"></div></div>
  </div>
  <div id="timer">00:00.0</div>
  <div id="speed-timer">SPEED: <span id="speed-val">0</span></div>
  <div id="sp-panel" class="panel">
    <div id="sp-amount">100</div>
    <div id="sp-rate">+5/s</div>
  </div>
  <div id="build-bar">
    <div class="build-btn active" data-type="0"><div class="ic">▬</div><div>STD</div></div>
    <div class="build-btn" data-type="1"><div class="ic">▰</div><div>RFG</div></div>
    <div class="build-btn" data-type="2"><div class="ic">▭</div><div>QCK</div></div>
    <div class="build-btn" id="blast-btn"><div class="ic">⚡</div><div>BLAST</div></div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="intel" class="panel">
    <h3>WAVE INTEL</h3>
    <div id="intel-list"></div>
  </div>
  <div id="menu">
    <h1>SANDFALL</h1>
    <div class="sub">TOWER DEFENSE</div>
    <button id="start-btn">START</button>
    <div class="hs">HIGH SCORE: <span id="menu-hs">0</span> waves</div>
  </div>
  <div id="wave-end" class="panel">
    <h2 id="we-title">WAVE CLEAR</h2>
    <div id="we-stats"></div>
    <button id="next-btn">NEXT WAVE</button>
  </div>
</div>
<script type="module">
import { Game } from './game.js';
import { UI } from './ui.js';

const canvas = document.getElementById('gameCanvas');
const uiContainer = document.getElementById('ui');
const hud = document.getElementById('integrity-bar');
const timerEl = document.getElementById('timer');

const game = new Game(canvas);
const ui = new UI(uiContainer, hud, timerEl);

game.start(ui);
</script>
</body>
</html>
