<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas Tower Defense</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏰</text></svg>">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;}
canvas{display:block;width:100%;height:100%;background:#222;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#hud{position:absolute;top:10px;right:10px;color:#fff;font-family:sans-serif;font-size:18px;pointer-events:none;}
#timer{position:absolute;top:10px;left:10px;color:#fff;font-family:sans-serif;font-size:18px;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui"></div>
<div id="hud"></div>
<div id="timer"></div>
<script type="module" src="main.js"></script>
</body>
</html>
