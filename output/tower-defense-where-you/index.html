<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏜️ SANDFALL</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏜️</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0D0D12;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  color: #E8E4D9;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
canvas { display: block; cursor: crosshair; }
#ui {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
.panel {
  background: rgba(13,13,18,0.85);
  border: 1px solid #B8860B;
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
}
#integrity-panel {
  position: absolute;
  top: 20px; left: 20px;
  width: 70px;
}
#integrity-bar-bg {
  width: 100%; height: 180px;
  background: #2a1a0a;
  border: 1px solid #B8860B;
  position: relative;
  margin-top: 8px;
}
#integrity-bar {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  background: linear-gradient(to top, #00CED1, #D4A574, #8B0000);
  transition: height 0.3s;
}
#wave-panel {
  position: absolute;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
}
#wave-num { font-size: 18px; color: #D4A574; font-weight: bold; }
#wave-bar-bg {
  width: 200px; height: 6px;
  background: #2a1a0a;
  margin-top: 6px;
}
#wave-bar {
  height: 100%;
  background: #B8860B;
  width: 0%;
  transition: width 0.2s;
}
#sp-panel {
  position: absolute;
  top: 20px; right: 20px;
  text-align: right;
}
#sp-amount { font-size: 22px; color: #D4A574; font-weight: bold; }
#sp-rate { font-size: 10px; color: #8A7A5A; margin-top: 2px; }
#build-bar {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  pointer-events: auto;
}
.build-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid #B8860B;
  background: rgba(13,13,18,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-direction: column;
  font-size: 9px;
  transition: all 0.15s;
}
.build-btn.active {
  border-color: #D4A574;
  background: rgba(212,165,116,0.25);
  box-shadow: 0 0 12px #D4A574;
}
.build-btn .ic { font-size: 18px; }
#minimap {
  position: absolute;
  bottom: 20px; left: 20px;
  width: 180px; height: 130px;
  border: 1px solid #B8860B;
  background: rgba(13,13,18,0.85);
}
#intel {
  position: absolute;
  bottom: 20px; right: 20px;
  width: 180px;
  font-size: 11px;
}
#intel h3 { color: #D4A574; margin-bottom: 6px; font-size: 12px; }
.intel-row { display: flex; justify-content: space-between; margin: 3px 0; }
#timer {
  position: absolute;
  top: 70px; left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: #B8860B;
  letter-spacing: 2px;
}
#speed-timer {
  position: absolute;
  top: 20px; right: 100px;
  font-size: 12px;
  color: #00CED1;
}
#highscore {
  position: absolute;
  top: 50px; left: 20px;
  font-size: 10px;
  color: #8A7A5A;
}
#menu {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(13,13,18,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: auto;
  z-index: 20;
}
#menu h1 {
  font-size: 64px;
  color: #D4A574;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #B8860B;
  margin-bottom: 10px;
}
#menu .sub { color: #8A7A5A; margin-bottom: 40px; font-size: 14px; letter-spacing: 4px; }
#start-btn {
  padding: 14px 40px;
  font-size: 16px;
  background: transparent;
  color: #D4A574;
  border: 2px solid #B8860B;
  cursor: pointer;
  letter-spacing: 4px;
  font-family: inherit;
  transition: all 0.2s;
}
#start-btn:hover { background: rgba(212,165,116,0.2); box-shadow: 0 0 20px #B8860B; }
#menu .hs { margin-top: 30px; color: #B8860B; font-size: 12px; }
#wave-end {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 30px 50px;
  text-align: center;
  pointer-events: auto;
  display: none;
}
#wave-end h2 { color: #D4A574; margin-bottom: 14px; font-size: 24px; }
#wave-end button {
  margin-top: 18px;
  padding: 10px 30px;
  background: transparent;
  color: #D4A574;
  border: 2px solid #B8860B;
  cursor: pointer;
  letter-spacing: 3px;
  font-family: inherit;
  font-size: 13px;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="integrity-panel" class="panel">
    <div>INTEGRITY</div>
    <div id="integrity-bar-bg"><div id="integrity-bar" style="height:100%"></div></div>
  </div>
  <div id="highscore">HIGH: <span id="hs-val">0</span></div>
  <div id="wave-panel" class="panel">
    <div id="wave-num">WAVE 0</div>
    <div id="wave-bar-bg"><div id="wave-bar"></div></div>
  </div>
  <div id="timer">00:00.0</div>
  <div id="speed-timer">SPEED: <span id="speed-val">0</span></div>
  <div id="sp-panel" class="panel">
    <div id="sp-amount">100</div>
    <div id="sp-rate">+5/s</div>
  </div>
  <div id="build-bar">
    <div class="build-btn active" data-type="0"><div class="ic">█</div><div>STD</div></div>
    <div class="build-btn" data-type="1"><div class="ic">██</div><div>RFG</div></div>
    <div class="build-btn" data-type="2"><div class="ic">│</div><div>QCK</div></div>
    <div class="build-btn" id="blast-btn"><div class="ic">⚡</div><div>BLAST</div></div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="intel" class="panel">
    <h3>WAVE INTEL</h3>
    <div id="intel-list"></div>
  </div>
  <div id="menu">
    <h1>SANDFALL</h1>
    <div class="sub">TOWER DEFENSE</div>
    <button id="start-btn">START</button>
    <div class="hs">HIGH SCORE: <span id="menu-hs">0</span> waves</div>
  </div>
  <div id="wave-end" class="panel">
    <h2 id="we-title">WAVE CLEAR</h2>
    <div id="we-stats"></div>
    <button id="next-btn">NEXT WAVE</button>
  </div>
</div>
<script>
const C = document.getElementById('game');
const ctx = C.getContext('2d');
const MC = document.getElementById('minimap');
const mctx = MC.getContext('2d');
let W, H;
function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
  MC.width = 180; MC.height = 130;
}
resize();
window.addEventListener('resize', resize);

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function snd(type, freq, dur) {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq;
    g.gain.value = 0.08;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start();
    o.stop(audioCtx.currentTime + dur);
    if (type === 'noise') o.type = 'sawtooth';
  } catch(e) {}
}
function playBuild() { snd('tone', 200 + Math.random()*100, 0.08); }
function playBlast() { snd('noise', 80, 0.3); }
function playHit() { snd('tone', 100, 0.05); }
function playWave() { snd('tone', 440, 0.2); setTimeout(()=>snd('tone', 550, 0.2), 100); }

// Storage
let highScore = parseInt(localStorage.getItem('sandfall_hs') || '0');
document.getElementById('hs-val').textContent = highScore;
document.getElementById('menu-hs').textContent = highScore;

// Game state
const state = {
  mode: 'menu', sp: 100, integrity: 100, wave: 0,
  waveTime: 0, waveDuration: 30, buildTimer: 0,
  speedTimer: 0, walls: [], enemies: [], particles: [],
  blasts: [], citadelHP: 100,
  selectedType: 0, paused: false,
  cam: { x: 0, y: 0, z: 1 },
  spawnTimer: 0, spawnInterval: 2, enemiesToSpawn: 0,
  shake: 0, mouseX: 0, mouseY: 0, worldMouseX: 0, worldMouseY: 0,
  dragging: false, dragStart: null, dragPoints: [],
  modifier: 'std'
};

const COLORS = {
  sand: '#D4A574', reinforced: '#B8860B', quick: '#F5DEB3',
  citadel: '#00CED1', void: '#0D0D12', grid: '#1a1410',
  std: '#4B0082', sluice: '#8A2BE2', crusher: '#8B0000', phase: '#4169E1'
};
const WALL_TYPES = [
  { hp: 100, cost: 2, thick: 6, color: COLORS.sand },
  { hp: 250, cost: 4, thick: 10, color: COLORS.reinforced },
  { hp: 50, cost: 1, thick: 4, color: COLORS.quick }
];

const ENEMY_TYPES = {
  std: { hp: 30, speed: 40, dmg: 10, color: COLORS.std, size: 8, score: 1 },
  sluice: { hp: 15, speed: 60, dmg: 0, color: COLORS.sluice, size: 5, score: 1, sluice: true },
  crusher: { hp: 120, speed: 25, dmg: 50, color: COLORS.crusher, size: 14, score: 3 },
  phase: { hp: 40, speed: 50, dmg: 5, color: COLORS.phase, size: 9, score: 2, phase: true }
};

// Input
C.addEventListener('mousedown', onDown);
C.addEventListener('mousemove', onMove);
C.addEventListener('mouseup', onUp);
C.addEventListener('contextmenu', e => { e.preventDefault(); doBlast(); });
C.addEventListener('wheel', e => {
  e.preventDefault();
  state.cam.z = Math.max(0.5, Math.min(2, state.cam.z - e.deltaY * 0.001));
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'Shift') state.modifier = 'rfg';
  if (e.key === 'Control') state.modifier = 'qck';
  if (e.key === 'Alt') state.modifier = 'exc';
  if (e.key === ' ') state.paused = !state.paused;
  if (e.key === 'm') document.getElementById('intel').style.display =
    document.getElementById('intel').style.display === 'none' ? 'block' : 'none';
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt') state.modifier = 'std';
});
function onDown(e) {
  if (state.mode !== 'building' && state.mode !== 'wave') return;
  audioCtx.resume();
  const r = C.getBoundingClientRect();
  state.mouseX = e.clientX - r.left;
  state.mouseY = e.clientY - r.top;
  state.dragging = true;
  state.dragStart = { x: state.worldMouseX, y: state.worldMouseY };
  state.dragPoints = [{ x: state.worldMouseX, y: state.worldMouseY }];
}
function onMove(e) {
  const r = C.getBoundingClientRect();
  state.mouseX = e.clientX - r.left;
  state.mouseY = e.clientY - r.top;
  state.worldMouseX = (state.mouseX - W/2) / state.cam.z + state.cam.x;
  state.worldMouseY = (state.mouseY - H/2) / state.cam.z + state.cam.y;
  if (state.dragging) {
    const last = state.dragPoints[state.dragPoints.length-1];
    const dx = state.worldMouseX - last.x;
    const dy = state.worldMouseY - last.y;
    if (dx*dx + dy*dy > 100) {
      state.dragPoints.push({ x: state.worldMouseX, y: state.worldMouseY });
    }
  }
}
function onUp(e) { if (state.dragging) finishWall(); state.dragging = false; }

// Touch
C.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  onDown({ clientX: t.clientX, clientY: t.clientY });
});
C.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  onMove({ clientX: t.clientX, clientY: t.clientY });
});
C.addEventListener('touchend', e => { e.preventDefault(); onUp(e); });

document.querySelectorAll('.build-btn[data-type]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.build-btn[data-type]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.selectedType = parseInt(b.dataset.type);
  });
});
document.getElementById('blast-btn').addEventListener('click', doBlast);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('next-btn').addEventListener('click', startWave);

function doBlast() {
  if (state.mode !== 'wave' && state.mode !== 'building') return;
  if (state.blasts.length > 0) return;
  playBlast();
  state.blasts.push({ x: state.worldMouseX, y: state.worldMouseY, r: 0, maxR: 150, life: 0.5 });
  state.enemies.forEach(en => {
    const dx = en.x - state.worldMouseX, dy = en.y - state.worldMouseY;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < 150) {
      const push = (1 - d/150) * 100;
      en.x += dx/d * push;
      en.y += dy/d * push;
      en.hp -= 25;
      spawnParticles(en.x, en.y, '#D4A574', 8);
    }
  });
  state.shake = 8;
}

function finishWall() {
  if (state.dragPoints.length < 2) return;
  if (state.modifier === 'exc') {
    // Excavate
    state.walls = state.walls.filter(w => {
      let removed = false;
      state.dragPoints.forEach(p => {
        const d = distToSegment(p.x, p.y, w.x1, w.y1, w.x2, w.y2);
        if (d < 12) { removed = true; state.sp += w.cost * 0.5; }
      });
      return !removed;
    });
    return;
  }
  const type = state.modifier === 'rfg' ? 1 : state.modifier === 'qck' ? 2 : state.selectedType;
  const cfg = WALL_TYPES[type];
  const cost = Math.ceil(state.dragPoints.length * cfg.cost);
  if (state.sp < cost) return;
  state.sp -= cost;
  for (let i = 0; i < state.dragPoints.length - 1; i++) {
    const p1 = state.dragPoints[i], p2 = state.dragPoints[i+1];
    state.walls.push({
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      hp: cfg.hp, maxHp: cfg.hp, thick: cfg.thick,
      color: cfg.color, cost: cfg.cost, type,
      grow: type === 2 ? 1 : 0
    });
  }
  playBuild();
  spawnParticles(state.dragPoints[state.dragPoints.length-1].x, state.dragPoints[state.dragPoints.length-1].y, cfg.color, 6);
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1;
  const t = Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy) / (dx*dx + dy*dy || 1)));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.sqrt((px-cx)*(px-cx) + (py-cy)*(py-cy));
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    state.particles.push({
      x, y, vx: (Math.random()-0.5)*80, vy: (Math.random()-0.5)*80,
      life: 0.5 + Math.random()*0.5, max: 1, color, size: 2 + Math.random()*3
    });
  }
}

function spawnEnemy(type) {
  const cfg = ENEMY_TYPES[type];
  state.enemies.push({
    x: -100 + Math.random()*40,
    y: (Math.random() - 0.5) * 400,
    hp: cfg.hp, maxHp: cfg.hp, type,
    speed: cfg.speed, dmg: cfg.dmg, color: cfg.color,
    size: cfg.size, score: cfg.score,
    phase: !!cfg.phase, sluice: !!cfg.sluice,
    phaseTimer: 0, attacking: null, attackTimer: 0
  });
}

function startGame() {
  document.getElementById('menu').style.display = 'none';
  audioCtx.resume();
  state.walls = []; state.enemies = []; state.particles = []; state.blasts = [];
  state.sp = 100; state.integrity = 100; state.wave = 0;
  state.speedTimer = 0;
  state.mode = 'building';
  state.buildTimer = 10;
}

function startWave() {
  document.getElementById('wave-end').style.display = 'none';
  state.wave++;
  state.waveTime = 0;
  state.waveDuration = 25 + state.wave * 3;
  state.mode = 'wave';
  state.spawnInterval = Math.max(0.4, 2 - state.wave * 0.1);
  state.enemiesToSpawn = 5 + state.wave * 3;
  state.spawnTimer = 0;
  playWave();
}

function update(dt) {
  if (state.paused || state.mode === 'menu' || state.mode === 'gameover') return;
  state.speedTimer += dt;

  // Camera keys
  const spd = 400 * dt;
  if (keys['w']||keys['arrowup']) state.cam.y -= spd;
  if (keys['s']||keys['arrowdown']) state.cam.y += spd;
  if (keys['a']||keys['arrowleft']) state.cam.x -= spd;
  if (keys['d']||keys['arrowright']) state.cam.x += spd;

  // Building phase
  if (state.mode === 'building') {
    state.buildTimer -= dt;
    if (state.buildTimer <= 0) startWave();
  }

  // Wave phase
  if (state.mode === 'wave') {
    state.waveTime += dt;
    state.sp += 5 * dt;
    if (state.enemiesToSpawn > 0) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        let types = ['std'];
        if (state.wave >= 4) types.push('sluice');
        if (state.wave >= 7) types.push('crusher');
        if (state.wave >= 10) types.push('phase');
        spawnEnemy(types[Math.floor(Math.random()*types.length)]);
        state.enemiesToSpawn--;
        state.spawnTimer = state.spawnInterval;
      }
    }
    if (state.enemiesToSpawn <= 0 && state.enemies.length === 0) {
      endWave();
    }
  }

  // Wall grow
  state.walls.forEach(w => {
    if (w.grow < 1) { w.grow += dt * 4; if (w.grow > 1) w.grow = 1; }
  });

  // Enemies
  state.enemies.forEach(en => {
    if (en.phase) { en.phaseTimer -= dt; if (en.phaseTimer < 0) en.phase = false; }
    let blocked = false;
    state.walls.forEach(w => {
      if (en.phase) return;
      const d = distToSegment(en.x, en.y, w.x1, w.y1, w.x2, w.y2);
      const reach = en.size + w.thick;
      if (d < reach) {
        if (en.sluice) { return; }
        blocked = true;
        if (!en.attacking) en.attacking = w;
        if (en.attacking === w) {
          en.attackTimer += dt;
          w.hp -= en.dmg * dt;
          playHit();
        }
      }
    });
    if (!blocked || en.sluice) {
      en.x += en.speed * dt;
      en.attacking = null;
    }
    // Citadel collision
    if (en.x > 280) {
      state.integrity -= en.dmg > 0 ? 10 : 5;
      en.hp = 0;
      state.shake = 12;
      spawnParticles(en.x, en.y, '#00CED1', 10);
    }
  });

  // Remove destroyed walls
  const newWalls = [];
  state.walls.forEach(w => {
    if (w.hp <= 0) {
      spawnParticles((w.x1+w.x2)/2, (w.y1+w.y2)/2, '#5a4020', 8);
      state.sp += w.cost * 0.3;
    } else {
      newWalls.push(w);
    }
  });
  state.walls = newWalls;

  // Remove dead enemies
  const before = state.enemies.length;
  state.enemies = state.enemies.filter(en => {
    if (en.hp <= 0) {
      state.sp += en.score * 2;
      spawnParticles(en.x, en.y, en.color, 6);
      return false;
    }
    return true;
  });

  // Particles
  state.particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
  });
  state.particles = state.particles.filter(p => p.life > 0);

  // Blasts
  state.blasts.forEach(b => { b.r += dt * 400; b.life -= dt; });
  state.blasts = state.blasts.filter(b => b.life > 0);

  // Shake
  if (state.shake > 0) state.shake *= 0.9;
  if (state.shake < 0.1) state.shake = 0;

  // Game over
  if (state.integrity <= 0) {
    state.integrity = 0;
    if (state.wave > highScore) {
      highScore = state.wave;
      localStorage.setItem('sandfall_hs', highScore);
      document.getElementById('hs-val').textContent = highScore;
      document.getElementById('menu-hs').textContent = highScore;
    }
    state.mode = 'gameover';
    setTimeout(() => {
      document.getElementById('menu').style.display = 'flex';
      document.getElementById('menu').innerHTML = `<h1 style="color:#8B0000">DEFEATED</h1><div class="sub">SURVIVED ${state.wave} WAVES</div><button id="start-btn">RETRY</button><div class="hs">HIGH SCORE: ${highScore} waves</div>`;
      document.getElementById('start-btn').addEventListener('click', () => location.reload());
    }, 500);
  }

  // Update UI
  document.getElementById('sp-amount').textContent = Math.floor(state.sp);
  document.getElementById('integrity-bar').style.height = state.integrity + '%';
  document.getElementById('wave-num').textContent = 'WAVE ' + state.wave;
  if (state.mode === 'wave') {
    document.getElementById('wave-bar').style.width = (state.waveTime/state.waveDuration*100) + '%';
  } else if (state.mode === 'building') {
    document.getElementById('wave-bar').style.width = (1 - state.buildTimer/10) * 100 + '%';
  }
  const mins = Math.floor(state.speedTimer/60);
  const secs = (state.speedTimer%60).toFixed(1);
  document.getElementById('timer').textContent =
    String(mins).padStart(2,'0') + ':' + String(secs).padStart(4,'0');
  document.getElementById('speed-val').textContent = state.wave + 'W';

  // Intel
  const counts = {};
  state.enemies.forEach(e => { counts[e.type] = (counts[e.type]||0) + 1; });
  const intelHTML = Object.entries(counts).map(([k,v]) =>
    `<div class="intel-row"><span style="color:${ENEMY_TYPES[k].color}">${k.toUpperCase()}</span><span>${v}</span></div>`
  ).join('') || '<div style="color:#5a4a3a">none</div>';
  document.getElementById('intel-list').innerHTML = intelHTML;
}

function endWave() {
  state.mode = 'waveend';
  const bonus = 20 + state.wave * 10;
  state.sp += bonus;
  document.getElementById('wave-end').style.display = 'block';
  document.getElementById('we-title').textContent = 'WAVE ' + state.wave + ' CLEAR';
  document.getElementById('we-stats').innerHTML =
    `Bonus: +${bonus} SP<br>Walls: ${state.walls.length}<br>Integrity: ${Math.floor(state.integrity)}%`;
  document.getElementById('next-btn').textContent = 'WAVE ' + (state.wave+1);
}

function render() {
  ctx.fillStyle = COLORS.void;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (state.shake > 0) {
    ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
  }
  ctx.translate(W/2, H/2);
  ctx.scale(state.cam.z, state.cam.z);
  ctx.translate(-state.cam.x, -state.cam.y);

  // Grid
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  const gs = 50;
  const sx = Math.floor((state.cam.x - W/2/state.cam.z)/gs)*gs;
  const sy = Math.floor((state.cam.y - H/2/state.cam.z)/gs)*gs;
  for (let x = sx; x < state.cam.x + W/2/state.cam.z + gs; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x, sy + H/state.cam.z + gs); ctx.stroke();
  }
  for (let y = sy; y < state.cam.y + H/2/state.cam.z + gs; y += gs) {
    ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + W/state.cam.z + gs, y); ctx.stroke();
  }

  // Citadel
  const cx = 300;
  ctx.fillStyle = COLORS.citadel;
  ctx.shadowBlur = 20;
  ctx.shadowColor = COLORS.citadel;
  ctx.fillRect(cx, -150, 30, 300);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.fillText('CITADEL', cx - 10, -160);

  // Citadel HP bar
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(cx + 35, -100, 8, 200);
  ctx.fillStyle = state.integrity > 30 ? COLORS.citadel : '#8B0000';
  ctx.fillRect(cx + 35, -100, 8, 200 * state.integrity/100);

  // Walls
  state.walls.forEach(w => {
    ctx.strokeStyle = w.color;
    ctx.lineWidth = w.thick * (w.grow || 1);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(w.x1 + (w.x2-w.x1)*(1-(w.grow||1)), w.y1 + (w.y2-w.y1)*(1-(w.grow||1)));
    ctx.lineTo(w.x2, w.y2);
    ctx.stroke();
    // HP indicator
    if (w.hp < w.maxHp) {
      ctx.strokeStyle = w.hp > w.maxHp*0.5 ? '#00CED1' : '#8B0000';
      ctx.lineWidth = 2;
      const mx = (w.x1+w.x2)/2, my = (w.y1+w.y2)/2;
      ctx.beginPath();
      ctx.arc(mx, my, 4, 0, Math.PI*2*w.hp/w.maxHp);
      ctx.stroke();
    }
  });

  // Blasts
  state.blasts.forEach(b => {
    ctx.strokeStyle = `rgba(212,165,116,${b.life*2})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.stroke();
  });

  // Enemies
  state.enemies.forEach(en => {
    ctx.fillStyle = en.phase ? 'rgba(' + hexToRgb(en.color) + ',0.4)' : en.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = en.color;
    ctx.beginPath();
    if (en.type === 'crusher') {
      ctx.rect(en.x - en.size, en.y - en.size, en.size*2, en.size*2);
    } else {
      ctx.arc(en.x, en.y, en.size, 0, Math.PI*2);
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    // HP
    ctx.fillStyle = '#000';
    ctx.fillRect(en.x - en.size, en.y - en.size - 6, en.size*2, 3);
    ctx.fillStyle = en.hp > en.maxHp*0.5 ? '#00CED1' : '#8B0000';
    ctx.fillRect(en.x - en.size, en.y - en.size - 6, en.size*2 * en.hp/en.maxHp, 3);
  });

  // Particles
  state.particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life/p.max;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Drag preview
  if (state.dragging && state.dragPoints.length > 0) {
    ctx.strokeStyle = state.modifier === 'exc' ? '#8B0000' :
      WALL_TYPES[state.modifier === 'rfg' ? 1 : state.modifier === 'qck' ? 2 : state.selectedType].color;
    ctx.lineWidth = WALL_TYPES[state.modifier === 'rfg' ? 1 : state.modifier === 'qck' ? 2 : state.selectedType].thick;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    const last = state.dragPoints[0];
    ctx.moveTo(last.x, last.y);
    for (let i = 1; i < state.dragPoints.length; i++) {
      ctx.lineTo(state.dragPoints[i].x, state.dragPoints[i].y);
    }
    ctx.lineTo(state.worldMouseX, state.worldMouseY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();

  // Minimap
  mctx.fillStyle = '#0D0D12';
  mctx.fillRect(0, 0, 180, 130);
  mctx.strokeStyle = '#B8860B';
  mctx.strokeRect(0, 0, 180, 130);
  // Walls on minimap
  mctx.strokeStyle = '#D4A574';
  mctx.lineWidth = 1;
  state.walls.forEach(w => {
    mctx.beginPath();
    mctx.moveTo(w.x1/5 + 90, w.y1/5 + 65);
    mctx.lineTo(w.x2/5 + 90, w.y2/5 + 65);
    mctx.stroke();
  });
  // Citadel on minimap
  mctx.fillStyle = '#00CED1';
  mctx.fillRect(60, 30, 8, 70);
  // Enemies on minimap
  state.enemies.forEach(en => {
    mctx.fillStyle = en.color;
    mctx.fillRect(en.x/5 + 90 - 1, en.y/5 + 65 - 1, 3, 3);
  });
  // Viewport
  mctx.strokeStyle = '#fff';
  mctx.lineWidth = 1;
  mctx.strokeRect(state.cam.x/5 + 90 - W/10/state.cam.z, state.cam.y/5 + 65 - H/10/state.cam.z, W/5/state.cam.z, H/5/state.cam.z);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last)/1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
