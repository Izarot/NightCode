<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cubetris</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
  <style>
    :root {
      --bg-deep: #0a0014;
      --bg-mid: #14002a;
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff00d4;
      --neon-yellow: #ffe600;
      --neon-green: #00ff88;
      --neon-purple: #b400ff;
      --neon-orange: #ff7700;
      --neon-red: #ff3366;
      --text-light: #eeeeee;
      --grid-line: #1a0033;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, var(--bg-mid), var(--bg-deep) 80%);
      color: var(--text-light);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      height: 100%;
      padding: 10px;
    }
    #canvas-wrap {
      position: relative;
      width: 400px;
      height: 800px;
      max-width: 95vw;
      max-height: 90vh;
      aspect-ratio: 1 / 2;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4), 0 0 80px rgba(180, 0, 255, 0.2);
      border: 2px solid var(--neon-cyan);
      border-radius: 8px;
      overflow: hidden;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 120px;
      font-size: 12px;
    }
    .hud-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--neon-purple);
      border-radius: 6px;
      padding: 8px;
      box-shadow: 0 0 12px rgba(180, 0, 255, 0.3);
    }
    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    .hud-value {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    #score-value {
      font-size: 22px;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow);
    }
    #next-queue, #hold-slot {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1px;
      width: 100%;
      aspect-ratio: 4 / 2;
    }
    #next-queue {
      grid-template-rows: repeat(5, 1fr);
      aspect-ratio: 4 / 5;
    }
    .next-cell, .hold-cell {
      background: transparent;
    }
    #top-bar {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-shadow: 0 0 6px currentColor;
    }
    .icon-btn:hover {
      background: rgba(0, 240, 255, 0.2);
    }
    #timer-box {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-magenta);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--neon-magenta);
      text-shadow: 0 0 6px var(--neon-magenta);
      z-index: 5;
    }
    #pause-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 0, 20, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    #pause-overlay.active {
      display: flex;
    }
    #pause-overlay h2 {
      font-size: 32px;
      color: var(--neon-cyan);
      text-shadow: 0 0 14px var(--neon-cyan);
      letter-spacing: 4px;
    }
    #pause-overlay p {
      font-size: 12px;
      opacity: 0.7;
    }
    #high-score-note {
      font-size: 9px;
      color: var(--neon-green);
      text-shadow: 0 0 6px var(--neon-green);
      margin-top: 2px;
    }
    @media (max-width: 560px) {
      #app {
        flex-direction: column;
        gap: 8px;
      }
      #canvas-wrap {
        width: min(95vw, 400px);
        height: calc(min(95vw, 400px) * 2);
      }
      #hud {
        flex-direction: row;
        flex-wrap: wrap;
        width: min(95vw, 400px);
        justify-content: space-around;
      }
      .hud-box {
        flex: 1 1 30%;
      }
      #next-queue { grid-template-rows: repeat(2, 1fr); aspect-ratio: 4/2; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="timer-box">⏱ <span id="timer-value">00:00.0</span></div>
      <div id="top-bar">
        <button class="icon-btn" id="pause-btn" title="Pause">⏸</button>
        <button class="icon-btn" id="sound-btn" title="Sound">🔊</button>
      </div>
      <div id="pause-overlay">
        <h2>PAUSED</h2>
        <p>Press P or tap pause to resume</p>
      </div>
    </div>
    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">Score</div>
        <div class="hud-value" id="score-value">0</div>
        <div id="high-score-note">Best: <span id="high-score-value">0</span></div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Level</div>
        <div class="hud-value" id="level-value">1</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Lines</div>
        <div class="hud-value" id="lines-value">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Hold</div>
        <canvas id="hold-slot" width="80" height="40"></canvas>
      </div>
      <div class="hud-box">
        <div class="hud-label">Next</div>
        <canvas id="next-queue" width="80" height="100"></canvas>
      </div>
    </div>
  </div>
  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
