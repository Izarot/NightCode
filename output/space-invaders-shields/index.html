<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Starward Invaders</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#06041a; overflow:hidden;
  font-family:'Courier New', monospace;
  color:#fff; touch-action:none; user-select:none;
}
#wrap { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
canvas { display:block; background:#06041a; box-shadow:0 0 40px #6e2bff; border:2px solid #6e2bff; }
#hint { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); font-size:11px; color:#b08aff; opacity:0.7; text-align:center; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gameCanvas" width="1024" height="768"></canvas></div>
<div id="hint">← → MOVE | SPACE FIRE | R REPAIR | P PAUSE</div>
<script src="src/main.js"></script>
</body>
</html>
