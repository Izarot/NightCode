<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>AEGIS PROTOCOL</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050508;overflow:hidden;font-family:'Courier New',monospace;touch-action:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:0;left:0;width:100%;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}#hud div{background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:4px;color:#00f0ff;font-size:14px;text-shadow:0 0 8px #00f0ff}#timer{color:#00ff88;text-shadow:0 0 8px #00ff88}#warning{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;border-left:4px solid transparent;border-right:4px solid transparent;transition:border-color .3s}#warning.active{border-left-color:#ff2255;border-right-color:#ff2255;animation:pulse .5s infinite alternate}@keyframes pulse{to{opacity:.5}}#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px);display:none}#modal h1{color:#00f0ff;font-size:32px;margin-bottom:20px;text-shadow:0 0 20px #00f0ff}#modal button{background:transparent;border:2px solid #00f0ff;color:#00f0ff;padding:12px 30px;font-size:18px;font-family:inherit;cursor:pointer;margin:8px;transition:all .2s}#modal button:hover{background:#00f0ff;color:#050508}#modal .sub{color:#ff6600;margin-top:10px;font-size:14px}</style></head><body><canvas id="c"></canvas><div id="hud"><div>SCORE: <span id="score">0</span> | BEST: <span id="best">0</span></div><div id="timer">00:00.00</div><div>LIVES: <span id="lives">3</span></div></div><div id="warning"></div><div id="modal"><h1>AEGIS PROTOCOL</h1><button id="start">START MISSION</button><div class="sub">[P] Pause | Arrows/WASD + Space</div></div><script src="game.js"></script></body></html>
