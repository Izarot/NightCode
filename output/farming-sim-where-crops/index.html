<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CODEFARMER</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%'http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div class="top-bar">
                <div class="stat">LP: <span id="lp">100</span></div>
                <div class="stat">Day: <span id="day">1</span> | <span id="clock">00:00</span></div>
                <div class="stat">Debug: <span id="debug">5</span></div>
                <div class="stat">Time: <span id="speedrun">00:00</span></div>
            </div>
            <div id="left-panel" class="panel hidden">
                <h3>Snippets</h3>
                <div id="snippet-grid"></div>
                <textarea id="code-editor" placeholder="// Write JS snippet...">return Math.random() > 0.5 ? 'carrot' : 'wheat';</textarea>
                <button id="compile-btn">Compile Test</button>
                <div id="compile-output"></div>
            </div>
            <div id="right-panel" class="panel hidden">
                <h3>Plot Info</h3>
                <div id="plot-details"></div>
            </div>
        </div>
        <div id="tool-wheel">
            <div class="tool" data-tool="0">Hoe</div>
            <div class="tool" data-tool="1">Water</div>
            <div class="tool" data-tool="2">Fertilize</div>
            <div class="tool" data-tool="3">Debug</div>
            <div class="tool" data-tool="4">Harvest</div>
        </div>
        <div id="tooltip" class="hidden"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
