<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVO-STRIKE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚀</text></svg>">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: #00FFFF;
            text-shadow: 0 0 5px #00FFFF;
        }
        menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        h1 { font-size: 3rem; color: #FF00FF; margin-bottom: 0.5rem; }
        btn {
            padding: 15px 30px;
            background: transparent;
            border: 2px solid #00FFFF;
            color: #00FFFF;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }
        btn:hover { background: #00FFFF; color: #050505; }
        #timer { position: absolute; top: 10px; right: 10px; color: #FFBF00; }
        #high-score-display { position: absolute; top: 10px; left: 10px; color: #FF00FF; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="high-score-display">HIGH SCORE: 0</div>
        <div id="timer">00:00.00</div>
        <div id="menu" class="menu-overlay">
            <h1>EVO-STRIKE</h1>
            <p style='color: #FFBF00;'>[SPACE] TO INITIALIZE</p>
            <button class="btn" onclick="startGame()">START MISSION</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
