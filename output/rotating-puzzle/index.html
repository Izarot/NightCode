<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>GYRE — Rotational Puzzle Platformer</title>
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#07070f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh}
#wrap{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;background:#0a0a12}
canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:8px}
#touch{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:10px;pointer-events:none}
#touch div{display:flex;gap:8px}
button{pointer-events:auto;min-width:52px;min-height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(10,10,30,.55);color:#0ff;font-size:20px;font-weight:800}
button:active{background:rgba(0,242,255,.35)}
@media(pointer:fine){#touch{display:none}}
</style>
</head>
<body>
<div id='wrap'>
<canvas id='c' width='1920' height='1080'></canvas>
<div id='touch'>
<div><button id='bL'>◀</button><button id='bR'>▶</button></div>
<div><button id='bRL'>⟲</button><button id='bRR'>⟳</button><button id='bJ'>⬆</button></div>
</div>
</div>
<script src='game.js'></script>
</body>
</html>
