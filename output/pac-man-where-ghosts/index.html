<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allied Ghosts</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>👻</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="timer">TIME: 03:00</div>
        <div id="lives">LIVES: 3</div>
        <div id="speedrun-timer">SPEEDRUN: 00:00</div>
      </div>
      <div id="screens">
        <div id="main-menu" class="screen">...</div>
        <div id="pause-menu" class="screen">...</div>
        <div id="game-over" class="screen">...</div>
        <div id="level-complete" class="screen">...</div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
