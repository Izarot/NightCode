<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroid Grav</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='70' font-size='60' fill='%23ff6b6b'%3E🌌%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: 'Orbitron', sans-serif; }
    #gameCanvas { display: block; background: #000; }
    #hud { position: absolute; top: 10px; left: 10px; color: #00ff00; font-size: 14px; z-index: 10; }
    #touchControls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; z-index: 10; }
    .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    #pauseBtn { position: absolute; top: 10px; right: 10px; z-index: 10; }
    #speedrunTimer { position: absolute; top: 10px; right: 120px; z-index: 10; font-size: 18px; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Health: <span id="health">100</span>%</div>
    <div>Wells: <span id="wells">0</span>/5</div>
  </div>
  <div id="speedrunTimer">Time: 00:00</div>
  <div id="pauseBtn" class="btn">⏸</div>
  <div id="touchControls">
    <div class="btn" id="thrustBtn">🔼</div>
    <div class="btn" id="fireBtn">🔫</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
