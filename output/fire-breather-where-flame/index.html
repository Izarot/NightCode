<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fire Breather</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔥%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <div id="timer">TIME: 0.0</div>
                <div id="fuel-container">
                    <div id="fuel-label">FUEL</div>
                    <div id="fuel-bar-bg"></div>
                    <div id="fuel-bar-fill"></div>
                    <div id="fuel-text">100/100</div>
                </div>
                <div id="health-container">
                    <div id="health-label">HP</div>
                    <div id="health-bar-bg"></div>
                    <div id="health-bar-fill"></div>
                    <div id="health-text">100/100</div>
                </div>
                <div id="score-container">SCORE: 0</div>
                <div id="highscore-container">BEST: 0</div>
            </div>
            <div id="mobile-controls" style="display:none;">
                <div class="d-pad">
                    <div class="btn left">L</div>
                    <div class="btn right">R</div>
                </div>
                <div class="action-pad">
                    <div class="btn jump">JUMP</div>
                    <div class="btn breath" id="breath-btn">FIRE</div>
                </div>
            </div>
        </div>
        <div id="overlay">
            <div id="start-screen" class="screen active">
                <h1>FIRE BREATHER</h1>
                <p>Move: Arrows / WASD</p>
                <p>Jump: Up / Space</p>
                <p>Breath: Hold Space / Touch</p>
                <button id="start-btn">START RUN</button>
                <div id="best-score-display">Best: 0</div>
            </div>
            <div id="game-over-screen" class="screen">
                <h1 style="color: #ff4444;">GAME OVER</h1>
                <div id="final-score">Score: 0</div>
                <div id="final-time">Time: 0.0s</div>
                <button id="restart-btn">TRY AGAIN</button>
            </div>
            <div id="victory-screen" class="screen">
                <h1 style="color: #44ff44;">LEVEL COMPLETE</h1>
                <div id="victory-score">Score: 0</div>
                <button id="next-btn">NEXT LEVEL</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
