<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Reflex</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-overlay">
            <div class="timer" id="timer">0.00s</div>
            <div class="score" id="score">Score: 0</div>
            <div class="high-score" id="highScore">Best: 0</div>
        </div>
        <div class="start-screen" id="startScreen">
            <h1>NEON REFLEX</h1>
            <p>Click the pulsing orbs before they vanish</p>
            <button id="startBtn">BEGIN</button>
        </div>
        <div class="game-over" id="gameOver">
            <h2>TIME UP</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">AGAIN</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
