<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dodge</title>
    <link rel="icon" href="data:text/plain,\u{1F680}">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui-overlay">
        <div class="stats">
            <div>Score: <span id="score">0</span></div>
            <div>Best: <span id="highscore">0.0</span></div>
            <div>Time: <span id="timer">0.0</span>s</div>
        </div>
        <div id="start-screen" class="screen">
            <h1>NEON DODGE</h1>
            <p>Tap/Click or Arrow Keys to Move</p>
            <button id="start-btn">START RUN</button>
        </div>
        <div id="game-over" class="screen hidden">
            <h1>CRASHED</h1>
            <p>Final Time: <span id="final-time">0.0</span>s</p>
            <p id="new-best" class="hidden">NEW BEST!</p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
