<!DOCTYPE html>\n<html lang='en'>\n<head>\n<meta charset='UTF-8'>\n<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>\n<title>PhaseShift</title>\n<link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>'>\n<style>\n*{box-sizing:border-box}html,body{margin:0;padding:0;background:#050510;color:#a0ffff;font-family:monospace;overflow:hidden;height:100%}\n#wrap{position:fixed;inset:0;background:radial-gradient(circle at 70% 20%,#1a0533,#050510 60%)}\ncanvas{display:block;width:100%;height:100%;cursor:none;touch-action:none}\n#timer{position:fixed;top:10px;left:10px;z-index:5;background:rgba(10,10,30,.6);border:1px solid #00f3ff;border-radius:8px;padding:6px 10px;font-size:14px;box-shadow:0 0 12px #00f3ff88}\n#high{position:fixed;top:52px;left:10px;z-index:5;font-size:12px;color:#ffea00;text-shadow:0 0 8px #ffea00}\n#msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;font-size:18px;color:#ff0055;text-shadow:0 0 10px #ff0055;letter-spacing:2px}\n#touch{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 12px;z-index:6;pointer-events:none}\n#touch .grp{display:flex;gap:10px;pointer-events:auto}\n.tbtn{width:58px;height:58px;border-radius:50%;border:2px solid #00f3ff;background:rgba(0,243,255,.15);color:#a0ffff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px #00f3ff}\n.tbtn:active{background:#ff0055;color:#fff}\n@media (pointer:coarse){#touch{display:flex}}\n#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7;z-index:4;white-space:nowrap}\n</style>\n</head>\n<body>\n<div id='wrap'><canvas id='game'></canvas></div>\n<div id='timer'>⏱ SPEEDRUN 0:00.0</div>\n<div id='high'>🏆 BEST: --</div>\n<div id='msg'>PHASESHIFT</div>\n<div id='help'>A/D MOVE • SPACE JUMP • HOLD LMB CREATE PLATFORM • SHIFT LOCK H • CTRL LOCK V</div>\n<div id='touch'><div class='grp'><div class='tbtn' id='bL'>◀</div><div class='tbtn' id='bR'>▶</div></div><div class='grp'><div class='tbtn' id='bJ'>⤒</div><div class='tbtn' id='bP'>◆</div></div></div>\n<script src='main.js'></script>\n</body>\n</html>\n
