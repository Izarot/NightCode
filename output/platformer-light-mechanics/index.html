<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luminous Platformer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='0.9em' font-size='64'>💡</text></svg>">
<style>
  :root {
    --bg: #0d0d0d;
    --platform: #2ecc71;
    --platform-glow: #f1c40f;
    --hazard: #e74c3c;
    --orb: #f1c40f;
    --aura-inner: #ffeb3b;
    --aura-outer: #ff9800;
    --health-high: #2ecc71;
    --health-med: #f1c40f;
    --health-low: #e74c3c;
    --charge: #9b59b6;
    --text: #ecf0f1;
    --ui-bg: rgba(0,0,0,0.6);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Press Start 2P',monospace;}
  #game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{background:var(--bg);display:block;max-width:100%;max-height:100%;touch-action:none;}
  .hud{position:absolute;left:10px;top:10px;font-size:16px;line-height:1.4;pointer-events:none;}
  .hud-right{right:10px;left:auto;text-align:right;}
  .hud-bottom{bottom:10px;top:auto;}
  .bar{height:8px;background:#222;margin-top:4px;overflow:hidden;border-radius:4px;}
  .bar div{height:100%;background:var(--health-high);}
  .charge-bar div{background:var(--charge);}
  .orb-count{font-size:14px;}
  .timer{font-size:18px;font-weight-bold;}
  @media (max-width:480px){
    .hud{font-size:12px;}
    .timer{font-size:14px;}
  }
</style>
</head>
<body>
<div id="game-container"><canvas id="gameCanvas"></canvas></div>
<div class="hud" id="hudHealth"></div>
<div class="hud hud-right" id="hudCharge"></div>
<div class="hud hud-bottom" id="hudOrbs"></div>
<div class="hud hud-right timer" id="hudTimer"></div>
<script type="module">
/* ==== Simple Vector ==== */
class Vec {
  constructor(x=0,y=0){this.x=x;this.y=y;}
  add(v){return new Vec(this.x+v.x,this.y+v.y);}
  sub(v){return new Vec(this.x-v.x,this.y-v.y);}
  mul(s){return new Vec(this.x*s,this.y*s);}
  clone(){return new Vec(this.x,this.y);}
  length(){return Math.hypot(this.x,this.y);}
  normalize(){const l=this.length();return l?new Vec(this.x/l,this.y/l):new Vec(0,0);}
}
/* ==== AABB ==== */
class AABB {
  constructor(pos,size){this.pos=pos;this.size=size;}
  get min(){return this.pos;}
  get max(){return new Vec(this.pos.x+this.size.x,this.pos.y+this.size.y);}
  intersects(other){return !(this.max.x<other.min.x||this.min.x>other.max.x||this.max.y<other.min.y||this.min.y>other.max.y);}
}
/* ==== Audio ==== */
class AudioMgr {
  constructor(){this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.volume=0.5;}
  play(type, freq=440, dur=0.1, vol=0.5){const o=this.ctx.createOscillator();const g=this.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol*this.volume,this.ctx.currentTime);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+dur);}
  jump(){this.play('triangle',520,0.15,0.4);}
  click(){this.play('sine',880,0.07,0.3);}
  collect(){this.play('sine',1040,0.12,0.4);}
  damage(){this.play('sawtooth',180,0.2,0.5);}
}
/* ==== Game ==== */
class Game {
  constructor(canvas){
    this.canvas=canvas;
    this.ctx=canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    this.audio=new AudioMgr();
    this.keys={};
    this.mouse=new Vec(0,0);
    this.lightOn=true;
    this.lightCharge=0;
    this.maxCharge=10;
    this.health=100;
    this.maxHealth=100;
    this.orbsCollected=0;
    this.totalOrbs=0;
    this.timer=0;
    this.bestTime=localStorage.getItem('luminousBestTime')?parseFloat(localStorage.getItem('luminousBestTime')):null;
    this.lastTime=performance.now();
    this.acc=new Vec(0,0);
    this.vel=new Vec(0,0);
    this.pos=new Vec(100,300);
    this.size=new Vec(40,60);
    this.onGround=false;
    this.gravity=1.2;
    this.walkAcc=0.4;
    this.runAcc=0.8;
    this.maxWalk=5;
    this.maxRun=9;
    this.airControl=0.7;
    this.frictionGround=0.9;
    this.frictionAir=0.96;
    this.jumpVel=-14;
    this.jumpReleaseFactor=0.3;
    this.jumpHeld=false;
    this.beamActive=false;
    this.particles=[];
    this.platforms=[];
    this.orbs=[];
    this.hazards=[];
    this.checkpoint=null;
    this.loadLevel();
    this.input();
    this.loop();
  }
  resize(){const w=window.innerWidth,h=window.innerHeight;let width=Math.min(w,1280);let height=width*9/16;if(height>h){height=h*0.95;width=height*16/9;}this.canvas.width=width;this.canvas.height=height;}
  input(){window.addEventListener('keydown',e=>{this.keys[e.code]=true;if(e.code==='Space'){this.lightOn=!this.lightOn;this.audio.click();}if(e.code==='ShiftLeft'||e.code==='ShiftRight'){this.beamActive=true;}});window.addEventListener('keyup',e=>{this.keys[e.code]=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight'){this.beamActive=false;}});window.addEventListener('mousemove',e=>{const rect=this.canvas.getBoundingClientRect();this.mouse=new Vec(e.clientX-rect.left,e.clientY-rect.top);});window.addEventListener('touchmove',e=>{if(e.touches.length){const rect=this.canvas.getBoundingClientRect();const t=e.touches[0];this.mouse=new Vec(t.clientX-rect.left,t.clientY-rect.top);}},{passive:true});window.addEventListener('touchstart',e=>{if(e.touches.length===1){this.jumpHeld=true;this.vel.y=this.jumpVel;this.onGround=false;this.audio.jump();}});window.addEventListener('touchend',e=>{this.jumpHeld=false;});
  }
  loadLevel(){// simple level: ground, platforms, orbs, hazards
    this.platforms=[
      new AABB(new Vec(0,this.canvas.height-40),new Vec(this.canvas.width,40)),
      new AABB(new Vec(200,this.canvas.height-120),new Vec(180,20)),
      new AABB(new Vec(450,this.canvas.height-200),new Vec(180,20)),
      new AABB(new Vec(700,this.canvas.height-280),new Vec(180,20)),
      new AABB(new Vec(950,this.canvas.height-160),new Vec(180,20)),
    ];
    this.orbs=[
      {pos:new Vec(260,this.canvas.height-140),radius:12,collected:false},
      {pos:new Vec(510,this.canvas.height-220),radius:12,collected:false},
      {pos:new Vec(760,this.canvas.height-300),radius:12,collected:false},
      {pos:new Vec(1010,this.canvas.height-180),radius:12,collected:false},
    ];
    this.totalOrbs=this.orbs.length;
    this.hazards=[
      {pos:new Vec(350,this.canvas.height-60),size:new Vec(20,20),damage:true},
      {pos:new Vec(600,this.canvas.height-140),size:new Vec(20,20),damage:true},
      {pos:new Vec(850,this.canvas.height-220),size:new Vec(20,20),damage:true},
    ];
    this.checkpoint=new AABB(new Vec(50,this.canvas.height-80),new Vec(40,40));
  }
  updatePhysics(dt){// dt in seconds
    // horizontal
    let accX=0;
    if(this.keys['ArrowLeft']||this.keys['KeyA'])accX=-1;
    if(this.keys['ArrowRight']||this.keys['KeyD'])accX=1;
    const maxSp=this.keys['ShiftLeft']||this.keys['ShiftRight']?this.maxRun:this.maxWalk;
    const accMag=this.keys['ShiftLeft']||this.keys['ShiftRight']?this.runAcc:this.walkAcc;
    if(accX!==0){this.acc.x=accX*accMag*(this.onGround?1:this.airControl);}else{// decel
      this.acc.x=-this.vel.x*(this.onGround?this.frictionGround:this.frictionAir);
    }
    // clamp speed
    if(Math.abs(this.vel.x)>maxSp)this.vel.x=Math.sign(this.vel.x)*maxSp;
    this.vel.x+=this.acc.x*dt;
    // vertical
    if(!this.onGround){this.vel.y+=this.gravity*dt;}
    // jumping
    if(this.jumpHeld&&this.onGround){this.vel.y=this.jumpVel;this.onGround=false;this.audio.jump();this.jumpHeld=false;}
    if(!this.jumpHeld&&this.vel.y<this.jumpVel*0.3){this.vel.y=this.jumpVel*0.3;}
    // apply velocity
    const oldPos=this.pos.clone();
    this.pos=this.pos.add(this.vel.mul(dt));
    // collision with platforms
    this.onGround=false;
    for(const p of this.platforms){if(new AABB(this.pos,this.size).intersects(p)){// resolve
      if(oldPos.y+this.size.y<=p.pos.y&&this.vel.y>0){this.pos.y=p.pos.y-this.size.y;this.vel.y=0;this.onGround=true;}
      else if(oldPos.y>=p.pos.y+p.size.y&&this.vel.y<0){this.pos.y=p.pos.y+p.size.y;this.vel.y=0;}
      else if(oldPos.x+this.size.x<=p.pos.x&&this.vel.x>0){this.pos.x=p.pos.x-this.size.x;this.vel.x=0;}
      else if(oldPos.x>=p.pos.x+p.size.x&&this.vel.x<0){this.pos.x=p.pos.x+p.size.x;this.vel.x=0;}
    }}
    // checkpoint
    if(new AABB(this.pos,this.size).intersects(this.checkpoint)){this.checkpoint=null;}
    // hazards damage
    if(!this.lightOn){for(const h of this.hazards){if(new AABB(this.pos,this.size).intersects(new AABB(h.pos,h.size))){this.health-=5*dt;this.audio.damage();this.spawnDamageParticles(h.pos);}}}
    // orb collection
    if(this.lightOn){for(const o of this.orbs){if(!o.collected){const d=this.pos.distanceTo(o.pos);if(d<this.size.x/2+o.radius+30){o.collected=true;this.orbsCollected++;this.audio.collect();this.spawnOrbParticles(o.pos);if(this.lightCharge<this.maxCharge)this.lightCharge++;}}}}
    // health regen from light
    if(this.lightOn&&this.health<this.maxHealth){this.health+=2*dt;}
    // death
    if(this.health<=0||this.pos.y>this.canvas.height+200){this.respawn();}
    // timer
    this.timer+=dt;
    // particles update
    for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.life-=dt;if(p.life<=0){this.particles.splice(i,1);}else{p.pos=p.pos.add(p.vel.mul(dt));p.vel.y+=0.2*dt;p.alpha=p.life/p.maxLife;}}
  }
  spawnOrbParticles(pos){for(let i=0;i<8;i++){const angle=Math.PI*2*i/8;const speed=Math.random()*60+20;this.particles.push({pos:pos.clone(),vel:new Vec(Math.cos(angle)*speed,Math.sin(angle)*speed-30),life:0.5,maxLife:0.5,alpha:1,size:Math.random()*4+2,color:'#f1c40f'});}}
  spawnDamageParticles(pos){for(let i=0;i<4;i++){const angle=Math.random()*Math.PI*2;const speed=Math.random()*40+20;this.particles.push({pos:pos.clone(),vel:new Vec(Math.cos(angle)*speed,Math.sin(angle)*speed),life:0.4,maxLife:0.4,alpha:1,size:Math.random()*2+1,color:'#000'});}}
  respawn(){this.pos=new Vec(100,300);this.vel=new Vec(0,0);this.health=100;if(this.bestTime===null||this.timer<this.bestTime){this.bestTime=this.timer;localStorage.setItem('luminousBestTime',this.bestTime);}this.timer=0;}
  render(){const ctx=this.ctx;ctx.clearRect(0,0,this.canvas.width,this.canvas.height);// background gradient
  const grad=ctx.createLinearGradient(0,0,0,this.canvas.height);grad.addColorStop(0,'#000');grad.addColorStop(1,'#111');ctx.fillStyle=grad;ctx.fillRect(0,0,this.canvas.width,this.canvas.height);// platforms
  for(const p of this.platforms){const lit=this.lightOn||this.pos.distanceTo(new Vec(p.pos.x+p.size.x/2,p.pos.y+p.size.y/2))<200;ctx.fillStyle=lit?`${this.platform}`:'#222';ctx.fillRect(p.pos.x,p.pos.y,p.size.x,p.size.y);if(lit){ctx.shadowColor=this.platformGlow;ctx.shadowBlur=15;ctx.fillRect(p.pos.x,p.pos.y,p.size.x,p.size.y);ctx.shadowBlur=0;}}
  // orbs
  for(const o of this.orbs){if(!o.collected){const dist=this.pos.distanceTo(o.pos);const intensity=Math.min(1,200/dist);ctx.beginPath();ctx.arc(o.pos.x,o.pos.y,o.radius,0,Math.PI*2);ctx.fillStyle=`rgba(241,196,15,${0.5+0.5*intensity})`;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}}
  // hazards
  for(const h of this.hazards){ctx.fillStyle=this.hazard;ctx.fillRect(h.pos.x,h.pos.y,h.size.x,h.size.y);}
  // checkpoint
  if(this.checkpoint){ctx.fillStyle='rgba(46,204,113,0.3)';ctx.fillRect(this.checkpoint.pos.x,this.checkpoint.pos.y,this.checkpoint.size.x,this.checkpoint.size.y);}
  // player
  ctx.fillStyle='#fff';ctx.fillRect(this.pos.x,this.pos.y,this.size.x,this.size.y);
  // light aura
  if(this.lightOn){const grad=ctx.createRadialGradient(this.pos.x+this.size.x/2,this.pos.y+this.size.y/2,0,this.pos.x+this.size.x/2,this.pos.y+this.size.y/2,150+this.lightCharge*10);grad.addColorStop(0,`rgba(255,235,59,0.6)`);grad.addColorStop(1,'rgba(255,152,0,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,this.canvas.width,this.canvas.height);}
  // beam
  if(this.beamActive&&this.lightOn){const angle=Math.atan2(this.mouse.y-(this.pos.y+this.size.y/2),this.mouse.x-(this.pos.x+this.size.x/2));const length=300;ctx.save();ctx.translate(this.pos.x+this.size.x/2,this.pos.y+this.size.y/2);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(length, -15);ctx.lineTo(length, 15);ctx.closePath();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();ctx.restore();}
  // particles
  for(const p of this.particles){ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.pos.x,p.pos.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();}
  // HUD
  this.renderHUD(ctx);}
  renderHUD(ctx){ctx.font='16px "Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillStyle=this.text;// health
  const healthWidth=200;const healthHeight=16;ctx.fillStyle='#222';ctx.fillRect(10,10,healthWidth,healthHeight);const healthRatio=Math.max(0,this.health/this.maxHealth);let healthColor=this.health>60?this.healthHigh:this.health>30?this.healthMed:this.healthLow;ctx.fillStyle=healthColor;ctx.fillRect(10,10,healthWidth*healthRatio,healthHeight);ctx.fillStyle=this.text;ctx.fillText(`HP: ${Math.round(this.health)}`,10,10);// charge
  const chargeWidth=200;ctx.fillStyle='#222';ctx.fillRect(this.canvas.width-chargeWidth-10,10,chargeWidth,16);const chargeRatio=this.lightCharge/this.maxCharge;ctx.fillStyle=this.charge;ctx.fillRect(this.canvas.width-chargeWidth-10,10,chargeWidth*chargeRatio,16);ctx.fillStyle=this.text;ctx.fillText(`Charge: ${this.lightCharge}/${this.maxCharge}`,this.canvas.width-chargeWidth-10,10);// orbs
  ctx.fillText(`Orbs: ${this.orbsCollected}/${this.totalOrbs}`,10,this.canvas.height-30);// timer
  const mins=Math.floor(this.timer/60);const secs=Math.floor(this.timer%60).toString().padStart(2,'0');ctx.fillText(`Time: ${mins}:${secs}`,this.canvas.width-180,10);// best time
  if(this.bestTime!==null){const bm=Math.floor(this.bestTime/60);const bs=Math.floor(this.bestTime%60).toString().padStart(2,'0');ctx.fillText(`Best: ${bm}:${bs}`,this.canvas.width-180,30);}}
  loop(){const now=performance.now();const dt=(now-this.lastTime)/1000;this.lastTime=now;this.updatePhysics(dt);this.render();requestAnimationFrame(()=>this.loop());}
}
// start
window.addEventListener('load',()=>{new Game(document.getElementById('gameCanvas'));});
</script>
</body>
</html>
