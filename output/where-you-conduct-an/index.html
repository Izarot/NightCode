<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orchestra Conductor: Beat Sync Challenge</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28'>🎶</text></svg>">
</head>
<body>
<canvas id="gameCanvas" width="1280" height="720"></canvas>
<div id="hud">
  <div id="score">Score: 0</div>
  <div id="combo">Combo: 0</div>
  <div id="focus">Focus: <span id="focusBar"></span></div>
  <div id="timer">0:00</div>
  <div id="highScore">High: 0</div>
</div>
<div id="menu" class="hidden">
  <h1>Orchestra Conductor</h1>
  <p>Press Space to Start</p>
</div>
<div id="gameOver" class="hidden">
  <h2>Game Over</h2>
  <p id="finalScore"></p>
  <button id="restartBtn">Replay</button>
</div>
<script src="game.js"></script>
</body>
</html>
