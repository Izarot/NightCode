<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Runner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃‍♂️</text></svg>"> 
    <style>
        body { margin: 0; padding: 20px; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }
        canvas { border: 2px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(74, 144, 226, 0.3); }
        .container { text-align: center; }
        h1 { color: #4A90E2; margin-bottom: 10px; }
        .score { color: #FF6B35; font-size: 1.2em; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Typing Runner</h1>
        <div class="score" id="score">Score: 0</div>
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div style="margin-top: 10px; color: #888; font-size: 0.9em;">
            Type words to dash! Use Backspace to correct mistakes.
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
