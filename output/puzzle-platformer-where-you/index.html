<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Shift</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌀%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; color: #ffaa44; font-family: 'Courier New', monospace; overflow: hidden; }
        #gameContainer { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #0f0f0f; image-rendering: pixelated; touch-action: none; }
        #hud { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 18px; text-shadow: 0 0 5px rgba(0,255,204,0.5); }
        #timer { position: absolute; top: 10px; right: 10px; text-align: right; }
        #score { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); text-align: center; }
        #highScore { position: absolute; bottom: 10px; right: 10px; font-size: 14px; opacity: 0.7; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div id="hud">Gravity: NORMAL</div>
    <div id="timer">Time: 0.0s</div>
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
