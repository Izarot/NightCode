<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Lumina Platformer</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💡%3C/text%3E%3C/svg%3E"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}#ui{position:fixed;top:0;left:0;width:100%;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10;color:#fff;text-shadow:0 0 8px rgba(255,200,50,.7)}#timer{font-size:18px;font-weight:bold;color:#ffcc33}#score{font-size:16px;color:#aaffcc}#lightBar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:180px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;z-index:10;pointer-events:none}#lightFill{height:100%;width:100%;background:linear-gradient(90deg,#ffcc33,#ff6699);border-radius:4px;transition:width .1s}#startScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1a3e,#0a0a1a);z-index:20;color:#fff;cursor:pointer}#startScreen h1{font-size:clamp(28px,6vw,52px);color:#ffcc33;text-shadow:0 0 20px rgba(255,200,50,.6);margin-bottom:8px}#startScreen p{font-size:clamp(12px,2.5vw,18px);color:#aaffcc;margin-bottom:24px;text-align:center;padding:0 20px}#startScreen .hint{font-size:13px;color:#888;margin-top:16px}#gameOver{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,26,.92);z-index:20;color:#fff}#gameOver h2{font-size:clamp(24px,5vw,42px);color:#ff6699;margin-bottom:8px}#gameOver p{font-size:18px;color:#ffcc33;margin-bottom:4px}#gameOver .hint{font-size:13px;color:#888;margin-top:16px;cursor:pointer}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="timer">00:00.0</div><div id="score">Best: 0.0s</div></div><div id="lightBar"><div id="lightFill"></div></div><div id="startScreen"><h1>💡 Lumina Platformer</h1><p>Guide your light to reveal platforms. Darkness hides the deadly spikes!</p><div class="hint">Click or tap to start</div></div><div id="gameOver"><h2>💀 You hit the spikes!</h2><p id="finalTime">Time: 0.0s</p><p id="bestTime">Best: 0.0s</p><div class="hint">Click to retry</div></div><script src="game.js"></script></body></html>
