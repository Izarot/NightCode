<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>ChronoShift</title><link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱</text></svg>'>><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#0A0A1A;font-family:'Courier New',monospace;touch-action:none}canvas{display:block;position:absolute;top:0;left:0;width:100vw;height:100vh}#ui{position:absolute;top:0;left:0;width:100%;padding:10px 20px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}#ui div{color:#00FFCC;text-shadow:0 0 10px #00FFCC;font-size:24px;font-weight:bold}#timer{font-size:32px}#score{font-size:24px}#powerups{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}#powerups span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0.3;border:2px solid currentColor}#powerups span.active{opacity:1;border-color:currentColor;animation:pulse 0.5s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,26,0.9);z-index:20;color:#00FFCC;text-align:center}.hidden{display:none}h1{font-size:64px;margin-bottom:20px;text-shadow:0 0 20px #FF00AA;animation:rotateTitle 4s linear infinite}@keyframes rotateTitle{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}p{font-size:24px;margin:10px;color:#FFD700}button{padding:10px 20px;margin:10px;font-size:18px;background:#0A0A1A;color:#00FFCC;border:2px solid #00FFCC;cursor:pointer;font-family:inherit}button:hover{background:#00FFCC;color:#0A0A1A}#gameOverScreen h2{font-size:48px;color:#FF00AA}</style></head><body><canvas id='gameCanvas'></canvas><div id='ui'><div id='timer'>TIME: 60.0s</div><div id='score'>SCORE: 0</div></div><div id='powerups'><span id='dilation' style='color:#00CCFF'>⏳</span><span id='extension' style='color:#FFD700'>⏰</span></div><div class='overlay' id='startScreen'><h1>CHRONOSHIFT</h1><p>Rotating Obstacle Avoidance</p><p>Arrow Keys/WASD to Move | SPACE to Dash</p><p>Survive 60 seconds!</p><button onclick='startGame()'>PRESS SPACE TO START</button></div><div class='overlay hidden' id='pauseScreen'><h2>PAUSED</h2><button onclick='resumeGame()'>RESUME</button><button onclick='restartGame()'>RESTART</button><button onclick='quitGame()'>QUIT</button></div><div class='overlay hidden' id='gameOverScreen'><h2>GAME OVER</h2><p id='finalScore'>SCORE: 0</p><p id='highScore'>HIGH SCORE: 0</p><button onclick='restartGame()'>PRESS R TO RESTART</button></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}resize();window.addEventListener('resize',resize);const keys={};let gameState='start';let score=0,timer=60,highScore=parseInt(localStorage.getItem('chronoHighScore'))||0;let obstacles=[],powerUps=[],particles=[],player;let lastTime=0,spawnTimer=0,dilationActive=0,extensionActive=0,dashCooldown=0,dashTimer=0;let screenFlash=0;const audioCtx=new(window.AudioContext||window.webkitAudioContext)();function playSound(freq,dur,type='square'){const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=0.1;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}function startGame(){gameState='playing';score=0;timer=60;obstacles=[];powerUps=[];particles=[];player={x:W/2,y:H/2,vx:0,vy:0,r:16,color:'#00FFCC',trail:[]};spawnTimer=0;dashCooldown=0;dashTimer=0;dilationActive=0;extensionActive=0;screenFlash=0;document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameOverScreen').classList.add('hidden');document.getElementById('pauseScreen').classList.add('hidden');updateHUD()}function pauseGame(){if(gameState==='playing'){gameState='pause';document.getElementById('pauseScreen').classList.remove('hidden')}}function resumeGame(){gameState='playing';document.getElementById('pauseScreen').classList.add('hidden');lastTime=performance.now()}function restartGame(){startGame()}function quitGame(){gameState='start';document.getElementById('pauseScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}function gameOver(){gameState='over';if(score>highScore){highScore=score;localStorage.setItem('chronoHighScore',highScore)}document.getElementById('finalScore').textContent='SCORE: '+score;document.getElementById('highScore').textContent='HIGH SCORE: '+highScore;document.getElementById('gameOverScreen').classList.remove('hidden');playSound(200,0.5,'sawtooth')}function updateHUD(){document.getElementById('timer').textContent='TIME: '+timer.toFixed(1)+'s';document.getElementById('score').textContent='SCORE: '+score;document.getElementById('dilation').classList.toggle('active',dilationActive>0);document.getElementById('extension').classList.toggle('active',extensionActive>0)}class Obstacle{constructor(type,x,y,size,rotSpeed){this.type=type;this.x=x;this.y=y;this.size=size;this.rotSpeed=rotSpeed;this.rotation=Math.random()*Math.PI*2;this.baseRotSpeed=rotSpeed;this.gaps=[];if(type==='ring'){const numGaps=2+Math.floor(Math.random()*2);for(let i=0;i<numGaps;i++)this.gaps.push(i/numGaps*Math.PI*2)}this.turrets=[];if(type==='turret'){const numT=4+Math.floor(Math.random()*4);for(let i=0;i<numT;i++)this.turrets.push({angle:i/numT*Math.PI*2})}this.hue=type==='blade'?0:type==='ring'?280:45}update(dt){this.rotation+=this.rotSpeed*dt;if(this.type==='turret')this.turrets.forEach(t=>t.angle+=dt*2)}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);if(this.type==='blade'){const blades=3+Math.floor(this.size/20);ctx.fillStyle='hsl('+this.hue+',100%,50%)';for(let i=0;i<blades;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(this.size*0.3,0);ctx.lineTo(this.size*0.1,this.size*0.8);ctx.lineTo(-this.size*0.1,this.size*0.8);ctx.lineTo(-this.size*0.3,0);ctx.closePath();ctx.fill();ctx.rotate(Math.PI*2/blades)}ctx.shadowBlur=20;ctx.shadowColor='hsl('+this.hue+',100%,50%)';ctx.fill();ctx.shadowBlur=0}else if(this.type==='ring'){ctx.strokeStyle='hsla('+this.hue+',100%,50%,0.5)';ctx.lineWidth=15;ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(10,10,26,0.8)';for(const gap of this.gaps){ctx.beginPath();ctx.arc(0,0,this.size,gap-0.1,gap+0.1);ctx.lineTo(0,0);ctx.fill()}ctx.shadowBlur=15;ctx.shadowColor='hsl('+this.hue+',100%,50%)';ctx.stroke();ctx.shadowBlur=0}else if(this.type==='turret'){ctx.fillStyle='#111';ctx.fillRect(-this.size*0.2,-this.size*0.2,this.size*0.4,this.size*0.4);this.turrets.forEach(t=>{ctx.save();ctx.rotate(t.angle);ctx.fillStyle='hsl('+this.hue+',100%,60%)';ctx.fillRect(this.size*0.1,-3,this.size*0.6,6);ctx.shadowBlur=10;ctx.shadowColor='hsl('+this.hue+',100%,60%)';ctx.fill();ctx.shadowBlur=0;ctx.restore()})}ctx.restore()}checkCollision(px,py,pr){const dx=px-this.x;const dy=py-this.y;const dist=Math.sqrt(dx*dx+dy*dy);if(this.type==='blade'){if(dist<this.size*0.8&&dist>this.size*0.2){const angle=Math.atan2(dy,dx)-this.rotation;const normAngle=((angle%Math.PI*2)+Math.PI*2)%(Math.PI*2);const bladeAngle=normAngle%(Math.PI*2/(3+Math.floor(this.size/20)));return bladeAngle<0.3||bladeAngle>Math.PI*2/(3+Math.floor(this.size/20))-0.3}return false}if(this.type==='ring'){const gapAngle=Math.atan2(dy,dx)-this.rotation;const normGap=((gapAngle%Math.PI*2)+Math.PI*2)%(Math.PI*2);let inGap=false;for(const gap of this.gaps){const gapStart=gap-0.1;const gapEnd=gap+0.1;if(normGap>=gapStart&&normGap<=gapEnd)inGap=true}return dist<this.size+pr&&dist>this.size-pr*2&&!inGap}if(this.type==='turret'){if(dist<this.size*0.5)return true;for(const t of this.turrets){const tAngle=Math.atan2(dy-t.y,dx-t.x)-t.angle;const tDist=Math.sqrt((dx-t.x)**2+(dy-t.y)**2);if(tDist<this.size*0.8&&Math.abs(Math.sin(tAngle))<0.1)return true}}return dist<pr}checkCollisionPoint(px,py){const dx=px-this.x;const dy=py-this.y;return Math.sqrt(dx*dx+dy*dy)<this.size}}class PowerUp{constructor(x,y,type){this.x=x;this.y=y;this.type=type;this.size=20;this.rotation=Math.random()*Math.PI*2;this.life=10;this.pulse=0}update(dt){this.life-=dt;this.pulse+=dt*3;this.rotation+=dt}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);const alpha=0.5+0.5*Math.sin(this.pulse);ctx.globalAlpha=alpha;ctx.fillStyle=this.type==='dilation'?'#00CCFF':'#FFD700';ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0A0A1A';ctx.font='16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.type==='dilation'?'⏳':'⏰',0,0);ctx.restore()}}function spawnObstacle(){const type=['blade','ring','turret'][Math.floor(Math.random()*3)];const size=40+Math.random()*60;const rotSpeed=(50+Math.random()*100)*Math.PI/180;let x,y,valid;do{x=Math.random()*W;y=Math.random()*H;valid=true;for(const o of obstacles){if(Math.hypot(x-o.x,y-o.y)<150){valid=false;break}}}if(valid){obstacles.push(new Obstacle(type,x,y,size,rotSpeed))}}function spawnPowerUp(){const x=Math.random()*(W-200)+100;const y=Math.random()*(H-200)+100;const type=Math.random()>0.5?'dilation':'extension';powerUps.push(new PowerUp(x,y,type))}function updatePlayer(dt){const speed=4;const accel=0.5;let ax=0,ay=0;if(keys['ArrowLeft']||keys['KeyA'])ax=-accel;if(keys['ArrowRight']||keys['KeyD'])ax=accel;if(keys['ArrowUp']||keys['KeyW'])ay=-accel;if(keys['ArrowDown']||keys['KeyS'])ay=accel;if(dashTimer>0&&keys['Space']){ax*=2;ay*=2;dashTimer-=dt}if(keys['Space']&&dashCooldown<=0&&dashTimer<=0){dashTimer=1;dashCooldown=3;playSound(400,0.1,'sine')}player.vx=(player.vx+ax)*0.95;player.vy=(player.vy+ay)*0.95;const spd=Math.sqrt(player.vx*player.vx+player.vy*player.vy);if(spd>speed){player.vx*=speed/spd;player.vy*=speed/spd}player.x+=player.vx;player.y+=player.vy;player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));if(player.trail.length>20)player.trail.shift();player.trail.push({x:player.x,y:player.y,life:1});player.trail.forEach(t=>t.life-=dt*2);if(dashCooldown>0)dashCooldown-=dt;if(dilationActive>0)dilationActive-=dt;if(extensionActive>0)extensionActive-=dt;if(screenFlash>0)screenFlash-=dt*3}function updateObstacles(dt){const speedMult=dilationActive>0?0.5:1;obstacles.forEach(o=>o.update(dt*speedMult));obstacles=obstacles.filter(o=>o.life===undefined||o.life>0)}function checkCollisions(){for(const p of powerUps){if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+p.size){if(p.type==='dilation'){dilationActive=5;playSound(600,0.2,'sine')}else{timer+=5;playSound(800,0.2,'sine')}score+=100;particles.push(...Array.from({length:10},()=>({x:p.x,y:p.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:1,color:p.type==='dilation'?'#00CCFF':'#FFD700'})));p.life=0}}powerUps=powerUps.filter(p=>p.life>0)}for(const o of obstacles){if(o.checkCollision(player.x,player.y,player.r)){timer-=1;score=Math.max(0,score-50);screenFlash=0.2;playSound(150,0.3,'sawtooth');player.vx*=-0.5;player.vy*=-0.5;particles.push(...Array.from({length:15},()=>({x:player.x,y:player.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,color:'#FF00AA'})));break}}}function updateParticles(dt){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*2});particles=particles.filter(p=>p.life>0)}function draw(){ctx.fillStyle='rgba(10,10,26,0.2)';ctx.fillRect(0,0,W,H);particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;player.trail.forEach(t=>{if(t.life>0){ctx.globalAlpha=t.life*0.5;ctx.fillStyle='#00FFCC';ctx.beginPath();ctx.arc(t.x,t.y,player.r*t.life*0.5,0,Math.PI*2);ctx.fill()}});ctx.globalAlpha=1;ctx.fillStyle='#00FFCC';ctx.shadowBlur=20;ctx.shadowColor='#00FFCC';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;obstacles.forEach(o=>o.draw());powerUps.forEach(p=>p.draw());if(screenFlash>0){ctx.fillStyle='rgba(255,255,255,'+screenFlash+')';ctx.fillRect(0,0,W,H)}if(dilationActive>0){ctx.strokeStyle='rgba(0,204,255,0.2)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H/2,Math.max(W,H),0,Math.PI*2);ctx.stroke()}}function gameLoop(timestamp){const dt=Math.min((timestamp-lastTime)/1000,0.05);lastTime=timestamp;if(gameState==='playing'){timer-=dt;score+=dt*20;spawnTimer+=dt;if(spawnTimer>2&&obstacles.length<8){spawnObstacle();spawnTimer=0}if(Math.random()<0.005&&powerUps.length<2)spawnPowerUp();updatePlayer(dt);updateObstacles(dt);checkCollisions();updateParticles(dt);updateHUD();if(timer<=0)gameOver()}if(gameState!=='pause'){draw()}requestAnimationFrame(gameLoop)}window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(gameState==='start'&&(e.code==='Space'||e.code==='Enter'))startGame();if(gameState==='over'&&e.code==='KeyR')restartGame();if(e.code==='Escape'&&gameState==='playing')pauseGame();if(e.code==='Escape'&&gameState==='pause')resumeGame()});window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('touchstart',e=>{if(gameState==='start')startGame();const touch=e.touches[0];keys['TouchX']=touch.clientX;keys['TouchY']=touch.clientY});window.addEventListener('touchmove',e=>{if(gameState==='playing'&&keys['TouchX']!==undefined){const touch=e.touches[0];const dx=touch.clientX-keys['TouchX'];const dy=touch.clientY-keys['TouchY'];keys['ArrowLeft']=dx<-20;keys['ArrowRight']=dx>20;keys['ArrowUp']=dy<-20;keys['ArrowDown']=dy>20}keys['TouchX']=e.touches[0].clientX;keys['TouchY']=e.touches[0].clientY});window.addEventListener('touchend',()=>{Object.keys(keys).forEach(k=>{if(k.startsWith('Arrow')||k==='Space')delete keys[k]})});document.getElementById('highScore').textContent='HIGH SCORE: '+highScore;player={x:W/2,y:H/2,vx:0,vy:0,r:16,trail:[]};requestAnimationFrame(gameLoop);</script></body></html>
