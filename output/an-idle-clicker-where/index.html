<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click & Collect - Idle Clicker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='70' font-size='60' font-family='Arial' fill='%23FFD700'%3E💰%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0A0A0A 0%, #1A1A2E 100%); font-family: 'Montserrat', sans-serif; overflow: hidden; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #gameCanvas { background: #0A0A0A; border: 2px solid #00E5FF; border-radius: 8px; max-width: 100%; max-height: 100%; width: 640px; height: 480px; }n        #speedrunTimer { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 5px; font-family: 'Montserrat', sans-serif; color: #FFD700; font-size: 18px; font-weight: bold; }
        @media (max-width: 640px) { #gameCanvas { width: 100%; height: auto; } }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div id="speedrunTimer">Time: 00:00</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
