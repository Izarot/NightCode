<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Parasite Protocol</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#010409;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden}#c{display:block;max-width:100vw;max-height:100vh;touch-action:none}</style></head><body><canvas id="c" width="960" height="640"></canvas><script>
const C={W:960,H:640,T:32,COLS:30,ROWS:20,BGC:'#0d1117',GRID:'#161b22',PATH:'#2d333b',GLOW:'#3fb950',DARK:'#161b22',BORDER:'#30363d',TEXT:'#e6edf3',BLUE:'#388bfd',CYAN:'#39d353',ORANGE:'#f0883e',RED:'#da3633',GOLD:'#d29922',PURPLE:'#a371f7',LBLUE:'#58a6ff',GRAY:'#8b949e'},A={shoot:{f:440,d:.05,t:'sawtooth'},hit:{f:220,d:.1,t:'sine'},death:{f:440,d:.2,t:'sine'},destroy:{f:80,d:.3,t:'sawtooth'},absorb:{f1:200,f2:600,d:.4,t:'triangle'},wave:{f:[262,330,392],d:.1,t:'sine'},over:{f:[392,330,262,220],d:.15,t:'sine'},click:{f:880,d:.05,t:'square'}},TYPES=[{t:'Blaster',c:50,d:10,r:2.5,f:1,c:'#388bfd'},{t:'Zapper',c:100,d:5,r:3.5,f:3,c:'#39d353'},{t:'Cannon',c:200,d:40,r:2,f:.4,c:'#f0883e'}];let ctx,canvas,state,enemies,towers,projectiles,particles,waypoints,gold,lives,score,wave,totalTV,spawnTimer,spawnCount,waveSize,gameSpeed=1,highScore=parseInt(localStorage.getItem('ppHS')||'0'),timer=0,selectedT=-1,placedT=null,targetMode=0,autoLaunch=!1,prepTime=5,gameState='menu',lastTime=0,tooltip=null,aCtx=null;function initAudio(){try{aCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}function play(n,v=1){if(!aCtx)return;let o=aCtx.createOscillator(),g=aCtx.createGain();o.type=A[n].t;o.frequency.value=A[n].f1||A[n].f;g.gain.setValueAtTime(v*.3,aCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,aCtx.currentTime+A[n].d);o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+A[n].d);if(A[n].f2){let s=aCtx.currentTime,e=A[n].d;o.frequency.setValueAtTime(A[n].f1,aCtx.currentTime);o.frequency.linearRampToValueAtTime(A[n].f2,aCtx.currentTime+e/2);o.frequency.linearRampToValueAtTime(A[n].f1,aCtx.currentTime+e)}}function playChord(freqs){freqs.forEach((f,i)=>{setTimeout(()=>play('click'),i*80)})}function genPath(){let w=[];for(let c=0;c<C.COLS;c++)w.push({x:c*C.T+C.T/2,y:C.T*5+C.T/2});let p=[];for(let i=0;i<w.length-1;i+=3){let x=w[i].x,y=w[i].y,ex=w[i+1].x,ey=w[i+1].y;for(let t=0;t<=1;t+=.1){let nx=x+(ex-x)*t,ny=y+(ey-y)*t+(Math.sin(t*Math.PI*2)*20);p.push({x:nx,y:ny})}}return p}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function init(){enemies=[];towers=[];projectiles=[];particles=[];waypoints=genPath();gold=200;lives=20;score=0;wave=0;totalTV=0;spawnTimer=0;spawnCount=0;waveSize=0;gameSpeed=1;selectedT=-1;placedT=null;targetMode=0;prepTime=5;timer=0;gameState='prep'}function update(dt){if(gameState==='menu'||gameState==='gameover'||gameState==='victory')return;timer+=dt;if(gameState==='prep'){prepTime-=dt;if(prepTime<=0){startWave()}}else if(gameState==='playing'){updateEnemies(dt);updateTowers(dt);updateProjectiles(dt);updateParticles(dt);spawnEnemies(dt);if(enemies.length===0&&spawnCount>=waveSize){gameState='wave_complete';setTimeout(()=>{if(gameState==='wave_complete')gameState='playing'},3000)}}else if(gameState==='wave_complete'){if(enemies.length===0&&spawnCount>=waveSize&&wave>=20){gameState='victory';if(score>highScore){highScore=score;localStorage.setItem('ppHS',highScore)}}}}function startWave(){wave++;waveSize=5+wave*2;spawnCount=0;spawnTimer=0;gameState='playing'}function updateEnemies(dt){for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.hp<=0){if(e.state==='absorb'){let bonus=e.absorb||0;e.hp+=bonus;e.maxHp+=bonus;e.absorb=0}spawnDeath(e.x,e.y);play('death');score+=10;gold+=10+e.wave*2;enemies.splice(i,1);continue}if(e.reached){enemies.splice(i,1);lives--;play('hit');if(lives<=0)gameState='gameover';continue}if(e.state==='spawning'){e.spawnTimer+=dt;if(e.spawnTimer>=.3)e.state='walking'}else if(e.state==='walking'){let target=waypoints[e.waypoint];if(!target){e.reached=!0;continue}let dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy);if(d<5){e.waypoint++;if(e.waypoint>=waypoints.length)e.reached=!0}else{e.x+=dx/d*e.speed*C.T*dt;e.y+=dy/d*e.speed*C.T*dt}}}for(let e of enemies){if(e.state==='absorb'&&e.absorbTimer>0){e.absorbTimer-=dt;if(e.absorbTimer<=0)e.state='walking'}}}function updateTowers(dt){for(let t of towers){if(t.hp<=0){spawnDestroy(t.x,t.y);totalTV-=t.value;let nearest=enemies.reduce((a,b)=>dist(b,t)<dist(a,t)?b:a,null);if(nearest&&nearest.state!=='dying'){nearest.state='absorb';nearest.absorbTimer=.5;nearest.absorb=(nearest.absorb||0)+t.value;spawnAbsorb(t.x,t.y,nearest);play('absorb')}continue}if(t.target){if(t.target.hp<=0||dist(t,t.target)>t.range*C.T)t.target=null}if(!t.target){let targets=enemies.filter(e=>e.state==='walking'||e.state==='spawning');if(targets.length>0){if(targetMode===0)t.target=targets.reduce((a,b)=>b.waypoint>a.waypoint?b:a);else if(targetMode===1)t.target=targets.reduce((a,b)=>dist(t,b)<dist(t,a)?b:a);else t.target=targets.reduce((a,b)=>b.hp>a.hp?b:a)}}if(t.target){t.fireTimer-=dt;if(t.fireTimer<=0){fireProjectile(t);t.fireTimer=1/t.fps;play('shoot')}}t.angle+=.02*dt*60}}function fireProjectile(t){let p={x:t.x,y:t.y,tx:t.target,type:t.type,dmg:t.dmg,speed:8*t.fps,angle:Math.atan2(t.target.y-t.y,t.target.x-t.x),life:1};projectiles.push(p);if(t.type===1){let near=enemies.filter(e=>e!==t.target&&dist(t.target,e)<100).slice(0,2);near.forEach(e=>{projectiles.push({x:t.target.x,y:t.target.y,tx:e,type:1,dmg:t.dmg*.5,speed:12,angle:Math.atan2(e.y-t.target.y,e.target.x-t.target.x),life:.5})})}}function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];if(!p.tx||p.tx.hp<=0){projectiles.splice(i,1);continue}p.x+=Math.cos(p.angle)*p.speed*C.T*dt;p.y+=Math.sin(p.angle)*p.speed*C.T*dt;p.life-=dt;if(dist(p,p.tx)<15||p.life<=0){p.tx.hp-=p.dmg;p.tx.maxHp=Math.max(p.tx.maxHp,p.tx.hp);spawnImpact(p.x,p.y);play('hit');projectiles.splice(i,1)}}}}function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=p.gravity*dt*60;if(p.life<=0)particles.splice(i,1)}}function spawnDeath(x,y){for(let i=0;i<8;i++){let a=Math.random()*Math.PI*2,v=2+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5,maxLife:.5,color:C.RED,size:3,gravity:0})}for(let i=0;i<4;i++){particles.push({x,y,vx:(Math.random()-.5)*2,vy:-2-Math.random()*2,life:1,maxLife:1,color:C.GOLD,size:4,gravity:.1})}}function spawnDestroy(x,y){play('destroy');for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*2;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.8,maxLife:.8,color:C.ORANGE,size:4,gravity:.05})}}function spawnAbsorb(x,y,tgt){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,v=3+Math.random()*2;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5,maxLife:.5,color:C.PURPLE,size:3,gravity:-.1,tx:tgt.x,ty:tgt.y,curve:.1})}}function spawnImpact(x,y){for(let i=0;i<4;i++){let a=Math.random()*Math.PI*2,v=2+Math.random()*2;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.2,maxLife:.2,color:'#fff',size:2,gravity:0})}}function spawnEnemies(dt){if(spawnCount>=waveSize)return;spawnTimer-=dt;if(spawnTimer<=0&&gameState==='playing'){let e={x:waypoints[0].x,y:waypoints[0].y,hp:50+totalTV*.5,maxHp:50+totalTV*.5,speed:1+.05*wave,waypoint:1,state:'spawning',spawnTimer:0,absorb:0,absorbTimer:0,wave,reached:!1,radius:12};enemies.push(e);spawnCount++;spawnTimer=1.2}}function render(){ctx.fillStyle=C.BGC;ctx.fillRect(0,0,C.W,C.H);renderGrid();renderPath();renderTowers();renderEnemies();renderProjectiles();renderParticles();renderHUD();if(tooltip)renderTooltip();if(gameState==='menu')renderMenu();else if(gameState==='gameover')renderGameOver();else if(gameState==='victory')renderVictory();else if(gameState==='wave_complete')renderWaveComplete()}function renderGrid(){ctx.strokeStyle=C.GRID;ctx.globalAlpha=.3;ctx.lineWidth=1;for(let x=0;x<=C.W;x+=C.T){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,C.H);ctx.stroke()}for(let y=0;y<=C.H;y+=C.T){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(C.W,y);ctx.stroke()}ctx.globalAlpha=1}function renderPath(){ctx.strokeStyle=C.PATH;ctx.lineWidth=C.T*.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();if(waypoints.length>0){ctx.moveTo(waypoints[0].x,waypoints[0].y);for(let i=1;i<waypoints.length;i++)ctx.lineTo(waypoints[i].x,waypoints[i].y)}ctx.stroke();ctx.strokeStyle=C.GLOW;ctx.lineWidth=2;ctx.shadowColor=C.GLOW;ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0}function renderEnemies(){for(let e of enemies){ctx.save();ctx.globalAlpha=e.state==='spawning'?e.spawnTimer/.3:e.state==='dying'?e.life/.3:1;ctx.fillStyle=C.RED;ctx.beginPath();ctx.arc(e.x,e.y,e.radius*(e.state==='dying'?e.life/.3:1),0,Math.PI*2);ctx.fill();ctx.fillStyle=C.PURPLE;ctx.globalAlpha=.5+.3*Math.sin(timer*12);ctx.beginPath();ctx.arc(e.x,e.y,e.radius*.5,0,Math.PI*2);ctx.globalAlpha=1;if(e.state==='absorb'){ctx.strokeStyle=C.PURPLE;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.radius+5,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#333';ctx.fillRect(e.x-12,e.y-e.radius-8,24,4);ctx.fillStyle=e.hp/e.maxHp>.5?'#3fb950':e.hp/e.maxHp>.25?'#d29922':'#da3633';ctx.fillRect(e.x-12,e.y-e.radius-8,24*(e.hp/e.maxHp),4);ctx.restore()}}function renderTowers(){for(let t of towers){ctx.save();ctx.fillStyle=t.color;if(t.type===0){ctx.fillRect(t.x-12,t.y-12,24,24);ctx.fillStyle='#fff';ctx.fillRect(t.x-2,t.y+6,4,-14);ctx.translate(t.x,t.y);ctx.rotate(t.angle);ctx.fillStyle='#fff';ctx.fillRect(0,-3,14,6)}else if(t.type===1){ctx.translate(t.x,t.y);ctx.rotate(Math.PI/4);ctx.fillRect(-10,-10,20,20);ctx.rotate(-Math.PI/4);ctx.strokeStyle='#39d353';ctx.lineWidth=2;for(let i=0;i<3;i++){let a=t.angle+i*Math.PI*2/3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18);ctx.stroke()}}else{ctx.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3-Math.PI/6;ctx.lineTo(t.x+Math.cos(a)*14,t.y+Math.sin(a)*14)}ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,5,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.fillStyle='#333';ctx.fillRect(t.x-12,t.y+16,24,4);ctx.fillStyle='#3fb950';ctx.fillRect(t.x-12,t.y+16,24*(t.hp/200),4);if(placedT===t){ctx.strokeStyle=t.color;ctx.globalAlpha=.3;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(t.x,t.y,t.range*C.T,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}}}function renderProjectiles(){for(let p of projectiles){ctx.fillStyle=p.type===0?C.BLUE:p.type===1?C.CYAN:C.ORANGE;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()}}function renderParticles(){for(let p of particles){ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function renderHUD(){ctx.fillStyle=C.DARK;ctx.fillRect(0,0,C.W,48);ctx.fillStyle=C.BORDER;ctx.fillRect(0,48,C.W,1);ctx.fillStyle=C.TEXT;ctx.font='bold 16px Courier New';ctx.fillText('❤️ '+lives,20,30);ctx.fillStyle=C.LBLUE;ctx.fillText('WAVE '+wave+'/20',C.W/2-50,30);ctx.fillStyle=C.GOLD;ctx.fillText('💰 '+gold,450,30);ctx.fillStyle=C.GRAY;ctx.fillText('Score: '+score,580,30);ctx.fillStyle=C.GRAY;ctx.fillText('⏱️ '+formatTime(timer),780,30);ctx.fillStyle=C.GRAY;ctx.fillText('Best: '+highScore,880,30);ctx.fillStyle=C.DARK;ctx.fillRect(C.W-170,58,160,C.H-100);ctx.fillStyle=C.BORDER;ctx.fillRect(C.W-170,58,160,1);ctx.fillStyle=C.TEXT;ctx.font='bold 14px Courier New';ctx.fillText('TOWERS',C.W-160,80);let types=['Blaster','Zapper','Cannon'];types.forEach((name,i)=>{let ty=TYPES[i],by=100+i*50,canAfford=gold>=ty.c;ctx.fillStyle=canAfford?C.BORDER:'#222';ctx.fillRect(C.W-160,by,140,40);ctx.fillStyle=canAfford?C.TEXT:'#555';ctx.font='12px Courier New';ctx.fillText(name,C.W-150,by+15);ctx.fillStyle=canAfford?C.GOLD:'#555';ctx.fillText('$'+ty.c,C.W-150,by+32);ctx.fillStyle=canAfford?ty.c:'#333';ctx.fillRect(C.W-50,by+10,30,20)});ctx.fillStyle=C.TEXT;ctx.font='12px Courier New';ctx.fillText('Speed:',C.W-160,C.H-45);ctx.fillStyle=gameSpeed===1?C.LBLUE:C.ORANGE;ctx.fillText('1x',C.W-120,C.H-45);ctx.fillStyle=gameSpeed===2?C.LBLUE:C.ORANGE;ctx.fillText('2x',C.W-90,C.H-45);if(placedT&&selectedT>=0){let t=TYPES[selectedT];ctx.fillStyle=C.TEXT;ctx.fillText(t.t,20,80);ctx.fillText('DMG:'+t.d+' RNG:'+t.r+' SPD:'+t.f,20,100);ctx.fillStyle=C.RED;ctx.fillText('Click tile to place',20,120)}}function renderMenu(){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,C.W,C.H);ctx.fillStyle=C.RED;ctx.font='bold 48px Courier New';ctx.fillText('PARASITE',C.W/2-150,C.H/2-60);ctx.fillStyle=C.PURPLE;ctx.fillText('PROTOCOL',C.W/2-150,C.H/2-10);ctx.fillStyle=C.TEXT;ctx.font='16px Courier New';ctx.fillText('Enemies absorb tower HP when destroyed!',C.W/2-200,C.H/2+40);ctx.fillText('Build wisely or feed the parasites.',C.W/2-180,C.H/2+65);ctx.fillStyle=C.LBLUE;ctx.fillText('[START GAME]',C.W/2-80,C.H/2+120);ctx.fillStyle=C.GRAY;ctx.fillText('Click towers to build | Right-click to sell/remove',C.W/2-240,C.H/2+160)}function renderGameOver(){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,C.W,C.H);ctx.fillStyle=C.RED;ctx.font='bold 48px Courier New';ctx.fillText('GAME OVER',C.W/2-150,C.H/2-40);ctx.fillStyle=C.TEXT;ctx.fillText('Final Score: '+score,C.W/2-80,C.H/2+20);ctx.fillText('High Score: '+highScore,C.W/2-80,C.H/2+50);ctx.fillStyle=C.LBLUE;ctx.fillText('[PLAY AGAIN]',C.W/2-80,C.H/2+100)}function renderVictory(){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,C.W,C.H);ctx.fillStyle=C.GLOW;ctx.font='bold 48px Courier New';ctx.fillText('VICTORY!',C.W/2-120,C.H/2-40);ctx.fillStyle=C.TEXT;ctx.fillText('Time: '+formatTime(timer),C.W/2-80,C.H/2+20);ctx.fillText('Score: '+score,C.W/2-80,C.H/2+50);if(score>=highScore){ctx.fillStyle=C.GOLD;ctx.fillText('NEW HIGH SCORE!',C.W/2-130,C.H/2+80)}ctx.fillStyle=C.LBLUE;ctx.fillText('[PLAY AGAIN]',C.W/2-80,C.H/2+130)}function renderWaveComplete(){ctx.fillStyle=C.GLOW;ctx.font='bold 32px Courier New';ctx.fillText('WAVE '+wave+' COMPLETE!',C.W/2-150,C.H/2);ctx.fillStyle=C.GOLD;ctx.fillText('+$'+(50+wave*10),C.W/2-50,C.H/2+40)}function renderTooltip(){}function formatTime(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}function handleClick(x,y){if(gameState==='menu'){init();gameState='playing';return}if(gameState==='gameover'||gameState==='victory'){init();gameState='playing';return}if(selectedT>=0&&placedT){let tx=Math.floor(x/C.T)*C.T+C.T/2,ty=Math.floor(y/C.T)*C.T+C.T/2;if(tx<C.W-170&&ty<64)return;if(tx>=C.W-170)return;let canPlace=!towers.some(t=>dist({x:tx,y:ty},t)<C.T);if(canPlace){let cost=TYPES[selectedT].c;if(gold>=cost){gold-=cost;let t={x:tx,y:ty,type:selectedT,hp:200,maxHp:200,dmg:TYPES[selectedT].d,range:TYPES[selectedT].r,fps:TYPES[selectedT].f,color:TYPES[selectedT].c,fireTimer:0,angle:0,target:null,value:TYPES[selectedT].c};towers.push(t);totalTV+=t.value;play('click');selectedT=-1;placedT=null;score+=5}}}else if(x>C.W-170&&y>58){let idx=Math.floor((y-100)/50);if(idx>=0&&idx<3&&gold>=TYPES[idx].c){selectedT=idx;placedT=!0;play('click')}}}function handleRightClick(x,y){if(gameState!=='playing'&&gameState!=='wave_complete'&&gameState!=='prep')return;let tx=Math.floor(x/C.T)*C.T+C.T/2,ty=Math.floor(y/C.T)*C.T+C.T/2;for(let i=towers.length-1;i>=0;i--){let t=towers[i];if(dist({x:tx,y:ty},t)<C.T){gold+=Math.floor(t.value*.6);totalTV-=t.value;play('click');towers.splice(i,1);return}}selectedT=-1;placedT=null}canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),scaleX=C.W/r.width,scaleY=C.H/r.height;handleClick((e.clientX-r.left)*scaleX,(e.clientY-r.top)*scaleY)};canvas.oncontextmenu=e=>{e.preventDefault();let r=canvas.getBoundingClientRect(),scaleX=C.W/r.width,scaleY=C.H/r.height;handleRightClick((e.clientX-r.left)*scaleX,(e.clientY-r.top)*scaleY)};function resize(){let ratio=C.W/C.H,w=window.innerWidth,h=window.innerHeight,scale=Math.min(w/ratio/C.W,h/C.H);canvas.style.width=(C.W*scale)+'px';canvas.style.height=(C.H*scale)+'px'}function loop(time){let dt=Math.min((time-lastTime)/1000,.1)*gameSpeed;lastTime=time;update(dt);render();requestAnimationFrame(loop)}window.onload=()=>{canvas=document.getElementById('c');ctx=canvas.getContext('2d');initAudio();resize();window.onresize=resize;init();requestAnimationFrame(loop)};
</script></body></html>
