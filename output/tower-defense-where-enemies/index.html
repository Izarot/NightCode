<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallcrawl Defense</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='70'>🛡️</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',monospace;background:#0a0a1a;color:#00ffea;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.bar{position:absolute;top:0;left:0;width:100%;height:40px;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);display:flex;align-items:center;padding:0 12px;gap:16px;font-size:14px}
#timer{position:absolute;top:8px;right:12px;background:#111; padding:4px 10px;border-radius:4px}
#highscore{position:absolute;top:8px;left:12px;background:#111;padding:4px 10px;border-radius:4px}
#radial{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.btn{background:#1a1a2e;border:2px solid #00ffea;color:#00ffea;padding:8px 12px;border-radius:50%;cursor:pointer;font-size:18px}
.btn.sel{box-shadow:0 0 12px #00ffea}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div class="bar">Wave: <b id="wave">1</b> | Lives: <span id="lives">❤️❤️❤️</span> | Energy: <b id="energy">0</b></div>
<div id="timer">Time: <b id="time">0.00</b></div>
<div id="highscore">High Score: <b id="hs">0</b></div>
<div id="radial">
<div class="btn" onclick="sel('floor')">⬜</div>
<div class="btn" onclick="sel('wall')">🧱</div>
<div class="btn" onclick="sel('ceil')">⬛</div>
</div>
</div>
<script src="core.js"></script>
<script src="game.js"></script>
<script src="rendering.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
