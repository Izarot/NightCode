<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHROMA CASCADE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0A0A12; overflow:hidden; font-family:'Rajdhani',sans-serif; user-select:none; -webkit-user-select:none; }
#gameCanvas { display:block; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(10,10,18,0.95); z-index:100; transition:opacity 1s ease; }
.overlay.hidden { opacity:0; pointer-events:none; }
.title { font-family:'Rajdhani',sans-serif; font-size:72px; font-weight:700; color:#00F0FF; text-shadow:0 0 30px rgba(0,240,255,0.5); letter-spacing:8px; margin-bottom:20px; }
.subtitle { font-size:24px; color:rgba(255,255,255,0.6); margin-bottom:60px; letter-spacing:4px; }
.game-btn { font-family:'Rajdhani',sans-serif; font-size:28px; font-weight:700; color:#00F0FF; background:transparent; border:3px solid #00F0FF; padding:15px 60px; cursor:pointer; letter-spacing:4px; transition:all 0.2s ease; text-transform:uppercase; }
.game-btn:hover { background:#00F0FF; color:#0A0A12; box-shadow:0 0 30px rgba(0,240,255,0.5); }
.stats { margin-top:40px; text-align:center; color:white; }
.stats p { font-size:24px; margin:10px 0; color:rgba(255,255,255,0.8); }
.stats span { color:#00F0FF; font-family:'Space Mono',monospace; }
.hint { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.3); font-size:14px; letter-spacing:2px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="startOverlay" class="overlay">
<h1 class="title">CHROMA CASCADE</h1>
<p class="subtitle">Draw paths. Sort the cascade.</p>
<button class="game-btn" id="startBtn">INITIATE</button>
<p class="hint">LEFT DRAG: DRAW | RIGHT DRAG: ERASE | SHIFT: SNAP TO 45°</p>
</div>
<div id="gameOverOverlay" class="overlay hidden">
<h1 class="title">SYSTEM FAILURE</h1>
<div class="stats">
<p>Accuracy: <span id="finalAccuracy">0%</span></p>
<p>Blocks Sorted: <span id="finalSorted">0</span> / <span id="finalTotal">0</span></p>
<p>High Score: <span id="highScore">0%</span></p>
</div>
<button class="game-btn" id="retryBtn" style="margin-top:50px;">RETRY</button>
</div>
<script>
const AudioManager = class {
constructor() { this.ctx=null; this.initialized=false; }
init() { if(this.initialized)return; try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.initialized=true;}catch(e){} }
playTone(f,d,t='sine',v=0.3) { if(!this.ctx)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d); }
playNoise(d,v=0.2) { if(!this.ctx)return; const bs=this.ctx.sampleRate*d,buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate),data=buf.getChannelData(0); for(let i=0;i<bs;i++)data[i]=Math.random()*2-1; const s=this.ctx.createBufferSource(),g=this.ctx.createGain(); s.buffer=buf; g.gain.setValueAtTime(v,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d); s.connect(g); g.connect(this.ctx.destination); s.start(); }
playDraw(spd) { this.playTone(80+spd*0.5,0.05,'sine',0.1); }
playFinalize() { this.playNoise(0.05,0.15); this.playTone(800,0.05,'square',0.1); }
playBounce(sz) { this.playTone(400-sz*5,0.1,'triangle',0.15); }
playSuccess() { this.playTone(523,0.15,'sine',0.2); setTimeout(()=>this.playTone(784,0.2,'sine',0.2),100); }
playError() { this.playTone(150,0.2,'square',0.15); }
};
const InputManager = class {
constructor(c) { this.canvas=c; this.isDrawing=false; this.isErasing=false; this.snapMode=false; this.currentLine=[]; this.lastPos=null; this.drawSpeed=0; this.onDraw=null; this.onFinalize=null; this.onErase=null; this.setup(); }
setup() {
const getPos=(e)=>{ const r=this.canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(this.canvas.width/r.width),y:(e.clientY-r.top)*(this.canvas.height/r.height)}; };
this.canvas.addEventListener('pointerdown',(e)=>{ e.preventDefault(); const pos=getPos(e); this.lastPos=pos; if(e.button===2){this.isErasing=true;if(this.onErase)this.onErase(pos);} else { if(pos.y<this.canvas.height*0.8){this.isDrawing=true;this.currentLine=[pos];} } });
this.canvas.addEventListener('pointermove',(e)=>{ if(!this.lastPos)return; const pos=getPos(e); const dx=pos.x-this.lastPos.x,dy=pos.y-this.lastPos.y; this.drawSpeed=Math.sqrt(dx*dx+dy*dy); if(this.isDrawing&&pos.y<this.canvas.height*0.8){ const segLen=Math.sqrt(dx*dx+dy*dy); if(segLen>=8){ let ex=pos.x,ey=pos.y; if(this.snapMode){ const ang=Math.atan2(dy,dx); const sa=Math.round(ang/(Math.PI/4))*(Math.PI/4); ex=this.lastPos.x+Math.cos(sa)*segLen; ey=this.lastPos.y+Math.sin(sa)*segLen; } let total=0; for(let i=1;i<this.currentLine.length;i++){ const p1=this.currentLine[i-1],p2=this.currentLine[i]; total+=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2); } if(total+segLen<=400){ const np={x:ex,y:ey}; this.currentLine.push(np); if(this.onDraw)this.onDraw(this.lastPos,np,this.drawSpeed); this.lastPos=np; } } } else if(this.isErasing){ if(this.onErase)this.onErase(pos); } });
const end=()=>{ if(this.isDrawing&&this.currentLine.length>1)if(this.onFinalize)this.onFinalize(this.currentLine); this.isDrawing=false; this.isErasing=false; this.currentLine=[]; this.lastPos=null; };
this.canvas.addEventListener('pointerup',end); this.canvas.addEventListener('pointerleave',end); this.canvas.addEventListener('contextmenu',(e)=>e.preventDefault());
window.addEventListener('keydown',(e)=>{if(e.key==='Shift')this.snapMode=true;}); window.addEventListener('keyup',(e)=>{if(e.key==='Shift')this.snapMode=false;});
}
};
const LineSystem = class {
constructor() { this.lines=[]; }
addLine(p) { this.lines.push({points:[...p],pulsePhase:0}); }
removeNear(pos,rad=20) { for(let i=this.lines.length-1;i>=0;i--){ for(const pt of this.lines[i].points){ const dx=pt.x-pos.x,dy=pt.y-pos.y; if(Math.sqrt(dx*dx+dy*dy)<rad){this.lines.splice(i,1);return true;} } } return false; }
update(dt) { for(const l of this.lines)l.pulsePhase+=dt*Math.PI*2; }
render(ctx,cur) {
ctx.lineCap='round'; ctx.lineJoin='round';
for(const line of this.lines){ const p=Math.sin(line.pulsePhase)*0.2+0.8; ctx.strokeStyle=`rgba(0,240,255,${0.3*p})`; ctx.lineWidth=16; ctx.shadowColor='#00F0FF'; ctx.shadowBlur=20; this.drawPath(ctx,line.points); ctx.stroke(); ctx.strokeStyle=`rgba(0,240,255,${p})`; ctx.lineWidth=4; ctx.shadowBlur=10; this.drawPath(ctx,line.points); ctx.stroke(); }
if(cur.length>1){ ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=4; ctx.shadowBlur=0; this.drawPath(ctx,cur); ctx.stroke(); }
ctx.shadowBlur=0;
}
drawPath(ctx,p) { ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y); for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y); }
getSegments() { const s=[]; for(const l of this.lines)for(let i=1;i<l.points.length;i++)s.push({p1:l.points[i-1],p2:l.points[i]}); return s; }
};
const Block = class {
constructor(x,y,sz,col) { this.x=x; this.y=y; this.size=sz; this.color=col; this.vx=(Math.random()-0.5)*100; this.vy=0; this.mass=sz===24?1:sz===32?2.5:6; this.trail=[]; this.scored=false; this.bounced=false; }
update(dt,gr=200) { this.trail.unshift({x:this.x,y:this.y}); if(this.trail.length>3)this.trail.pop(); this.vy+=gr*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; }
render(ctx) {
const al=[0.2,0.4,0.6];
for(let i=0;i<this.trail.length;i++){ const t=this.trail[i]; ctx.fillStyle=this.h2r(this.color,al[i]||0.2); ctx.fillRect(t.x-this.size/2,t.y-this.size/2,this.size,this.size); }
ctx.fillStyle=this.color; ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size); ctx.strokeStyle=this.lt(this.color,40); ctx.lineWidth=2; ctx.strokeRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
}
h2r(h,a) { const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
lt(h,amt) { const r=Math.min(255,parseInt(h.slice(1,3),16)+amt),g=Math.min(255,parseInt(h.slice(3,5),16)+amt),b=Math.min(255,parseInt(h.slice(5,7),16)+amt); return `rgb(${r},${g},${b})`; }
bounds() { return {left:this.x-this.size/2,right:this.x+this.size/2,top:this.y-this.size/2,bottom:this.y+this.size/2}; }
};
const BlockManager = class {
constructor(w,h) { this.w=w; this.h=h; this.blocks=[]; this.colors=['#FF3366','#33FF66','#3366FF']; this.spawnT=0; this.spawnInt=1.5; this.totalSpawned=0; this.totalScored=0; }
spawn() { if(this.blocks.length>=60){ let idx=0,maxY=this.blocks[0].y; for(let i=1;i<this.blocks.length;i++)if(this.blocks[i].y>maxY){maxY=this.blocks[i].y;idx=i;} this.blocks.splice(idx,1); return null; } const sz=[24,32,48][Math.floor(Math.random()*3)]; const col=this.colors[Math.floor(Math.random()*3)]; const x=100+Math.random()*(this.w-200); const b=new Block(x,-sz,sz,col); this.totalSpawned++; return b; }
update(dt) { this.spawnT+=dt; if(this.spawnT>=this.spawnInt){this.spawnT=0;const b=this.spawn();if(b)this.blocks.push(b);} for(const b of this.blocks)b.update(dt); this.blocks=this.blocks.filter(b=>b.y<this.h+100&&!b.scored); }
checkBins(bins,h) { const res=[]; for(const b of this.blocks){ if(b.scored)continue; const bd=b.bounds(); if(bd.bottom>h-100){ for(const bin of bins){ if(b.x>=bin.x&&b.x<=bin.x+bin.width){ const ok=b.color===bin.color; res.push({block:b,correct:ok}); b.scored=true; if(ok)this.totalScored++; break; } } } } this.blocks=this.blocks.filter(b=>!b.scored); return res; }
floorFall(h) { const f=this.blocks.filter(b=>b.y>h+50); this.blocks=this.blocks.filter(b=>b.y<=h+50); return f.length; }
render(ctx) { for(const b of this.blocks)b.render(ctx); }
};
const PhysicsEngine = class {
constructor() { this.rest=0.4; this.fric=0.95; }
lineCol(line,block) { const {p1,p2}=line; const cx=block.x,cy=block.y,r=block.size*0.7; const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.sqrt(dx*dx+dy*dy); if(len===0)return false; const t=Math.max(0,Math.min(1,((cx-p1.x)*dx+(cy-p1.y)*dy)/(len*len))); const clx=p1.x+t*dx,cly=p1.y+t*dy; const distX=cx-clx,distY=cy-cly,dist=Math.sqrt(distX*distX+distY*distY); if(dist<r){ const pen=r-dist; const nx=distX/dist||(-dy/len),ny=distY/dist||(dx/len); block.x+=nx*(pen+1); block.y+=ny*(pen+1); const dot=block.vx*nx+block.vy*ny; if(dot<0){ block.vx-=(1+this.rest)*dot*nx; block.vy-=(1+this.rest)*dot*ny; const tx=-ny,ty=nx,tv=block.vx*tx+block.vy*ty; block.vx-=this.fric*tv*tx; block.vy-=this.fric*tv*ty; } return true; } return false; }
resolveBB(b) { for(let i=0;i<b.length;i++)for(let j=i+1;j<b.length;j++){ const a=b[i],c=b[j],ab=a.bounds(),cb=c.bounds(); if(ab.right<cb.left||ab.left>cb.right||ab.bottom<cb.top||ab.top>cb.bottom)continue; const ox=Math.min(ab.right-cb.left,cb.right-ab.left),oy=Math.min(ab.bottom-cb.top,cb.bottom-ab.top); if(ox<oy){ const s=a.x<c.x?-1:1; a.x+=s*ox*0.5; c.x-=s*ox*0.5; const rv=a.vx-c.vx; a.vx-=rv*0.3; c.vx+=rv*0.3; } else { const s=a.y<c.y?-1:1; a.y+=s*oy*0.5; c.y-=s*oy*0.5; const rv=a.vy-c.vy; if(rv>0){a.vy-=rv*0.3;c.vy+=rv*0.3;} } } }
update(b,s) { for(const bl of b)for(const seg of s)this.lineCol(seg,bl); this.resolveBB(b); }
};
const Bin = class {
constructor(x,w,col,lbl) { this.x=x; this.width=w; this.color=col; this.label=lbl; this.fill=0; this.count=0; }
render(ctx,h) { const bh=80,y=h-bh; ctx.strokeStyle=this.color; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(this.x,y); ctx.lineTo(this.x+20,h); ctx.lineTo(this.x+this.width-20,h); ctx.lineTo(this.x+this.width,y); ctx.stroke(); if(this.fill>0){ const gr=ctx.createLinearGradient(this.x,y,this.x,h); gr.addColorStop(0,this.h2r(this.color,0.6)); gr.addColorStop(1,this.h2r(this.color,0.2)); ctx.fillStyle=gr; ctx.fillRect(this.x+2,y+2,this.width-4,(h-y-2)*this.fill); } ctx.fillStyle=this.color; ctx.font='16px "Space Mono"'; ctx.textAlign='center'; ctx.fillText(this.label,this.x+this.width/2,y-10); ctx.font='24px "Rajdhani"'; ctx.fillText(this.count.toString(),this.x+this.width/2,y+40); }
h2r(h,a) { const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }
add() { this.count++; this.fill=Math.min(1,this.fill+0.1); }
};
const UIRenderer = class {
constructor(c,w,h) { this.ctx=c; this.w=w; this.h=h; this.combos=[]; }
addCombo(x,y,n) { this.combos.push({x,y,text:n+'x',alpha:1,scale:1,life:0.8}); }
update(dt) { for(let i=this.combos.length-1;i>=0;i--){ const c=this.combos[i]; c.life-=dt; c.alpha=c.life/0.8; c.scale=1+(1-c.life/0.8)*0.5; if(c.life<=0)this.combos.splice(i,1); } }
render(timer,integ,sc,total,hs) { const c=this.ctx;
c.font='36px "Space Mono"'; c.textAlign='center'; c.fillStyle=timer<=15?(Math.sin(Date.now()/250)>0?'#FF3030':'white'):'white'; const m=Math.floor(timer/60),s=Math.floor(timer%60); c.fillText(m+':'+s.toString().padStart(2,'0'),this.w/2,45);
const bw=200,bx=20,by=25; c.fillStyle='rgba(255,255,255,0.2)'; c.fillRect(bx,by,bw,12); c.fillStyle=this.intCol(integ); c.fillRect(bx,by,bw*integ,12); c.font='14px "Space Mono"'; c.textAlign='left'; c.fillStyle='white'; c.fillText('INTEGRITY',bx,by-5);
c.textAlign='right'; c.fillStyle='rgba(255,255,255,0.6)'; c.font='16px "Space Mono"'; c.fillText(sc+' / '+total,this.w-20,35); c.fillText('SORTED',this.w-20,52); c.fillText('HI: '+hs+'%',this.w-20,70);
for(const cm of this.combos){ c.save(); c.globalAlpha=cm.alpha; c.font=`bold ${24*cm.scale}px "Rajdhani"`; c.textAlign='center'; c.fillStyle='#00F0FF'; c.shadowColor='#00F0FF'; c.shadowBlur=10; c.fillText(cm.text,cm.x,cm.y); c.restore(); }
c.strokeStyle='rgba(255,255,255,0.1)'; c.lineWidth=1; c.beginPath(); c.moveTo(0,this.h*0.8); c.lineTo(this.w,this.h*0.8); c.stroke();
}
intCol(i) { if(i>0.6)return '#33FF66'; if(i>0.3)return '#FFFF33'; return '#FF3366'; }
};
const GameState = class {
constructor() { this.canvas=document.getElementById('gameCanvas'); this.ctx=this.canvas.getContext('2d'); this.LW=1280; this.LH=720; this.state='start'; this.timer=90; this.integrity=1; this.targetInteg=1; this.audio=new AudioManager(); this.input=new InputManager(this.canvas); this.lineSys=new LineSystem(); this.blockMgr=new BlockManager(this.LW,this.LH); this.physics=new PhysicsEngine(); this.ui=new UIRenderer(this.ctx,this.LW,this.LH); this.comboCount=0; this.comboTimer=0; this.accum=0; this.fdt=1/60; this.deg=0; this.lastT=performance.now(); this.gridOff=0; this.highScore=parseInt(localStorage.getItem('cc_hs')||'0'); this.bins=[]; this.setupBins(); this.setupInput(); this.resize(); window.addEventListener('resize',()=>this.resize()); }
setupBins() { const bw=this.LW/3-40; this.bins=[new Bin(40,bw,'#FF3366','RED'),new Bin(this.LW/3+20,bw,'#33FF66','GREEN'),new Bin(this.LW*2/3,bw,'#3366FF','BLUE')]; }
setupInput() { this.input.onDraw=(a,b,sp)=>this.audio.playDraw(sp); this.input.onFinalize=(p)=>{ if(p.length>1){this.lineSys.addLine(p);this.audio.playFinalize();} }; this.input.onErase=(p)=>{ if(this.lineSys.removeNear(p))this.audio.playFinalize(); }; }
resize() { const a=this.LW/this.LH; let w=window.innerWidth,h=window.innerHeight; if(w/h>a)w=h*a; else h=w/a; this.canvas.style.width=w+'px'; this.canvas.style.height=h+'px'; this.canvas.width=this.LW; this.canvas.height=this.LH; }
start() { this.state='playing'; this.timer=90; this.integrity=1; this.targetInteg=1; this.blockMgr=new BlockManager(this.LW,this.LH); this.lineSys=new LineSystem(); this.comboCount=0; this.comboTimer=0; this.bins.forEach(b=>{b.count=0;b.fill=0;}); document.getElementById('startOverlay').classList.add('hidden'); document.getElementById('gameOverOverlay').classList.add('hidden'); this.audio.init(); }
gameOver() { this.state='gameover'; const acc=this.blockMgr.totalSpawned>0?Math.round((this.blockMgr.totalScored/this.blockMgr.totalSpawned)*100):0; if(acc>this.highScore){this.highScore=acc;localStorage.setItem('cc_hs',this.highScore);} document.getElementById('finalAccuracy').textContent=acc+'%'; document.getElementById('finalSorted').textContent=this.blockMgr.totalScored; document.getElementById('finalTotal').textContent=this.blockMgr.totalSpawned; document.getElementById('highScore').textContent=this.highScore+'%'; document.getElementById('gameOverOverlay').classList.remove('hidden'); }
update(dt) { if(this.state!=='playing')return; this.timer-=dt; this.gridOff=(this.gridOff+dt*20)%40; this.lineSys.update(dt); this.ui.update(dt); if(this.timer<=15)this.blockMgr.spawnInt=Math.max(0.4,1.5-(90-this.timer)/30); else this.blockMgr.spawnInt=1.5; this.blockMgr.update(dt); const segs=this.lineSys.getSegments(); this.physics.update(this.blockMgr.blocks,segs); for(const b of this.blockMgr.blocks){ const bd=b.bounds(); for(const bin of this.bins){ if(bd.bottom>this.LH-100&&b.x>=bin.x&&b.x<=bin.x+bin.width){ const ok=b.color===bin.color; if(ok){bin.add();this.comboCount++;this.comboTimer=1;this.ui.addCombo(b.x,b.y,this.comboCount);this.audio.playSuccess();} else {this.targetInteg=Math.max(0,this.targetInteg-0.05);this.audio.playError();} b.scored=true; break; } } } const fall=this.blockMgr.floorFall(this.LH); if(fall>0)this.targetInteg=Math.max(0,this.targetInteg-fall*0.03); if(this.blockMgr.blocks.length>60)this.targetInteg=Math.max(0,this.targetInteg-0.02); this.integrity+=(this.targetInteg-this.integrity)*0.1; this.comboTimer-=dt; if(this.comboTimer<=0)this.comboCount=0; if(this.timer<=0){ const acc=this.blockMgr.totalSpawned>0?(this.blockMgr.totalScored/this.blockMgr.totalSpawned):0; if(acc<0.75)this.targetInteg=0; } if(this.integrity<=0.01||(this.timer<=0&&(this.blockMgr.totalSpawned>0&&(this.blockMgr.totalScored/this.blockMgr.totalSpawned)<0.75)))this.gameOver(); }
render() { const c=this.ctx; c.fillStyle='#0A0A12'; c.fillRect(0,0,this.LW,this.LH); c.strokeStyle='rgba(26,10,42,0.2)'; c.lineWidth=1; for(let x=-this.gridOff;x<this.LW;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,this.LH);c.stroke();} for(let y=-this.gridOff;y<this.LH;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(this.LW,y);c.stroke();} for(const bin of this.bins)bin.render(c,this.LH); this.blockMgr.render(c); this.lineSys.render(c,this.input.currentLine); this.ui.render(this.timer,this.integrity,this.blockMgr.totalScored,this.blockMgr.totalSpawned,this.highScore); }
loop(now) { const dt=Math.min(0.1,(now-this.lastT)/1000); this.lastT=now; this.accum+=dt; const step=now-this.lastT>25?this.fdt*2:this.fdt; while(this.accum>=step){this.update(step);this.accum-=step;} this.render(); requestAnimationFrame((t)=>this.loop(t)); }
};
const game=new GameState();
document.getElementById('startBtn').addEventListener('click',()=>game.start());
document.getElementById('retryBtn').addEventListener('click',()=>game.start());
requestAnimationFrame((t)=>game.loop(t));
</script>
</body>
</html>
