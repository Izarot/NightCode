<!DOCTYPE html>
<html>
<head>
<title>ShapeShift</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🧩</text></svg>'>
</head>
<body>
<canvas id='c'></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=800,H=600,score=0;
const COLORS=['#3498DB','#E74C3C','#2ECC71','#F1C40F'];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
window.onresize=resize;resize();
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(){const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=440;g.gain.value=0.1;setTimeout(()=>g.gain.value=0,50);o.start();o.stop(audio.currentTime+0.05)}
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  x.fillStyle='#222';x.fillRect(0,0,W,H);
  x.fillStyle=COLORS[0];x.beginPath();x.arc(W/2,H/2,20,0,Math.PI*2);x.fill();
  x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
  x.fillStyle=COLORS[1];x.fillRect(W/2-50,H/2-10,100,20);
  x.fillStyle=score>1000?'#2ECC71':'#E74C3C';x.font='20px sans-serif';x.fillText('Score: '+score,W+10,H-10);
  beep();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
