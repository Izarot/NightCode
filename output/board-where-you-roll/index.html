<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<title>Path & Roll - Board Game</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#1A1D23;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#F4F1DE}.game-container{width:100%;max-width:900px;padding:16px;display:flex;flex-direction:column;gap:12px}.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#2A2F38;border-radius:12px}.header h1{font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;color:#F4F1DE}.timer{font-family:'Space Mono',monospace;font-size:18px;color:#81B29A;background:#1A1D23;padding:6px 12px;border-radius:8px}.turn-indicator{display:flex;align-items:center;gap:8px;font-weight:500}.turn-dot{width:16px;height:16px;border-radius:50%}.canvas-wrapper{position:relative;background:#2A2F38;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.1),0 10px 20px rgba(0,0,0,0.15)}.game-canvas{display:block;width:100%;height:auto;max-height:60vh}.ui-panel{display:flex;gap:12px;flex-wrap:wrap}.player-panels,.controls,.log-panel{flex:1;min-width:200px}.player-panels{display:flex;flex-direction:column;gap:8px}.player-card{background:rgba(61,68,80,0.8);backdrop-filter:blur(12px);border:1px solid rgba(244,241,222,0.1);border-radius:12px;padding:12px 16px;transition:all 0.3s}.player-card.active{box-shadow:0 0 20px var(--glow-color,transparent);border-color:var(--glow-color,transparent)}.player-card h3{display:flex;align-items:center;gap:8px;font-size:14px}.player-dot{width:12px;height:12px;border-radius:50%}.progress-bar{height:6px;background:#1A1D23;border-radius:3px;margin-top:8px;overflow:hidden}.progress-fill{height:100%;border-radius:3px;transition:width 0.3s}.player-pos{font-size:12px;color:#9CA3AF;margin-top:4px}.controls{background:#2A2F38;border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}.dice-display{width:100px;height:100px;background:#F4F1DE;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:48px;color:#1A1D23;box-shadow:inset -4px -4px 0 rgba(0,0,0,0.1);transition:transform 0.1s}.dice-display.rolling{animation:shake 0.1s infinite}.dice-display.reveal{animation:pulse 0.3s}.dices-container{display:flex;gap:16px}.roll-btn{background:#F4F1DE;color:#1A1D23;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;padding:14px 40px;border:none;border-radius:12px;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 8px rgba(0,0,0,0.2)}.roll-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,0.3)}.roll-btn:active:not(:disabled){transform:translateY(0)}.roll-btn:disabled{opacity:0.5;cursor:not-allowed}.roll-btn.pulse{border:2px solid #81B29A;animation:btnPulse 1.5s infinite}.log-panel{background:#2A2F38;border-radius:12px;padding:12px;max-height:180px;overflow-y:auto}.log-title{font-size:12px;color:#9CA3AF;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}.log-entries{font-size:13px;display:flex;flex-direction:column;gap:4px}.log-entry{display:flex;align-items:center;gap:6px}.log-dot{width:8px;height:8px;border-radius:50%}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s}.modal-overlay.show{opacity:1;pointer-events:all}.modal{background:#2A2F38;border-radius:16px;padding:32px;text-align:center;transform:scale(0.8);transition:transform 0.3s}.modal.show{transform:scale(1)}.modal h2{font-family:'Outfit',sans-serif;font-size:28px;margin-bottom:8px}.modal p{color:#9CA3AF;margin-bottom:24px}.modal-btn{background:#81B29A;color:#1A1D23;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;padding:14px 32px;border:none;border-radius:12px;cursor:pointer;margin:4px}.modal-btn:hover{background:#6a9b84}.setup-modal .modal{background:#2A2F38;min-width:300px}.player-select{display:flex;gap:8px;justify-content:center;margin:16px 0}.player-opt{flex:1;padding:12px;background:#3D4450;border:2px solid transparent;border-radius:8px;color:#F4F1DE;cursor:pointer;transition:all 0.2s;font-size:14px}.player-opt:hover,.player-opt.selected{border-color:#81B29A;background:#4A5568}.highscore{font-size:12px;color:#9CA3AF;margin-top:8px}.confetti{position:fixed;pointer-events:none;z-index:99}@keyframes shake{0%,100%{transform:translateX(-5px) rotate(-5deg)}50%{transform:translateX(5px) rotate(5deg)}}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(129,178,154,0.4)}50%{box-shadow:0 0 0 8px rgba(129,178,154,0)}}</style>
</head>
<body>
<div class="game-container">
<div class="header">
<h1>🎲 Path & Roll</h1>
<div class="turn-indicator" id="turnIndicator"><span class="turn-dot" id="turnDot" style="background:#E07A5F"></span><span id="turnText">Player 1's Turn</span></div>
<div class="timer" id="timer">00:00</div>
</div>
<div class="canvas-wrapper">
<canvas id="gameCanvas" class="game-canvas"></canvas>
</div>
<div class="ui-panel">
<div class="player-panels" id="playerPanels"></div>
<div class="controls">
<div class="dices-container">
<div class="dice-display" id="dice1">?</div>
</div>
<button class="roll-btn pulse" id="rollBtn">ROLL DICE</button>
<p style="font-size:12px;color:#9CA3AF">Press SPACE</p>
<p class="highscore">🏆 High Score: <span id="highScore">0</span> turns</p>
</div>
<div class="log-panel">
<div class="log-title">Game Log</div>
<div class="log-entries" id="logEntries"></div>
</div>
</div>
</div>
<div class="modal-overlay" id="setupModal"><div class="modal setup-modal"><h2>Path & Roll</h2><p>Choose number of players</p><div class="player-select"><button class="player-opt" data-players="2">2 Players</button><button class="player-opt selected" data-players="3">3 Players</button><button class="player-opt" data-players="4">4 Players</button></div><button class="modal-btn" id="startBtn">Start Game</button></div></div>
<div class="modal-overlay" id="winnerModal"><div class="modal"><h2>🎉 Winner!</h2><p id="winnerText">Player 1 Wins!</p><p id="winnerStats"></p><button class="modal-btn" id="playAgainBtn">Play Again</button></div></div>
<canvas id="confettiCanvas" class="confetti"></canvas>
<script>
const COLORS={bg:'#1A1D23',board:'#2A2F38',path:'#3D4450',tileHover:'#4A5568',players:['#E07A5F','#81B29A','#F2CC8F','#3D405B'],accent:'#F4F1DE',danger:'#E63946',success:'#2ECC71',bonus:'#3498DB',text:'#F4F1DE',textMuted:'#9CA3AF'};
const TILE_SIZE=52,TILE_GAP=4,TILE_COUNT=20,FINISH_TILE=20,BONUS_TILES=[5,12],PENALTY_TILES=[8,16];
let ctx,canvas,confettiCtx,confettiCanvas;
let audioCtx;
let state={phase:'SETUP',players:[],currentPlayerIndex:0,currentRoll:null,winner:null,startTime:null,turnsPlayed:0,moveQueue:[],isAnimating:false,log:[]};
let diceAnimation={active:false,startTime:0,duration:800,result:1};
let pathCoords=[];
function initAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){console.log('Audio not supported')}}
function playSound(type){if(!audioCtx)return;const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);switch(type){case'roll':osc.frequency.value=300;gain.gain.setValueAtTime(0.1, audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.2);osc.start();osc.stop(audioCtx.currentTime+0.2);break;case'land':osc.frequency.value=440;gain.gain.setValueAtTime(0.15, audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.15);osc.start();osc.stop(audioCtx.currentTime+0.15);break;case'bonus':osc.frequency.value=600;osc.type='triangle';gain.gain.setValueAtTime(0.1, audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.3);osc.start();osc.stop(audioCtx.currentTime+0.3);break;case'penalty':osc.frequency.value=150;osc.type='sawtooth';gain.gain.setValueAtTime(0.1, audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.4);osc.start();osc.stop(audioCtx.currentTime+0.4);break;case'win':osc.frequency.value=523;osc.type='sine';gain.gain.setValueAtTime(0.15, audioCtx.currentTime);[523,659,784,1047].forEach((f,i)=>{osc.frequency.setValueAtTime(f, audioCtx.currentTime+i*0.1)});gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.5);osc.start();osc.stop(audioCtx.currentTime+0.5);break;}}
function generatePath(){pathCoords=[];const rows=5,cols=4;let x=0,y=0,dir=1;for(let i=0;i<TILE_COUNT;i++){pathCoords.push({x,y,index:i});if(i===0){y++;continue}if(i%cols===0&&i<15){x+=dir;y++;if(x>=cols-1||x<=0)dir*=-1}else{x+=dir}}pathCoords.reverse()}
function getTilePos(index){const scale=canvas.width/800;const baseX=100*scale,baseY=80*scale;const t=pathCoords[index];if(!t)return{x:baseX,y:baseY};const col=t.x,row=t.y;const tileW=(TILE_SIZE+TILE_GAP)*scale; const totalCols=4;const startX=baseX+(800-200-(totalCols-1)*tileW)/2;return{x:startX+col*tileW,y:baseY+row*tileW}}
function initGame(numPlayers){state={phase:'PLAYING',players:[],currentPlayerIndex:0,currentRoll:null,winner:null,startTime:Date.now(),turnsPlayed:0,moveQueue:[],isAnimating:false,log:[]};for(let i=0;i<numPlayers;i++)state.players.push({id:i,name:`Player ${i+1}`,color:COLORS.players[i],position:0,isActive:i===0,isFinished:false,skipNextTurn:false});document.getElementById('setupModal').classList.remove('show');updateUI();addLog(`${state.players[0].name} starts the game!`,'start')}
function rollDice(){if(state.phase!=='PLAYING'||state.isAnimating)return;const player=state.players[state.currentPlayerIndex];if(player.skipNextTurn){player.skipNextTurn=false;addLog(`${player.name} skips their turn!`,'skip');advanceTurn();return}state.phase='ROLLING';diceAnimation.active=true;diceAnimation.startTime=performance.now();diceAnimation.result=Math.floor(Math.random()*6)+1;document.getElementById('rollBtn').disabled=true;playSound('roll');const diceEl=document.getElementById('dice1');diceEl.classList.add('rolling');setTimeout(()=>{diceEl.classList.remove('rolling');diceEl.classList.add('reveal');diceEl.textContent=diceAnimation.result;playSound('land');setTimeout(()=>diceEl.classList.remove('reveal'),300)},800)}
function finishRoll(){diceAnimation.active=false;state.phase='PLAYING';state.currentRoll=diceAnimation.result;const player=state.players[state.currentPlayerIndex];addLog(`${player.name} rolled a ${state.currentRoll}!`,player.color);state.moveQueue=[];for(let i=1;i<=state.currentRoll;i++){const newPos=Math.min(player.position+i,FINISH_TILE);state.moveQueue.push(newPos)}state.isAnimating=true;animateMovement()}
function animateMovement(){if(state.moveQueue.length===0){state.isAnimating=false;const player=state.players[state.currentPlayerIndex];checkSpecialTile(player);return}const nextPos=state.moveQueue.shift();const player=state.players[state.currentPlayerIndex];player.position=nextPos;updateUI();playSound('land');setTimeout(animateMovement,150)}
function checkSpecialTile(player){if(player.position>=FINISH_TILE){player.isFinished=true;state.winner=player;state.phase='GAME_OVER';playSound('win');const elapsed=Math.floor((Date.now()-state.startTime)/1000);const mins=Math.floor(elapsed/60).toString().padStart(2,'0');const secs=(elapsed%60).toString().padStart(2,'0');const highScore=localStorage.getItem('pathRollHighScore');if(!highScore||state.turnsPlayed<parseInt(highScore)){localStorage.setItem('pathRollHighScore',state.turnsPlayed);document.getElementById('highScore').textContent=state.turnsPlayed}document.getElementById('winnerText').textContent=`🏆 ${player.name} Wins!`;document.getElementById('winnerStats').textContent=`Finished in ${state.turnsPlayed} turns | Time: ${mins}:${secs}`;document.getElementById('winnerModal').classList.add('show');startConfetti();return}if(BONUS_TILES.includes(player.position)){addLog(`${player.name} landed on ROLL AGAIN!`,'bonus');playSound('bonus');state.turnsPlayed++;setTimeout(()=>{state.isAnimating=false;document.getElementById('rollBtn').disabled=false},500);return}if(PENALTY_TILES.includes(player.position)){addLog(`${player.name} landed on SKIP!`,'penalty');playSound('penalty');player.skipNextTurn=true}advanceTurn()}
function advanceTurn(){state.turnsPlayed++;state.currentPlayerIndex=(state.currentPlayerIndex+1)%state.players.length;state.players.forEach((p,i)=>p.isActive=i===state.currentPlayerIndex);const nextPlayer=state.players[state.currentPlayerIndex];addLog(`It's ${nextPlayer.name}'s turn`,'turn');updateUI();state.isAnimating=false;document.getElementById('rollBtn').disabled=false}
function updateUI(){state.players.forEach((p,i)=>{const card=document.getElementById(`player-${i}`);if(card){const isActive=state.currentPlayerIndex===i;card.className=`player-card${isActive?' active':''}`;card.querySelector('.progress-fill').style.width=`${(p.position/FINISH_TILE)*100}%`;card.querySelector('.progress-fill').style.backgroundColor=p.color;card.querySelector('.player-pos').textContent=`Position: Tile ${p.position}`;if(p.skipNextTurn)card.querySelector('.player-pos').innerHTML+=` <span style="color:#E63946">(Skipping next)</span>`}});const curr=state.players[state.currentPlayerIndex];document.getElementById('turnDot').style.background=curr.color;document.getElementById('turnText').textContent=`${curr.name}'s Turn`}
function addLog(text,color='text'){state.log.push({text,color});const container=document.getElementById('logEntries');const entry=document.createElement('div');entry.className='log-entry';const dot=document.createElement('span');dot.className='log-dot';dot.style.backgroundColor=color==='text'?COLORS.textMuted:color;entry.appendChild(dot);entry.appendChild(document.createTextNode(text));container.appendChild(entry);container.scrollTop=container.scrollHeight}
function renderBoard(time){ctx.fillStyle=COLORS.board;ctx.fillRect(0,0,canvas.width,canvas.height);const scale=canvas.width/800;pathCoords.forEach((_,i)=>{const pos=getTilePos(i);const x=pos.x*scale,y=pos.y*scale,size=TILE_SIZE*scale;ctx.fillStyle=BONUS_TILES.includes(i)?'#2980B9':PENALTY_TILES.includes(i)?'#C0392B':COLORS.path;if(i===0)ctx.fillStyle='#27AE60';if(i===FINISH_TILE)ctx.fillStyle='#F39C12';ctx.beginPath();ctx.roundRect(x,y,size,size,8*scale);ctx.fill();ctx.strokeStyle='rgba(244,241,222,0.1)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=COLORS.text;ctx.font=`bold ${14*scale}px Outfit`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i===FINISH_TILE?'🏁':i===0?'▶':i,x+size/2,y+size/2);if(BONUS_TILES.includes(i)){ctx.font=`${10*scale}px Inter`;ctx.fillStyle='#fff';ctx.fillText('⚡',x+size-12*scale,y+12*scale)}if(PENALTY_TILES.includes(i)){ctx.font=`${10*scale}px Inter`;ctx.fillStyle='#fff';ctx.fillText('⏸',x+size-12*scale,y+12*scale)}});state.players.forEach((p,i)=>{const pos=getTilePos(p.position);const x=pos.x*scale+4*scale,y=pos.y*scale+4*scale;const tokenSize=(TILE_SIZE-8)*scale;const offsetX=(i%2)*6*scale,offsetY=Math.floor(i/2)*6*scale;ctx.beginPath();ctx.arc(x+tokenSize/2+offsetX,y+tokenSize/2+offsetY,tokenSize/2,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x+tokenSize/2+offsetX,y+tokenSize/2+offsetY,tokenSize/2-4*scale,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`bold ${12*scale}px Inter`;ctx.fillText(p.name.split(' ')[1],x+tokenSize/2+offsetX,y+tokenSize/2+offsetY)});if(diceAnimation.active){const elapsed=performance.now()-diceAnimation.startTime;if(elapsed>=800)finishRoll()}requestAnimationFrame(renderBoard)}
function updateTimer(){if(state.phase==='PLAYING'||state.phase==='ROLLING'){const elapsed=Math.floor((Date.now()-state.startTime)/1000);const mins=Math.floor(elapsed/60).toString().padStart(2,'0');const secs=(elapsed%60).toString().padStart(2,'0');document.getElementById('timer').textContent=`⏱ ${mins}:${secs}`}}setInterval(updateTimer,1000);
let confetti=[];
function startConfetti(){confettiCanvas.width=window.innerWidth;confettiCanvas.height=window.innerHeight;confetti=[];for(let i=0;i<150;i++)confetti.push({x:Math.random()*confettiCanvas.width,y:Math.random()*confettiCanvas.height- confettiCanvas.height,vx:Math.random()*4-2,vy:Math.random()*3+2,color:COLORS.players[Math.floor(Math.random()*4)],size:Math.random()*8+4,rotation:Math.random()*360,rotSpeed:Math.random()*10-5})}}
function animateConfetti(){if(state.phase!=='GAME_OVER'&&confetti.length===0)return;confettiCtx.fillStyle='rgba(26,29,35,0.3)';confettiCtx.fillRect(0,0,confettiCanvas.width,confettiCanvas.height);confetti.forEach(c=>{c.y+=c.vy;c.x+=c.vx;c.rotation+=c.rotSpeed;confettiCtx.save();confettiCtx.translate(c.x,c.y);confettiCtx.rotate(c.rotation*Math.PI/180);confettiCtx.fillStyle=c.color;confettiCtx.fillRect(-c.size/2,-c.size/2,c.size,c.size);confettiCtx.restore()});confetti=confetti.filter(c=>c.y<confettiCanvas.height+50);if(confetti.length>0)requestAnimationFrame(animateConfetti)}
function createPlayerPanels(){const container=document.getElementById('playerPanels');container.innerHTML='';state.players.forEach((p,i)=>{const card=document.createElement('div');card.className='player-card';card.id=`player-${i}`;card.innerHTML=`<h3><span class="player-dot" style="background:${p.color}"></span>${p.name}</h3><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div><div class="player-pos">Position: Tile 0</div>`;card.querySelector('.player-card').style.setProperty('--glow-color',p.color);container.appendChild(card)})}
window.addEventListener('load',()=>{canvas=document.getElementById('gameCanvas');ctx=canvas.getContext('2d');confettiCanvas=document.getElementById('confettiCanvas');confettiCtx=confettiCanvas.getContext('2d');canvas.width=800;canvas.height=500;generatePath();initAudio();const savedHigh=localStorage.getItem('pathRollHighScore');if(savedHigh)document.getElementById('highScore').textContent=savedHigh;document.querySelectorAll('.player-opt').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.player-opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')})});document.getElementById('startBtn').addEventListener('click',()=>{const selected=document.querySelector('.player-opt.selected');const numPlayers=parseInt(selected.dataset.players);initGame(numPlayers);createPlayerPanels()});document.getElementById('rollBtn').addEventListener('click',rollDice);document.getElementById('playAgainBtn').addEventListener('click',()=>{confetti=[];document.getElementById('winnerModal').classList.remove('show');document.getElementById('setupModal').classList.add('show')});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();rollDice()}});requestAnimationFrame(renderBoard)});
</script>
</body>
</html>
