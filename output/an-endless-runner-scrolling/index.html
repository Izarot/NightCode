<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Reverie</title><link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.5em%22 font-size=%2276%22>😴</text></svg>'><style>body{margin:0;overflow:hidden;background:#0b0710}*{box-sizing:border-box}#c{width:100%;height:100%;display:block}#hud{position:absolute;top:10px;left:10px;color:#e8e2f0;font-family:sans-serif;font-size:14px;text-shadow:0 0 5px #fff;pointer-events:none}</style></head><body><canvas id='c'></canvas><div id='hud'>0000 m <span id='timer'>0:00</span></div></body><script type='module'>import { createLoop } from './loop.js'; import { Player } from './player.js'; import { World } from './world.js'; import { Renderer } from './render.js'; import { Audio } from './audio.js'; const c = document.getElementById('c'); const ctx = c.getContext('2d'); const dpr = Math.min(window.devicePixelRatio, 2); c.width = 1280 * dpr; c.height = 720 * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const player = new Player(c.width, c.height); const world = new World(); const renderer = new Renderer(ctx, c.width, c.height); const audio = new Audio(); let last = 0; let timerStart = Date.now(); document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); player.jumpRequested = true; } if (e.code === 'KeyS' || e.code === 'ArrowDown') player.slide(); }); document.addEventListener('keyup', e => { if (e.code === 'Space') player.jumpCut = true; if (e.code === 'KeyS' || e.code === 'ArrowDown') player.stand(); }); window.addEventListener('resize', () => { const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720); c.style.transform = `scale(${scale})`; }); const loop = createLoop((dt) => { update(dt, world, player, audio); renderer.render(world, player, audio); const seconds = Math.floor((Date.now() - timerStart) / 1000); const m = String(Math.floor(seconds / 60)).padStart(2, '0'); const s = String(seconds % 60).padStart(2, '0'); document.getElementById('hud').innerHTML = `0000 m ${m}:${s}`; }); loop.start(); </script></html>
