<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexiForm: Safe Stretch Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.7em' font-size='80'%3E🧘%3C/text%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; }
        #gameCanvas { display: block; width: 100%; height: 100%; background: #0f0f1a; }
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .timer { background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; font-size: 24px; font-weight: bold; }
        .meters { display: flex; gap: 10px; }
        .meter { flex: 1; background: rgba(0,0,0,0.5); border-radius: 10px; height: 24px; position: relative; overflow: hidden; }
        .meter-fill { height: 100%; transition: width 0.2s; }
        .safety-fill { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
        .fatigue-fill { background: linear-gradient(90deg, #FFC107, #F44336); }
        .meter-label { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        #uiPanel { position: absolute; top: 10px; left: 10px; width: 180px; background: rgba(0,0,0,0.7); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .btn { background: #4a90d9; border: none; color: white; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn:active { background: #357abd; }
        #bottomControls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; }
        .control-btn { width: 60px; height: 60px; border-radius: 50%; background: #4a90d9; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .control-btn:active { background: #357abd; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
        .modal-content { background: #2a2a4a; padding: 30px; border-radius: 15px; min-width: 300px; text-align: center; }
        .star { display: inline-block; width: 30px; height: 30px; background: #FFD700; border-radius: 50%; margin: 0 5px; }
        .locked { background: #555; }
        @media (max-width: 768px) { #uiPanel { width: 120px; } .meter-label { font-size: 10px; } }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="timer" id="speedrunTimer">00:00</div>
            <div class="meters">
                <div class="meter"><div class="meter-fill safety-fill" id="safetyMeter" style="width: 100%"><span class="meter-label">Safety</span></div></div>
                <div class="meter"><div class="meter-fill fatigue-fill" id="fatigueMeter" style="width: 100%"><span class="meter-label">Fatigue</span></div></div>
            </div>
        </div>
        <div id="uiPanel">
            <button class="btn" id="stretchLibraryBtn">📚 Library</button>
            <button class="btn" id="resetPoseBtn">🔄 Reset</button>
            <button class="btn" id="hintBtn">💡 Hint</button>
        </div>
        <div id="bottomControls">
            <div class="control-btn" id="resetBtn">🔄</div>
            <div class="control-btn" id="pauseBtn">⏸</div>
        </div>
        <div id="modal" class="modal">
            <div class="modal-content">
                <h2 id="modalTitle">Pause</h2>
                <button class="btn" id="resumeBtn">Resume</button>
                <button class="btn" id="restartBtn">Restart</button>
                <button class="btn" id="settingsBtn">Settings</button>
                <button class="btn" id="exitBtn">Exit</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
