<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity-Lock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>🎮</text></svg>">
<style>
body,html{margin:0;padding:0;height:100%;background:#0a0a0a;overflow:hidden;color:#fff;font-family:sans-serif;}
#canvas{display:block;width:100%;height:100%;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);color:#fff;display:none;align-items:center;justify-content:center;font-size:2rem;z-index:10;}
#pauseMenu{display:flex;flex-direction:column;gap:1rem;align-items:center;}
button{background:#111;color:#0f0;border:none;padding:0.5rem 1rem;margin:0.5rem;cursor:pointer;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui"></div>
<div id="overlay">
<div id="startScreen"><button id="startBtn">Tap to Play</button></div>
<div id="pauseMenu"><button id="resumeBtn">Resume</button><button id="quitBtn">Quit</button></div>
<div id="gameOver"><h1>Game Over</h1><p>Score: <span id="finalScore"></span></p><p>High Score: <span id="highScore"></span></p><button id="restartBtn">Play Again</button></div>
</div>
<script src="src/game.js"></script>
</body>
</html>
