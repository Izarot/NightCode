<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadow Hop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%220.9em%22 font-size=%2224%22>🌑</text></svg>">
<style>
  body,html{margin:0;padding:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
  canvas{background:#000;display:block;max-width:100%;max-height:100%;touch-action:none;}
  #ui{position:absolute;top:10px;left:10px;color:#fff;font-family:sans-serif;}
  #pauseOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:sans-serif;}
  #pauseOverlay button{padding:10px 20px;font-size:1.2rem;cursor:pointer;}
  #joystick,#jumpBtn{position:absolute;bottom:20px;width:80px;height:80px;background:rgba(255,255,255,0.2);border-radius:50%;}
  #joystick{left:20px;}
  #jumpBtn{right:20px;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div>Score: <span id="score">0</span></div>
  <div>Timer: <span id="timer">0.0</span></div>
  <div>Health: <span id="health">3</span></div>
  <div>Shadow: <progress id="shadowMeter" max="100" value="100"></progress></div>
</div>
<div id="pauseOverlay">
  <h2>Paused</h2>
  <button id="resumeBtn">Resume</button>
  <button id="restartBtn">Restart</button>
  <button id="menuBtn">Main Menu</button>
</div>
<div id="joystick"></div>
<div id="jumpBtn"></div>
<script src="main.js"></script>
</body>
</html>
