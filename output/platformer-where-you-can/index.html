<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Symphonic Leap</title>
  <style>
    body{margin:0;background:#0d0220;color:#fff;font-family:sans-serif;overflow:hidden}
    #gameContainer{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
    canvas{max-width:100%;height:auto;display:block;background:#0d0220}
    #hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    .bar{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:10px 20px;box-sizing:border-box;color:#fff;text-shadow:0 0 5px #fff}
    #topBar{border-bottom:1px solid #444}
    #bottomBar{border-top:1px solid #444;bottom:0;position:absolute;width:100%}
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="topBar" class="bar">
      <div id="musicIcon">🎵</div>
      <div id="levelInfo">Level 1</div>
      <div id="score">0</div>
      <div id="hearts">❤️❤️❤️</div>
      <div id="timer">⏱ 0.00</div>
    </div>
    <div id="bottomBar" class="bar">
      <div id="jumpMeter">Jump: □□□□□</div>
      <div id="powerTimer"></div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
