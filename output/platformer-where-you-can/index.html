<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerShift</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.7em' font-size='80'%3E🎮%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Courier New', monospace; }
        #gameCanvas { display: block; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        #ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
        hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        health,.score,.timer { background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 8px; font-size: 18px; color: white; }
        layer-indicator { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; position: relative; }
        layer-icon { font-size: 24px; cursor: pointer; }
        cooldown { position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border-radius: 50%; border: 2px solid cyan; animation: pulse 0.3s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        #startScreen, #gameOver { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 24px; }
        button { padding: 15px 30px; margin: 10px; font-size: 20px; cursor: pointer; border: none; border-radius: 8px; background: linear-gradient(45deg, #ff6b6b, #ee5a5a); color: white; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="hud">
            <div class="health" id="health">♥♥♥♥♥</div>
            <div class="layer-indicator"><div class="layer-icon" id="layerIcon">🔵</div><div class="cooldown" id="cooldown" style="display:none"></div></div>
            <div class="score" id="score">Score: 0</div>
            <div class="timer" id="timer">Time: 00:00</div>
        </div>
    </div>
    <div id="startScreen">
        <h1 style="font-size:60px; margin-bottom:30px; color:#4ecdc4;">🎮 LayerShift</h1>
        <p style="font-size:24px; margin-bottom:30px;">Switch between layers to navigate!</p>
        <button onclick="startGame()">Start Game</button>
        <button onclick="showInstructions()">Instructions</button>
    </div>
    <div id="gameOver" style="display:none">
        <h1 style="font-size:60px; margin-bottom:30px; color:#ff6b6b;">Game Over</h1>
        <p id="finalScore" style="font-size:24px; margin-bottom:30px;"></p>
        <button onclick="restartGame()">Restart</button>
        <button onclick="mainMenu()">Main Menu</button>
    </div>
    <div id="instructions" style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); display:none; flex-direction:column; justify-content:center; align-items:center; color:white; padding:40px; text-align:center;">
        <h2 style="font-size:40px; margin-bottom:20px; color:#4ecdc4;">How to Play</h2>
        <p style="font-size:20px; max-width:600px; margin-bottom:20px;">Use <strong>SPACEBAR</strong> or <strong>CLICK</strong> to switch between foreground (🔴) and background (🔵) layers. Navigate platforms, avoid enemies, and reach the exit!</p>
        <p style="font-size:20px; max-width:600px; margin-bottom:30px;">Press <strong>R</strong> to restart, <strong>ESC</strong> to pause.</p>
        <button onclick="hideInstructions()">Back to Menu</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, scale;
        
        function resizeCanvas() {
            const maxWidth = window.innerWidth;
            const maxHeight = window.innerHeight;
            const aspect = 1920 / 1080;
            
            if (maxWidth / maxHeight > aspect) {
                height = maxHeight;
                width = height * aspect;
            } else {
                width = maxWidth;
                height = width / aspect;
            }
            
            scale = width / 1920;
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Game State
        let gameState = 'enu';
        let currentLayer = 'background';
        let lastSwitchTime = 0;
        let switchCooldown = 300;
        let gameStartTime = 0;
        let elapsedTime = 0;
        let score = 0;
        let highScore = localStorage.getItem('layerShiftHighScore') || 0;
        let player = { x: 100, y: 500, w: 32, h: 48, vx: 0, vy: 0, onGround: false, color: '#4ecdc4' };
        let gravity = 0.6;
        let jumpForce = -12;
        let speed = 4.5;
        let acceleration = 0.4;
        let friction = 0.85;
        let coyoteTime = 100; // ms
        let lastGroundedTime = 0;
        let jumpBufferTime = 150; // ms
        let lastJumpAttempt = 0;
        let keys = {};
        let particles = [];
        let enemies = [];
        let platforms = [];
        let exit = null;
        
        // Audio
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playSound(frequency, duration, type) {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            osc.frequency.value = frequency;
            osc.type = type || 'ine';
            gain.connect(osc.destination);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        function layerSwitchSound() {
            playSound(440, 0.1, 'quare');
            setTimeout(() => playSound(880, 0.1, 'quare'), 50);
        }
        
        function jumpSound() { playSound(330, 0.1, 'ine'); }
        function landSound() { playSound(220, 0.15, 'ine'); }
        function collectSound() { playSound(660, 0.1, 'quare'); }
        
        // Particles
        function createParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color
                });
            }
        }
        
        // Level Data
        function initLevel() {
            platforms = [
                { x: 0, y: 650, w: 1920, h: 30, layer: 'background' },
                { x: 200, y: 550, w: 200, h: 20, layer: 'background' },
                { x: 500, y: 450, w: 200, h: 20, layer: 'background' },
                { x: 800, y: 400, w: 200, h: 20, layer: 'background' },
                { x: 1100, y: 500, w: 200, h: 20, layer: 'background' },
                { x: 1400, y: 400, w: 200, h: 20, layer: 'background' },
                { x: 1700, y: 500, w: 200, h: 20, layer: 'background' },
                { x: 0, y: 750, w: 1920, h: 30, layer: 'ain' },
                { x: 150, y: 650, w: 150, h: 20, layer: 'ain' },
                { x: 350, y: 580, w: 150, h: 20, layer: 'ain' },
                { x: 550, y: 520, w: 150, h: 20, layer: 'ain' },
                { x: 750, y: 480, w: 150, h: 20, layer: 'ain' },
                { x: 950, y: 550, w: 150, h: 20, layer: 'ain' },
                { x: 1150, y: 480, w: 150, h: 20, layer: 'ain' },
                { x: 1350, y: 550, w: 150, h: 20, layer: 'ain' },
                { x: 1550, y: 480, w: 150, h: 20, layer: 'ain' },
                { x: 100, y: 380, w: 100, h: 20, layer: 'foreground' },
                { x: 300, y: 350, w: 100, h: 20, layer: 'foreground' },
                { x: 500, y: 320, w: 100, h: 20, layer: 'foreground' },
                { x: 700, y: 280, w: 100, h: 20, layer: 'foreground' },
                { x: 900, y: 350, w: 100, h: 20, layer: 'foreground' },
                { x: 1100, y: 280, w: 100, h: 20, layer: 'foreground' },
                { x: 1300, y: 350, w: 100, h: 20, layer: 'foreground' },
                { x: 1500, y: 280, w: 100, h: 20, layer: 'foreground' },
                { x: 1700, y: 350, w: 100, h: 20, layer: 'foreground' },
            ];
            
            enemies = [
                { x: 400, y: 530, w: 32, h: 32, vx: 1.5, layer: 'ain', type: 'patrol' },
                { x: 1000, y: 450, w: 32, h: 32, vx: -1.5, layer: 'ain', type: 'patrol' },
                { x: 1400, y: 450, w: 32, h: 32, vx: 1.5, layer: 'ain', type: 'patrol' },
            ];
            
            exit = { x: 1850, y: 300, w: 50, h: 50, color: '#ff6b6b' };
            
            player.x = 100;
            player.y = 600;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            score = 0;
            elapsedTime = 0;
            gameStartTime = 0;
            particles = [];
        }
        
        // Input
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
            if (e.code === 'KeyR' && gameState === 'playing') restartLevel();
            if (e.code === 'Escape') togglePause();
        });
        
        window.addEventListener('keyup', e => keys[e.code] = false);
                
        canvas.addEventListener('click', e => {
            if (gameState === 'playing') switchLayer();
        });
        
        function switchLayer() {
            const now = Date.now();
            if (now - lastSwitchTime < switchCooldown) return;
            
            currentLayer = currentLayer === 'background'? 'foreground' : 'background';
            lastSwitchTime = now;
            layerSwitchSound();
            createParticles(player.x, player.y, currentLayer === 'foreground'? '#ff6b6b' : '#4ecdc4');
            document.getElementById('layerIcon').textContent = currentLayer === 'foreground'? '🔴' : '🔵';
            document.getElementById('cooldown').style.display = 'block';
            setTimeout(() => document.getElementById('cooldown').style.display = 'none', switchCooldown);
        }
        
        function togglePause() {
            if (gameState === 'paused') resumeGame();
            else if (gameState === 'playing') pauseGame();
        }
        
        function startGame() {
            gameState = 'playing';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            initLevel();
            gameStartTime = Date.now();
            requestAnimationFrame(gameLoop);
        }
        
        function pauseGame() {
            gameState = 'paused';
            const pauseOverlay = document.createElement('div');
            pauseOverlay.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;font-size:24px;z-index:10;';
            pauseOverlay.innerHTML = '<h2 style="margin-bottom:20px;">Paused</h2><button onclick="resumeGame()">Resume</button><button onclick="restartLevel()">Restart</button>';
            document.body.appendChild(pauseOverlay);
        }
        
        function resumeGame() {
            gameState = 'playing';
            document.querySelectorAll('div[style*="position:absolute"]').forEach(el => {
                if (el.style.zIndex === '10') el.remove();
            });
            gameStartTime = Date.now() - elapsedTime;
            requestAnimationFrame(gameLoop);
        }
        
        function restartLevel() {
            gameState = 'playing';
            initLevel();
            gameStartTime = Date.now();
            requestAnimationFrame(gameLoop);
        }
        
        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }
        
        function mainMenu() {
            gameState = 'enu';
            document.getElementById('startScreen').style.display = 'flex';
            document.getElementById('gameOver').style.display = 'none';
        }
        
        function showInstructions() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('instructions').style.display = 'flex';
        }
        
        function hideInstructions() {
            document.getElementById('instructions').styleةdisplay = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }
        
        // Game Loop
        function gameLoop(timestamp) {
            if (gameState!== 'playing') return;
            
            if (!gameStartTime) gameStartTime = timestamp;
            elapsedTime = timestamp - gameStartTime;
            
            update();
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        function update() {
            // Movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= acceleration;
            if (keys['ArrowRight'] || keys['KeyD']) player.vx += acceleration;
            player.vx *= friction;
            player.vx = Math.max(-speed, Math.min(speed, player.vx));
            
            // Jumping
            if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) {
                if (lastJumpAttempt < Date.now() - jumpBufferTime) {
                    if (player.onGround || (Date.now() - lastGroundedTime < coyoteTime)) {
                        player.vy = jumpForce;
                        jumpSound();
                        lastGroundedTime = 0;
                    }
                    lastJumpAttempt = Date.now();
                }
            }
            
            // Gravity
            player.vy += gravity;
            player.vy = Math.min(18, player.vy);
            
            // Update positions
            player.x += player.vx;
            player.y += player.vy;
            
            // Collision
            player.onGround = false;
            platforms.forEach(p => {
                if (p.layer === currentLayer) {
                    if (player.x < p.x + p.w && player.x + player.w > p.x && 
                        player.y + player.h > p.y && player.y + player.h < p.y + p.h) {
                        if (player.vy > 0) {
                            player.y = p.y - player.h;
                            player.vy = 0;
                            player.onGround = true;
                            lastGroundedTime = Date.now();
                        }
                    }
                }
            });
            
            // Enemy collision
            enemies.forEach(e => {
                if (e.layer === currentLayer) {
                    if (player.x < e.x + e.w && player.x + player.w > e.x && 
                        player.y < e.y + e.h && player.y + player.h > e.y) {
                        if (player.vy > 0 && player.y + player.h <= e.y + 10) {
                            player.vy = jumpForce * 0.5;
                            score += 100;
                            collectSound();
                        } else {
                            endGame();
                        }
                    }
                }
            });
            
            // Enemy movement
            enemies.forEach(e => {
                if (e.layer === currentLayer) {
                    e.x += e.vx;
                    if (e.x < 50 || e.x > 1870) e.vx *= -1;
                }
            });
            
            // Exit
            if (player.x < exit.x + exit.w && player.x + player.w > exit.x && 
                player.y < exit.y + exit.h && player.y + player.h > exit.y) {
                completeLevel();
            }
            
            // Update particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += gravity * 0.3;
                p.life--;
            });
            
            // Update score
            score = Math.floor(elapsedTime / 100) + Math.floor(player.x / 10);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('layerShiftHighScore', highScore);
            }
        }
        
        function render() {
            ctx.clearRect(0, 0, width, height);
            ctx.scale(scale, scale);
            
            // Background layer
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, 1920, 1080);
            
            // Parallax background elements
            ctx.fillStyle = 'rgba(110, 180, 255, 0.1)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(100 + i * 300, 200, 50 + i * 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Platforms
            platforms.forEach(p => {
                if (p.layer === 'background') {
                    ctx.fillStyle = 'rgba(100, 100, 255, 0.7)';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                } else if (p.layer === 'ain') {
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.8)';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                } else if (p.layer === 'foreground') {
                    ctx.fillStyle = 'rgba(255, 100, 100, 0.8)';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                }
            });
            
            // Enemies
            enemies.forEach(e => {
                if (e.layer === currentLayer) {
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(e.x, e.y, e.w, e.h);
                    ctx.fillStyle = '#ff6b81';
                    ctx.fillRect(e.x + 8, e.y + 8, e.w - 16, e.h - 16);
                }
            });
            
            // Exit
            ctx.fillStyle = exit.color;
            ctx.fillRect(exit.x, exit.y, exit.w, exit.h);
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(exit.x + 10, exit.y + 10, exit.w - 20, exit.h - 20);
            
            // Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(player.x + 8, player.y + 8, player.w - 16, player.h - 16);
            
            // Layer indicators
            if (currentLayer === 'foreground') {
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 3;
                ctx.strokeRect(player.x, player.y, player.w, player.h);
            }
            
            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
            });
        }
        
        function endGame() {
            gameState = 'gameover';
            document.getElementById('gameOver').style.display = 'flex';
            document.getElementById('finalScore').textContent = `Final Score: ${score} | High Score: ${highScore} | Time: ${(elapsedTime/1000).toFixed(1)}s`;
        }
        
        function completeLevel() {
            gameState = 'gameover';
            document.getElementById('gameOver').style.display = 'flex';
            document.getElementById('finalScore').innerHTML = `<h2 style="font-size:30px;margin-bottom:20px;color:#2ed573;">🎉 Level Complete!</h2><p>Final Score: ${score} | High Score: ${highScore} | Time: ${(elapsedTime/1000).toFixed(1)}s</p>`; 
        }
        
        // HUD Update
        setInterval(() => {
            if (gameState === 'playing') {
                const minutes = Math.floor(elapsedTime / 60000);
                const seconds = Math.floor((elapsedTime % 60000) / 1000);
                document.getElementById('timer').textContent = `Time: ${minutes}:${seconds.toString().padStart(3, '0')}`;
                document.getElementById('score').textContent = `Score: ${score}`;
            }
        }, 100);
    </script>
</body>
</html>
