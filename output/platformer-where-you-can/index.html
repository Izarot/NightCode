<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale="1.0, maximum-scale=1.0, user-scalable=no">
    <title>LayerShift</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0="0 100 100"><text y=".9em" font-size="90">🌀</text></svg>">
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #timer { position: absolute; top: 10px; right: 10px; color: #00ffcc; font-family: monospace; font-size: 24px; }
        #controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="score">SCORE: 0</div>
        <div id="high-score">BEST: 0</div>
    </div>
    <div id="timer">00:00.00</div>
    <div id="controls-hint">SPACE / CLICK to Switch Layers | ARROWS to Move</div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
