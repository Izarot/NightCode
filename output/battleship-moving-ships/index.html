<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Battleship: Naval Warfare</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>🚢</text></svg>">
  <style>
    html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a1a2f;font-family:sans-serif}
    #gameCanvas{display:block;width:100%;height:100%;background:#081828}
    #hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    .hud-elem{color:#fff;text-shadow:1px 1px 2px #000;font-size:14px}
    #speedrunTimer{position:absolute;top:10px;right:10px;color:#00ffcc;font-size:18px;text-shadow:1px 1px 2px #000}
    #highScore{position:absolute;top:30px;right:10px;color:#ffaa00;font-size:14px;text-shadow:1px 1px 2px #000}
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="speedrunTimer">Time: 0.00s</div>
    <div id="highScore">High Score: 0.00s</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
