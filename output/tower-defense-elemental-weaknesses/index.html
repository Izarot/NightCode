<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Bastion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='70' font-size='60' fill='%23FFD166'%3E🔥%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0D1117; color: #ADB5BD; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #gameCanvas { display: block; background: #0D1117; }
        .ui-element { cursor: pointer; }
        .selected { border: 2px solid #FFD166; box-shadow: 0 0 10px #FFD166; }
        .invalid { opacity: 0.5; }
        .tooltip { position: absolute; background: #1A2029; border: 1px solid #4A5568; padding: 5px 10px; border-radius: 3px; font-size: 12px; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="tooltip" class="tooltip" style="display: none;"></div>
    <div id="ui" style="position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none;">
        <div id="topBar" style="display: flex; justify-content: space-between; align-items: center; pointer-events: auto;">
            <div id="bastionHP" style="display: flex; align-items: center; gap: 8px;">
                <span style="color: #E63946;">❤️</span>
                <div style="background: #2D3748; border-radius: 5px; padding: 3px 8px;">
                    <div id="hpBar" style="width: 150px; height: 20px; background: #E63946; border-radius: 3px;"></div>
                </div>
                <span id="hpText">100/100</span>
            </div>
            <div id="waveInfo" style="text-align: center;">
                <div id="waveNum" style="font-size: 24px; font-weight: bold; color: #FFD166;">Wave 0/20</div>
                <button id="startWave" style="margin-top: 5px; padding: 8px 16px; background: #4A90D9; color: white; border: none; border-radius: 5px; cursor: pointer;">Start Wave</button>
                <div id="wavePreview" style="font-size: 12px; color: #ADB5BD; margin-top: 5px;"></div>
            </div>
            <div id="goldInfo" style="display: flex; align-items: center; gap: 8px;">
                <span>🪙</span>
                <div id="goldBar" style="background: #2D3748; border-radius: 5px; padding: 3px 8px;">
                    <div id="goldValue" style="width: 100px; height: 20px; background: #FFD166; border-radius: 3px; text-align: center; line-height: 20px;">&nbsp;200</div>
                </div>
            </div>
        </div>
        <div id="bottomBar" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); pointer-events: auto;">
            <div id="towerMenu" style="display: flex; gap: 10px; background: rgba(26, 32, 41, 0.8); padding: 10px; border-radius: 10px;"></div>
        </div>
    </div>
    <div id="speedControls" style="position: absolute; bottom: 10px; right: 10px; pointer-events: auto;">
        <button class="speed-btn" data-speed="1">1x</button>
        <button class="speed-btn selected" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="3">3x</button>
    </div>
    <div id="timer" style="position: absolute; top: 10px; right: 10px; font-size: 24px; font-weight: bold; color: #FFD166; pointer-events: none;">⏱️ 00:00</div>
    <script>
        // Game Configuration
        const CONFIG = {
            ELEMENTS: { fire: { name: 'Fire', color: '#FF6B35', resist: 'Fire', weak: 'Air' }, water: { name: 'Water', color: '#4CC9F0', resist: 'Water', weak: 'Earth' }, earth: { name: 'Earth', color: '#80B918', weak: 'Water', resist: 'Earth' }, air: { name: 'Air', color: '#FFFFFF', weak: 'Earth', resist: 'Air' }, neutral: { name: 'Neutral', color: '#ADB5BD', weak: null, resist: null } },
            TOWERS: { cannon: { element: 'neutral', damage: 10, range: 120, fireRate: 1, cost: 50, upgrades: [[20, 130, 1.2], [35, 140, 1.5]] }, pyre: { element: 'fire', damage: 8, range: 110, fireRate: 2.5, cost: 100, upgrades: [[16, 120, 3.0], [28, 130, 3.5]], burn: [5, 10, 20] }, frost: { element: 'water', damage: 25, range: 100, fireRate: 0.7, cost: 100, upgrades: [[45, 110, 0.8], [75, 120, 1.0]], chill: [40, 40, 60] }, boulder: { element: 'earth', damage: 20, range: 130, fireRate: 0.5, cost: 100, upgrades: [[35, 140, 0.6], [60, 150, 0.7]], splash: 60, stun: [0, 0, 0.5] }, storm: { element: 'air', damage: 6, range: 140, fireRate: 4, cost: 100, upgrades: [[12, 150, 4.5], [22, 160, 5.0]], chain: [1, 1, 3] } };
        };
        
        // Game State
        const game = { canvas: null, ctx: null, width: 0, height: 0, scale: 1, offsetX: 0, offsetY: 0, keys: {}, mouse: { x: 0, y: 0, down: false, right: false, wheel: 0 }, player: { x: 200, y: 200, vx: 0, vy: 0, rot: 0, speed: 350, accel: 2500, friction: 0.85, radius: 14, selectedTower: null, buildCooldown: 0 }, gold: 200, bastionHP: 100, maxBastionHP: 100, wave: 0, maxWaves: 20, waveTimer: 0, buildPhase: 30, waveActive: false, enemies: [], towers: [], projectiles: [], particles: [], lastTime: 0, highScore: 0, gameTime: 0, speed: 2, paused: false, gameState: 'MENU', waveEnemies: [], waveCounts: [] };
        
        // Audio Setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type, freq, dur = 0.1) { try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = freq; gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur); osc.type = 'sine'; osc.start(); osc.stop(audioCtx.currentTime + dur); } catch(e) {} }
        
        // Initialize Canvas
        function init() { game.canvas = document.getElementById('gameCanvas'); game.ctx = game.canvas.getContext('2d'); resizeCanvas(); window.addEventListener('resize', resizeCanvas); setupInput(); loadHighScore(); gameLoop(0); }
        
        function resizeCanvas() { game.width = window.innerWidth; game.height = window.innerHeight; game.canvas.width = game.width; game.canvas.height = game.height; game.scale = Math.min(game.width / 1280, game.height / 720); }
        
        function setupInput() { const canvas = game.canvas; canvas.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); game.mouse.x = (e.clientX - rect.left) / game.scale - game.offsetX; game.mouse.y = (e.clientY - rect.top) / game.scale - game.offsetY; }); canvas.addEventListener('mousedown', e => { if (e.button === 0) game.mouse.down = true; else if (e.button === 2) game.mouse.right = true; }); canvas.addEventListener('mouseup', e => { if (e.button === 0) game.mouse.down = false; else if (e.button === 2) game.mouse.right = false; }); canvas.addEventListener('wheel', e => { game.mouse.wheel = e.deltaY > 0 ? 1 : -1; }); window.addEventListener('keydown', e => { game.keys[e.key.toLowerCase()] = true; if (e.key === 'Escape') game.mouse.right = true; if (e.key === ' ') e.preventDefault(); }); window.addEventListener('keyup', e => { game.keys[e.key.toLowerCase()] = false; }); }
        
        function loadHighScore() { const saved = localStorage.getItem('elementalBastionHighScore'); if (saved) game.highScore = parseInt(saved); }
        function saveHighScore() { localStorage.setItem('elementalBastionHighScore', game.highScore.toString()); }
        
        function gameLoop(timestamp) { if (!game.lastTime) game.lastTime = timestamp; const dt = Math.min((timestamp - game.lastTime) / 1000, 0.05); game.lastTime = timestamp; update(dt); render(); if (!game.paused) requestAnimationFrame(gameLoop); }
        
        function update(dt) { if (game.paused) return; game.gameTime += dt * game.speed; updateTimer(); updatePlayer(dt); updateTowers(dt); updateProjectiles(dt); updateEnemies(dt); updateParticles(dt); checkWave(); }
        
        function updateTimer() { const seconds = Math.floor(game.gameTime); const mins = Math.floor(seconds / 60); const display = mins.toString().padStart(2, '0') + ':' + (seconds % 60).toString().padStart(2, '0'); document.getElementById('timer').textContent = '⏱️ ' + display; }
        
        function updatePlayer(dt) { const p = game.player; if (game.keys['w'] || game.keys['arrowup']) p.vy -= p.accel * dt; if (game.keys['s'] || game.keys['arrowdown']) p.vy += p.accel * dt; if (game.keys['a'] || game.keys['arrowleft']) p.vx -= p.accel * dt; if (game.keys['d'] || game.keys['arrowright']) p.vx += p.accel * dt; p.vx *= Math.pow(p.friction, dt * 60); p.vy *= Math.pow(p.friction, dt * 60); const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy); if (speed > p.speed) { p.vx = (p.vx / speed) * p.speed; p.vy = (p.vy / speed) * p.speed; } p.x += p.vx * dt; p.y += p.vy * dt; p.x = Math.max(p.radius, Math.min(1200 - p.radius, p.x)); p.y = Math.max(p.radius, Math.min(900 - p.radius, p.y)); const targetRot = Math.atan2(game.mouse.y - p.y, game.mouse.x - p.x); p.rot += (targetRot - p.rot) * 0.15; if (game.mouse.down && game.buildCooldown <= 0) { attemptBuild(); } if (game.buildCooldown > 0) game.buildCooldown -= dt; }
        
        function attemptBuild() { if (!game.player.selectedTower) return; const towerType = game.player.selectedTower; const cost = CONFIG.TOWERS[towerType].cost; if (game.gold >= cost && isValidPlacement(game.mouse.x, game.mouse.y)) { placeTower(towerType, game.mouse.x, game.mouse.y); game.gold -= cost; playSound('build', 200); game.buildCooldown = 0.3; } }
        
        function isValidPlacement(x, y) { for (const t of game.towers) { const dx = x - t.x, dy = y - t.y; if (Math.sqrt(dx * dx + dy * dy) < 20) return false; } return true; }
        
        function placeTower(type, x, y) { game.towers.push({ type, x, y, level: 1, target: null, fireTimer: 0 }); }
        
        function updateTowers(dt) { for (const t of game.towers) { t.fireTimer += dt; const stats = getTowerStats(t.type, t.level); if (t.fireTimer >= 1 / stats.fireRate) { t.fireTimer = 0; const target = findTarget(t.x, t.y, stats.range); if (target) { t.target = target; fireProjectile(t, target); playSound('shoot', 100 + Math.random() * 200, 0.05); } } }
        }
        
        function getTowerStats(type, level) { const base = CONFIG.TOWERS[type]; if (level > 2) level = 2; const [damage, range, fireRate] = level === 0 ? [base.damage, base.range, base.fireRate] : base.upgrades[level - 1]; return { element: base.element, damage, range, fireRate, ...base }; }
        
        function findTarget(x, y, range) { let closest = null; let minDist = range; for (const e of game.enemies) { const dx = e.x - x, dy = e.y - y; const dist = Math.sqrt(dx * dx + dy * dy); if (dist <= range && dist < minDist) { minDist = dist; closest = e; } } return closest; }
        
        function fireProjectile(tower, target) { const stats = getTowerStats(tower.type, tower.level); game.projectiles.push({ x: tower.x, y: tower.y, targetX: target.x, targetY: target.y, vx: 0, vy: 0, element: stats.element, damage: stats.damage, life: 1 }); }
        
        function updateProjectiles(dt) { for (let i = game.projectiles.length - 1; i >= 0; i--) { const p = game.projectiles[i]; const dx = p.targetX - p.x, dy = p.targetY - p.y; const dist = Math.sqrt(dx * dx + dy * dy); if (dist > 0) { p.vx = (dx / dist) * 300; p.vy = (dy / dist) * 300; } p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0 || dist < 5) { hitEnemy(p, targetAt(p.x, p.y)); game.projectiles.splice(i, 1); } }
        }
        
        function targetAt(x, y) { for (const e of game.enemies) { const dx = x - e.x, dy = y - e.y; if (Math.sqrt(dx * dx + dy * dy) < 10) return e; } return null; }
        
        function hitEnemy(projectile, enemy) { if (!enemy) return; const elem = projectile.element; const enemyElem = enemy.element; let damage = projectile.damage; if (CONFIG.ELEMENTS[elem].weak === enemyElem) damage *= 1.5; else if (CONFIG.ELEMENTS[elem].resist === enemyElem) damage *= 0.75; enemy.hp -= damage; game.particles.push({ x: enemy.x, y: enemy.y, vx: 0, vy: 0, life: 0.3, color: elem === 'fire' ? '#FF6B35' : elem === 'water' ? '#4CC9F0' : elem === 'earth' ? '#80B918' : elem === 'air' ? '#FFFFFF' : '#ADB5BD', size: 4 }); }
        
        function updateEnemies(dt) { for (let i = game.enemies.length - 1; i >= 0; i--) { const e = game.enemies[i]; e.x += e.vx * dt; e.y += e.vy * dt; if (e.x < -50 || e.x > 1250 || e.y < -50 || e.y > 950) { if (game.bastionHP > 0) { game.bastionHP -= e.damage; shakeScreen(10); } game.enemies.splice(i, 1); }
        } }
        
        function updateParticles(dt) { for (let i = game.particles.length - 1; i >= 0; i--) { const p = game.particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) game.particles.splice(i, 1); }
        }
        
        function shakeScreen(magnitude) { game.canvas.style.transform = `translate(${Math.random() * magnitude * 2 - magnitude}px, ${Math.random() * magnitude * 2 - magnitude}px)`; setTimeout(() => { game.canvas.style.transform = ''; }, 200); }
        
        function checkWave() { if (!game.waveActive && game.buildPhase <= 0) { startWave(); } else if (!game.waveActive) { game.buildPhase -= 1/60 * game.speed; }
        }
        
        function startWave() { game.wave++; game.waveActive = true; game.buildPhase = 20; spawnWave(); }
        
        function spawnWave() { const enemies = []; const types = ['grunt', 'emberling', 'tidespawn', 'golem', 'zephyr']; const counts = [10, 8, 6, 4, 6]; for (let i = 0; i < types.length; i++) { for (let j = 0; j < counts[i]; j++) { enemies.push(createEnemy(types[i])); } } game.enemies = enemies; }
        
        function createEnemy(type) { const data = { grunt: { element: 'neutral', hp: 60, speed: 60, damage: 1, bounty: 10 }, emberling: { element: 'fire', hp: 50, speed: 75, damage: 1, bounty: 12 }, tidespawn: { element: 'water', hp: 80, speed: 50, damage: 2, bounty: 14 }, golem: { element: 'earth', hp: 120, speed: 40, damage: 2, bounty: 16 }, zephyr: { element: 'air', hp: 40, speed: 100, damage: 1, bounty: 12 } }[type]; return { x: 0, y: 200 + Math.random() * 400, vx: data.speed, vy: 0, hp: data.hp, maxHp: data.hp, element: data.element, damage: data.damage, bounty: data.bounty, type }; }
        
        function render() { const ctx = game.ctx; ctx.clearRect(0, 0, game.width, game.height); ctx.save(); ctx.translate(game.width / 2, game.height / 2); ctx.scale(game.scale, game.scale); ctx.translate(-game.width / (2 * game.scale), -game.height / (2 * game.scale)); drawMap(); drawTowers(); drawEnemies(); drawProjectiles(); drawParticles(); drawPlayer(); ctx.restore(); }
        
        function drawMap() { const ctx = game.ctx; ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, 1280, 720); ctx.fillStyle = '#3A2E1A'; ctx.fillRect(0, 320, 1280, 80); ctx.strokeStyle = '#1A2029'; for (let x = 0; x < 1280; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke(); } for (let y = 0; y < 720; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke(); }
        }
        
        function drawPlayer() { const p = game.player; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#4A90D9'; ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
        
        function drawTowers() { for (const t of game.towers) { const stats = getTowerStats(t.type, t.level); ctx.save(); ctx.translate(t.x, t.y); ctx.fillStyle = CONFIG.ELEMENTS[stats.element].color; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.stroke(); ctx.restore(); }
        }
        
        function drawEnemies() { for (const e of game.enemies) { ctx.save(); ctx.translate(e.x, e.y); ctx.fillStyle = CONFIG.ELEMENTS[e.element].color; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.stroke(); const hpRatio = e.hp / e.maxHp; ctx.fillStyle = '#2D3748'; ctx.fillRect(-12, 15, 24 * hpRatio, 5); ctx.fillStyle = '#E63946'; ctx.fillRect(-12, 15, 24 * hpRatio, 5); ctx.restore(); }
        }
        
        function drawProjectiles() { for (const p of game.projectiles) { ctx.save(); ctx.translate(p.x, p.y); ctx.fillStyle = CONFIG.ELEMENTS[p.element].color; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }
        
        function drawParticles() { for (const p of game.particles) { ctx.save(); ctx.translate(p.x, p.y); ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }
        
        function setupUI() { const menu = document.getElementById('towerMenu'); for (const [type, tower] of Object.entries(CONFIG.TOWERS)) { const btn = document.createElement('button'); btn.className = 'ui-element'; btn.style.background = CONFIG.ELEMENTS[tower.element].color; btn.style.color = 'white'; btn.style.padding = '10px'; btn.style.borderRadius = '5px'; btn.style.cursor = 'pointer'; btn.style.minWidth = '80px'; btn.innerHTML = '<strong>' + type.charAt(0).toUpperCase() + type.slice(1) + '</strong><br>🪙' + tower.cost; btn.onclick = () => { game.player.selectedTower = game.player.selectedTower === type ? null : type; updateTowerSelection(); }; menu.appendChild(btn); }
        }
        
        function updateTowerSelection() { document.querySelectorAll('#towerMenu button').forEach(b => b.classList.remove('selected')); if (game.player.selectedTower) { document.querySelector(`#towerMenu button:nth-child(${Object.keys(CONFIG.TOWERS).indexOf(game.player.selectedTower) + 1})`).classList.add('selected'); }
        }
        
        function updateHUD() { document.getElementById('goldValue').textContent = game.gold; document.getElementById('hpValue').textContent = game.bastionHP + '/' + game.maxBastionHP; document.getElementById('hpBar').style.width = (game.bastionHP / game.maxBastionHP * 100) + '%'; document.getElementById('waveNum').textContent = 'Wave ' + game.wave + '/' + game.maxWaves; document.getElementById('startWave').onclick = startWave; }
        
        // Speed Controls
        document.querySelectorAll('.speed-btn').forEach(btn => { btn.onclick = () => { game.speed = parseInt(btn.dataset.speed); document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }; });
        
        // Start Game
        window.onload = () => { init(); setupUI(); updateHUD(); game.gameState = 'BUILDING'; document.getElementById('startWave').textContent = 'Start Wave'; };
    </script>
</body>
</html>
