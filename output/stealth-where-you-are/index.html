<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Phantom in the House</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' x='0' font-size='90'>👻</text></svg>">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; overflow: hidden; }
  #game { display: block; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); background: #1a1a1a; }
</style>
</head>
<body>
<canvas id='game'></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 1280;
canvas.height = 720;
let keys = {};
let player = { x: 100, y: 100, w: 16, h: 16, speed: 200, vx: 0, vy: 0, stamina: 100, phase: 0 };
let enemies = [];
let particles = [];
let score = 0;
let highScore = parseInt(localStorage.getItem('phantomHighScore') || '0');
let startTime = Date.now();
function beep(freq, dur, type) {
  const audio = new AudioContext();
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = 0.1;
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + dur);
}
function update() {
  let dx = (keys['ArrowLeft'] || keys['a'] ? -1 : 0) - (keys['ArrowRight'] || keys['d'] ? 1 : 0);
  let dy = (keys['ArrowUp'] || keys['w'] ? -1 : 0) - (keys['ArrowDown'] || keys['s'] ? 1 : 0);
  if (dx || dy) {
    const len = Math.sqrt(dx * dx + dy * dy);
    player.vx = dx * player.speed / len;
    player.vy = dy * player.speed / len;
  } else {
    player.vx *= 0.85;
    player.vy *= 0.85;
  }
  player.x += player.vx;
  player.y += player.vy;
  if (keys[' '] || player.phase > 0) player.stamina -= 15 * 0.016;
  if (player.stamina < 0) player.stamina = 0;
}
function draw() {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 200, 20);
  ctx.fillStyle = player.stamina > 0 ? '#39ff14' : '#ff2e55';
  ctx.fillRect(10, 10, 200 * player.stamina / 100, 20);
  const elapsed = (Date.now() - startTime) / 1000;
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText('TIME: ' + elapsed.toFixed(2), 10, 50);
  ctx.fillStyle = '#ff2e88';
  ctx.fillText('HIGH: ' + Math.max(highScore, score), 10, 80);
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('contextmenu', e => e.preventDefault());
loop();
</script>
</body>
</html>
