<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal Shift</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='.9em' font-size='40'>🔫</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="hud">
            <div id="timer">TIME: 00:00</div>
            <div id="score">HI: 0</div>
            <div id="weapon">WEAPON: RIFLE</div>
            <div id="health">HP: 100</div>
        </div>
        <div id="overlay">
            <h1>GAME OVER</h1>
            <div id="finalScore">Score: 0</div>
            <button onclick="location.reload()">RESTART</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
