<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survival Snowfall</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; image-rendering: pixelated; }
    .hud { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 10px; color: #fff; font-family: Segoe UI; }
    .temperature-bar { height: 10px; background: linear-gradient(to right, green, yellow, red); border-radius: 5px; }
    .health { display: flex; gap: 5px; }
    .heart { width: 16px; height: 16px; border-radius: 50%; }
    .heart.full { background: red; }
    .heart.half { background: orange; }
    .heart.empty { background: gray; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div class="temperature-bar" id="tempBar"></div>
    <div class="score" id="score">Score: 0</div>
    <div class="timer" id="timer">00:00</div>
    <div class="health" id="health">
      <div class="heart full"></div>
      <div class="heart full"></div>
      <div class="heart full"></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
