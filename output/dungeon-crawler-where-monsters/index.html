<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolve & Conquer</title>
    <!-- Sneaky Feature 2: Emoji Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="timer" id="timer">00:00.00</div>
            <div class="high-score" id="highScore">Best: 00:00.00</div>
            <div class="evolution-tracker" id="evolutionTracker">
                <div>Evolution: <span id="evolutionStage">0/3</span></div>
                <div>Progress: <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
            </div>
        </div>
    </div>
    <script src="game.js" type="module"></script>
</body>
</html>
