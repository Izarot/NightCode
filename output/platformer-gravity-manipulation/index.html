<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GravityShift</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }
    #gameCanvas { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100vw; max-height: 100vh; }
    @media (orientation: portrait) { #gameCanvas { width: 100vw; height: auto; } }
    @media (orientation: landscape) { #gameCanvas { height: 100vh; width: auto; } }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // Game constants
    const CANVAS_W = 800, CANVAS_H = 450;
    const GRAVITY = 0.45;
    const JUMP_FORCE = 15;
    const MOVE_SPEED = 6;
    const TERMINAL_VEL = 12;
    const PLAYER_W = 24, PLAYER_H = 24;
    
    // Color palette
    const COLORS = {
      bg: '#0a0a1a',
      platform: '#00ffcc',
      spike: '#ff3366',
      orb: '#ffcc00',
      goal: '#ff00ff',
      playerNormal: '#00ffff',
      playerInverted: '#ff00cc',
      playerZero: '#ffff00',
      ui: '#ffffff',
      uiAccent: '#00ffcc'
    };
    
    // Audio context
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    function playTone(freq, duration, type='square', vol=0.1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }
    function sfxJump() { playTone(440, 0.1, 'sine', 0.05); }
    function sfxGravity() { playTone(220, 0.2, 'sawtooth', 0.07); }
    function sfxCollect() { playTone(880, 0.1, 'triangle', 0.05); }
    function sfxWin() { playTone(660, 0.3, 'sine', 0.1); }
    
    // Canvas setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    
    // Input
    const keys = {};
    const touch = { x: 0, y: 0, active: false };
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); touch.active = true; touch.x = e.touches[0].clientX; touch.y = e.touches[0].clientY; });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); touch.x = e.touches[0].clientX; touch.y = e.touches[0].clientY; });
    canvas.addEventListener('touchend', e => { touch.active = false; });
    
    // Game state
    let player = { x: 100, y: 300, vx: 0, vy: 0, w: PLAYER_W, h: PLAYER_H, gravityState: 0, onGround: false, gravityCooldown: 0 };
    // gravityState: 0=normal, 1=inverted, 2=zero
    let platforms = [];
    let spikes = [];
    let orbs = [];
    let goal = { x: 700, y: 100, w: 40, h: 40 };
    let timer = 0;
    let timerRunning = true;
    let bestTime = parseFloat(localStorage.getItem('gravityShiftBest')) || Infinity;
    let levelComplete = false;
    let screenShake = 0;
    
    // Level data
    function initLevel() {
      platforms = [
        { x: 0, y: 400, w: 800, h: 50 },
        { x: 200, y: 300, w: 150, h: 20 },
        { x: 450, y: 250, w: 150, h: 20 },
        { x: 600, y: 150, w: 200, h: 20 },
        { x: 0, y: 0, w: 800, h: 50 },
        { x: 100, y: 100, w: 100, h: 20 }
      ];
      spikes = [
        { x: 300, y: 380, w: 30, h: 20 },
        { x: 500, y: 230, w: 30, h: 20 },
        { x: 650, y: 130, w: 30, h: 20 }
      ];
      orbs = [
        { x: 250, y: 250, r: 10, collected: false },
        { x: 500, y: 200, r: 10, collected: false },
        { x: 700, y: 100, r: 10, collected: false }
      ];
      player.x = 100; player.y = 300; player.vx = 0; player.vy = 0; player.gravityState = 0; player.onGround = false; player.gravityCooldown = 0;
      timer = 0; timerRunning = true; levelComplete = false; screenShake = 0;
    }
    initLevel();
    
    // Fixed timestep
    const DT = 1/60;
    let lastTime = 0;
    let accumulator = 0;
    
    function update(dt) {
      if (levelComplete) return;
      timer += dt;
      
      // Input handling
      let moveX = 0;
      if (keys['ArrowLeft'] || keys['KeyA'] || (touch.active && touch.x < window.innerWidth/2)) moveX = -1;
      if (keys['ArrowRight'] || keys['KeyD'] || (touch.active && touch.x > window.innerWidth/2)) moveX = 1;
      
      // Gravity toggle
      if (player.gravityCooldown > 0) player.gravityCooldown -= dt;
      if ((keys['KeyG'] || (touch.active && touch.y < window.innerHeight/2)) && player.gravityCooldown <= 0) {
        player.gravityState = (player.gravityState + 1) % 3;
        player.gravityCooldown = 0.2;
        sfxGravity();
        screenShake = 0.2;
      }
      
      // Horizontal movement
      player.vx = moveX * MOVE_SPEED;
      
      // Gravity application
      if (player.gravityState === 0) { // normal
        player.vy += GRAVITY;
        if (player.vy > TERMINAL_VEL) player.vy = TERMINAL_VEL;
      } else if (player.gravityState === 1) { // inverted
        player.vy -= GRAVITY;
        if (player.vy < -TERMINAL_VEL) player.vy = -TERMINAL_VEL;
      } else { // zero gravity
        player.vy *= 0.95; // slight drag
      }
      
      // Jump
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        if (player.gravityState === 0) player.vy = -JUMP_FORCE;
        else if (player.gravityState === 1) player.vy = JUMP_FORCE;
        else player.vx += moveX * JUMP_FORCE; // zero-g jump boosts horizontal
        player.onGround = false;
        sfxJump();
      }
      
      // Move X
      player.x += player.vx;
      // Collision X
      for (const p of platforms) {
        if (aabb(player, p)) {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
        }
      }
      
      // Move Y
      player.y += player.vy;
      player.onGround = false;
      for (const p of platforms) {
        if (aabb(player, p)) {
          if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; if (player.gravityState === 0) player.onGround = true; }
          else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; if (player.gravityState === 1) player.onGround = true; }
        }
      }
      
      // Spike collision
      for (const s of spikes) {
        if (aabb(player, s)) {
          initLevel(); // reset on death
          return;
        }
      }
      
      // Orb collection
      for (const o of orbs) {
        if (!o.collected && circleRect(player.x+player.w/2, player.y+player.h/2, 12, o.x, o.y, o.r*2, o.r*2)) {
          o.collected = true;
          sfxCollect();
        }
      }
      
      // Goal check
      if (aabb(player, goal)) {
        levelComplete = true;
        timerRunning = false;
        if (timer < bestTime) {
          bestTime = timer;
          localStorage.setItem('gravityShiftBest', bestTime.toFixed(2));
        }
        sfxWin();
      }
      
      // Screen shake decay
      if (screenShake > 0) screenShake -= dt;
    }
    
    function aabb(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function circleRect(cx, cy, cr, rx, ry, rw, rh) {
      const dx = Math.abs(cx - (rx + rw/2));
      const dy = Math.abs(cy - (ry + rh/2));
      if (dx > rw/2 + cr) return false;
      if (dy > rh/2 + cr) return false;
      if (dx <= rw/2) return true;
      if (dy <= rh/2) return true;
      const corner = Math.pow(dx - rw/2, 2) + Math.pow(dy - rh/2, 2);
      return corner <= Math.pow(cr, 2);
    }
    
    function render() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*4, (Math.random()-0.5)*4);
      }
      // Background
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      
      // Platforms
      ctx.fillStyle = COLORS.platform;
      for (const p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);
      
      // Spikes (triangles)
      ctx.fillStyle = COLORS.spike;
      for (const s of spikes) {
        ctx.beginPath();
        ctx.moveTo(s.x, s.y + s.h);
        ctx.lineTo(s.x + s.w/2, s.y);
        ctx.lineTo(s.x + s.w, s.y + s.h);
        ctx.closePath();
        ctx.fill();
      }
      
      // Orbs
      for (const o of orbs) {
        if (!o.collected) {
          ctx.fillStyle = COLORS.orb;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('★', o.x, o.y+3);
        }
      }
      
      // Goal
      ctx.fillStyle = COLORS.goal;
      ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
      ctx.fillStyle = '#fff';
      ctx.font = '16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('🏁', goal.x+goal.w/2, goal.y+goal.h/2+5);
      
      // Player
      let playerColor;
      if (player.gravityState === 0) playerColor = COLORS.playerNormal;
      else if (player.gravityState === 1) playerColor = COLORS.playerInverted;
      else playerColor = COLORS.playerZero;
      ctx.fillStyle = playerColor;
      ctx.fillRect(player.x, player.y, player.w, player.h);
      // Eyes
      ctx.fillStyle = '#000';
      ctx.fillRect(player.x+5, player.y+5, 4, 4);
      ctx.fillRect(player.x+15, player.y+5, 4, 4);
      
      // UI
      ctx.fillStyle = COLORS.ui;
      ctx.font = '20px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`Time: ${timer.toFixed(2)}s`, 10, 30);
      ctx.fillText(`Best: ${bestTime===Infinity?'--':bestTime.toFixed(2)}s`, 10, 55);
      ctx.textAlign = 'right';
      const gravNames = ['NORMAL', 'INVERTED', 'ZERO-G'];
      ctx.fillText(`Gravity: ${gravNames[player.gravityState]}`, CANVAS_W-10, 30);
      
      if (levelComplete) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.fillStyle = COLORS.uiAccent;
        ctx.font = '40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL COMPLETE!', CANVAS_W/2, CANVAS_H/2 - 20);
        ctx.font = '20px monospace';
        ctx.fillText(`Time: ${timer.toFixed(2)}s`, CANVAS_W/2, CANVAS_H/2 + 20);
        ctx.fillText('Press R to restart', CANVAS_W/2, CANVAS_H/2 + 60);
      }
      
      ctx.restore();
    }
    
    function gameLoop(time) {
      const dt = (time - lastTime) / 1000;
      lastTime = time;
      accumulator += dt;
      while (accumulator >= DT) {
        update(DT);
        accumulator -= DT;
      }
      render();
      requestAnimationFrame(gameLoop);
    }
    
    // Restart on R key
    window.addEventListener('keydown', e => {
      if (e.code === 'KeyR' && levelComplete) initLevel();
    });
    
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
