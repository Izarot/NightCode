<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpringPaddle Breakout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏓</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-family: 'Segoe UI', sans-serif; pointer-events: none; }
    #overlay.visible { pointer-events: auto; }
    #overlay h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 0 0 10px #00ffff; }
    #overlay p { font-size: 1.5rem; margin: 0.5rem 0; }
    #overlay button { padding: 0.8rem 2rem; font-size: 1.2rem; background: #00ffff; border: none; border-radius: 4px; cursor: pointer; color: #000; font-weight: bold; transition: transform 0.1s; }
    #overlay button:active { transform: scale(0.95); }
    #hud { position: absolute; top: 10px; left: 10px; color: #fff; font-family: monospace; font-size: 1.2rem; text-shadow: 0 0 5px #000; pointer-events: none; z-index: 10; }
    #timer { position: absolute; top: 10px; right: 10px; color: #fff; font-family: monospace; font-size: 1.2rem; text-shadow: 0 0 5px #000; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="overlay" class="visible">
    <h1>SpringPaddle Breakout</h1>
    <p>Press <span style="color:#0ff">SPACE</span> to launch</p>
    <p>← / → or A / D to move paddle target</p>
    <p>P to pause</p>
    <button id="startBtn">Start Game</button>
  </div>
  <div id="hud">Score: 0 | Lives: 3 | High: 0</div>
  <div id="timer">Time: 0.00s</div>
  <script type="module" src="main.js"></script>
</body>
</html>
