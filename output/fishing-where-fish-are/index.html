<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>🎣 Fish Equations</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎣</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#0a1628;font-family:'Orbitron',monospace;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;position:absolute;top:0;left:0}#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}.hud-top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;gap:8px;flex-wrap:wrap}.hud-bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:12px 16px;gap:8px;flex-wrap:wrap}.panel{background:rgba(13,17,23,0.9);border:1px solid #30363d;border-radius:8px;padding:8px 16px;backdrop-filter:blur(10px)}.label{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1.5px}.value{font-weight:700}.score-value{font-size:26px;color:#58a6ff;text-shadow:0 0 10px rgba(88,166,255,0.5)}.level-value{font-size:22px;color:#3fb950}.combo-value{font-size:22px;color:#d29922;transition:all 0.3s}.combo-value.active{color:#ffd43b;text-shadow:0 0 15px rgba(255,212,59,0.7)}.fish-value{font-size:20px;color:#a5d8ff}.timer-value{font-size:22px;color:#f85149}.high-value{font-size:14px;color:#ffd43b}.equation-panel{background:rgba(22,27,34,0.95);border:2px solid #58a6ff;border-radius:12px;padding:12px 24px;box-shadow:0 0 30px rgba(88,166,255,0.3);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.eq-slot{min-width:45px;height:55px;border:2px dashed #30363d;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;transition:all 0.3s}.eq-slot.filled{border:2px solid #3fb950;background:rgba(63,185,80,0.2);color:#3fb950;text-shadow:0 0 10px rgba(63,185,80,0.5);animation:slotPop 0.4s}@keyframes slotPop{50%{transform:scale(1.2)}}.eq-operator{font-size:28px;color:#d29922;font-weight:700}.power-bar{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:180px;height:16px;background:rgba(13,17,23,0.9);border:2px solid #30363d;border-radius:8px;overflow:hidden;opacity:0;transition:opacity 0.2s}.power-bar.visible{opacity:1}.power-fill{height:100%;width:0%;background:linear-gradient(90deg,#3fb950,#58a6ff,#d29922,#f85149);border-radius:6px;transition:width 0.05s}.floating-text{position:absolute;font-size:22px;font-weight:700;color:#ffd43b;text-shadow:0 0 10px rgba(255,212,59,0.8);pointer-events:none;animation:floatUp 1.5s ease-out forwards}@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}.instruction{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);font-size:12px;color:#8b949e;text-align:center}.speedrun{position:absolute;top:12px;right:16px;font-size:14px;color:#67e8f9;background:rgba(13,17,23,0.9);padding:6px 12px;border-radius:6px;border:1px solid #67e8f9}@media(max-width:600px){.score-value{font-size:18px}.level-value,.combo-value,.timer-value{font-size:16px}.eq-slot{min-width:35px;height:45px;font-size:22px}.eq-operator{font-size:20px}.equation-panel{padding:8px 12px;gap:4px}.panel{padding:6px 10px}.hud-top,.hud-bottom{padding:8px}}@media(max-width:400px){.hud-top{flex-direction:column;align-items:stretch}.score-panel,.level-panel{text-align:center}}</style></head><body><canvas id="gameCanvas"></canvas><div id="hud"><div class="hud-top"><div class="panel"><div class="label">Score</div><div class="value score-value" id="score">0</div></div><div class="equation-panel"><div class="eq-slot" id="slot0">?</div><div class="eq-operator" id="opDisp">+</div><div class="eq-slot" id="slot1">?</div><div class="eq-operator">=</div><div class="eq-slot" id="slot2" style="border-color:#58a6ff;color:#58a6ff">?</div></div><div class="panel"><div class="label">Level</div><div class="value level-value" id="level">1</div><div class="high-value" id="high">Best:0</div></div></div><div class="hud-bottom"><div class="panel"><div class="label">Combo</div><div class="value combo-value" id="combo">x1.0</div></div><div class="panel"><div class="label">Caught</div><div class="value fish-value" id="fishCount">0</div></div><div class="panel"><div class="label">Time</div><div class="value timer-value" id="timer">60</div></div></div><div class="power-bar" id="powerBar"><div class="power-fill" id="powerFill"></div></div><div class="speedrun" id="speedrun">⏱️ 0:00.0</div><div class="instruction" id="instruction">Click & hold to cast</div></div><script src="game.js"></script></body></html>
