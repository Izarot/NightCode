<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Water Drop Maze</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>💧</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f2027; color: #e0f7fa; overflow: hidden; }
    #gameContainer { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { width: 100%; height: 100%; background: #1a2a40; image-rendering: pixelated; }
    .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; padding: 5px 15px; font-size: 14px; z-index: 10; }
    .hud div { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
    #levelSelect { display: none; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 20px; }
    .levelBtn { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; background: #00bcd4; color: #000; }
    .levelBtn:hover { background: #00e5ff; }
    #startBtn { padding: 15px 30px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; background: #ffeb3b; color: #000; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="hud" id="hud">
      <div>Level: <span id="levelDisplay">1</span></div>
      <div>Time: <span id="timerDisplay">0.00</span>s</div>
      <div>Size: <span id="sizeDisplay">100</span>%</div>
      <div>High Score: <span id="highScoreDisplay">0</span></div>
    </div>
    <div id="levelSelect"></div>
    <button id="startBtn">Start Game</button>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
