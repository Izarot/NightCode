<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitosis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg"><text y=".9em" font-size="16">🧩</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        canvas { image-rendering: pixelated; background: #111; }
        #hud { position: absolute; top: 10px; left: 10px; color: #fff; font-family: monospace; font-size: 14px; pointer-events: none; }
        #timer { position: absolute; top: 10px; right: 10px; color: #0ff; font-family: monospace; font-size: 18px; }
        #highscore { position: absolute; bottom: 10px; left: 10px; color: #ff0; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud"></div>
    <div id="timer"></div>
    <div id="highscore"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
