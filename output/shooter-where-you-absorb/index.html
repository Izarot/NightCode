<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e27">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<title>Void Weaver</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e27;font-family:'Orbitron',sans-serif;color:#e0e6ff;user-select:none;}
#wrap{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#050714;}
canvas{display:block;background:#0a0e27;image-rendering:pixelated;box-shadow:0 0 40px rgba(0,200,255,0.15);max-width:100%;max-height:100%;}
#overlay{position:absolute;top:10px;right:10px;background:rgba(10,14,39,0.7);padding:8px 12px;border:1px solid #00d9ff;border-radius:4px;font-size:12px;letter-spacing:0.1em;}
#hs{color:#ffaa00;font-weight:700;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="overlay">HIGH SCORE: <span id="hs">0</span></div>
<script src="src/audio.js"></script>
<script src="src/data.js"></script>
<script src="src/entities.js"></script>
<script src="src/systems.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
