<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonant Velocity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='50%' font-size='80' font-family='Arial' fill='%23ff00aa'%3E🎵%3C/text%3E%3C/svg%3E">
<style>
body{margin:0;overflow:hidden;background:#0a0a1a;color:#fff;font-family:Arial, sans-serif}
#gameCanvas{background:#0a0a1a;display:block}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none}
#speedo{position:absolute;bottom:20px;right:20px;width:80px;height:80px;border-radius:50%;border:2px solid #00f0ff;background:rgba(0,240,255,0.1);display:flex;align-items:center;justify-content:center}
#combo{position:absolute;top:20px;right:20px;font-size:24px;font-weight:bold;color:#fff}
#timer{position:absolute;top:20px;left:20px;font-size:20px;color:#00f0ff}
#waveform{position:absolute;top:60px;left:20px;width:200px;height:10px;background:rgba(255,255,255,0.1);border-radius:5px;overflow:hidden}
#waveformCanvas{position:absolute;top:60px;left:20px;width:200px;height:10px}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
<div id="timer">00:00</div>
<div id="combo">COMBO: 0</div>
<div id="speedo"><div id="speedoNeedle" style="width:2px;height:20px;background:#faff00;transform:rotate(45deg);transform-origin:bottom center"></div></div>
<div id="waveform"><canvas id="waveformCanvas" width="200" height="10"></canvas></div>
</div>
<script src="audio/AudioEngine.js"></script>
<script src="engine/Physics.js"></script>
<script src="engine/TrackGenerator.js"></script>
<script src="render/Renderer.js"></script>
<script src="systems/GameManager.js"></script>
<script src="ui/HUD.js"></script>
<script src="game.js"></script>
</body>
</html>
