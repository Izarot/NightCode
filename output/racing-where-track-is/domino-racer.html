<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Domino Racer</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🁡</text></svg>"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"><style>:root{--cp:#00f5ff;--cm:#ff00aa;--ca:#ffd700;--cw:#ff6b35;--cg:#00ff88;--bd:#0a0a0f;--bm:#1a1a2e;--bt:#1a1a2a;--tx:#fff;--td:#888}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bd);color:var(--tx);font-family:'Orbitron',monospace;overflow:hidden;height:100vh;width:100vw}canvas{display:block;background:linear-gradient(180deg,var(--bd),var(--bm))}.menu{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,15,.92);z-index:10;text-align:center;padding:20px}.menu h1{font-size:clamp(36px,8vw,72px);color:var(--cp);text-shadow:0 0 20px var(--cp),0 0 40px var(--cm);margin-bottom:20px;letter-spacing:8px;font-weight:900}.menu h2{font-size:clamp(20px,4vw,32px);color:var(--ca);margin-bottom:30px;text-shadow:0 0 15px var(--ca)}.menu .ctrl{color:var(--td);font-size:clamp(11px,2vw,14px);line-height:2;margin:15px 0}.menu .start{color:var(--cg);font-size:clamp(16px,3vw,24px);animation:pulse 1.2s infinite;margin-top:20px;text-shadow:0 0 10px var(--cg)}.menu .hi{color:var(--ca);font-size:clamp(14px,2.5vw,18px);margin-top:15px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.time{position:absolute;top:10px;right:50%;transform:translateX(50%);color:var(--ca);font-size:clamp(12px,2vw,16px);z-index:5;text-shadow:0 0 8px var(--ca);background:rgba(0,0,0,.5);padding:4px 12px;border-radius:4px;border:1px solid var(--ca)}</style></head><body><canvas id="c"></canvas><div class="time" id="tm">0:00.0</div><div class="menu" id="menu"><h1>DOMINO RACER</h1><h2>NEON EDITION</h2><div class="ctrl">W/↑/SPACE: Accelerate | S/↓: Brake<br>A/←: Left | D/→: Right | SHIFT: Boost<br>R: Restart | M: Mute | ESC: Pause</div><div class="start">PRESS SPACE TO START</div><div class="hi" id="hi"></div></div><script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');const menu=document.getElementById('menu');const tmEl=document.getElementById('tm');const hiEl=document.getElementById('hi');let W,H,DPR;function resize(){DPR=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}window.addEventListener('resize',resize);resize();
let hiScore=parseInt(localStorage.getItem('dominoRacerHi')||'0');hiEl.textContent='HIGH SCORE: '+hiScore;
const COL={cp:'#00f5ff',cm:'#ff00aa',ca:'#ffd700',cw:'#ff6b35',cg:'#00ff88',bd:'#0a0a0f',bm:'#1a1a2e',bt:'#1a1a2a',tx:'#fff',td:'#888'};
const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(state==='menu')startGame();}if(e.key==='Escape'&&state==='play')state='pause';if(e.key==='m')audio.muted=!audio.muted;});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const audio={muted:false,ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();},play(f,d,v,t){if(this.muted)return;this.init();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t||'sine';o.frequency.value=f;g.connect(this.ctx.destination);g.gain.setValueAtTime(v||.1,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+(d||.2));o.start();o.stop(this.ctx.currentTime+(d||.2));},clack(){this.play(800,.05,.15,'square');this.play(600,.08,.1,'triangle');},whoosh(){this.play(200,.3,.08,'sawtooth');this.play(400,.2,.05,'sine');},chime(){this.play(523,.1,.1);setTimeout(()=>this.play(659,.1,.1),80);setTimeout(()=>this.play(784,.3,.1),160);},damage(){this.play(100,.3,.2,'sawtooth');this.play(80,.4,.15,'square');}};
const stateMgr={state:'menu',raceTime:0,runStart:0};
let state='menu',raceTime=0,runStart=0,countdown=0;
class Domino{constructor(x,y){this.x=x;this.y=y;this.w=20;this.h=60;this.angle=0;this.angVel=0;this.fallen=false;this.fallT=0;this.color=COL.cp;this.hp=1;}update(dt){if(this.fallen){this.fallT+=dt;if(this.angle<Math.PI/2)this.angVel+=980*dt*0.01;this.angle+=this.angVel*dt;this.angVel*=0.98;if(this.angle>=Math.PI/2){this.angle=Math.PI/2;this.angVel=0;}}else{if(Math.abs(this.angle)>0.26){this.fallen=true;audio.clack();}}}draw(c){const sx=this.x-camera.x;if(sx<-50||sx>W+50)return;c.save();c.translate(sx,this.y);c.rotate(this.angle);const g=c.createLinearGradient(-this.w/2,-this.h/2,this.w/2,this.h/2);if(this.fallen){g.addColorStop(0,'#334');g.addColorStop(1,'#112');}else{g.addColorStop(0,this.color);g.addColorStop(1,'#0066aa');}c.shadowColor=this.fallen?'#000':this.color;c.shadowBlur=this.fallen?0:12;c.fillStyle=g;c.beginPath();c.roundRect(-this.w/2,-this.h/2,this.w,this.h,4);c.fill();c.restore();}}
class Player{constructor(){this.reset();}reset(){this.x=100;this.y=400;this.vx=0;this.vy=0;this.w=80;this.h=30;this.fuel=100;this.health=3;this.dmgT=0;this.checkpoint=0;this.score=0;this.combo=0;this.lastTopple=0;}update(dt){const acc=(keys['w']||keys['arrowup']||keys[' '])?300:0;const brk=(keys['s']||keys['arrowdown'])?500:0;const boost=keys['shift']&&this.fuel>0;if(boost){this.fuel=Math.max(0,this.fuel-40*dt);}else{this.fuel=Math.min(100,this.fuel+15*dt);}let maxV=boost?600:400;if(acc>0)this.vx+=acc*dt;if(brk>0)this.vx-=brk*dt;this.vx*=(this.grounded?0.95:0.99);this.vx=Math.max(-100,Math.min(maxV,this.vx));this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=980*dt;if(this.y>400){this.y=400;this.vy=0;this.grounded=true;}else{this.grounded=false;}if(this.dmgT>0)this.dmgT-=dt;this.score=Math.floor(this.x/10)+this.checkpoint*1000;}draw(c){const sx=this.x-camera.x;c.save();c.translate(sx,this.y);c.shadowColor=COL.ca;c.shadowBlur=20;const g=c.createLinearGradient(-this.w/2,-this.h/2,this.w/2,this.h/2);g.addColorStop(0,COL.ca);g.addColorStop(1,COL.cw);c.fillStyle=g;c.beginPath();c.moveTo(this.w/2,0);c.lineTo(-this.w/2,-this.h/2);c.lineTo(-this.w/2+15,0);c.lineTo(-this.w/2,this.h/2);c.closePath();c.fill();for(let i=0;i<5;i++){c.globalAlpha=1-i*0.2;c.fillStyle=COL.cw;c.fillRect(-this.w/2-10-i*8,-2,6,4);}c.globalAlpha=1;c.restore();}}
const camera={x:0,y:0};const player=new Player();const dominos=[];const particles=[];const stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*2000,y:Math.random()*720,s:Math.random()*2+0.5,v:Math.random()*20+10});
function buildTrack(){dominos.length=0;let x=400;let y=380;let dir=1;for(let i=0;i<500;i++){const baseY=380+Math.sin(i*0.02)*50;dominos.push(new Domino(x,baseY));x+=25;if(i%40===0&&i>0){x+=80;}}dominos.push(new Domino(5000+200,380));}
function startGame(){state='countdown';countdown=3;runStart=performance.now();player.reset();buildTrack();menu.style.display='none';particles.length=0;}
function spawnP(x,y,c,n){for(let i=0;i<(n||5);i++)particles.push({x,y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200-50,life:1,c:c||COL.ca});}
function update(dt){if(state!=='play'&&state!=='countdown')return;if(state==='countdown'){countdown-=dt;if(countdown<=0){state='play';raceTime=0;}return;}raceTime=(performance.now()-runStart)/1000;tmEl.textContent=Math.floor(raceTime/60)+':'+(raceTime%60).toFixed(1);player.update(dt);camera.x=Math.max(0,player.x-W/2+200);dominos.forEach(d=>{d.update(dt);const dx=player.x-d.x;const dy=player.y-d.y;if(Math.abs(dx)<25&&Math.abs(dy)<50&&!d.fallen){d.fallen=true;d.angVel=2;player.score+=5;player.combo++;spawnP(d.x,d.y,COL.cp,3);}else if(Math.abs(dx)<50&&Math.abs(dy)<45&&d.fallen&&Math.abs(d.angle-Math.PI/2)<0.1&&d.fallT>0.3){if(player.dmgT<=0&&player.vx>200){player.health--;player.dmgT=1;player.vx*=-0.5;audio.damage();}}});const cp=Math.floor(player.x/500);if(cp>player.checkpoint&&cp<=10){player.checkpoint=cp;player.health=Math.min(3,player.health+1);audio.chime();spawnP(player.x,player.y,COL.cg,20);}if(player.x>=5000){state='finish';const final=player.score+Math.max(0,Math.floor(30000-raceTime*100));if(final>hiScore){hiScore=final;localStorage.setItem('dominoRacerHi',hiScore);hiEl.textContent='HIGH SCORE: '+hiScore;}setTimeout(()=>{state='menu';menu.style.display='flex';},2000);}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt*2;});particles.splice(0,particles.length,(p)=>p.life>0);stars.forEach(s=>{s.x-=s.v*dt*0.5;if(s.x<0)s.x=W+Math.random()*500;});if(keys['r']){startGame();}}
function draw(){ctx.fillStyle=COL.bd;ctx.fillRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,COL.bd);bg.addColorStop(1,COL.bm);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=COL.tx;stars.forEach(s=>{ctx.globalAlpha=s.s*0.4;ctx.fillRect(s.x,s.y,s.s,s.s);});ctx.globalAlpha=1;ctx.fillStyle=COL.bt;ctx.fillRect(-camera.x%40,Math.sin(camera.x*0.01)*30+350,W,8);ctx.shadowColor=COL.cp;ctx.shadowBlur=8;for(let i=0;i<W;i+=50){ctx.fillStyle=i%200===0?COL.ca:COL.bt;ctx.fillRect(i-camera.x%50,Math.sin(camera.x*0.01)*30+355,30,2);}ctx.shadowBlur=0;dominos.forEach(d=>d.draw(ctx));player.draw(ctx);particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x-camera.x,p.y,3,3);});ctx.globalAlpha=1;const sx=player.x-camera.x;const pulse=player.dmgT>0?Math.random()*5:0;ctx.font='16px Orbitron';ctx.fillStyle=COL.cp;ctx.shadowColor=COL.cp;ctx.shadowBlur=10;ctx.fillText('♥'.repeat(Math.max(0,player.health))+('♡'.repeat(3-Math.max(0,player.health))),20+pulse,40);ctx.textAlign='center';ctx.fillStyle=COL.ca;ctx.fillText('CHECKPOINT '+player.checkpoint+'/10',W/2,40);ctx.textAlign='left';ctx.fillStyle=COL.cg;ctx.fillText('DIST: '+Math.floor(player.x/10)+'m',20,H-20);ctx.textAlign='center';ctx.fillStyle=COL.cm;ctx.fillText('SCORE: '+player.score,W/2,H-20);ctx.textAlign='right';ctx.fillStyle=COL.ca;ctx.fillRect(W-130,25,120,12);ctx.fillStyle=COL.cw;ctx.fillRect(W-128,27,player.fuel*1.16,8);ctx.fillStyle=COL.tx;ctx.fillText('⚡',W-140,38);ctx.shadowBlur=0;if(state==='countdown'){ctx.font='80px Orbitron';ctx.textAlign='center';ctx.fillStyle=COL.ca;ctx.shadowColor=COL.ca;ctx.shadowBlur=30;ctx.fillText(Math.ceil(countdown),W/2,H/2);}if(state==='finish'){ctx.font='60px Orbitron';ctx.textAlign='center';ctx.fillStyle=COL.cg;ctx.shadowColor=COL.cg;ctx.shadowBlur=30;ctx.fillText('FINISH!',W/2,H/2);ctx.font='24px Orbitron';ctx.fillText('Score: '+player.score,W/2,H/2+50);}if(state==='pause'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.font='60px Orbitron';ctx.textAlign='center';ctx.fillStyle=COL.ca;ctx.fillText('PAUSED',W/2,H/2);ctx.font='20px Orbitron';ctx.fillStyle=COL.tx;ctx.fillText('ESC to Resume',W/2,H/2+50);}}
let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
