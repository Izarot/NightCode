<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slide & Find</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui-overlay" class="hidden">
    <div id="start-screen" class="screen">
      <h1>Slide & Find</h1>
      <p>Navigate rows, hit targets, reach exits</p>
      <div class="controls-hint">← → or A/D to move | Tap sides on mobile</div>
      <button id="start-btn">Start Game</button>
      <div class="high-score">Best: <span id="high-score-val">0</span></div>
    </div>
    <div id="win-screen" class="screen hidden">
      <h1>Level Complete! 🎉</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <p>Time: <span id="final-time">0.00</span>s</p>
      <button id="play-again-btn">Play Again</button>
    </div>
    <div id="fail-screen" class="screen hidden">
      <h1>Failed ⏱️</h1>
      <p id="fail-reason">Time ran out</p>
      <button id="retry-btn">Retry</button>
    </div>
  </div>
  <script src="audio.js"></script>
  <script src="input.js"></script>
  <script src="particles.js"></script>
  <script src="game.js"></script>
</body>
</html>
