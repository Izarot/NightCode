<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seesaw Balance</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⚖️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item">Moves: <span id="moves">0</span></div>
            <div class="hud-item">Time: <span id="timer">0.0</span>s</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="controls">
            <button id="undoBtn">Undo</button>
            <button id="hintBtn">Hint</button>
            <button id="restartBtn">Restart</button>
        </div>
        <div id="overlay" class="hidden">
            <div id="overlay-content">
                <h2 id="overlay-title">Level Complete!</h2>
                <p id="overlay-stats"></p>
                <button id="nextBtn">Next Level</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
