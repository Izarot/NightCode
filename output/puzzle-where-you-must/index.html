<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Balance‑Shift</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#1a1a2e; overflow:hidden; font-family:'Segoe UI', sans-serif; }
    canvas { display:block; width:100vw; height:100vh; touch-action:none; }
    #ui-overlay { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
    .hud { position:absolute; color:#fff; font-size:1.2rem; text-shadow:0 0 4px #000; pointer-events:auto; }
    #timer { top:1rem; right:1rem; font-family:monospace; font-size:1.5rem; background:rgba(0,0,0,0.5); padding:0.5rem 1rem; border-radius:8px; }
    #level-info { top:1rem; left:1rem; background:rgba(0,0,0,0.5); padding:0.5rem 1rem; border-radius:8px; }
    #inventory { bottom:1rem; left:50%; transform:translateX(-50%); display:flex; gap:0.5rem; background:rgba(0,0,0,0.7); padding:0.5rem; border-radius:12px; }
    .weight-btn { width:60px; height:60px; border:none; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:#fff; text-shadow:0 0 2px #000; transition:transform 0.1s; }
    .weight-btn:active { transform:scale(0.9); }
    .weight-btn.selected { outline:3px solid #ffd700; }
    .weight-btn:disabled { opacity:0.4; cursor:not-allowed; }
    #torque-meter { top:1rem; left:50%; transform:translateX(-50%); width:300px; height:24px; background:rgba(0,0,0,0.5); border-radius:12px; overflow:hidden; display:flex; }
    .torque-bar { height:100%; transition:width 0.1s; }
    #torque-left { background:#00d9ff; }
    #torque-right { background:#ff6b6b; }
    #torque-values { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:0 0.5rem; font-size:0.8rem; color:#fff; text-shadow:0 0 2px #000; }
    #hint-btn { top:1rem; right:4.5rem; width:50px; height:50px; border-radius:50%; background:#0f3460; border:none; color:#fff; font-size:1.5rem; cursor:pointer; box-shadow:0 0 10px #e94560; }
    #pause-btn { top:1rem; right:10rem; width:50px; height:50px; border-radius:50%; background:#0f3460; border:none; color:#fff; font-size:1.5rem; cursor:pointer; }
    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; gap:1rem; }
    .modal.hidden { display:none; }
    .modal h2 { color:#ffd700; text-shadow:0 0 10px #e94560; }
    .modal button { padding:0.8rem 2rem; font-size:1.2rem; border:none; border-radius:8px; background:#e94560; color:#fff; cursor:pointer; transition:background 0.2s; }
    .modal button:hover { background:#ff6b6b; }
    #stars { display:flex; gap:0.5rem; font-size:2rem; }
    .star { color:#444; transition:color 0.2s; }
    .star.filled { color:#feca57; text-shadow:0 0 8px #feca57; }
    @media (max-width:600px) { .hud { font-size:1rem; } #timer { font-size:1.2rem; } .weight-btn { width:50px; height:50px; } #torque-meter { width:90vw; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div id="timer" class="hud">00:00.00</div>
    <div id="level-info" class="hud">Level 1 / 15</div>
    <div id="torque-meter" class="hud">
      <div id="torque-left" class="torque-bar" style="width:50%"></div>
      <div id="torque-right" class="torque-bar" style="width:50%"></div>
      <div id="torque-values"><span id="torque-l">0.0</span><span id="torque-r">0.0</span></div>
    </div>
    <button id="hint-btn" class="hud" aria-label="Hint">💡</button>
    <button id="pause-btn" class="hud" aria-label="Pause">⏸️</button>
    <div id="inventory" class="hud"></div>
  </div>
  <div id="pause-modal" class="modal hidden">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
    <button id="restart-btn">Restart Level</button>
    <button id="menu-btn">Main Menu</button>
  </div>
  <div id="complete-modal" class="modal hidden">
    <h2>Level Complete!</h2>
    <div id="stars"></div>
    <p id="time-result"></p>
    <button id="next-btn">Next Level</button>
    <button id="replay-btn">Replay</button>
  </div>
  <div id="menu-modal" class="modal">
    <h2>Balance‑Shift</h2>
    <p style="color:#aaa; max-width:80%; text-align:center;">Place weights to balance the seesaw. Drag weights to slots. Achieve equilibrium to win.</p>
    <button id="start-btn">Start Game</button>
    <button id="continue-btn" class="hidden">Continue</button>
    <button id="reset-btn">Reset Progress</button>
  </div>
  <script src="config.js"></script>
  <script src="levels.js"></script>
  <script src="audio.js"></script>
  <script src="seesaw.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
