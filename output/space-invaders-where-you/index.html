<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MOTHERSHIP — Inverted Space Invaders</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👽</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05010f;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#e8f6ff;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a0533 0%,#05010f 70%)}
canvas{display:block;box-shadow:0 0 60px #7b2fff88,0 0 120px #00f5ff33;border:1px solid #7b2fff66;border-radius:8px;max-width:100vw;max-height:100vh;cursor:crosshair}
#touchUI{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}
.tbtn{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #00f5ff;background:#00f5ff22;color:#fff;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 6px #000}
.tbtn:active{background:#ff2ea688}
#btnFire{right:18px;bottom:90px;width:78px;height:78px;border-color:#ff2ea6}
#btnDash{right:108px;bottom:28px}
#btnDeploy{right:18px;bottom:180px;border-color:#a6ff00}
#btnCluster{right:108px;bottom:110px;border-color:#ffb800}
@media(pointer:coarse){#touchUI{display:block}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<div id="touchUI">
<div class="tbtn" id="btnFire">FIRE</div><div class="tbtn" id="btnDash">DASH</div><div class="tbtn" id="btnDeploy">DEPLOY</div><div class="tbtn" id="btnCluster">BOMB</div>
</div>
<script>
'use strict';
const W=960,H=640,canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);canvas.style.width=(W*s)+'px';canvas.style.height=(H*s)+'px';}
addEventListener('resize',resize);resize();
// SNEAKY: LocalStorage High Score + Speedrun Timer + WebAudio
let HI=+(localStorage.getItem('mothership_hi')||0);
let audioCtx=null,muted=false;
function ac(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function sfx(type){if(muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);const t=a.currentTime;
 if(type==='shoot'){o.type='sawtooth';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(220,t+0.08);g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);o.start(t);o.stop(t+0.1);}
 else if(type==='hit'){o.type='square';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+0.2);g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.start(t);o.stop(t+0.25);}
 else if(type==='boom'){o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(30,t+0.4);g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.45);o.start(t);o.stop(t+0.5);}
 else if(type==='click'){o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.start(t);o.stop(t+0.09);}
 else if(type==='pod'){o.type='sine';o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(880,t+0.12);g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.start(t);o.stop(t+0.32);}
}catch(e){}}
// Input
const keys={},mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(e.code==='KeyM')muted=!muted;if(e.code==='KeyP'&&state==='playing')state='paused';else if(e.code==='KeyP'&&state==='paused')state='playing';});
addEventListener('keyup',e=>keys[e.code]=false);
function canvasPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
canvas.addEventListener('mousemove',e=>{const p=canvasPos(e);mouse.x=p.x;mouse.y=p.y;});
canvas.addEventListener('mousedown',e=>{const p=canvasPos(e);mouse.x=p.x;mouse.y=p.y;mouse.down=true;ac();handleClick(p.x,p.y);if(e.button===2)tryCluster();});
addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// Touch joystick + buttons
let joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0};
canvas.addEventListener('touchstart',e=>{ac();for(const t of e.changedTouches){const p={x:(t.clientX-canvas.getBoundingClientRect().left)/canvas.getBoundingClientRect().width*W,y:(t.clientY-canvas.getBoundingClientRect().top)/canvas.getBoundingClientRect().height*H};if(p.x<W/2&&!joy.active){joy.active=true;joy.id=t.identifier;joy.ox=p.x;joy.oy=p.y;}handleClick(p.x,p.y);}}e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){const r=canvas.getBoundingClientRect();joy.dx=((t.clientX-r.left)/r.width*W-joy.ox)/50;joy.dy=((t.clientY-r.top)/r.height*H-joy.oy)/50;}e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.dx=joy.dy=0;}e.preventDefault();},{passive:false});
function bindBtn(id,down,up){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();down();},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();up&&up();},{passive:false});el.addEventListener('mousedown',down);el.addEventListener('mouseup',()=>up&&up());}
let touchFire=false,touchDeploy=false;
bindBtn('btnFire',()=>touchFire=true,()=>touchFire=false);bindBtn('btnDash',()=>tryDash());bindBtn('btnDeploy',()=>touchDeploy=true,()=>touchDeploy=false);bindBtn('btnCluster',()=>tryCluster());
// Game State
let state='title',sector=1,score=0,multiplier=1,noHitTimer=0,kills=0,shots=0,hits=0,startTime=0,elapsed=0,shake=0,shakeT=0,redFlash=0,jetTimer=5;
let player,bullets,ebullets,bombs,particles,popups,enemies,cities,shields,pods,drones,stars,deployProgress,deployCity,landed,lostPods;
function makeStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:[0.2,0.5,0.8][i%3],s:1+Math.random()*2,tw:Math.random()*6});}
makeStars();
function resetSector(s){sector=s;bullets=[];ebullets=[];bombs=[];particles=[];popups=[];enemies=[];drones=[];pods=[];landed=0;lostPods=0;deployProgress=0;deployCity=null;jetTimer=4;
 cities=[120,360,600,840].map(x=>({x,y:560,w:110,h:70,hp:10,max:10,alive:true,seed:Math.random()*100}));
 shields=[240,480,720].map((x,i)=>({x,y:545,w:56,h:42,hp:6,max:6,alive:true,type:'shield',t:0}));
 // Turrets on rooftops
 cities.forEach(c=>{enemies.push({type:'turret',x:c.x-30,y:c.y-8,hp:3,max:3,cool:1+Math.random(),r:14});enemies.push({type:'turret',x:c.x+30,y:c.y-8,hp:3,max:3,cool:1.5+Math.random(),r:14});});
 for(let i=0;i<2+s;i++)enemies.push({type:'sam',x:100+Math.random()*760,y:600,hp:5,max:5,dir:Math.random()<0.5?-1:1,cool:2,burst:0,r:16});
 player={x:W/2,y:90,vx:0,vy:0,tilt:0,hull:100,energy:50,heat:0,overheat:0,heatDelay:0,fireCool:0,dashT:0,dashCool:0,clusterCool:0,droneCool:0,trail:[],ring:0};
}
function startGame(){score=0;multiplier=1;kills=0;shots=0;hits=0;noHitTimer=0;startTime=performance.now();elapsed=0;resetSector(1);state='playing';sfx('click');}
function addScore(n,x,y){const v=n*multiplier;score+=v;popups.push({x,y,txt:'+'+v,col:'#a6ff00',t:0});if(score>HI){HI=score;localStorage.setItem('mothership_hi',HI);}}
function explode(x,y,col,n){for(let i=0;i<n&&particles.length<300;i++){const a=Math.random()*6.28,sp=40+Math.random()*220;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.6,t:0,col,size:2+Math.random()*3});}shake=Math.max(shake,3);shakeT=0.2;sfx('boom');}
function tryDash(){if(state!=='playing'||player.dashCool>0||player.energy<15)return;player.energy-=15;player.dashT=0.18;player.dashCool=1.2;player.vx=(player.vx>=0?900:-900);sfx('click');}
function tryCluster(){if(state!=='playing'||player.clusterCool>0||player.energy<20)return;player.energy-=20;player.clusterCool=2.5;for(let i=-2;i<=2;i++)bombs.push({x:player.x+i*14,y:player.y+20,vx:i*90,vy:120,r:7,t:0});sfx('shoot');}
function tryDrone(){if(state!=='playing'||player.droneCool>0||player.energy<30||drones.length>=2)return;player.energy-=30;player.droneCool=1;drones.push({x:player.x-40,y:player.y+30,t:8,cool:0,ang:Math.random()*6});sfx('pod');}
function handleClick(x,y){if(state==='title'){startGame();return;}if(state==='over'||state==='victory'){if(x>380&&x<580&&y>420&&y<470)startGame();return;}if(state==='paused'){if(y>300&&y<340)state='playing';if(y>350&&y<390)startGame();if(y>400&&y<440)state='title';}}
// Update
function update(dt){
 if(state!=='playing')return;
 elapsed=(performance.now()-startTime)/1000;
 noHitTimer+=dt;multiplier=Math.min(5,1+Math.floor(noHitTimer/10));
 // Movement
 const tractor=keys['KeyQ'];
 let ax=0,ay=0;
 if(keys['KeyA']||keys['ArrowLeft'])ax-=1800; if(keys['KeyD']||keys['ArrowRight'])ax+=1800;
 if(keys['KeyW']||keys['ArrowUp'])ay-=900; if(keys['KeyS']||keys['ArrowDown'])ay+=900;
 if(joy.active){ax+=joy.dx*1800;ay+=joy.dy*900;}
 const slow=tractor?0.5:1;
 if(player.dashT>0){player.dashT-=dt;}else{player.vx+=ax*slow*dt;player.vy+=ay*slow*dt;if(ax===0)player.vx*=Math.exp(-6*dt);if(ay===0)player.vy*=Math.exp(-6*dt);}
 player.vx=Math.max(-(player.dashT>0?900:420),Math.min(player.dashT>0?900:420,player.vx));
 player.vy=Math.max(-180,Math.min(180,player.vy));
 player.x+=player.vx*dt;player.y+=player.vy*dt;
 if(player.x<50){player.x=50;player.vx*=-0.3;shake=4;} if(player.x>W-50){player.x=W-50;player.vx*=-0.3;shake=4;}
 if(player.y<40){player.y=40;player.vy*=-0.3;} if(player.y>224){player.y=224;player.vy*=-0.3;}
 player.tilt+= ((player.vx/420*12)-player.tilt)*Math.min(1,dt*8);
 player.ring+=dt*2;
 // Mouse aim assist
 if(Math.abs(mouse.x-player.x)<100)player.x+=(mouse.x-player.x)*dt*0.5;
 player.trail.unshift({x:player.x,y:player.y,t:0});if(player.trail.length>12)player.trail.pop();player.trail.forEach(t=>t.t+=dt);
 // Energy / heat
 player.energy=Math.min(100,player.energy+8*dt);
 player.heatDelay-=dt;if(player.heatDelay<=0&&player.overheat<=0)player.heat=Math.max(0,player.heat-40*dt);
 if(player.overheat>0)player.overheat-=dt;
 player.fireCool-=dt;player.dashCool-=dt;player.clusterCool-=dt;player.droneCool-=dt;
 const firing=(keys['Space']||mouse.down||touchFire)&&player.overheat<=0&&player.dashT<=0;
 if(firing&&player.fireCool<=0){player.fireCool=1/8;shots++;bullets.push({x:player.x,y:player.y+24,vx:0,vy:750,r:5});player.heat+=12;player.heatDelay=0.5;sfx('shoot');if(player.heat>=100){player.heat=100;player.overheat=1.5;popups.push({x:player.x,y:player.y-40,txt:'OVERHEAT!',col:'#ff4444',t:0});}}
 if(keys['ShiftLeft']||keys['ShiftRight'])tryDash();
 if(keys['KeyF'])tryCluster();
 if(keys['KeyC'])tryDrone();
 // Tractor
 if(tractor){ebullets.forEach(b=>{const dx=player.x-b.x,dy=player.y-b.y,d=Math.hypot(dx,dy);if(d<220&&dy>0){b.vx+=dx/d*600*dt;b.vy+=dy/d*600*dt;if(d<26){b.dead=true;player.energy=Math.min(100,player.energy+5);popups.push({x:b.x,y:b.y,txt:'+5 ENERGY',col:'#c77dff',t:0});}}});particles.push({x:player.x+(Math.random()-0.5)*60,y:player.y+40,vx:0,vy:-50,life:0.3,t:0,col:'#c77dff',size:2});}
 // Drones
 drones.forEach(d=>{d.t-=dt;d.ang+=dt*3;d.x=player.x+Math.cos(d.ang)*55;d.y=player.y+Math.sin(d.ang)*30+20;d.cool-=dt;if(d.cool<=0){let best=null,bd=1e9;enemies.forEach(e=>{const dd=Math.hypot(e.x-d.x,e.y-d.y);if(dd<bd){bd=dd;best=e;}});cities.forEach(c=>{if(c.alive){const dd=Math.hypot(c.x-d.x,c.y-d.y);if(dd<bd){bd=dd;best=c;}}});if(best&&bd<400){bullets.push({x:d.x,y:d.y,vx:(best.x-d.x)/bd*600,vy:(best.y-d.y)/bd*600,r:4});d.cool=0.4;}}});drones=drones.filter(d=>d.t>0);
 // Bullets
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>H+20)b.dead=true;});
 bombs.forEach(b=>{b.t+=dt;b.vy+=500*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>540||b.t>2){b.dead=true;explode(b.x,b.y,'#ffb800',20); // AoE
   enemies.forEach(e=>{if(Math.hypot(e.x-b.x,e.y-b.y)<60)damageEnemy(e,3,b.x,b.y);});
   cities.forEach(c=>{if(c.alive&&Math.hypot(c.x-b.x,c.y-b.y)<70)damageCity(c,3);});
   shields.forEach(s=>{if(s.alive&&Math.hypot(s.x-b.x,s.y-b.y)<60)damageShield(s,3);});}});
 // Enemies
 const bulletSpeed=(380+Math.random()*140)*(1+(sector-1)*0.1);
 enemies.forEach(e=>{e.cool-=dt;
  if(e.type==='sam'){e.x+=e.dir*60*dt;if(e.x<40||e.x>W-40)e.dir*=-1;if(e.cool<=0){e.cool=2.2;e.burst=3;}}
  if(e.type==='sam'&&e.burst>0&&e.cool>1.8){ebullets.push({x:e.x,y:e.y-10,vx:(player.x-e.x)*0.3,vy:-bulletSpeed,r:5});e.burst--;}
  if(e.type==='turret'&&e.cool<=0){e.cool=1.4;const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;ebullets.push({x:e.x,y:e.y-8,vx:dx/d*bulletSpeed,vy:dy/d*bulletSpeed,r:5});}
  if(e.type==='jet'){e.t+=dt;e.x+=e.dir*140*dt;e.y=300+Math.sin(e.t*3)*40;if(e.cool<=0){e.cool=1.8;ebullets.push({x:e.x,y:e.y+10,vx:0,vy:bulletSpeed*0.8,r:5});}if(e.x<-40||e.x>W+40)e.dead=true;}
 });
 // Jet spawn
 jetTimer-=dt;if(jetTimer<=0){jetTimer=6+Math.random()*3;enemies.push({type:'jet',x:Math.random()<0.5?-30:W+30,y:300,hp:2,max:2,dir:Math.random()<0.5?1:-1,cool:1,t:0,r:14});}
 enemies=enemies.filter(e=>!e.dead);
 // Enemy bullets
 ebullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.dead=true;
  const d=Math.hypot(b.x-player.x,b.y-player.y);
  if(d<18&&!b.dead){b.dead=true;player.hull-=8;noHitTimer=0;redFlash=0.3;shake=6;shakeT=0.3;sfx('hit');explode(player.x,player.y,'#ff4444',10);if(player.hull<=0){player.hull=0;gameOver();}}
  else if(d<40&&!b.grazed){b.grazed=true;player.energy=Math.min(100,player.energy+2);popups.push({x:player.x,y:player.y-30,txt:'GRAZE +2',col:'#00f5ff',t:0});}
  // pods damage
  pods.forEach(p=>{if(Math.hypot(b.x-p.x,b.y-p.y)<16){b.dead=true;p.hp-=5;}});
 });
 ebullets=ebullets.filter(b=>!b.dead);
 // Bullet collisions
 bullets.forEach(b=>{if(b.dead)return;
  for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){b.dead=true;hits++;damageEnemy(e,1,b.x,b.y);break;}}
  if(b.dead)return;
  for(const s of shields){if(s.alive&&Math.hypot(b.x-s.x,b.y-s.y)<34){b.dead=true;hits++;damageShield(s,1);break;}}
  if(b.dead)return;
  for(const c of cities){if(c.alive&&Math.abs(b.x-c.x)<c.w/2&&Math.abs(b.y-c.y)<c.h/2){b.dead=true;hits++;damageCity(c,1);break;}}
 });
 bullets=bullets.filter(b=>!b.dead);bombs=bombs.filter(b=>!b.dead);
 // Deploy mechanic
 const shieldsDown=shields.every(s=>!s.alive);
 deployCity=null;
 if(shieldsDown&&landed<3){for(const c of cities){if(!c.alive&&Math.abs(player.x-c.x)<55&&Math.abs(player.y-c.y)<80)deployCity=c;}}
 const deploying=(keys['KeyE']||touchDeploy)&&deployCity&&Math.hypot(player.vx,player.vy)<50;
 if(deploying){deployProgress+=dt;if(deployProgress>=3){deployProgress=0;pods.push({x:deployCity.x,y:deployCity.y-20,hp:20,max:20,t:0,need:10});sfx('pod');popups.push({x:deployCity.x,y:deployCity.y-60,txt:'POD DEPLOYED!',col:'#a6ff00',t:0});}}
 else deployProgress=Math.max(0,deployProgress-dt*0.5);
 pods.forEach(p=>{p.t+=dt;if(p.hp<=0&&!p.dead){p.dead=true;lostPods++;explode(p.x,p.y,'#ff8800',25);popups.push({x:p.x,y:p.y,txt:'POD LOST!',col:'#ff4444',t:0});}if(p.t>=p.need&&!p.dead){p.dead=true;p.landed=true;landed++;addScore(2000,p.x,p.y);sfx('pod');popups.push({x:p.x,y:p.y,txt:'POD LANDED!',col:'#a6ff00',t:0});if(landed>=3){if(sector>=3)victory();else{popups.push({x:W/2,y:200,txt:'SECTOR CLEARED!',col:'#00f5ff',t:0});resetSector(sector+1);player.hull=Math.min(100,player.hull+20);}}}});
 pods=pods.filter(p=>!p.dead);
 // Particles/popups
 particles.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;p.vy*=0.98;});particles=particles.filter(p=>p.t<p.life);
 popups.forEach(p=>{p.t+=dt;p.y-=30*dt;});popups=popups.filter(p=>p.t<0.8);
 if(shakeT>0)shakeT-=dt;else shake=0;
 if(redFlash>0)redFlash-=dt;
 stars.forEach(s=>{s.y+=s.z*20*dt;if(s.y>H)s.y=0;});
}
function damageEnemy(e,d,x,y){e.hp-=d;popups.push({x:e.x,y:e.y-10,txt:''+d,col:'#fff',t:0});if(e.hp<=0&&!e.dead){e.dead=true;kills++;player.energy=Math.min(100,player.energy+4);explode(e.x,e.y,'#ff8800',30);addScore(e.type==='turret'?100:e.type==='sam'?150:200,e.x,e.y);}}
function damageShield(s,d){s.hp-=d;if(s.hp<=0&&s.alive){s.alive=false;explode(s.x,s.y,'#00f5ff',35);addScore(500,s.x,s.y);player.hull=Math.min(100,player.hull+10);popups.push({x:s.x,y:s.y-30,txt:'SHIELD DOWN +10 HULL',col:'#00f5ff',t:0});}}
function damageCity(c,d){if(shields.some(s=>s.alive)){popups.push({x:c.x,y:c.y-40,txt:'SHIELDED!',col:'#00f5ff',t:0});return;}c.hp-=d;if(c.hp<=0&&c.alive){c.alive=false;explode(c.x,c.y,'#ffaa00',40);shake=8;shakeT=0.4;addScore(1000,c.x,c.y);}}
function gameOver(){state='over';if(score>HI){HI=score;localStorage.setItem('mothership_hi',HI);}}
function victory(){state='victory';if(score>HI){HI=score;localStorage.setItem('mothership_hi',HI);}}
// Draw
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
 // BG
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0220');g.addColorStop(0.6,'#12042e');g.addColorStop(1,'#1a0533');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
 // Nebula
 for(let i=0;i<3;i++){const rg=ctx.createRadialGradient(200+i*250,150+i*80,10,200+i*250,150+i*80,220);rg.addColorStop(0,['#7b2fff22','#ff2ea622','#00f5ff18'][i]);rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);}
 stars.forEach(s=>{ctx.globalAlpha=0.5+Math.sin(s.tw+performance.now()/500)*0.4;ctx.fillStyle=s.z>0.6?'#a6ff00':s.z>0.3?'#00f5ff':'#ffffff';ctx.fillRect(s.x,s.y,s.s,s.s);});ctx.globalAlpha=1;
 // Earth curvature
 ctx.beginPath();ctx.ellipse(W/2,780,620,220,0,0,6.28);ctx.fillStyle='#0a2a4a';ctx.fill();ctx.strokeStyle='#00f5ff';ctx.lineWidth=3;ctx.shadowColor='#00f5ff';ctx.shadowBlur=20;ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle='#ffcc6633';for(let i=0;i<40;i++){const x=(i*97)%W,y=560+((i*53)%40);ctx.fillRect(x,y,3,2);}
 if(state==='title'){drawTitle();ctx.restore();return;}
 if(!player){ctx.restore();return;}
 // Deploy zone
 if(deployCity){ctx.strokeStyle='#a6ff00';ctx.setLineDash([6,6]);ctx.strokeRect(deployCity.x-55,deployCity.y-70,110,90);ctx.setLineDash([]);ctx.fillStyle='#a6ff00';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('DEPLOY ZONE — HOLD E',deployCity.x,deployCity.y-80);if(deployProgress>0){ctx.fillStyle='#a6ff00';ctx.fillRect(deployCity.x-50,deployCity.y-95,100*deployProgress/3,6);}}
 // Cities
 cities.forEach(c=>{if(!c.alive){
ctx.fillStyle='#3a2a1a';ctx.fillRect(c.x-c.w/2,c.y-10,c.w,20);ctx.fillStyle='#ff6600';ctx.fillRect(c.x-20,c.y-18,8,8);ctx.fillRect(c.x+10,c.y-14,6,6);ctx.fillStyle='#888';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText('DESTROYED',c.x,c.y+30);}else{ctx.fillStyle='#1a3a5a';ctx.fillRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);ctx.fillStyle='#00f5ff';for(let i=0;i<12;i++){ctx.fillRect(c.x-c.w/2+8+(i%4)*24,c.y-c.h/2+10+Math.floor(i/4)*18,10,8);}ctx.strokeStyle='#00f5ff';ctx.strokeRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);ctx.fillStyle='#ffcc66';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('CITY '+c.hp+'/'+c.max,c.x,c.y-c.h/2-8);}});
 shields.forEach(s=>{if(!s.alive)return;ctx.strokeStyle='#00f5ff';ctx.shadowColor='#00f5ff';ctx.shadowBlur=15;ctx.strokeRect(s.x-s.w/2,s.y-s.h/2,s.w,s.h);ctx.fillStyle='#00f5ff33';ctx.fillRect(s.x-s.w/2,s.y-s.h/2,s.w,s.h);ctx.shadowBlur=0;ctx.fillStyle='#00f5ff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('SHIELD '+s.hp,s.x,s.y+3);});
 pods.forEach(p=>{ctx.fillStyle='#a6ff00';ctx.shadowColor='#a6ff00';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,12,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('POD',p.x,p.y+3);ctx.fillStyle='#a6ff00';ctx.fillRect(p.x-20,p.y-24,40*p.t/p.need,4);});
 enemies.forEach(e=>{ctx.save();ctx.translate(e.x,e.y);if(e.type==='turret'){ctx.fillStyle='#ff4444';ctx.fillRect(-12,-8,24,16);ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(0,-8,6,0,6.28);ctx.fill();}else if(e.type==='sam'){ctx.fillStyle='#ff8800';ctx.fillRect(-16,-6,32,12);ctx.fillStyle='#fff';ctx.fillRect(-4,-16,8,12);}else{ctx.fillStyle='#ff2ea6';ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(16,0);ctx.lineTo(0,12);ctx.closePath();ctx.fill();}ctx.restore();ctx.fillStyle='#ff4444';ctx.fillRect(e.x-14,e.y-24,28*e.hp/e.max,3);});
 drones.forEach(d=>{ctx.fillStyle='#c77dff';ctx.beginPath();ctx.arc(d.x,d.y,7,0,6.28);ctx.fill();ctx.strokeStyle='#c77dff';ctx.beginPath();ctx.arc(d.x,d.y,12+Math.sin(d.ang*2)*3,0,6.28);ctx.stroke();});
 bullets.forEach(b=>{ctx.fillStyle='#a6ff00';ctx.shadowColor='#a6ff00';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();ctx.shadowBlur=0;});
 ebullets.forEach(b=>{ctx.fillStyle='#ff4444';ctx.shadowColor='#ff4444';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();ctx.shadowBlur=0;});
 bombs.forEach(b=>{ctx.fillStyle='#ffb800';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();});
 // Player mothership
 ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.tilt*Math.PI/180);
 player.trail.forEach((t,i)=>{ctx.globalAlpha=0.3*(1-i/12);ctx.fillStyle='#00f5ff';ctx.beginPath();ctx.arc(t.x-player.x,t.y-player.y,6-i*0.4,0,6.28);ctx.fill();});ctx.globalAlpha=1;
 if(player.dashT>0){ctx.strokeStyle='#00f5ff';ctx.beginPath();ctx.arc(0,0,34+Math.sin(player.ring*10)*4,0,6.28);ctx.stroke();}
 ctx.fillStyle='#c77dff';ctx.shadowColor='#7b2fff';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(0,28);ctx.lineTo(-28,-10);ctx.lineTo(-12,-18);ctx.lineTo(12,-18);ctx.lineTo(28,-10);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle='#00f5ff';ctx.beginPath();ctx.arc(0,-2,9,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-2,4,0,6.28);ctx.fill();
 ctx.fillStyle='#ff2ea6';ctx.fillRect(-34,-6,8,10);ctx.fillRect(26,-6,8,10);ctx.restore();
 particles.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;
 popups.forEach(p=>{ctx.globalAlpha=1-p.t/0.8;ctx.fillStyle=p.col;ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);});ctx.globalAlpha=1;
 // HUD
 ctx.fillStyle='#00000088';ctx.fillRect(0,0,W,52);
 ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillStyle='#a6ff00';ctx.fillText('SCORE '+score,16,22);ctx.fillStyle='#00f5ff';ctx.font='12px Arial';ctx.fillText('HI '+HI+'  x'+multiplier+'  SECTOR '+sector+'/3',16,40);
 ctx.fillStyle='#ff4444';ctx.fillRect(220,10,160,12);ctx.fillStyle='#ff6666';ctx.fillRect(220,10,160*player.hull/100,12);ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.fillText('HULL '+Math.ceil(player.hull)+'%',230,20);
 ctx.fillStyle='#c77dff';ctx.fillRect(220,28,160,10);ctx.fillStyle='#e0aaff';ctx.fillRect(220,28,160*player.energy/100,10);
 ctx.fillStyle='#ffb800';ctx.fillRect(400,10,120,10);ctx.fillStyle=player.overheat>0?'#ff4444':'#ffcc66';ctx.fillRect(400,10,120*player.heat/100,10);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText(player.overheat>0?'OVERHEAT':'HEAT',405,19);
 ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('PODS '+landed+'/3  KILLS '+kills+'  ACC '+ (shots?Math.round(hits/shots*100):0)+'%',W-16,22);
 const mm=Math.floor(elapsed/60),ss=Math.floor(elapsed%60);ctx.fillText('TIME '+mm+':'+String(ss).padStart(2,'0')+(muted?'  MUTED':''),W-16,40);
 ctx.textAlign='center';ctx.font='11px Arial';ctx.fillStyle='#aaa';ctx.fillText('WASD Move | SPACE Fire | SHIFT Dash | F Cluster | C Drone | Q Tractor | E Deploy | P Pause | M Mute',W/2,H-8);
 if(redFlash>0){ctx.fillStyle='rgba(255,0,0,'+redFlash+')';ctx.fillRect(0,0,W,H);}
 if(state==='paused'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.fillText('PAUSED',W/2,200);ctx.font='18px Arial';ctx.fillText('Click RESUME / RESTART / TITLE',W/2,320);}
 if(state==='over'){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff4444';ctx.font='bold 48px Arial';ctx.fillText('GAME OVER',W/2,220);ctx.fillStyle='#fff';ctx.font='20px Arial';ctx.fillText('SCORE '+score+'  HI '+HI,W/2,270);ctx.fillText('Click to retry',W/2,445);}
 if(state==='victory'){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#a6ff00';ctx.font='bold 48px Arial';ctx.fillText('VICTORY!',W/2,220);ctx.fillStyle='#fff';ctx.font='20px Arial';ctx.fillText('All sectors cleared! SCORE '+score,W/2,270);ctx.fillText('Click to play again',W/2,445);}
 ctx.restore();
}
function drawTitle(){ctx.fillStyle='rgba(5,1,15,0.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#7b2fff';ctx.shadowColor='#7b2fff';ctx.shadowBlur=30;ctx.font='bold 64px Arial';ctx.fillText('MOTHERSHIP',W/2,180);ctx.shadowBlur=0;ctx.fillStyle='#00f5ff';ctx.font='bold 22px Arial';ctx.fillText('INVERTED SPACE INVADERS',W/2,220);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('You are the alien mothership. Destroy Earth cities from above!',W/2,270);ctx.fillText('Destroy shields, then deploy pods on ruined cities. Land 3 pods per sector.',W/2,295);ctx.fillText('WASD Move | SPACE Fire | SHIFT Dash | F Bomb | C Drone | Q Tractor | E Deploy',W/2,330);ctx.fillStyle='#a6ff00';ctx.font='bold 20px Arial';ctx.fillText('CLICK TO START',W/2,390);ctx.fillStyle='#aaa';ctx.font='13px Arial';ctx.fillText('HI SCORE '+HI,W/2,430);}
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
