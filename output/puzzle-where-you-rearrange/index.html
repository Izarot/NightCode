<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equation Shift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='60' font-family='Arial' fill='%23ff6b6b'%3E➕➗%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: radial-gradient(circle at center, #0d1117, #1e293b);
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #f8fafc;
    }
    #game-container { 
      position: relative;
      width: min(90vw, 600px);
      aspect-ratio: 1;
    }
    canvas { 
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #0d1117, #1e293b);
      border: 1px solid #334155;
      border-radius: 12px;
    }
    .hud { 
      position: absolute;
      top: -80px;
      left: 0; right: 0;
      display: flex; 
      justify-content: space-between;
      padding: 0 16px;
      font-size: clamp(12px, 2vw, 14px);
    }
    .hud div { color: #94a3b8; }
    .timer { color: #ef4444; }
    .timer.warning { 
      color: #ef4444; 
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .controls { 
      position: absolute;
      bottom: -50px;
      left: 0; right: 0;
      display: flex; justify-content: center; gap: 12px;
    }
    .btn { 
      width: 36px; height: 36px; 
      border-radius: 6px; 
      background: #334155; 
      border: 2px solid #334155;
      cursor: pointer; 
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: all 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.08); }
    .btn:active { transform: scale(0.95); }
    .score { 
      position: absolute; 
      top: -50px; right: 16px; 
      color: #a78bfa; 
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div id="level">Level: 1</div>
      <div id="equations">Eq: 0 / 3</div>
      <div id="moves">Moves: 0 / 30</div>
    </div>
    <canvas id="game" width="600" height="600"></canvas>
    <div class="score" id="score">Score: 0</div>
    <div class="controls">
      <button class="btn" id="undo" title="Undo (Z)">↩</button>
      <button class="btn" id="reset" title="Reset (R)">↺</button>
      <button class="btn" id="hint" title="Hint (H)">✦</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
