<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Equation Shift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="speedrun-timer">⏱️ <span id="timer">00:00.000</span></div>
<div id="hud">
<div class="hud-item"><span class="label">Level</span><span id="level">1</span>/20</div>
<div class="hud-item"><span class="label">Equations</span><span id="eq-count">0</span>/<span id="eq-target">3</span></div>
<div class="hud-item"><span class="label">Moves</span><span id="moves">0</span>/<span id="move-limit">20</span></div>
<div class="hud-item score"><span class="label">Score</span><span id="score">0</span></div>
<div class="hud-item time"><span class="label">Time</span><span id="time">60</span>s</div>
<div class="high-score">🏆 <span id="high-score">0</span></div>
</div>
<div id="equation-preview"></div>
<div id="buttons">
<button id="undo" title="Undo (Z)">↩</button>
<button id="reset" title="Reset (R)">↺</button>
<button id="hint" title="Hint (H)">💡</button>
</div>
<div id="modal" class="hidden">
<div class="modal-content">
<h2 id="modal-title"></h2>
<p id="modal-msg"></p>
<div id="modal-btns"></div>
</div>
</div>
<div id="start-screen">
<h1>🔢 Equation Shift</h1>
<p>Swap tiles to form valid equations</p>
<p><em>Left-to-right evaluation • One = sign</em></p>
<button id="start-btn">Play</button>
</div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
