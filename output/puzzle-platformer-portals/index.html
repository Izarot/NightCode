<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Shift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23ff5e00'/%3E%3Ctext y='58' font-size='40' text-anchor='middle' fill='%2300f3ff'%3E%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #121218;
      font-family: 'Inter', sans-serif;
      touch-action: none;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.7);
    }
    .hud-element {
      position: absolute;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    #levelTitle {
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }
    #portalIndicators {
      top: 10px;
      left: 10px;
    }
    #timer {
      top: 10px;
      right: 10px;
    }
    #highScore {
      bottom: 10px;
      right: 10px;
    }
    #controlsHint {
      bottom: 10px;
      left: 10px;
      font-size: 14px;
      opacity: 0.7;
    }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
      z-index: 10;
    }
    #menu h1 {
      font-size: 48px;
      margin-bottom: 30px;
    }
    .menu-button {
      font-size: 20px;
      padding: 10px 30px;
      margin: 10px;
      border: 2px solid #00f3ff;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .menu-button:hover {
      background: rgba(0, 243, 255, 0.2);
      transform: scale(1.05);
    }
    #virtualJoystick {
      position: absolute;
      bottom: 60px;
      left: 20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      pointer-events: auto;
      display: none;
    }
    #aimReticle {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div id="levelTitle" class="hud-element">LEVEL 01 / 30</div>
      <div id="portalIndicators" class="hud-element">A: <span style="color:#00f3ff">●</span> B: <span style="color:#ff5e00">●</span></div>
      <div id="timer" class="hud-element">TIME: 00:00</div>
      <div id="highScore" class="hud-element">HIGH SCORE: 00:00</div>
      <div id="controlsHint" class="hud-element">Press TAB for controls</div>
    </div>
    <div id="menu">
      <h1>PORTAL SHIFT</h1>
      <div class="menu-button" onclick="startGame()">Start Game</div>
      <div class="menu-button" onclick="showControls()">Controls</div>
      <div class="menu-button" onclick="exitGame()">Exit</div>
    </div>
    <div id="virtualJoystick"></div>
    <div id="aimReticle"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
