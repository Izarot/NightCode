<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Dash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 9/16;
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.3), inset 0 0 60px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 2px solid rgba(0, 255, 200, 0.4);
      background: #050510;
    }
    canvas { 
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-radius: 10px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-box {
      background: rgba(5, 5, 16, 0.9);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      backdrop-filter: blur(10px);
    }
    .stat-label { font-size: 10px; color: #00ffc8; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 18px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .stat-value.high { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
    .center-message {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }
    .title { font-size: clamp(24px, 8vw, 42px); font-weight: 800; background: linear-gradient(90deg, #00ffc8, #ff006e, #8338ec); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; }
    .btn {
      background: linear-gradient(135deg, #00ffc8, #00d4aa);
      color: #050510;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 20px rgba(0, 255, 200, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(0, 255, 200, 0.4); }
    .controls-hint { color: rgba(255,255,255,0.4); font-size: 12px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .controls-hint kbd { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    @media (max-width: 480px) { #game-container { border-radius: 0; max-width: 100vw; aspect-ratio: 9/16; } }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui-overlay">
      <div class="top-bar">
        <div class="stat-box"><div class="stat-label">Time</div><div class="stat-value" id="timer">0.00s</div></div>
        <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
        <div class="stat-box"><div class="stat-label">Best</div><div class="stat-value high" id="highscore">0</div></div>
      </div>
      <div class="center-message" id="center-message">
        <div class="title">NEON DASH</div>
        <div class="subtitle">Dodge obstacles. Survive longer. Go faster.</div>
        <button class="btn" id="start-btn">TAP TO START</button>
        <div class="controls-hint"><kbd>← →</kbd> or <kbd>A D</kbd> to move | <kbd>Space</kbd> to jump</div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
