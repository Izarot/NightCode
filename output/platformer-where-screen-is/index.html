<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Catcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a0b2e;
    font-family: 'Courier New', monospace;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, #2d1b4e 0%, #1a0b2e 100%);
    box-shadow: 0 0 40px rgba(255, 0, 170, 0.4);
    border-radius: 8px;
  }
  #hud {
    position: fixed; top: 10px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    color: #00f0ff; font-size: 14px; pointer-events: none;
    text-shadow: 0 0 8px currentColor;
    z-index: 10;
  }
  #hud .timer { color: #ffea00; }
  #hud .hs { color: #ff5cf4; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; z-index: 20;
    background: rgba(26, 11, 46, 0.85);
    backdrop-filter: blur(4px);
  }
  #overlay h1 {
    font-size: clamp(28px, 7vw, 56px);
    color: #ff5cf4; text-shadow: 0 0 20px #ff5cf4, 0 0 40px #ff5cf4;
    letter-spacing: 4px; margin-bottom: 8px;
  }
  #overlay p { color: #00f0ff; font-size: clamp(12px, 3vw, 16px); margin: 6px 0; text-shadow: 0 0 8px #00f0ff; }
  #overlay .hint { color: #b8ff5c; margin-top: 18px; font-size: clamp(11px, 2.6vw, 14px); }
  #overlay button {
    margin-top: 22px; padding: 12px 28px;
    background: transparent; border: 2px solid #b8ff5c; color: #b8ff5c;
    font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 6px;
    text-shadow: 0 0 8px #b8ff5c; box-shadow: 0 0 14px rgba(184,255,92,0.5);
    transition: transform .15s;
  }
  #overlay button:active { transform: scale(0.94); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud">
  <div>SCORE <span id="score">0</span> &nbsp; <span class="hs">BEST <span id="best">0</span></span></div>
  <div class="timer">⏱ <span id="timer">0.00</span>s</div>
</div>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="overlay">
  <h1>NEON CATCHER</h1>
  <p>Catch the glowing orbs. Dodge the 💣 bombs.</p>
  <p>Move with mouse / touch / arrow keys.</p>
  <p class="hint">Win at 50 points — beat your best time!</p>
  <button id="startBtn">▶ START</button>
</div>
<script src="game.js"></script>
</body>
</html>
