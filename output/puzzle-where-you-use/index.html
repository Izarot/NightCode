<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magnet-Key Puzzler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🧲</text></svg>">
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 10px; color: #e94560; pointer-events: none; font-weight: bold; text-shadow: 2px 2px #000; }
        #timer { position: absolute; top: 10px; right: 10px; color: #0f3460; background: rgba(255,255,255,0.7); padding: 5px 10px; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="ui">
        ENERGY: <span id="energy">100</span> | MOVES: <span id="moves">0</span>
    </div>
    <div id="timer">00:00</div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="main.js"></script>
</body>
</html>
