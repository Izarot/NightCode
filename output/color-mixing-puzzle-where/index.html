<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>ChromaShift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E" />
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a18; overflow:hidden; font-family:system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#10102a; image-rendering:pixelated; max-width:100%; max-height:100%; width:auto; height:auto; aspect-ratio:16/9; box-shadow:0 0 40px #ff00aa55; border:2px solid #ff00aa; border-radius:6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="ChromaShift game canvas" role="application"></canvas></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
