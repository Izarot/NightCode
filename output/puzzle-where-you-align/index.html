<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gear Alignment Puzzle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #e94560;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #16213e;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(22, 33, 62, 0.95);
            padding: 2rem;
            border: 3px solid #0f3460;
            text-align: center;
            pointer-events: auto;
            border-radius: 15px;
        }
        button {
            background: #e94560;
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:hover { background: #ff4d6d; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="start-screen" class="overlay">
                <h1>GEAR ALIGNMENT</h1>
                <p>WASD to Move | Left-Click: Rotate | Right-Click: Snap 90°</p>
                <p>Align all gears to power the core!</p>
                <button onclick="startGame()">START MISSION</button>
            </div>
            <div id="win-screen" class="overlay hidden">
                <h1>CORE ACTIVATED!</h1>
                <p id="final-time"></p>
                <p id="high-score-msg"></p>
                <button onclick="location.reload()">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="src/main.js"></script>
</body>
</html>
