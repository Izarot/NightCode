<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AETHEL — Raindrop Ripple Genesis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a1a2a;
            font-family: 'IBM Plex Mono', monospace;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #main-canvas {
            display: block;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .title-glyph {
            position: absolute;
            top: 24px;
            left: 28px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.35em;
            color: #f0f8ff;
            opacity: 0.5;
            text-transform: lowercase;
            transition: opacity 0.3s ease;
        }

        .ripple-counter {
            position: absolute;
            top: 24px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #f0f8ff;
            opacity: 0.5;
        }

        .ripple-icon {
            width: 8px;
            height: 8px;
            border: 1px solid currentColor;
            border-radius: 50%;
            animation: ripple-pulse 2s ease-in-out infinite;
        }

        @keyframes ripple-pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .first-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 300;
            color: #f0f8ff;
            opacity: 0;
            transition: opacity 1s ease;
            letter-spacing: 0.1em;
            pointer-events: none;
        }

        .first-prompt.visible {
            opacity: 0.6;
            animation: prompt-breathe 3s ease-in-out infinite;
        }

        @keyframes prompt-breathe {
            0%, 100% { letter-spacing: 0.1em; }
            50% { letter-spacing: 0.2em; }
        }

        .ambient-control {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: auto;
        }

        .ambient-control.visible {
            opacity: 0.4;
        }

        .ambient-control:hover {
            opacity: 0.7 !important;
        }

        .ambient-slider {
            width: 120px;
            height: 2px;
            background: rgba(240, 248, 255, 0.3);
            border-radius: 1px;
            position: relative;
            cursor: pointer;
        }

        .ambient-slider-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(240, 248, 255, 0.6);
            border-radius: 1px;
            width: 30%;
            transition: background 0.3s ease;
        }

        .ambient-handle {
            position: absolute;
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #f0f8ff;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 8px rgba(240, 248, 255, 0.5);
            transition: transform 0.2s ease;
        }

        .ambient-handle:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.3);
        }

        .ambient-label {
            font-size: 9px;
            color: #f0f8ff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 26, 42, 0.6) 100%);
            z-index: 5;
        }

        .vignette.active {
            opacity: 1;
        }

        .speedrun-timer {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: #f0f8ff;
            opacity: 0.5;
            letter-spacing: 0.15em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timer-dot {
            width: 4px;
            height: 4px;
            background: #4dffd6;
            border-radius: 50%;
            animation: timer-bulse 1s ease-in-out infinite;
        }

        @keyframes timer-bulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .high-score {
            position: absolute;
            top: 50px;
            left: 28px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            color: #4dffd6;
            opacity: 0.5;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>
    <div id="ui-overlay">
        <div class="title-glyph">aethel</div>
        <div class="speedrun-timer">
            <div class="timer-dot"></div>
            <span id="speedrun-time">00:00.0</span>
        </div>
        <div class="high-score" id="high-score">best: 0</div>
        <div class="ripple-counter">
            <div class="ripple-icon"></div>
            <span id="ripple-count">0</span>
        </div>
        <div class="first-prompt" id="first-prompt">tap the water</div>
        <div class="ambient-control" id="ambient-control">
            <span class="ambient-label">rain</span>
            <div class="ambient-slider" id="ambient-slider">
                <div class="ambient-slider-fill" id="ambient-fill"></div>
                <div class="ambient-handle" id="ambient-handle"></div>
            </div>
        </div>
        <div class="vignette" id="vignette"></div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // AETHEL — Raindrop Ripple Genesis
        // ═══════════════════════════════════════════════════════════════

        const CONFIG = {
            gridWidth: 256,
            gridHeight: 192,
            cellSize: 4,
            damping: 0.992,
            physicsStep: 1 / 120,
            lightDir: { x: 0.3, y: 0.7, z: 0.6 },
            specularPower: 32
        };

        // ═══════════════════════════════════════════════════════════════
        // WAVE SIMULATION
        // ═══════════════════════════════════════════════════════════════

        class WaveSimulator {
            constructor(width, height) {
                this.width = width;
                this.height = height;
                this.size = width * height;
                
                this.curr = new Float32Array(this.size);
                this.prev = new Float32Array(this.size);
                this.next = new Float32Array(this.size);
                
                this.damping = CONFIG.damping;
            }

            impact(x, y, amplitude) {
                const gx = Math.floor(x / CONFIG.cellSize);
                const gy = Math.floor(y / CONFIG.cellSize);
                const radius = 3;
                const sigmaSq = 2.5;

                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const px = gx + dx;
                        const py = gy + dy;
                        if (px >= 1 && px < this.width - 1 && py >= 1 && py < this.height - 1) {
                            const rSq = dx * dx + dy * dy;
                            const gaussian = amplitude * Math.exp(-rSq / sigmaSq);
                            this.curr[py * this.width + px] += gaussian;
                        }
                    }
                }
            }

            update() {
                const w = this.width;
                const h = this.height;
                const curr = this.curr;
                const prev = this.prev;
                const next = this.next;
                const damping = this.damping;

                for (let y = 1; y < h - 1; y++) {
                    const rowStart = y * w;
                    for (let x = 1; x < w - 1; x++) {
                        const idx = rowStart + x;
                        const avg = (curr[idx - 1] + curr[idx + 1] + curr[idx - w] + curr[idx + w]) * 0.5;
                        next[idx] = (avg - prev[idx]) * damping;
                    }
                }

                // Absorbing boundaries - fade edges
                for (let x = 0; x < w; x++) {
                    next[x] *= 0.95;
                    next[(h - 1) * w + x] *= 0.95;
                }
                for (let y = 0; y < h; y++) {
                    next[y * w] *= 0.95;
                    next[y * w + w - 1] *= 0.95;
                }

                // Swap buffers
                this.prev = curr;
                this.curr = next;
                this.next = prev;
            }

            getEnergy() {
                let sum = 0;
                const curr = this.curr;
                const sample = 4;
                for (let i = 0; i < this.size; i += sample) {
                    sum += Math.abs(curr[i]);
                }
                return sum / (this.size / sample);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // PARTICLE SYSTEM
        // ═══════════════════════════════════════════════════════════════

        class Particle {
            constructor(x, y, vx, vy, type = 'foam') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type;
                this.life = 1;
                this.maxLife = type === 'foam' ? 0.5 : 0.8;
                this.size = type === 'foam' ? 3 : 2;
                this.initialSize = this.size;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                if (this.type === 'droplet') {
                    this.vy += 280 * dt;
                } else {
                    this.vy += 80 * dt;
                }
                
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                this.life -= dt / this.maxLife;
                this.size = this.initialSize * Math.max(0, this.life);
            }

            get alpha() {
                return Math.max(0, this.life);
            }
        }

        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            spawnImpact(x, y, intensity = 1) {
                const foamCount = Math.floor(12 + intensity * 4);
                for (let i = 0; i < foamCount; i++) {
                    const angle = (i / foamCount) * Math.PI * 2 + Math.random() * 0.3;
                    const speed = 40 + Math.random() * 30;
                    this.particles.push(new Particle(
                        x, y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed - 30,
                        'foam'
                    ));
                }

                const dropletCount = Math.floor(3 + intensity * 2);
                for (let i = 0; i < dropletCount; i++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.6;
                    const speed = 80 + Math.random() * 60;
                    this.particles.push(new Particle(
                        x, y,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        'droplet'
                    ));
                }
            }

            update(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update(dt);
                    if (this.particles[i].life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // AUDIO SYNTHESIS
        // ═══════════════════════════════════════════════════════════════

        class AudioSynth {
            constructor() {
                this.ctx = null;
                this.initialized = false;
                this.reverbNode = null;
                this.lastPlayTime = 0;
            }

            init() {
                if (this.initialized) return;
                
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0.25;
                    this.masterGain.connect(this.ctx.destination);
                    
                    this.reverbNode = this.createReverb();
                    this.reverbNode.connect(this.masterGain);
                    
                    this.initialized = true;
                } catch (e) {
                    console.warn('WebAudio not available');
                }
            }

            createReverb() {
                const convolver = this.ctx.createConvolver();
                const rate = this.ctx.sampleRate;
                const length = rate * 1.5;
                const impulse = this.ctx.createBuffer(2, length, rate);
                
                for (let channel = 0; channel < 2; channel++) {
                    const data = impulse.getChannelData(channel);
                    for (let i = 0; i < length; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
                    }
                }
                
                convolver.buffer = impulse;
                return convolver;
            }

            playPlink(frequency = null, intensity = 1) {
                if (!this.initialized) return;
                
                // Throttle to prevent audio overload on rapid tapping
                const now = this.ctx.currentTime;
                if (now - this.lastPlayTime < 0.015) return;
                this.lastPlayTime = now;
                
                const freq = frequency || 800 + Math.random() * 400;
                
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 1.5, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.7, now + 0.15);
                
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3 * intensity, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                
                const osc2 = this.ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * 2.2, now);
                osc2.frequency.exponentialRampToValueAtTime(freq * 1.4, now + 0.1);
                
                const gain2 = this.ctx.createGain();
                gain2.gain.setValueAtTime(0.12 * intensity, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                
                osc.connect(gain);
                osc2.connect(gain2);
                
                gain.connect(this.masterGain);
                gain2.connect(this.masterGain);
                gain.connect(this.reverbNode);
                
                osc.start(now);
                osc.stop(now + 0.5);
                osc2.start(now);
                osc2.stop(now + 0.3);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // RENDERER
        // ═══════════════════════════════════════════════════════════════

        class Renderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d', { alpha: false });
                
                this.displayWidth = 0;
                this.displayHeight = 0;
                
                this.offscreen = document.createElement('canvas');
                this.offscreen.width = CONFIG.gridWidth;
                this.offscreen.height = CONFIG.gridHeight;
                this.offCtx = this.offscreen.getContext('2d');
                this.imageData = this.offCtx.createImageData(CONFIG.gridWidth, CONFIG.gridHeight);
                this.pixels = this.imageData.data;
                
                // Pre-rendered pond background
                this.bgCanvas = document.createElement('canvas');
                this.bgCanvas.width = CONFIG.gridWidth;
                this.bgCanvas.height = CONFIG.gridHeight;
                this.bgCtx = this.bgCanvas.getContext('2d');
                this.bgPixelData = null;
                this.generateBackground();
                
                this.flashes = [];
                
                // Light direction normalized
                const ld = CONFIG.lightDir;
                const len = Math.sqrt(ld.x * ld.x + ld.y * ld.y + ld.z * ld.z);
                this.normLight = { x: ld.x / len, y: ld.y / len, z: ld.z / len };
                this.viewZ = 1;
            }

            resize(width, height) {
                this.displayWidth = width;
                this.displayHeight = height;
                this.canvas.width = width;
                this.canvas.height = height;
            }

            generateBackground() {
                const ctx = this.bgCtx;
                const w = CONFIG.gridWidth;
                const h = CONFIG.gridHeight;
                
                // Vibrant pond palette - deep magenta-purple base with bioluminescent accents
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#1a0a3c');
                gradient.addColorStop(0.5, '#2d1b5a');
                gradient.addColorStop(1, '#4d2d8b');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
                
                // Organic shapes - vibrant bioluminescent tones
                const colors = ['#6b2db5', '#ff3d8b', '#3dffe6', '#8b3dff', '#ff8b3d', '#2dff8b'];
                ctx.globalAlpha = 0.4;
                
                for (let i = 0; i < 20; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const radius = 12 + Math.random() * 35;
                    
                    ctx.beginPath();
                    ctx.ellipse(x, y, radius, radius * (0.5 + Math.random() * 0.5), Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fill();
                }
                
                // Glowing pebbles
                ctx.globalAlpha = 0.6;
                for (let i = 0; i < 40; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const rx = 2 + Math.random() * 5;
                    const ry = 1 + Math.random() * 3;
                    
                    ctx.beginPath();
                    ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
                    const hue = Math.random() * 360;
                    ctx.fillStyle = `hsl(${hue}, 80%, ${50 + Math.random() * 25}%)`;
                    ctx.fill();
                }
                
                // Ethereal glow particles
                ctx.globalAlpha = 0.3;
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const radius = 0.5 + Math.random() * 1.5;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }
                
                ctx.globalAlpha = 1;
                
                // Cache pixel data for fast access
                this.bgPixelData = ctx.getImageData(0, 0, w, h).data;
            }

            addFlash(x, y) {
                this.flashes.push({ x, y, life: 1 });
            }

            render(waveSim, particles, ambientIntensity, time) {
                const w = CONFIG.gridWidth;
                const h = CONFIG.gridHeight;
                const pixels = this.pixels;
                const curr = waveSim.curr;
                const cellSize = CONFIG.cellSize;
                const bgData = this.bgPixelData;
                const nlx = this.normLight.x;
                const nly = this.normLight.y;
                const nlz = this.normLight.z;
                const specularPow = CONFIG.specularPower;
                
                for (let y = 1; y < h - 1; y++) {
                    const rowStart = y * w;
                    for (let x = 1; x < w - 1; x++) {
                        const idx = rowStart + x;
                        const hVal = curr[idx];
                        
                        // Calculate normal from gradient
                        const hLeft = curr[idx - 1];
                        const hRight = curr[idx + 1];
                        const hUp = curr[idx - w];
                        const hDown = curr[idx + w];
                        
                        let nx = (hLeft - hRight) * 0.5;
                        let ny = (hUp - hDown) * 0.5;
                        let nz = cellSize;
                        
                        // Normalize
                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        if (len > 0) {
                            nx /= len;
                            ny /= len;
                            nz /= len;
                        } else {
                            nx = 0;
                            ny = 0;
                            nz = 1;
                        }
                        
                        // Diffuse lighting
                        const diffuse = Math.max(0, nx * nlx + ny * nly + nz * nlz);
                        
                        // Specular
                        const dotNL = nx * nlx + ny * nly + nz * nlz;
                        const rx = nlx - 2 * nx * dotNL;
                        const ry = nly - 2 * ny * dotNL;
                        const rz = nlz - 2 * nz * dotNL;
                        const specular = Math.pow(Math.max(0, rz), specularPow);
                        
                        // Sample background with distortion
                        const bgX = Math.max(0, Math.min(w - 1, x + Math.floor(nx * 8)));
                        const bgY = Math.max(0, Math.min(h - 1, y + Math.floor(ny * 8)));
                        const bgIdx = (bgY * w + bgX) * 4;
                        
                        let r = bgData[bgIdx];
                        let g = bgData[bgIdx + 1];
                        let b = bgData[bgIdx + 2];
                        
                        // Apply lighting
                        const lighting = 0.65 + 0.35 * diffuse;
                        r *= lighting;
                        g *= lighting;
                        b *= lighting;
                        
                        // Specular highlights - cool cyan-white
                        const specIntensity = specular * 0.9;
                        r += specIntensity * 180;
                        g += specIntensity * 220;
                        b += specIntensity * 255;
                        
                        // Trough darkening (negative height)
                        if (hVal < 0) {
                            const troughFactor = 1 + hVal * 0.2;
                            r *= troughFactor;
                            g *= troughFactor;
                            b *= troughFactor;
                        }
                        
                        // Peak subtle warm shift (positive height)
                        if (hVal > 0) {
                            r += hVal * 8;
                            g += hVal * 12;
                            b += hVal * 15;
                        }
                        
                        // Ambient rainfall shimmer
                        if (ambientIntensity > 0) {
                            const shimmer = Math.sin(time * 0.003 + x * 0.15 + y * 0.15) * 0.5 + 0.5;
                            const shimmerAmount = shimmer * ambientIntensity * 4;
                            r += shimmerAmount;
                            g += shimmerAmount;
                            b += shimmerAmount * 1.5;
                        }
                        
                        // Write pixel
                        const pixelIdx = idx * 4;
                        pixels[pixelIdx] = Math.min(255, Math.max(0, r));
                        pixels[pixelIdx + 1] = Math.min(255, Math.max(0, g));
                        pixels[pixelIdx + 2] = Math.min(255, Math.max(0, b));
                        pixels[pixelIdx + 3] = 255;
                    }
                }
                
                this.offCtx.putImageData(this.imageData, 0, 0);
                
                // Scale to main canvas
                this.ctx.imageSmoothingEnabled = true;
                this.ctx.drawImage(this.offscreen, 0, 0, this.displayWidth, this.displayHeight);
                
                // Render particles on top
                this.renderParticles(particles);
                this.renderFlashes();
            }

            renderParticles(particles) {
                const ctx = this.ctx;
                const ps = particles.particles;
                
                for (let i = 0; i < ps.length; i++) {
                    const p = ps[i];
                    if (p.type === 'foam') {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 245, 255, ${p.alpha * 0.7})`;
                        ctx.fill();
                    } else if (p.type === 'droplet') {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(200, 230, 255, ${p.alpha * 0.85})`;
                        ctx.fill();
                    }
                }
            }

            renderFlashes() {
                const ctx = this.ctx;
                
                for (let i = this.flashes.length - 1; i >= 0; i--) {
                    const flash = this.flashes[i];
                    flash.life -= 0.18;
                    
                    if (flash.life <= 0) {
                        this.flashes.splice(i, 1);
                        continue;
                    }
                    
                    const radius = 15 * flash.life;
                    const gradient = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, radius);
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${flash.life * 0.6})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    
                    ctx.beginPath();
                    ctx.arc(flash.x, flash.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // HIGH SCORE MANAGER
        // ═══════════════════════════════════════════════════════════════

        class HighScoreManager {
            constructor() {
                this.storageKey = 'aethel_high_score';
                this.highScore = this.load();
            }

            load() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    return stored ? parseInt(stored, 10) : 0;
                } catch (e) {
                    return 0;
                }
            }

            save(score) {
                try {
                    if (score > this.highScore) {
                        this.highScore = score;
                        localStorage.setItem(this.storageKey, score.toString());
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            get() {
                return this.highScore;
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // MAIN APPLICATION
        // ═══════════════════════════════════════════════════════════════

        class Aethel {
            constructor() {
                this.canvas = document.getElementById('main-canvas');
                
                this.waveSim = new WaveSimulator(CONFIG.gridWidth, CONFIG.gridHeight);
                this.renderer = new Renderer(this.canvas);
                this.particles = new ParticleSystem();
                this.audio = new AudioSynth();
                this.highScoreManager = new HighScoreManager();
                
                this.rippleCount = 0;
                this.lastTapTime = 0;
                this.tapRate = 0;
                this.ambientIntensity = 0;
                this.firstImpact = false;
                this.ambientTimer = 0;
                
                this.physicsAccum = 0;
                this.lastTime = performance.now();
                this.startTime = this.lastTime;
                
                // UI elements
                this.rippleCountEl = document.getElementById('ripple-count');
                this.firstPromptEl = document.getElementById('first-prompt');
                this.ambientControlEl = document.getElementById('ambient-control');
                this.ambientHandleEl = document.getElementById('ambient-handle');
                this.ambientFillEl = document.getElementById('ambient-fill');
this.ambientSliderEl = document.getElementById('ambient-slider');
                this.vignetteEl = document.getElementById('vignette');
                this.speedrunTimeEl = document.getElementById('speedrun-time');
                this.highScoreEl = document.getElementById('high-score');
                
                this.resize();
                this.setupEventListeners();
                this.updateHighScoreDisplay();
                
                // Start with prompt visible
                setTimeout(() => {
                    this.firstPromptEl.classList.add('visible');
                }, 800);
                
                this.animate();
            }

            resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                this.renderer.resize(width, height);
                this.scaleX = width / CONFIG.gridWidth;
                this.scaleY = height / CONFIG.gridHeight;
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.resize());
                
                const handleImpact = (clientX, clientY, intensity = 1) => {
                    this.audio.init();
                    
                    const x = clientX;
                    const y = clientY;
                    
                    this.waveSim.impact(x / this.scaleX, y / this.scaleY, 18 * intensity);
                    this.particles.spawnImpact(x, y, intensity);
                    this.renderer.addFlash(x, y);
                    this.audio.playPlink(null, intensity);
                    
                    this.rippleCount++;
                    this.rippleCountEl.textContent = this.rippleCount.toString();
                    
                    // Calculate tap rate
                    const now = performance.now();
                    if (this.lastTapTime > 0) {
                        const dt = (now - this.lastTapTime) / 1000;
                        this.tapRate = 0.7 * this.tapRate + 0.3 * (1 / Math.max(0.05, dt));
                    }
                    this.lastTapTime = now;
                    
                    // Save high score
                    if (this.highScoreManager.save(this.rippleCount)) {
                        this.updateHighScoreDisplay();
                        this.flashHighScore();
                    }
                    
                    // Hide first prompt
                    if (!this.firstImpact) {
                        this.firstImpact = true;
                        this.firstPromptEl.classList.remove('visible');
                        setTimeout(() => {
                            this.ambientControlEl.classList.add('visible');
                        }, 500);
                    }
                    
                    // Tap rate speedrun visualization
                    if (this.tapRate > 8) {
                        this.vignetteEl.classList.add('active');
                    } else {
                        this.vignetteEl.classList.remove('active');
                    }
                };

                this.canvas.addEventListener('mousedown', (e) => {
                    handleImpact(e.clientX, e.clientY, 1.2);
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for (let i = 0; i < e.touches.length; i++) {
                        const t = e.touches[i];
                        handleImpact(t.clientX, t.clientY, 1);
                    }
                }, { passive: false });

                // Ambient slider control
                let dragging = false;
                
                const updateSlider = (clientX) => {
                    const rect = this.ambientSliderEl.getBoundingClientRect();
                    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    this.ambientIntensity = ratio;
                    this.ambientHandleEl.style.left = (ratio * 100) + '%';
                    this.ambientFillEl.style.width = (ratio * 100) + '%';
                };

                this.ambientHandleEl.addEventListener('mousedown', (e) => {
                    dragging = true;
                    e.preventDefault();
                });

                this.ambientSliderEl.addEventListener('mousedown', (e) => {
                    dragging = true;
                    updateSlider(e.clientX);
                });

                document.addEventListener('mousemove', (e) => {
                    if (dragging) {
                        updateSlider(e.clientX);
                    }
                });

                document.addEventListener('mouseup', () => {
                    dragging = false;
                });

                // Touch support for slider
                this.ambientHandleEl.addEventListener('touchstart', (e) => {
                    dragging = true;
                    e.preventDefault();
                }, { passive: false });

                this.ambientSliderEl.addEventListener('touchstart', (e) => {
                    dragging = true;
                    if (e.touches[0]) {
                        updateSlider(e.touches[0].clientX);
                    }
                }, { passive: false });

                document.addEventListener('touchmove', (e) => {
                    if (dragging && e.touches[0]) {
                        updateSlider(e.touches[0].clientX);
                        e.preventDefault();
                    }
                }, { passive: false });

                document.addEventListener('touchend', () => {
                    dragging = false;
                });
            }

            updateHighScoreDisplay() {
                this.highScoreEl.textContent = `best: ${this.highScoreManager.get()}`;
            }

            flashHighScore() {
                this.highScoreEl.style.color = '#fff';
                this.highScoreEl.style.opacity = '1';
                setTimeout(() => {
                    this.highScoreEl.style.color = '#4dffd6';
                    this.highScoreEl.style.opacity = '0.5';
                }, 800);
            }

            updateSpeedrunTimer(currentTime) {
                if (!this.firstImpact) {
                    this.startTime = currentTime;
                    this.speedrunTimeEl.textContent = '00:00.0';
                    return;
                }
                
                const elapsed = currentTime - this.startTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                const tenths = Math.floor((elapsed % 1000) / 100);
                
                this.speedrunTimeEl.textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
            }

            ambientRain(dt) {
                if (this.ambientIntensity <= 0) return;
                
                // Spawn random raindrops based on intensity
                const dropCount = Math.floor(this.ambientIntensity * 8);
                for (let i = 0; i < dropCount; i++) {
                    if (Math.random() < this.ambientIntensity) {
                        const x = Math.random() * CONFIG.gridWidth;
                        const y = Math.random() * CONFIG.gridHeight;
                        const intensity = 0.3 + Math.random() * 0.5;
                        this.waveSim.impact(x, y, 6 * intensity * this.ambientIntensity);
                        
                        // Occasionally add small particles for visible rain
                        if (Math.random() < 0.3) {
                            const screenX = x * this.scaleX;
                            const screenY = y * this.scaleY;
                            this.particles.spawnImpact(screenX, screenY, intensity * 0.3);
                        }
                    }
                }
            }

            animate() {
                const currentTime = performance.now();
                let dt = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;
                
                // Clamp dt to prevent huge jumps
                dt = Math.min(dt, 0.05);
                
                // Update speedrun timer
                this.updateSpeedrunTimer(currentTime);
                
                // Ambient rain generation
                this.ambientTimer += dt;
                if (this.ambientTimer > 0.05) {
                    this.ambientRain(dt);
                    this.ambientTimer = 0;
                }
                
                // Physics step - fixed timestep
                this.physicsAccum += dt;
                const physicsStep = CONFIG.physicsStep;
                while (this.physicsAccum >= physicsStep) {
                    this.waveSim.update();
                    this.physicsAccum -= physicsStep;
                }
                
                // Update particles
                this.particles.update(dt);
                
                // Render
                this.renderer.render(this.waveSim, this.particles, this.ambientIntensity, currentTime);
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════════════════════════

        window.addEventListener('DOMContentLoaded', () => {
            new Aethel();
        });
    </script>
