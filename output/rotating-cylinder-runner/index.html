<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cylinder Rush</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9' font-size='80'>🏁</text></svg>">
<style>
body{margin:0;overflow:hidden;background:#0D1B2A;color:#00FFFF;font-family:Orbitron;}
canvas{display:block;background:#0D1B2A;}
.menu,.gameover{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#fff;}
.menu button,.gameover button{background:#4A6FA5;color:#fff;border:none;padding:10px 20px;margin:5px;cursor:pointer;font-size:20px;}
.hud{position:absolute;top:10px;left:10px;font-size:24px;}
.powerup-bar{position:absolute;bottom:10px;left:10px;width:200px;height:10px;background:#444;border-radius:5px;overflow:hidden;}
.powerup-bar div{height:100%;background:#00FFFF;width:0;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="menu" id="menu">
<h1>Cylinder Rush</h1>
<button id="startBtn">Start Game</button>
<button id="highBtn">High Scores</button>
<button id="settingsBtn">Settings</button>
<button id="howBtn">How to Play</button>
</div>
<div class="gameover" id="gameover" style="display:none;">
<h1>Game Over</h1>
<p>Final Score: <span id="finalScore">0</span></p>
<p>Coins: <span id="finalCoins">0</span></p>
<p>Time: <span id="finalTime">0:00</span></p>
<p id="newHigh"></p>
<button id="restartBtn">Play Again</button>
<button id="menuBtn">Main Menu</button>
</div>
<div class="hud" id="hud"></div>
<div class="powerup-bar"><div id="ppBar"></div></div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let w = Math.min(window.innerWidth,800);
let h = Math.min(window.innerHeight,600);
canvas.width = w;
canvas.height = h;
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function playSound(freq,dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  osc.start();
  osc.stop(audioCtx.currentTime + dur/1000);
}

function drawCylinder(t){
  const gradient = ctx.createLinearGradient(0,0,w,0);
  gradient.addColorStop(0,'#4A6FA5');
  gradient.addColorStop(1,'#2C5A8A');
  ctx.fillStyle = gradient;
  ctx.fillRect(w/2-150,0,300,h);
}

const player = {
  x: w/4,
  y: h-50,
  radius: 10,
  vy: 0,
  onGround: true,
  lane: 0,
  invincible: false,
  invTimer: 0,
  laneX: [
    w/8,
    w/4,
    (3*w)/8,
    (5*w)/8
  ]
};

let score = 0;
let highScore = parseInt(localStorage.getItem('cylinderRush_highScore'))||0;
let combo = 0;
let coins = 0;
let gameTime = 0;
let gameState = 'menu';
let obstacles = [];
let collectibles = [];
let lastTime = 0;

const hud = document.getElementById('hud');
const ppBar = document.getElementById('ppBar');

const keys = {};
window.addEventListener('keydown', e=>{ keys[e.key] = true; });
window.addEventListener('keyup', e=>{ keys[e.key] = false; });

let touchStartX = 0;
let touchStartY = 0;
canvas.addEventListener('touchstart', e=>{
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
});
canvas.addEventListener('touchmove', e=>{
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) > 30){
    const laneIdx = player.lane;
    if(dx < 0){
      player.lane = (player.lane + 1) % 4;
    }else{
      player.lane = (player.lane + 3) % 4;
    }
    touchStartX = t.clientX;
  }
});
canvas.addEventListener('touchend', e=>{
  // maybe tap for jump
});

function resize(){
  w = Math.min(window.innerWidth,800);
  h = Math.min(window.innerHeight,600);
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resize);

document.getElementById('startBtn').addEventListener('click',()=>{
  gameState = 'playing';
  document.getElementById('menu').style.display = 'none';
  resetGame();
});

function resetGame(){
  player.x = w/4;
  player.y = h-50;
  player.vy = 0;
  player.onGround = true;
  player.lane = 0;
  player.invincible = false;
  player.invTimer = 0;
  score = 0;
  combo = 0;
  coins = 0;
  gameTime = 0;
  obstacles = [];
  collectibles = [];
  lastTime = performance.now();
}

function update(dt){
  // gravity
  if(!player.onGround){
    player.vy += 800 * dt/1000;
    if(player.vy > 600) player.vy = 600;
  }
  // jump
  if((keys[' ']||keys['ArrowUp']||keys['w']||keys['ArrowUp']) && player.onGround){
    player.vy = -400;
    player.onGround = false;
    playSound(440,150);
  }
  // horizontal lane movement
  const targetX = player.laneX[player.lane];
  player.x += (targetX - player.x) * 0.1;
  // vertical movement
  player.y += player.vy * dt/1000;
  // keep on ground
  if(player.y > h-50){
    player.y = h-50;
    player.vy = 0;
    player.onGround = true;
  }
  // invincibility timer
  if(player.invincible){
    player.invTimer -= dt;
    if(player.invTimer <= 0){
      player.invincible = false;
    }
  }
  // update obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.x -= o.speed * dt/1000;
    if(o.x + o.w < 0){
      obstacles.splice(i,1);
    }
  }
  // spawn obstacles
  if(gameTime > 0){
    if(Math.random()<0.02){
      const type = Math.random()<0.5?'barrier':'spike';
      const x = w + Math.random()*200;
      const y = h-80;
      const w = 60;
      const h = 40;
      obstacles.push({x,y,w,h,type, speed:1.2});
    }
  }
  // collectibles
  for(let i=collectibles.length-1;i>=0;i--){
    const c = collectibles[i];
    c.x -= c.speed * dt/1000;
    if(c.x + c.r*2 < 0){
      collectibles.splice(i,1);
    }
  }
  // spawn collectibles
  if(Math.random()<0.01){
    const type = Math.random()<0.8?'coin':'powerup';
    const x = w + Math.random()*200;
    const y = h-80;
    const r = type==='coin'?7.5:10;
    const w = r*2;
    const h = r*2;
    collectibles.push({x,y,r,w,h,type,speed:1.5});
  }
  // collision detection
  if(!player.invincible){
    for(const o of obstacles){
      if(player.x < o.x+o.w && player.x+player.radius*2 > o.x && player.y < o.y+o.h && player.y+player.radius*2 > o.y){
        gameState = 'gameover';
        document.getElementById('finalScore').textContent = Math.floor(score);
        document.getElementById('finalCoins').textContent = coins;
        document.getElementById('finalTime').textContent = formatTime(gameTime);
        const newHigh = score > highScore;
        document.getElementById('newHigh').textContent = newHigh ? 'NEW HIGH SCORE! 🎉' : '';
        document.getElementById('highScore').textContent = highScore;
        document.getElementById('gameover').style.display = 'flex';
        return;
      }
    }
  }
  // update score (distance)
  score = Math.floor((player.x / w) * 1000);
  // update combo
  if(collectibles.some(c=> Math.abs(c.x - player.x) < 5 && c.type==='coin'){
    combo++;
    coins++;
    playSound(880,200);
    for(let i=collectibles.length-1;i>=0;i--){
      if(collectibles[i].type==='coin' && Math.abs(collectibles[i].x - player.x) < 5){
        collectibles.splice(i,1);
        break;
      }
    }
  }else{
    combo = Math.max(0, combo-1);
  }
  // update high score
  if(score > highScore){
    highScore = score;
    localStorage.setItem('cylinderRush_highScore', highScore);
  }
}

function formatTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function gameLoop(timestamp){
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  if(gameState === 'playing'){
    update(dt);
    draw();
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Menu handling
document.getElementById('menu').style.display = 'flex';

document.getElementById('restartBtn').addEventListener('click',()=>{
  gameState = 'playing';
  document.getElementById('gameover').style.display = 'none';
  resetGame();
});

document.getElementById('menuBtn').addEventListener('click',()=>{
  gameState = 'menu';
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
});
</script>
</body>
</html>
