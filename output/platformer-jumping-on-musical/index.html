<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎵 Beat-Jump</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0420;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;background:rgba(10,4,32,0.85)}
#overlay h1{font-size:clamp(32px,8vw,72px);background:linear-gradient(90deg,#00f0ff,#ff00ea,#a8ff00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,0,234,0.5)}
#overlay p{font-size:clamp(14px,3vw,22px);margin:15px;color:#b8a8ff;max-width:90%}
.btn{padding:15px 40px;font-size:clamp(16px,4vw,24px);background:linear-gradient(135deg,#00f0ff,#ff00ea);border:none;border-radius:30px;color:#fff;cursor:pointer;margin-top:20px;font-weight:bold;box-shadow:0 0 30px rgba(255,0,234,0.5)}
.btn:hover{transform:scale(1.05)}
.hidden{display:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
<h1>🎵 BEAT-JUMP</h1>
<p>Jump ON the beat! Press SPACE or TAP to jump.<br>Land perfectly to fill your Rhythm Meter!</p>
<button class="btn" id="startBtn">START GAME</button>
</div>
<script src="game.js"></script>
</body>
</html>
