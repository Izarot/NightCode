<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stardust Clicker</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg" width=\"32" height=\"32\" fill=\"#ffdd33\"> <circle cx=\"16" cy=\"16" r=\"16\" /><path d=\"M16 8A8 8 0 1 1 16 24a8 8 0 0 1 0-16z\" /></svg>" type="image/svg+xml"><style>body { margin: 0; overflow: hidden; background: #0a0a2a; } canvas { display: block; width: 100vw; height: 100vh; } .upgrade-button { position: absolute; bottom: 20px; right: 20px; background: #222; border-radius: 8px; padding: 10px; color: #ffdd33; font-family: Orbitron, sans-serif; cursor: pointer; opacity: 1; transition: opacity 0.2s; } .upgrade-button:hover { opacity: 0.7; } .tooltip { position: absolute; background: #222; border-radius: 8px; padding: 8px; color: #ffdd33; font-family: Orbitron, sans-serif; font-size: 14px; display: none; animation: fadeIn 0.2s; } @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }</style></head><body><canvas id="gameCanvas" width="800" height="600"></canvas><script>document.addEventListener('DOMContentLoaded', () => { const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const ui = { counter: 0, upgrades: {}, tooltip: null }; let lastTime = 0; let mouseX = 0, mouseY = 0; let isDragging = false; let wind = { x: 0, y: 0 }; const avatar = { x: canvas.width/2, y: canvas.height/2, vx: 0, vy: 0, radius: 12, maxSpeed: 300, acceleration: 800, deceleration: 600, friction: 0.85 }; const particles = []; const upgradeButtons = []; const upgradeCosts = {}; const upgradeLevels = {}; const upgradeNames = ['Spawn Rate', 'Collection Radius', 'Particle Value']; let lastSpawnTime = 0; let nextSpawnInterval = 0.8 + Math.random() * 1.7; const milestoneRing = { x: canvas.width/2, y: canvas.height/2 - 30, radius: 30, scale: 1, animating: false }; function update(delta) { // Input handling mouseX = (canvas.width - mouseX) * (canvas.width > canvas.height ? canvas.width / canvas.height : 1); mouseY = (canvas.height - mouseY) * (canvas.height > canvas.width ? canvas.height / canvas.width : 1); if (isDragging) { avatar.x = mouseX; avatar.y = mouseY; } else { const dir = { x: 0, y: 0 }; if (ui.upgrades['Arrow Keys']) { if (keys['ArrowUp']) dir.y -= 1; if (keys['ArrowDown']) dir.y += 1; if (keys['ArrowLeft']) dir.x -= 1; if (keys['ArrowRight']) dir.x += 1; } const speed = Math.sqrt(dir.x*dir.x + dir.y*dir.y); if (speed > 0) { dir.x /= speed; dir.y /= speed; } const targetVx = dir.x * avatar.maxSpeed; const targetVy = dir.y * avatar.maxSpeed; const dvx = targetVx - avatar.vx; const dvy = targetVy - avatar.vy; avatar.vx += dvx * delta * avatar.acceleration; avatar.vy += dvy * delta * avatar.deceleration; if (Math.abs(avatar.vx) > avatar.maxSpeed) avatar.vx = avatar.maxSpeed * Math.sign(avatar.vx); if (Math.abs(avatar.vy) > avatar.maxSpeed) avatar.vy = avatar.maxSpeed * Math.sign(avatar.vy); } avatar.vx *= avatar.friction; avatar.vy *= avatar.friction; avatar.x += avatar.vx * delta; avatar.y += avatar.vy * delta; // Canvas bounds if (avatar.x < 0) { avatar.x = 0; avatar.vx *= -0.2; } if (avatar.x > canvas.width) { avatar.x = canvas.width; avatar.vx *= -0.2; } if (avatar.y < 0) { avatar.y = 0; avatar.vy *= -0.2; } if (avatar.y > canvas.height) { avatar.y = canvas.height; avatar.vy *= -0.2; } // Wind effect wind.x = Math.sin(Date.now() * 0.001) * 50; wind.y = Math.cos(Date.now() * 0.001) * 50; // Particle updates for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * delta; p.y += p.vy * delta; p.age += delta; p.radius = 6 + (p.age / p.lifetime) * 6; if (p.age >= p.lifetime) { particles.splice(i, 1); } } // Spawn new particles const now = Date.now(); if (now - lastSpawnTime > nextSpawnInterval * 1000) { lastSpawnTime = now; const angle = Math.random() * Math.PI * 2; const x = Math.random() * canvas.width; const y = Math.random() * canvas.height; if (Math.hypot(x - avatar.x, y - avatar.y) < 50) { x = Math.random() * canvas.width; y = Math.random() * canvas.height; } particles.push({ x, y, vx: Math.cos(angle) * (30 + Math.random() * 40), vy: Math.sin(angle) * (30 + Math.random() * 40), age: 0, lifetime: 5000, radius: 6, hue: `#${Math.floor(Math.random() * 256).toString(16)}${Math.floor(Math.random() * 256).toString(16)}${Math.floor(Math.random() * 256).toString(16)}` }); nextSpawnInterval = 0.8 + Math.random() * 1.7; } // Collision detection for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; if (Math.hypot(p.x - avatar.x, p.y - avatar.y) <= avatar.radius + p.radius) { particles.splice(i, 1); ui.counter += 1; if (ui.counter % 100 === 0) { milestoneRing.animating = true; milestoneRing.scale = 1; } playSound('ding'); } } // Milestone ring animation if (milestoneRing.animating) { milestoneRing.scale = (milestoneRing.scale + delta * 0.002) % 2; if (milestoneRing.scale > 1.5) milestoneRing.animating = false; } // Upgrade logic for (const name in upgradeButtons) { const btn = upgradeButtons[name]; if (btn.cost <= ui.counter && !btn.disabled) { btn.cost = Math.round(btn.base * Math.pow(1.15, upgradeLevels[name] + 1)); } } // UI updates document.getElementById('stardust-counter').textContent = `Stardust: ${ui.counter}`; document.getElementById('milestone-ring').style.transform = `scale(${milestoneRing.scale})`; } function render() { ctx.fillStyle = 'radial-gradient(circle, #ffffff, transparent)'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Background ctx.fillStyle = '#0a0a2a'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#001133'; ctx.fillRect(0, canvas.height * 0.5, canvas.width, canvas.height * 0.5); // Starfield for (let i = 0; i < 1000; i++) { ctx.fillStyle = '#fff'; ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2); } // Avatar ctx.beginPath(); ctx.arc(avatar.x, avatar.y, avatar.radius, 0, Math.PI * 2); ctx.fillStyle = '#ffdd33'; ctx.fill(); ctx.strokeStyle = '#222222'; ctx.lineWidth = 2; ctx.stroke(); // Particles for (const p of particles) { ctx.fillStyle = p.hue; ctx.shadowBlur = 2; ctx.shadowColor = p.hue; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; } // Milestone ring ctx.beginPath(); ctx.arc(milestoneRing.x, milestoneRing.y, milestoneRing.radius * milestoneRing.scale, 0, Math.PI * 2); ctx.fillStyle = '#00ffcc'; ctx.fill(); // UI ctx.fillStyle = '#ffdd33'; ctx.font = '24px Orbitron'; ctx.fillText(`Stardust: ${ui.counter}`, 20, 40); // Upgrade buttons for (const name in upgradeButtons) { const btn = upgradeButtons[name]; ctx.fillStyle = btn.disabled ? 'rgba(255,221,51,0.4)' : '#ffdd33'; ctx.font = '16px Orbitron'; ctx.fillText(btn.label, btn.x, btn.y); } }); function gameLoop(timestamp) { const delta = (timestamp - lastTime) / 1000; update(delta); render(); lastTime = timestamp; requestAnimationFrame(gameLoop); } function init() { // Initialize upgrades for (const name of upgradeNames) { upgradeButtons[name] = { x: canvas.width - 160, y: canvas.height - 40, width: 140, height: 40, baseCost: 100, level: 0, label: `${name} +1 Particle/s`, cost: Math.round(100 * Math.pow(1.15, 0)), disabled: false }; upgradeCosts[name] = 100; upgradeLevels[name] = 0; } // Add upgrade buttons for (const name in upgradeButtons) { const btn = upgradeButtons[name]; btn.x = canvas.width - 160 - (upgradeButtons.length - 1) * 160; btn.y = canvas.height - 40; btn.cost = upgradeCosts[name]; btn.disabled = false; btn.onclick = () => { if (ui.counter >= btn.cost) { ui.counter -= btn.cost; upgradeLevels[name]++; btn.cost = Math.round(btn.baseCost * Math.pow(1.15, upgradeLevels[name] + 1)); } }; canvas.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; }); canvas.addEventListener('mousedown', (e) => { isDragging = true; }); canvas.addEventListener('mouseup', () => { isDragging = false; }); canvas.addEventListener('touchstart', (e) => { isDragging = true; }); canvas.addEventListener('touchend', () => { isDragging = false; }); // Tooltip logic canvas.addEventListener('mousemove', (e) => { const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; for (const name in upgradeButtons) { const btn = upgradeButtons[name]; if (x > btn.x && x < btn.x + btn.width && y > btn.y && y < btn.y + btn.height) { if (!ui.tooltip) { ui.tooltip = document.createElement('div'); ui.tooltip.className = 'tooltip'; document.body.appendChild(ui.tooltip); } ui.tooltip.textContent = `${name}: ${btn.label}`; ui.tooltip.style.left = `${e.clientX + 10}px`; ui.tooltip.style.top = `${e.clientY + 10}px`; ui.tooltip.style.display = 'block'; } else { ui.tooltip.style.display = 'none'; } } }); // Audio context const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); let oscillator; function playSound(type) { if (type === 'ding') { oscillator = audioCtx.createOscillator(); oscillator.type = 'sine'; oscillator.frequency.value = 440; oscillator.connect(audioCtx.destination); oscillator.start(); setTimeout(() => oscillator.stop(), 100); } } // Start game loop gameLoop(); });</script></body></html>
