<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Field</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
#game{width:100%;height:100%;display:block;background:#0a0f1a}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.bar{position:absolute;left:0;right:0;display:flex;gap:1rem;padding:1rem;font-size:0.9rem;color:#fff;text-shadow:0 0 5px rgba(0,0,0,.7)}
.bottom{top:auto;bottom:0;justify-content:center}
.slot{background:rgba(13,26,46,.8);border:1px solid rgba(0,255,200,.2);border-radius:4px;padding:.5rem .75rem;text-align:center;min-width:80px}
.slot .cost{font-size:.7rem;color:#00ffcc}
button{background:#0d1a2e;color:#00ffcc;border:1px solid #00ffcc;cursor:pointer;padding:.5rem 1rem;border-radius:4px;font-size:.85rem}
button:hover{box-shadow:0 0 10px #00ffcc}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="bar" style="top:0"><div>STABILITY <b id="stability">10/10</b></div><div>CYCLE <b id="cycle">0</b></div><div>ENTROPY <b id="entropy">0%</b></div><div>SCAN CHARGE <b id="charge">100/100</b></div><div>HIGH SCORE <b id="hiscore">0</b></div><div>TIMER <b id="timer">0.00</b></div></div>
<div class="bar bottom"><div class="slot">[LMB] Reveal</div><div class="slot">[RMB] Flag</div><div class="slot">[SPACE] Commit</div><div class="slot">[P] Ping</div><button id="extract" style="display:none">EXTRACT</button></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
