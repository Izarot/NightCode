<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geometric Clicker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>🎮</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #0f0c29; color: #e0f7fa; }
    #game-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .top-left, .top-center, .top-right, .bottom-left, .bottom-right { position: absolute; padding: 10px; font-size: 16px; }
    .top-left { top: 10px; left: 10px; }
    .top-center { top: 10px; left: 50%; transform: translateX(-50%); }
    .top-right { top: 10px; right: 10px; }
    .bottom-left { bottom: 10px; left: 10px; }
    .bottom-right { bottom: 10px; right: 10px; }
    .pulse { animation: pulse 0.3s ease-out; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .upgrade-list { display: flex; gap: 10px; overflow-x: auto; padding: 5px; }
    .upgrade-item { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; min-width: 100px; text-align: center; pointer-events: auto; }
    .upgrade-item button { background: #00e676; color: #000; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
    .upgrade-item button:disabled { background: #555; cursor: not-allowed; }
    .speed-bar { width: 150px; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
    .speed-fill { height: 100%; background: linear-gradient(90deg, #ff1744, #00e676); width: 0%; transition: width 0.2s; }
    .tooltip { background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; max-width: 250px; display: none; pointer-events: auto; }
    .tooltip.show { display: block; }
    .close-btn { position: absolute; top: 5px; right: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="top-left">
        <div>Energy: <span id="energy">0</span></div>
        <div>Clicks: <span id="clicks">0</span></div>
        <div>High Score: <span id="highScore">0</span></div>
        <div>Speedrun: <span id="speedrun">0.00</span>s</div>
      </div>
      <div class="top-center">
        <div class="upgrade-list" id="upgradeList"></div>
      </div>
      <div class="top-right">
        <button id="settingsBtn">⚙️</button>
        <button id="prestigeBtn" style="display:none;">⭐</button>
      </div>
      <div class="bottom-left">
        <div>Speed</div>
        <div class="speed-bar"><div class="speed-fill" id="speedFill"></div></div>
      </div>
      <div class="bottom-right">
        <div class="tooltip" id="tooltip"><div class="close-btn" onclick="this.parentElement.classList.remove('show')">✕</div><strong>Geometric Clicker</strong><br>Click/tap to generate energy.<br>Hold Shift or drag to move faster.<br>Purchase shapes to generate passive energy.<br>Avoid shape interiors!<br>Reach 1000 energy to prestige.</div>
      </div>
    </div>
  </div>
  <script src="game/state.js"></script>
  <script src="game/input.js"></script>
  <script src="shapes/shapes.js"></script>
  <script src="game/render.js"></script>
  <script src="game/main.js"></script>
</body>
</html>
