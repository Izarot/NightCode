<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geometric Clicker</title><link rel="icon" href="favicon.ico" type="image/x-icon"><style>body { margin: 0; overflow: hidden; background: #0a0a1f; color: #fff; font-family: 'Inter', sans-serif; } canvas { display: block; width: 100vw; height: 100vh; } .ui { position: absolute; top: 0; left: 0; z-index: 10; } .energy { font-size: 2em; margin: 10px; } .click-count { font-size: 0.8em; } .upgrade-panel { position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; } .shape-slot { display: inline-block; margin: 5px; padding: 8px; border: 1px solid #333; border-radius: 4px; cursor: pointer; } .shape-slot:hover { background: rgba(0,255,0,0.1); } .speed-bar { position: absolute; bottom: 10px; left: 10px; width: 100px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; } .speed-fill { height: 100%; width: 0; background: #00ff00; transition: width 0.3s; }</style></head><body><canvas id="gameCanvas"></canvas><div class="ui"><div class="energy" id="energy">0.00 B</div><div class="click-count" id="clicks">Clicks: 0</div><div class="upgrade-panel" id="upgradePanel"></div><div class="speed-bar"><div class="speed-fill" id="speedFill"></div></div></div><script src="game.js"></script><script src="ui.js"></script><script src="shapes.js"></script></body></html>
