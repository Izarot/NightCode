<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Solar Evaporation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#1A237E;font-family:'Fredoka One',sans-serif;touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>const $=document.getElementById('c'),C=$.getContext('2d');let W,H;function resize(){W=$.width=window.innerWidth;H=$.height=window.innerHeight}resize();window.addEventListener('resize',resize);const COL={core:'#FFE566',glow:'#FFAA00',corona:'#FFF5CC',puddle:'#7BA3C4',highlight:'#E8F4FF',grass:'#7CB342',accent:'#FF6D00',navy:'#1A237E'};const STATES={TITLE:0,PLAY:1,PAUSE:2,OVER:3};let state=STATES.TITLE,score=0,level=1,combo=0,comboT=0,evap=0,overflow=0,time=0,timer=0,highScore=localStorage.getItem('solEvapHS')||0,mouseX=W/2,targetX=W/2;const puddles=[],clouds=[],parts=[];let lastSpawn=0,lastTime=0;const audioCtx=new(window.AudioContext||window.webkitAudioContext)();function playSound(freq,dur,type='sine',vol=0.15){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}function playEvap(){playSound(800,0.1,'sine',0.08);playSound(1200,0.15,'sine',0.05)}function playScore(){playSound(880,0.1,'square',0.06);setTimeout(()=>playSound(1100,0.1,'square',0.06),80)}function playWarning(){playSound(150,0.3,'sawtooth',0.1)}class Cloud{constructor(x,y){this.x=x||Math.random()*W;this.y=y||Math.random()*H*0.25;this.w=150+Math.random()*100;this.h=60+Math.random()*40;this.spd=10+Math.random()*20;this.op=0.3+Math.random()*0.3}update(){this.x+=this.spd*0.05;if(this.x>W+this.w)this.x=-this.w}draw(){C.globalAlpha=this.op;C.fillStyle='#FFF';C.beginPath();C.ellipse(this.x+this.w/2,this.y+this.h/2,this.w*0.4,this.h*0.4,0,0,Math.PI*2);C.fill();C.beginPath();C.ellipse(this.x+this.w*0.2,this.y+this.h*0.6,this.w*0.25,this.h*0.3,0,0,Math.PI*2);C.fill();C.beginPath();C.ellipse(this.x+this.w*0.8,this.y+this.h*0.6,this.w*0.25,this.h*0.3,0,0,Math.PI*2);C.fill();C.globalAlpha=1}blocks(bx,by){return bx>this.x&&bx<this.x+this.w&&by>this.y&&by<this.y+this.h+50}}class Puddle{constructor(){const sizes=[30,60,100];this.size=sizes[Math.floor(Math.random()*sizes.length)];this.base=this.size;let x,y,v=true,att=0;do{x=this.size/2+Math.random()*(W-this.size);y=H*0.35+Math.random()*(H*0.55-this.size);for(const p of puddles)if(Math.hypot(x-p.x,y-p.y)<80)v=false;att++}while(!v&&att<20);this.x=x;this.y=y;const r=Math.random();this.type=r<0.1?'golden':r<0.25?'frozen':r<0.4?'mud':'normal';this.evMult=this.type==='frozen'?0.5:this.type==='mud'?2:1;if(this.type==='mud')this.size*=1.3;this.vx=(Math.random()-0.5)*20;this.vy=(Math.random()-0.5)*20;this.phase=Math.random()*Math.PI*2;this.verts=[];this.genShape();this.state='active';this.progress=0}genShape(){const n=8+Math.floor(Math.random()*4);for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,r=this.size/2*(0.7+Math.random()*0.3);this.verts.push({x:Math.cos(a)*r,y:Math.sin(a)*r})}}update(dt){if(this.state==='active'){this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.x<this.size/2||this.x>W-this.size/2)this.vx*=-1;if(this.y<H*0.3||this.y>H-this.size/2)this.vy*=-1;this.phase+=dt*3}else if(this.state==='evap'){this.progress+=dt*0.67;this.size=this.base*(1-this.progress);if(this.progress>=1)this.state='gone'}}draw(){if(this.state==='gone')return;const a=this.state==='evap'?1-this.progress:1;let col=COL.puddle,hi=COL.highlight;if(this.type==='golden'){col='#FFD700';hi='#FFF8DC'}else if(this.type==='frozen'){col='#B3E5FC';hi='#FFF'}else if(this.type==='mud'){col='#8B7355';hi='#A0826D'}C.globalAlpha=a*0.3;C.fillStyle='rgba(0,0,0,0.2)';C.beginPath();this.shape(4,4);C.fill();const g=C.createRadialGradient(this.x,this.y-this.size*0.1,0,this.x,this.y,this.size/2);g.addColorStop(0,hi);g.addColorStop(0.5,col);g.addColorStop(1,'rgba(0,0,0,0.3)');C.fillStyle=g;C.globalAlpha=a;C.beginPath();this.shape(0,0);C.fill();C.globalAlpha=a*(0.3+Math.sin(this.phase)*0.2);C.fillStyle=hi;C.beginPath();C.ellipse(this.x-this.size*0.15,this.y-this.size*0.15,this.size*0.2,this.size*0.1,-Math.PI/4,0,Math.PI*2);C.fill();if(this.type==='golden'){C.globalAlpha=a*(0.5+Math.sin(time*5)*0.5);C.fillStyle='#FFF';for(let i=0;i<3;i++){const sx=this.x+Math.cos(time*2+i*2)*this.size*0.3,sy=this.y+Math.sin(time*2+i*2)*this.size*0.3;C.beginPath();C.arc(sx,sy,3,0,Math.PI*2);C.fill()}}if(this.type==='frozen'){C.strokeStyle='#FFF';C.lineWidth=2;C.globalAlpha=a*0.6;for(let i=0;i<6;i++){const angle=(i/6)*Math.PI*2+time*0.5,cx=this.x+Math.cos(angle)*this.size*0.3,cy=this.y+Math.sin(angle)*this.size*0.3;C.beginPath();C.moveTo(cx-5,cy);C.lineTo(cx+5,cy);C.moveTo(cx,cy-5);C.lineTo(cx,cy+5);C.stroke()}}C.globalAlpha=1}shape(ox,oy){const v=this.verts;C.moveTo(v[0].x+this.x+ox,v[0].y+this.y+oy);for(let i=1;i<=v.length;i++){const c=v[i%v.length],p=v[(i-1)%v.length],n=v[(i+1)%v.length],cpx=c.x+this.x+ox,cpy=c.y+this.y+oy,npx=(c.x+n.x)/2+this.x+ox,npy=(c.y+n.y)/2+this.y+oy;C.quadraticCurveTo(cpx,cpy,npx,npy)}}contains(x,y){if(this.state!=='active')return false;return Math.hypot(x-this.x,y-this.y)<this.size/2}getArea(){return Math.PI*(this.size/2)*(this.size/2)}getPts(){const b=this.type==='golden'?3:1,m=this.base>80?500:this.base>50?250:100;return m*b}}class Part{constructor(x,y,t){this.x=x;this.y=y;this.type=t;this.life=1;if(t==='steam'){this.vx=(Math.random()-0.5)*30;this.vy=-Math.random()*60-20;this.sz=Math.random()*8+4;this.dec=0.4+Math.random()*0.3}else if(t==='spark'){this.vx=(Math.random()-0.5)*100;this.vy=Math.random()*50+50;this.sz=Math.random()*4+2;this.dec=1.5+Math.random()*0.5}else{this.vx=0;this.vy=-80;this.dec=0.8;this.txt=''}}update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=this.dec*dt;if(this.type==='steam')this.sz+=dt*10}draw(){if(this.type==='steam'){C.globalAlpha=this.life*0.6;C.fillStyle='#FFF';C.beginPath();C.arc(this.x,this.y,this.sz,0,Math.PI*2);C.fill();C.globalAlpha=1}else if(this.type==='spark'){C.globalAlpha=this.life;C.fillStyle=COL.core;C.shadowColor=COL.glow;C.shadowBlur=10;C.beginPath();C.arc(this.x,this.y,this.sz,0,Math.PI*2);C.fill();C.shadowBlur=0;C.globalAlpha=1}else if(this.type==='score'){C.globalAlpha=this.life;C.fillStyle=COL.core;C.font='24px Fredoka One,sans-serif';C.textAlign='center';C.fillText(this.txt,this.x,this.y);C.globalAlpha=1}}}function spawnCloud(){clouds.push(new Cloud(Math.random()*W,Math.random()*H*0.25))}for(let i=0;i<5;i++)spawnCloud();function spawnPuddle(){if(puddles.length<20)puddles.push(new Puddle())}function drawBg(){const sg=C.createLinearGradient(0,0,0,H*0.4);sg.addColorStop(0,'#87CEEB');sg.addColorStop(1,'#FFF5E6');C.fillStyle=sg;C.fillRect(0,0,W,H*0.4);for(const c of clouds)c.draw();const ho=mouseX*0.001;C.fillStyle='#6B9B37';C.beginPath();C.moveTo(0,H*0.35);for(let x=0;x<=W;x+=50){const y=H*0.35+Math.sin((x+ho)*0.01)*30;C.lineTo(x,y)}C.lineTo(W,H);C.lineTo(0,H);C.fill();const gg=C.createLinearGradient(0,H*0.4,0,H);gg.addColorStop(0,COL.grass);gg.addColorStop(1,'#5D8A2F');C.fillStyle=gg;C.fillRect(0,H*0.4,W,H*0.6);C.fillStyle='#9CCC65';for(let i=0;i<100;i++){const gx=(i*47+time*0.5)%W,gy=H*0.5+(i*31)%(H*0.45),sw=Math.sin(time*2+i)*3;C.beginPath();C.moveTo(gx,gy);C.lineTo(gx+sw,gy-10);C.lineTo(gx+2,gy);C.fill()}}function drawBeam(){const bx=mouseX,ty=0,by=H*0.9,tw=20,bw=80;const blocked=clouds.some(c=>c.blocks(bx,by));const inten=blocked?0:Math.min(1+(Date.now()-lastMove)/1000,3);if(blocked){C.globalAlpha=0.3;const g=C.createLinearGradient(bx,ty,bx,by);g.addColorStop(0,COL.corona);g.addColorStop(1,'rgba(255,229,102,0)');C.fillStyle=g;C.beginPath();C.moveTo(bx-tw/2,ty);C.lineTo(bx+tw/2,ty);C.lineTo(bx+bw/2,by);C.lineTo(bx-bw/2,by);C.fill();C.globalAlpha=1;return}C.save();C.globalAlpha=0.1*inten;for(let i=0;i<5;i++){const y=by-50+i*10,wave=Math.sin(time*5+i)*5*inten;C.fillStyle=`rgba(255,255,255,${0.1-i*0.02})`;C.beginPath();C.ellipse(bx+wave,y,bw*0.4,5,0,0,Math.PI*2);C.fill()}C.restore();C.save();C.globalAlpha=0.3*inten;const cg=C.createLinearGradient(bx,ty,bx,by);cg.addColorStop(0,COL.corona);cg.addColorStop(1,'rgba(255,170,0,0)');C.fillStyle=cg;C.beginPath();C.moveTo(bx-tw*1.5,ty);C.lineTo(bx+tw*1.5,ty);C.lineTo(bx+bw*2,by);C.lineTo(bx-bw*2,by);C.fill();C.restore();const bg=C.createLinearGradient(bx,ty,bx,by);bg.addColorStop(0,COL.core);bg.addColorStop(0.3,COL.glow);bg.addColorStop(1,'rgba(255,170,0,0.5)');C.save();C.shadowColor=COL.glow;C.shadowBlur=30*inten;C.fillStyle=bg;C.beginPath();C.moveTo(bx-tw/2,ty);C.lineTo(bx+tw/2,ty);C.lineTo(bx+bw/2,by);C.lineTo(bx-bw/2,by);C.fill();C.restore();const pr=5+Math.sin(time*4)*2;C.save();C.shadowColor='#FFF';C.shadowBlur=15;C.fillStyle='#FFF';C.beginPath();C.arc(bx,ty+30,pr,0,Math.PI*2);C.fill();C.restore()}let lastMove=Date.now();$.addEventListener('mousemove',e=>{targetX=e.clientX;lastMove=Date.now()});$.addEventListener('touchmove',e=>{e.preventDefault();targetX=e.touches[0].clientX;lastMove=Date.now()},{passive:false});$.addEventListener('touchstart',e=>{if(state===STATES.TITLE)state=STATES.PLAY;targetX=e.touches[0].clientX});$.addEventListener('click',()=>{if(state===STATES.TITLE)state=STATES.PLAY;else if(state===STATES.OVER)resetGame()});window.addEventListener('keydown',e=>{if(e.code==='Space'){if(state===STATES.PLAY)state=STATES.PAUSE;else if(state===STATES.PAUSE)state=STATES.PLAY}else if(e.code==='KeyR'&&state===STATES.OVER)resetGame()});function resetGame(){state=STATES.PLAY;score=0;level=1;combo=0;comboT=0;evap=0;overflow=0;timer=0;puddles.length=0;parts.length=0;lastSpawn=time}function drawHUD(){const hy=30;C.fillStyle=COL.core;C.font='32px Fredoka One,sans-serif';C.textAlign='left';C.shadowColor='rgba(0,0,0,0.5)';C.shadowBlur=4;C.fillText(`SCORE: ${score.toLocaleString()}`,20,hy+10);C.fillStyle='#FFF';C.font='24px Fredoka One,sans-serif';C.fillText(`LVL: ${level}`,20,hy+45);C.font='14px Fredoka One,sans-serif';C.fillText(`TIME: ${Math.floor(timer)}s`,20,hy+70);const mx=W/2-100,mw=200,mh=20;let mc='#4CAF50';if(overflow>0.4)mc='#FFEB3B';if(overflow>0.5)mc='#F44336';C.fillStyle='rgba(0,0,0,0.5)';C.fillRect(mx,hy,mw,mh);C.fillStyle=mc;C.fillRect(mx+2,hy+2,(mw-4)*(overflow/0.6),mh-4);C.strokeStyle='#FFF';C.lineWidth=2;C.strokeRect(mx,hy,mw,mh);C.fillStyle='#FFF';C.textAlign='center';C.fillText(`${Math.round(overflow*100)}%`,W/2,hy+15);if(combo>=2){const cs=1+Math.sin(time*10)*0.1;C.save();C.translate(W-80,hy+25);C.scale(cs,cs);C.fillStyle=COL.accent;C.font='28px Fredoka One,sans-serif';C.textAlign='center';C.fillText(`x${combo>=5?3:combo>=3?2:1}`,0,0);C.restore()}C.shadowBlur=0;C.fillStyle='#FFE566';C.font='12px Fredoka One,sans-serif';C.textAlign='right';C.fillText(`BEST: ${highScore.toLocaleString()}`,W-20,hy+10)}function drawTitle(){C.fillStyle='rgba(26,35,126,0.85)';C.fillRect(0,0,W,H);const py=H*0.25,pu=Math.sin(time*3)*10;C.save();C.translate(W/2,py+pu);const sg=C.createRadialGradient(0,0,0,0,0,80);sg.addColorStop(0,'#FFFFAA');sg.addColorStop(0.5,'#FFE566');sg.addColorStop(1,'#FFAA00');C.shadowColor=COL.glow;C.shadowBlur=50;C.fillStyle=sg;C.beginPath();C.arc(0,0,60+Math.sin(time*2)*5,0,Math.PI*2);C.fill();C.restore();C.shadowColor=COL.glow;C.shadowBlur=20;C.fillStyle=COL.core;C.font=`${Math.min(W*0.1,64)}px Fredoka One,sans-serif`;C.textAlign='center';C.fillText('SOLAR',W/2,H*0.4);C.fillText('EVAPORATION',W/2,H*0.4+Math.min(W*0.1,64));C.shadowBlur=0;C.fillStyle='#FFF';C.font='20px Fredoka One,sans-serif';C.globalAlpha=0.5+Math.sin(time*4)*0.5;C.fillText('CLICK OR TAP TO START',W/2,H*0.65);C.globalAlpha=1;C.fillStyle=COL.accent;C.font='16px Fredoka One,sans-serif';C.fillText('MOVE MOUSE TO AIM • SPACE TO PAUSE',W/2,H*0.75);C.fillStyle='#AAA';C.font='14px Fredoka One,sans-serif';C.fillText(`HIGH SCORE: ${highScore.toLocaleString()}`,W/2,H*0.85)}function drawPause(){C.fillStyle='rgba(0,0,0,0.7)';C.fillRect(0,0,W,H);C.fillStyle='#FFF';C.font='48px Fredoka One,sans-serif';C.textAlign='center';C.fillText('PAUSED',W/2,H/2-30);C.font='24px Fredoka One,sans-serif';C.fillStyle=COL.accent;C.fillText('PRESS SPACE TO RESUME',W/2,H/2+30)}function drawOver(){C.fillStyle='rgba(0,0,0,0.8)';C.fillRect(0,0,W,H);C.fillStyle='#F44336';C.font='48px Fredoka One,sans-serif';C.textAlign='center';C.fillText('GAME OVER',W/2,H/2-60);C.fillStyle=COL.core;C.font='36px Fredoka One,sans-serif';C.fillText(`SCORE: ${score.toLocaleString()}`,W/2,H/2);C.fillStyle='#FFF';C.font='20px Fredoka One,sans-serif';C.fillText(`TIME: ${Math.floor(timer)}s • LEVEL: ${level}`,W/2,H/2+40);if(score>highScore){C.fillStyle=COL.accent;C.font='24px Fredoka One,sans-serif';C.fillText('NEW HIGH SCORE!',W/2,H/2+80)}C.fillStyle='#AAA';C.font='18px Fredoka One,sans-serif';C.globalAlpha=0.5+Math.sin(time*4)*0.5;C.fillText('CLICK OR PRESS R TO PLAY AGAIN',W/2,H/2+130);C.globalAlpha=1}function drawVignette(){const vg=C.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.3)');C.fillStyle=vg;C.fillRect(0,0,W,H)}function loop(ts){const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;time+=dt;mouseX+=(targetX-mouseX)*0.15;C.fillStyle=COL.navy;C.fillRect(0,0,W,H);drawBg();if(state===STATES.PLAY||state===STATES.PAUSE){for(const p of puddles)p.draw();for(const pt of parts)pt.draw();drawBeam();if(state===STATES.PLAY){timer+=dt;const si=Math.max(4-level*0.5,1.5);if(time-lastSpawn>si)spawnPuddle(),lastSpawn=time;let ta=0;for(const p of puddles){p.update(dt);if(p.state==='active')ta+=p.getArea()}overflow=ta/(W*H);if(overflow>0.5)time%0.5<0.1?playWarning():null;if(overflow>0.6){state=STATES.OVER;if(score>highScore)highScore=score,localStorage.setItem('solEvapHS',highScore)}if(evap>=level*20)level++;const bx=mouseX,by=H*0.9,blk=clouds.some(c=>c.blocks(bx,by)),inten=blk?0:Math.min(1+(Date.now()-lastMove)/1000,3);for(const p of puddles){if(p.state==='active'&&p.containsPoint(bx,by)){const r=20*inten*p.evMult*dt;p.size-=r;if(Math.random()<0.3)parts.push(new Part(p.x+(Math.random()-0.5)*p.size,p.y-p.size/4,'steam'));if(p.size<=0){p.state='evap';let pts=p.getPts();if(Math.abs(p.x-bx)<p.base*0.2)pts+=50;combo++;comboT=2;const mul=combo>=5?3:combo>=3?2:1;pts*=mul;score+=pts;evap++;const sp=new Part(p.x,p.y,'score');sp.txt=`+${pts}`;parts.push(sp);playScore();playEvap()}}}if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}if(Math.random()<0.1&&!blk)parts.push(new Part(bx+(Math.random()-0.5)*40,by-Math.random()*100,'spark'));for(const pt of parts)pt.update(dt);for(const c of clouds)c.update()}drawHUD()}drawVignette();if(state===STATES.TITLE)drawTitle();else if(state===STATES.PAUSE)drawPause();else if(state===STATES.OVER)drawOver();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
