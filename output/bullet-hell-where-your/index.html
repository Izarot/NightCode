<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<title>Pixel Point</title>
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0D0221;font-family:monospace;color:#fff}
#game{display:block;width:100vw;height:100vh;touch-action:none;background:#0D0221}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:12px}
.btn{pointer-events:auto;background:rgba(255,46,151,.25);border:2px solid #FF2E97;color:#fff;border-radius:50%;width:64px;height:64px;font-size:22px}
#joy{width:110px;height:110px;border:2px solid #00F5FF;border-radius:50%;background:rgba(0,245,255,.12);position:relative}
#stick{width:44px;height:44px;background:#00F5FF;border-radius:50%;position:absolute;left:33px;top:33px;box-shadow:0 0 16px #00F5FF}
.hint{position:fixed;top:8px;left:50%;transform:translateX(-50%);font-size:12px;color:#B6FF00;text-shadow:0 0 8px #B6FF00;pointer-events:none}
</style>
</head>
<body>
<canvas id='game'></canvas>
<div class='hint'>WASD MOVE • SHIFT FOCUS • X BOMB • P PAUSE</div>
<div id='ui'><div id='joy'><div id='stick'></div></div><div><button class='btn' id='bFocus'>◎</button> <button class='btn' id='bBomb'>💣</button></div></div>
<script type='module' src='src/main.js'></script>
</body>
</html>
