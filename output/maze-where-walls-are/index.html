<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Tetris Fall</title>\n<link rel=\"icon\" href=\"data:image/svg+xml;utf8,\<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">\<text y=\"0.9em\" font-size=\"80\">\🧩\</text>\</svg>\">\n<link href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;background:#0a0e27;color:#fff;font-family:Orbitron;overflow:hidden;}\
canvas{display:block;background:#0a0e27;}\
#hud{position:absolute;top:10px;left:10px;font-size:24px;color:#fff;text-shadow:0 0 5px #0ff;}\
#stack{position:absolute;top:10px;right:10px;font-size:14px;color:#fff;}\
#time{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:20px;color:#fff;}\
#dash{position:absolute;bottom:10px;left:10px;width:200px;height:6px;background:#000;}\
#dashFill{height:100%;background:#0ff;width:0%;}\
</style>\n</head>\n<body>\n<canvas id=\"c\"></canvas>\n<div id=\"hud\">SCORE 0000000\</div>\n<div id=\"stack\">STACK ↓ 0\</div>\n<div id=\"time\">00:00\</div>\n<div id=\"dash\"><div id=\"dashFill\"></div></div>\n<script>\nconst C={cell:32,w:20,h:20,speed:8,dashSpeed:20,dashTime:.5,dashCD:1.5,fallBase:3,fallAcc:0.2,fallInt:15000,stack:0.15,highScoreKey:'tetrisFallHS',cols:{bg:'#0a0e27',player:'#ffffff',dash:'#00ffff',stackStart:'#ff0040',stackEnd:'#ff4080',grid:'#1a3a5c',I:'#00ffff',O:'#ffff00',T:'#ff00ff',L:'#ff7f00',J:'#00ff7f',S:'#7fff00',Z:'#00ff00'}};\nlet canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),cw=C.w*C.cell,ch=C.h*C.cell,scale=cw/C.w;\nwindow.onresize=()=>{const w=Math.min(window.innerWidth*0.9,960),h=Math.min(window.innerHeight*0.9,960);canvas.width=w;canvas.height=h;scale=w/C.w;};\nlet keys={},player={x:0,y:0,dash:false,cd:0,if:0,dashStart:0},pieces=[],settled=[],stackH=0,score=0,time=0,dashR=0,last=0,high=0;\nfunction snd(freq,dur,gain){const a=Ctx.createOscillator(),g2=Ctx.createGain();a.type='sine';a.frequency.setValueAtTime(freq,Ctx.currentTime);g2.gain.setValueAtTime(gain,Ctx.currentTime);a.connect(g2);g2.connect(Ctx.destination);a.start();a.stop(Ctx.currentTime+dur);}\nCtx=canvas.getContext('2d');audioCtx=new (window.AudioContext||window.webkitAudioContext)();\nsounds={fall:()=>snd(400,.2,.2),settle:()=>snd(150,.3,.5),dash:()=>snd(600,.2,.3),near:()=>snd(800,.15,.4),death:()=>snd(200,.5,.8)};\nlet high=localStorage.getItem(C.highScoreKey);\nif(high) high=+high;\nfunction spawn(){const t=Object.keys(C.cols).filter(k=>k>='I'&&k<='Z')[Math.floor(Math.random()*7)];pieces.push({type:t,x:Math.random()*(C.w-4),y:-4,size:4,rot:0,state:'f',t0:performance.now()});}\nfunction coll(x,y){for(let i=0;i<4;i++)for(let j=0;j<4;j++){const cx=Math.round(x+i),cy=Math.round(y+j);if(cx<0||cy<0||cx>=C.w||cy>=C.h)return!0;if(settled.some(s=>s.x===cx&&s.y===cy))return!0;}}return!1;}\nfunction upd(dt){if(player.cd>0)player.cd-=dt;\nif(keys['Shift']&&player.cd<=0&&!player.dash){player.dash=true;player.dashStart=performance.now();sounds.dash();player.cd=C.dashCD;}\nif(player.dash){player.x+=C.dashSpeed*dt;if(player.x>C.w-1)player.x=C.w-1;if(performance.now()-player.dashStart>C.dashTime*1000){player.dash=false;player.cd=C.dashCD;}}else{if(keys['ArrowUp']||keys['w'])player.y-=C.speed*dt;if(keys['ArrowDown']||keys['s'])player.y+=C.speed*dt;if(keys['ArrowLeft']||keys['a'])player.x-=C.speed*dt;if(keys['ArrowRight']||keys['d'])player.x+=C.speed*dt;player.x=Math.max(0,Math.min(C.w-1,player.x));player.y=Math.max(0,Math.min(C.h-1,player.y));}\nif(player.if>0)player.if-=dt;\nif(!player.dash&&coll(player.x,player.y)){end('CRUSHED BY SETTLED');}\nif(performance.now()- (pieces.lastSpawn||0)>C.fallInt){spawn();pieces.lastSpawn=performance.now();}\npieces.forEach(p=>{p.y+= (C.fallBase + (dt*C.fallAcc)*(performance.now()-p.t0)/C.fallInt)*dt;if(p.y+4>=C.h-1||coll(p.x,p.y)){p.state='s';setTimeout(()=>{settled.push(p);sounds.settle();},100);}});\nstackH+=C.stack*dt;\nif(player.y<=stackH)end('OVERTAKEN BY STACK');\nif(player.cd>0)player.cd-=dt;\ndocument.getElementById('hud').innerText='SCORE '+String(score).padStart(7,'0');\ndocument.getElementById('stack').innerText='STACK ↓ '+Math.max(0,C.h-1-Math.floor(stackH));\ndocument.getElementById('time').innerText=String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0');\nconst df=document.getElementById('dashFill');df.style.width=((1-player.cd/C.dashCD)*100)+'%';}\nfunction render(){ctx.fillStyle=C.cols.bg;ctx.fillRect(0,0,cw,ch);\nsettled.forEach(b=>{ctx.fillStyle=C.cols[b.type];ctx.fillRect(b.x*scale,b.y*scale,scale,scale);});\npieces.forEach(p=>{ctx.fillStyle=C.cols[p.type];ctx.shadowColor=C.cols[p.type];ctx.shadowBlur=8;ctx.fillRect(p.x*scale,p.y*scale,4*scale,4*scale);ctx.shadowBlur=0;});\nctx.fillStyle=C.cols.player;ctx.beginPath();ctx.arc(player.x*scale+scale/2,player.y*scale+scale/2,10,0,2*Math.PI);ctx.fill();\nif(player.dash){ctx.fillStyle=C.cols.dash;for(let i=0;i<3;i++){ctx.globalAlpha=0.5-i*0.2;ctx.fillRect(player.x*scale+2+i*2,player.y*scale+2+i*2,28-4*i,28-4*i);ctx.globalAlpha=1;}}\nconst lineY=stackH*scale;ctx.strokeStyle=C.cols.stackStart;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,lineY);ctx.lineTo(cw,lineY);ctx.stroke();ctx.strokeStyle=`rgba(${parseInt(C.cols.stackEnd.slice(1,3)}+0.5*Math.sin(performance.now()/200)*30)},${parseInt(C.cols.stackEnd.slice(3,5)}+0.5*Math.sin(performance.now()/200)*30)},${parseInt(C.cols.stackEnd.slice(5,7)}+0.5*Math.sin(performance.now()/200)*30)},1)`;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,lineY);ctx.lineTo(cw,lineY);ctx.stroke();}\nfunction end(reason){localStorage.setItem(C.highScoreKey,Math.max(score,high).toString());alert('Game Over - '+reason+'\nScore: '+score+'\nHigh: '+high);player={x:0,y:0,dash:false,cd:0,if:0,dashStart:0};pieces=[];settled=[];stackH=0;score=0;time=0;dashR=0;init();}\nfunction init(){last=0;score=0;time=0;dashR=0;player={x:0,y:0,dash:false,cd:0,if:0,dashStart:0};pieces=[];settled=[];stackH=0;initKey();}\nfunction initKey(){window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Shift'&&!player.dash&&player.cd<=0){player.dash=true;player.dashStart=performance.now();sounds.dash();player.cd=C.dashCD;}});window.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key==='Shift')player.dash=false;});}\nfunction col(c){return C.cols[c]||'#fff';}\nfunction loop(t){if(!last)last=t;const dt=(t-last)/1000;last=t;upd(dt);render();requestAnimationFrame(loop);}\nrequestAnimationFrame(loop);\n</script>\n</body>\n</html>
