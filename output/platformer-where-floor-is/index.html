<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ignis Ascent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><text y=\"0.7em\" font-size=\"90\">🔥</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #1a1a2e; 
      overflow: hidden; 
      font-family: 'JetBrains Mono', monospace; 
      color: #e0e0e0; 
    }
    canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
      image-rendering: pixelated; 
      background: linear-gradient(to bottom, #1a1a2e 0%, #2d2d4a 100%);
    }
    .ui-overlay { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      pointer-events: none; 
    }
    .hud { 
      position: absolute; 
      color: #e0e0e0; 
      font-size: 14px; 
      text-shadow: 0 0 3px #00000080;
    }
    .timer { top: 10px; left: 10px; 
      color: #44ff88; 
      text-shadow: 0 0 5px #44ff88;
    }
    .stamina { bottom: 20px; left: 50%; transform: translateX(-50%); 
      width: 200px; height: 16px; 
      background: #2d2d4a; 
      border-radius: 8px; 
      overflow: hidden; 
      border: 2px solid #4a4a6a;
    }
    .stamina-fill { 
      height: 100%; 
      width: 100%; 
      background: linear-gradient(90deg, #44ff88, #ff4444); 
      transition: width 0.1s;
    }
    .death-overlay { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(0,0,0,0.85);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: #ff4444;
      font-size: 24px;
      display: none;
    }
    button { 
      margin-top: 20px; 
      padding: 10px 30px; 
      font-size: 16px; 
      background: #ff3300; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    button:hover { 
      transform: scale(1.05); 
      box-shadow: 0 0 10px #ff3300;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="ui-overlay">
    <div class="hud timer" id="timer">00:00.00</div>
    <div class="hud stamina"><div class="stamina-fill" id="staminaFill" style="width: 100%"></div></div>
    <div class="death-overlay" id="deathOverlay">
      <div style="font-size: 36px; margin-bottom: 20px;">ASCENT HALTED</div>
      <div id="deathStats" style="margin-bottom: 20px;"></div>
      <button onclick="restartGame()">CLIMB AGAIN</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
