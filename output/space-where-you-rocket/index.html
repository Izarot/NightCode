<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket Salvage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0f0c2c; color: #e0e0ff; }
    #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; background: radial-gradient(circle at 50% 50%, #1a1a3e, #0f0c2c); }
    .hud { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
    .hud-bar { width: 150px; height: 18px; background: rgba(0,0,0,0.4); border: 1px solid #4a4a8a; border-radius: 3px; }
    .hud-fill { height: 100%; border-radius: 2px; transition: width 0.2s; }
    .timer { position: absolute; top: 10px; right: 10px; font-size: 16px; color: #ffd700; text-shadow: 0 0 5px #fff; }
    .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center; color: #e0e0ff; }
    button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; background: #4a9dff; color: #fff; border: none; border-radius: 5px; }
    button:hover { background: #66b2ff; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="hud-bar"><div id="fuelBar" class="hud-fill" style="width:80%; background:#4a9dff;"></div></div>
      <div class="hud-bar"><div id="shieldBar" class="hud-fill" style="width:100%; background:#4cff4c;"></div></div>
      <div class="hud-bar"><div id="cargoBar" class="hud-fill" style="width:50%; background:#ffaa00;"></div></div>
    </div>
    <div class="timer" id="timer">Time: 0.00s</div>
    <div class="overlay" id="overlay">
      <h1>Rocket Salvage</h1>
      <p>Collect scrap, build rockets, survive!</p>
      <button onclick="startGame()">Start Mission</button>
      <button onclick="showBuildScreen()">Build Rocket</button>
      <button onclick="showHighScores()">High Scores</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
