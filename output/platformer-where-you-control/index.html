<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>COIL: Kinetic Ascent</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>'>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#0b0b18;color:#fff;font-family:system-ui,Arial,sans-serif;height:100%;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a1a4a,#0b0b18 70%)}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-height:100vh}
canvas{width:100%;height:100%;display:block;background:#1a1a2e;border-radius:8px;touch-action:none;box-shadow:0 0 40px #00f2ff55}
#touch{position:absolute;left:0;right:0;bottom:8px;display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #00f2ff;background:#00f2ff33;color:#fff;font-size:24px}
#touch .charge{width:84px;height:84px;border-color:#ff2ec4;background:#ff2ec433}
@media(pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id='wrap'><div id='stage'>
<canvas id='game' width='1280' height='720'></canvas>
<div id='touch'>
<button id='tL'>◀</button><button id='tR'>▶</button><button id='tC' class='charge'>⬆</button>
</div>
</div></div>
<script type='module' src='./src/main.js'></script>
</body>
</html>
