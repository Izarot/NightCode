<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Star Dodge</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; }
        canvas { width: 100%; height: 100%; display: block; border: 2px solid #ffd700; border-radius: 8px; background: #0a0a2a; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); color: #ffd700; text-align: center; z-index: 10; }
        .hidden { display: none; }
        h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 0 0 10px #ff4500; }
        p { font-size: 1.2rem; margin: 0.5rem 0; }
        button { padding: 1rem 2rem; font-size: 1.2rem; background: #ff4500; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #ff6347; }
        .hud { position: absolute; top: 10px; left: 10px; color: #ffd700; font-size: 1.5rem; z-index: 5; text-shadow: 2px 2px 4px #000; }
        .health-bar { width: 200px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .health-fill { height: 100%; width: 100%; background: linear-gradient(to right, #00ff00, #ffff00, #ff0000); transition: width 0.3s; }
        .timer { position: absolute; top: 10px; right: 10px; color: #00ffff; font-size: 1.5rem; z-index: 5; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div>Score: <span id="score">0</span></div>
            <div>Combo: <span id="combo">0</span>x</div>
            <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
        </div>
        <div class="timer" id="timer">0.0s</div>
        
        <div class="overlay" id="startScreen">
            <h1>NINJA STAR DODGE</h1>
            <p>Avoid the boomerangs!</p>
            <p>Use WASD or Arrow Keys to move</p>
            <button id="startBtn">START</button>
        </div>
        
        <div class="overlay hidden" id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Time: <span id="finalTime">0</span>s</p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
