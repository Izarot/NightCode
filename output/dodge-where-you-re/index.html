<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Photon Reflex</title>\n<style>\nbody{margin:0;background:#050508;overflow:hidden;font-family:monospace;color:#E0E0E0}\\ncanvas{display:block}\\n</style>\n<link rel=\"icon\" href=\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.5' x='0.5' font-size='100'>🚀</text></svg>\">\n</head>\n<body>\n<canvas id=\"c\"></canvas>\n<script>\n/* ---------- Setup ---------- */\nconst canvas=document.getElementById('c'),ctx=canvas.getContext('2d');\nfunction resize(){const dpr=window.devicePixelRatio||1;const w=canvas.clientWidth*dpr,h=canvas.clientHeight*dpr;canvas.width=w;canvas.height=h;canvas.style.width=canvas.clientWidth+'px';canvas.style.height=canvas.clientHeight+'px';}\\nresize();window.addEventListener('resize',resize);\nconst dpr=window.devicePixelRatio||1;\n/* ---------- Vector ---------- */\nclass Vec{\\n constructor(x=0,y=0){this.x=x;this.y=y;}\\n add(v){this.x+=v.x;this.y+=v.y;return this;}\\n sub(v){this.x-=v.x;this.y-=v.y;return this;}\\n mul(s){this.x*=s;this.y*=s;return this;}\\n clone(){return new Vec(this.x,this.y);}\\n dot(v){return this.x*v.x+this.y*v.y;}\\n normalize(){const l=Math.hypot(this.x,this.y);if(l>0){this.x/=l;this.y/=l;}return this;}\\n}\\n/* ---------- Input ---------- */\nconst keys={left:0,right:0,up:0};\nwindow.addEventListener('keydown',e=>{\\n if(e.key==='ArrowLeft'||e.key==='a') keys.left=1;\n if(e.key==='ArrowRight'||e.key==='d') keys.right=1;\n if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') keys.up=1;\n});\nwindow.addEventListener('keyup',e=>{\\n if(e.key==='ArrowLeft'||e.key==='a') keys.left=0;\n if(e.key==='ArrowRight'||e.key==='d') keys.right=0;\n if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') keys.up=0;\n});\n/* ---------- Game ---------- */\nconst baseSpeed=400, maxTurn=Math.PI; // rad/s\nlet pos=new Vec(canvas.width/2,canvas.height/2);\nlet vel=new Vec(0,0);\nlet angle=0;\nlet speed=baseSpeed;\nlet angularVel=0;\nlet boost=false, boostTimer=0, boostCooldown=3, boostDur=0.5;\nlet score=0, time=0;\nconst mirrors=[{x1:100,y1:100,x2:300,y2:150}]; // static mirror\nconst enemies=[new (class{\\n constructor(x,y){\\n  this.x=x; this.y=y; this.r=6;\n  this.vx=0; this.vy=0;\n }\n update(dt){\\n  const dx=pos.x-this.x, dy=pos.y-this.y;\n  const d=Math.hypot(dx,dy);\n  this.vx=dx/d*0.7*baseSpeed;\n  this.vy=dy/d*0.7*baseSpeed;\n  this.x+=this.vx*dt; this.y+=this.vy*dt;\n }\n})(-50,50);\nfunction dist(p1,p2){return Math.hypot(p1.x-p2.x,p1.y-p2.y);}\\nfunction reflect(v,n){\\n const d=v.dot(n);\n return new Vec(v.x-2*d*n.x, v.y-2*d*n.y);\n}\\nfunction update(dt){\\n // angular velocity\n angularVel=0;\n if(keys.left) angularVel-=maxTurn*dt;\n if(keys.right) angularVel+=maxTurn*dt;\n angle=(angle+angularVel*dt)%(Math.PI*2);\n vel.x=Math.cos(angle); vel.y=Math.sin(angle);\n vel.mul(speed);\n pos.add(vel.clone().mul(dt));\n // wall collision\n if(pos.x-8<0){ pos.x=8; vel.x*=-1; }\n else if(pos.x+8>canvas.width){ pos.x=canvas.width-8; vel.x*=-1; }\n if(pos.y-8<0){ pos.y=8; vel.y*=-1; }\n else if(pos.y+8>canvas.height){ pos.y=canvas.height-8; vel.y*=-1; }\n // mirror bounce\n for(const m of mirrors){\\n  const nx=m.y2-m.y1, ny=-(m.x2-m.x1);\n  const len=Math.hypot(nx,ny);\n  if(len===0) continue;\n  const nxn=nx/len, nyn=nyn/len;\n  const cx=m.x1+(pos.x-m.x1)*nxn+(pos.y-m.y1)*nyn;\n  const cy=m.y1+(pos.y-m.y1)*nyn;\n  if(dist(pos,new Vec(cx,cy))<=8){\\n   const n=new Vec(nxn,nyn);\n   vel=reflect(vel,n);\n   speed*=0.99; // 1% loss\n   vel=vel.clone().mul(speed/baseSpeed);\n  }\n }\n // boost\n if(keys.up && boostCooldown<=0 && !boost){\\n  boost=true; boostTimer=boostDur;\n }\n if(boost){\\n  speed=baseSpeed*1.5;\n  boostTimer-=dt;\n  if(boostTimer<=0){ boost=false; speed=baseSpeed; }\n } else if(boostCooldown>0){\\n  boostCooldown-=dt;\n }\n // enemy update & collision\n for(const e of enemies){\\n  e.update(dt);\n  if(dist(pos,e) < e.r){\\n   // reset for simplicity\n   score=0; time=0;\n  }\n }\n // scoring\n score+=1; // per frame survival\n // timer\n time+=dt;\n}\\nfunction draw(){ \n ctx.fillStyle='#050508';\n ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr); \n // mirrors\n ctx.strokeStyle='white';\n ctx.beginPath();\n ctx.moveTo(mirrors[0].x1*dpr,mirrors[0].y1*dpr);\n ctx.lineTo(mirrors[0].x2*dpr,mirrors[0].y2*dpr);\n ctx.stroke();\n // photon\n ctx.fillStyle='cyan';\n ctx.beginPath();\n ctx.arc(pos.x*dpr,pos.y*dpr,8,0,Math.PI*2);\n ctx.fill();\n // enemies\n for(const e of enemies){\\n  ctx.fillStyle='magenta';\n  ctx.beginPath();\n  ctx.arc(e.x*dpr,e.y*dpr,e.r*dpr,0,Math.PI*2);\n  ctx.fill();\n }\n // score & timer\n ctx.fillStyle='cyan';\n ctx.font='20px monospace';\n ctx.fillText(`Score: ${Math.floor(score)}`,20,30);\n ctx.fillText(`Time: ${Math.floor(time/60)}:${String(Math.floor(time)%60).padStart(2,'0')}`,canvas.width-150,30);\n}\\nfunction loop(t){\\n const dt=(t-last)/1000;\n last=t;\n update(dt);\n draw();\n requestAnimationFrame(loop);\n}\\nlet last=performance.now();\nrequestAnimationFrame(loop);\n/* ---------- Audio ---------- */\nlet audioCtx=null;\ndocument.body.addEventListener('click',()=>{ if(!audioCtx){ const AudioContext=window.AudioContext||window.webkitAudioContext; audioCtx=new AudioContext(); } },{once:true});\nfunction play(freq){\\n if(!audioCtx) return;\n const osc=audioCtx.createOscillator();\n const gain=audioCtx.createGain();\n osc.type='sine'; osc.frequency.value=freq;\n gain.gain.value=0.2;\n osc.connect(gain).connect(audioCtx.destination);\n osc.start();\n setTimeout(()=>osc.stop(),50);\n}\\n/* ---------- High Score ---------- */\nconst hs=localStorage.getItem('photonHS');\nif(hs!==null && hs!== ''){ score=Math.max(score,parseInt(hs,10)); }\n</script>\n</body>\n</html>
