<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Trail Runner</title>
 <link rel="icon" href="data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg" viewBox=\"0 0 100 100"><text y=\".9em" font-size=\"90">🚀</text></svg>">
 <style>
 body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
 canvas { display: block; touch-action: none; }
 #ui {
 position: absolute; top: 10px; left: 10px; color: #e94560; 
 pointer-events: none; text-shadow: 2px 2px #000;
 font-weight: bold; font-size: 18px;
 }
 #timer { position: absolute; top: 10px; right: 10px; color: #0f3460; background: rgba(255,255,255,0.7); padding: 5px 10px; border-radius: 5px; }
 #high-score { position: absolute; bottom: 10px; left: 10px; color: #fff; font-size: 14px; }
 #controls-hint { position: absolute; bottom: 10px; right: 10px; color: rgba(255,255,255,0.5); font-size: 12px; }
 </style>
</head>
<body>
 <div id="ui">
 TRAILS: <span id="trail-count">0</span>/500
 </div>
 <div id="timer">00:00.00</div>
 <div id="high-score">BEST: 0.00s</div>
 <div id="controls-hint">WASD/Arrows to Move | SHIFT to Run</div>
 <canvas id="gameCanvas"></canvas>
 <script src="game.js"></script>
</body>
</html>
