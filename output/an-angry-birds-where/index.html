<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Angry Avian Assault</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>🐦</text></svg>" alt="Emoji Favicon"/>
  <style>
    body { margin:0; overflow:hidden; background:#1a1a2e; font-family:Arial,sans-serif; }
    canvas { display:block; width:100vw; height:100vh; touch-action:none; }
    #hud { position:absolute; top:10px; left:10px; color:#fff; font-size:16px; text-shadow:1px 1px 2px #000; }
    #hud div { margin-bottom:5px; }
    #resultOverlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:#fff; font-size:24px; background:rgba(0,0,0,0.8); padding:20px; border-radius:10px; }
    .colorblind { filter: invert(1) hue-rotate(180deg); }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud"></div>
  <script src="game.js" defer></script>
  <script src="physics.js" defer></script>
  <script src="birds.js" defer></script>
  <script src="structures.js" defer></script>
  <script src="hud.js" defer></script>
  <script src="post-level-screen.js" defer></script>
  <script src="sound.js" defer></script>
  <script src="accessibility.js" defer></script>
  <script src="achievements.js" defer></script>
  <script src="worker.js" defer></script>
  <script src="optimization.js" defer></script>
</body>
</html>
