<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>Pizza Rush</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='icon' href='data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9' font-size='80'%3E%F0%9F%8D%96%3C/text%3E%3C/svg%3E'>
<style>
  body { margin:0; overflow:hidden; background:#222; font-family:sans-serif; color:#fff; }
  #gameContainer { position:relative; width:100%; height:100vh; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:10px; left:10px; font-size:18px; }
  #pauseMenu, #settingsPanel { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#333; padding:20px; border-radius:8px; color:#fff; display:none; }
  #pauseMenu button, #settingsPanel button { margin:5px; }
</style>
</head>
<body>
<div id='gameContainer'>
  <canvas id='gameCanvas'></canvas>
  <div id='hud'></div>
  <div id='pauseMenu' style='display:none;'>
    <button id='resumeBtn'>Resume</button>
    <button id='restartBtn'>Restart</button>
    <button id='settingsBtn'>Settings</button>
    <button id='exitBtn'>Exit</button>
  </div>
  <div id='settingsPanel' style='display:none;'>
    <label>Music Volume <input type='range' id='musicVol' min='0' max='1' step='0.1' value='0.5'></label><br>
    <label>SFX Volume <input type='range' id='sfxVol' min='0' max='1' step='0.1' value='0.5'></label><br>
    <label><input type='checkbox' id='cbColorBlind'> Color‑blind mode</label><br>
    <label><input type='checkbox' id='cbHighContrast'> High‑contrast UI</label><br>
    <button id='saveSettingsBtn'>Save</button>
    <button id='closeSettingsBtn'>Close</button>
  </div>
</div>
<script src='main.js'></script>
</body>
</html>
