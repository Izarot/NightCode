<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Master: Trap Layer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E🧙‍♂️%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #gameContainer {
      position: relative;
      margin: auto;
    }
    canvas {
      background: #2a2a3d;
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    #ui {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 200px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      padding: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="game"></canvas>
  </div>
  <div id="ui">
    <div>TRAP BUDGET: <span id="budget">10</span></div>
    <div>[1] SPIKE (1)</div>
    <div>[2] PIT (2)</div>
    <div>[3] FIRE (2)</div>
    <div>[4] FREEZE (3)</div>
    <div>WALLS: <span id="walls">5</span> left</div>
    <div>LEVEL: <span id="level">1</span></div>
    <div>BEST: <span id="best">0</span> pts</div>
    <div><button id="start">START SIM</button><button id="reset">RESET</button></div>
  </div>
  <div id="hud">
    <div>Level: <span id="curLevel">1</span></div>
    <div>Score: <span id="score">0</span></div>
    <div>Timer: <span id="timer">0</span>s</div>
    <div>HP: <span id="hp">100</span>/100</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
