<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON DRIFT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">BEST</span>
        <span id="highscore" class="hud-value">0</span>
      </div>
      <div class="hud-item timer">
        <span class="hud-label">TIME</span>
        <span id="timer" class="hud-value">0.00s</span>
      </div>
    </div>
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay hidden">
      <h1>NEON DRIFT</h1>
      <p id="overlay-text">Tap or Click to Start</p>
      <p class="controls">← → or Touch to Move</p>
      <button id="start-btn">BEGIN RUN</button>
    </div>
    <div id="pause-overlay" class="overlay hidden">
      <h1>PAUSED</h1>
      <p>Tap to Resume</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
