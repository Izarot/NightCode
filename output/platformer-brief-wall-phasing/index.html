<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PHASE SHIFT</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>"><style>body{margin:0;overflow:hidden;background:#0d0d1a;color:#e0e0e0;font-family:'Segoe UI',system-ui;font-size:14px}#game{cursor:crosshair;display:block}#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:8px;box-sizing:border-box}zones{display:flex;justify-content:space-between;align-items:flex-start}gauge{position:relative;width:200px;height:12px;background:rgba(26,26,46,0.8);border-radius:6px;overflow:hidden;margin-left:8px}gauge::after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#00f3ff,#aa00ff);transition:width 0.1s linear;box-shadow:0 0 8px #00f3ff}zones > div{flex:1;min-width:0;margin:0 4px}h1{margin:0;font-size:1rem;color:#00f3ff;text-shadow:0 0 8px #00f3ff}timer{color:#ffd700;font-size:1.2rem;font-weight:bold;text-shadow:0 0 10px #ffd700}#pause{position:absolute;top:8px;right:8px;width:40px;height:40px;background:rgba(26,26,46,0.8);border:1px solid #00f3ff;border-radius:4px;color:#00f3ff;text-align:center;line-height:40px;transition:background 0.2s}#pause:hover{background:rgba(0,243,255,0.1)}</style></head><body><div id="ui"><div><h1>PHASE SHIFT</h1><div class="zones"><div>LEVEL 1</div><div><span class="timer">00:00.000</span><span style="opacity:0.5">[SHIFT]</span></div></div></div><div class="gauge" id="phaseGauge"><div class="fill"></div></div></div><canvas id="game"></canvas><div id="pause">⏸</div></body></html>
