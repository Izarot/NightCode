<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rotating Labyrinth</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="uiOverlay">
  <div id="topLeft" class="hud"><span id="objectiveText">Loading...</span><br><span id="objTimer">0.0s</span></div>
  <div id="topRight" class="hud"><span id="scoreText">Score: 0</span> | <span id="highScoreText">Best: 0</span><br><span id="livesText">❤️❤️❤️</span></div>
  <div id="bottomCenter" class="hud"><span id="speedrunTimer">00:00.00</span></div>
  <div id="startMenu" class="menu"><h1>🌀 Rotating Labyrinth</h1><p>Navigate the rotating maze. Complete objectives before time runs out.</p><p>Controls: WASD / Arrows / Joystick</p><button id="startBtn">Start Run</button></div>
  <div id="pauseMenu" class="menu"><h1>Paused</h1><button id="resumeBtn">Resume</button><button id="restartBtn">Restart</button></div>
  <div id="gameOverMenu" class="menu"><h1>Run Ended</h1><p id="finalScore">Score: 0</p><button id="retryBtn">Retry</button></div>
</div>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
<script src="main.js"></script>
</body>
</html>
