<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tree Tapper</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0f0f1a; font-family: 'Arial', sans-serif; touch-action: manipulation; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud { position: fixed; top: 10px; right: 10px; color: #ffd700; text-shadow: 0 0 10px #ffd700; font-size: 24px; font-weight: bold; z-index: 10; pointer-events: none; }
        #timer { position: fixed; top: 10px; left: 10px; color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 20px; z-index: 10; pointer-events: none; }
        #upgrades { position: fixed; bottom: 10px; left: 10px; display: flex; gap: 10px; z-index: 10; flex-wrap: wrap; }
        .btn { background: rgba(0,0,0,0.8); border: 2px solid #ff6b6b; color: white; padding: 10px; border-radius: 8px; cursor: pointer; min-width: 80px; font-size: 14px; }
        .btn:hover { background: rgba(255,107,107,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #progress-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 300px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #0f0; z-index: 10; }
        #progress-bar { height: 100%; background: linear-gradient(90deg, #0f0, #0f0); width: 0%; transition: width 0.3s; }
        #stage-text { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ffd700; font-size: 32px; text-shadow: 0 0 20px #ff6b6b; opacity: 0; transition: opacity 0.3s; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="timer">00:00</div>
    <div id="hud">💰 0</div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="stage-text"></div>
    <div id="upgrades">
        <button class="btn" id="tapPower">⚡+1 (50)</button>
        <button class="btn" id="growthSpeed">🚀 Speed (100)</button>
        <button class="btn" id="autoTapper">🤖 Auto (200)</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
