is.cx.fillText(t,500,20)}}class Game{constructor(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d');this.canvas.width=C.W;this.canvas.height=C.H;this.maze=new Maze();this.player=new Player(this.maze);this.ghosts=new GManager();this.renderer=new Renderer(this.maze);this.audio=new SFX();this.state='menu';this.score=0;this.lives=3;this.powerTimer=0;this.mult=1;this.startTime=0;this.elapsed=0;this.highScore=parseInt(localStorage.getItem('pacman_hs'))||0;this.keys={};this.ghostScoreCount=0;this.init();this.loop()}init(){document.addEventListener('keydown',e=>{this.keys[e.key]=true;if(e.key==='p'||e.key==='P')this.togglePause();if(e.key==='m'||e.key==='M')this.audio.toggle();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>{this.keys[e.key]=false});document.getElementById('startBtn').onclick=()=>this.start();window.addEventListener('resize',()=>this.resize());this.resize()}resize(){const maxW=window.innerWidth,maxH=window.innerHeight;const scale=Math.min(maxW/C.W,maxH/C.H);this.canvas.style.width=(C.W*scale)+'px';this.canvas.style.height=(C.H*scale)+'px';document.getElementById('container').style.width=(C.W*scale)+'px';document.getElementById('container').style.height=(C.H*scale)+'px'}start(){this.audio.init();this.audio.resume();this.maze.init();this.player.r();this.ghosts.r();this.score=0;this.lives=3;this.powerTimer=0;this.mult=1;this.startTime=Date.now();this.elapsed=0;this.ghostScoreCount=0;this.state='playing';document.getElementById('overlay').classList.add('hidden');this.updateLives()}togglePause(){if(this.state==='playing'){this.state='paused';document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').innerHTML='<h1>PAUSED</h1><button onclick="game.togglePause()">RESUME</button><button onclick="game.restart()">RESTART</button>'}else if(this.state==='paused'){this.state='playing';document.getElementById('overlay').classList.add('hidden');this.startTime=Date.now()-this.elapsed}}gameOver(){this.state='gameover';const hs=Math.max(this.highScore,this.score);localStorage.setItem('pacman_hs',hs);document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').innerHTML=`<h1>GAME OVER</h1><p style="color:#0ff">SCORE: ${this.score}</p><p style="color:#ff0">HIGH: ${hs}</p><button onclick="game.start()">RESTART</button>`}win(){this.state='win';document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').innerHTML=`<h1 style="color:#0f0">YOU WIN!</h1><p style="color:#0ff">SCORE: ${this.score}</p><button onclick="game.start()">PLAY AGAIN</button>`}updateLives(){const el=document.getElementById('lives');el.innerHTML='';for(let i=0;i<this.lives;i++){const span=document.createElement('span');span.style.color='#ff0';span.style.fontSize='16px';span.textContent='C';span.style.marginRight='5px';el.appendChild(span)}}updatePowerTimer(){const el=document.getElementById('powerTimer');if(this.powerTimer>0){const pct=(this.powerTimer/C.PD)*100;el.style.setProperty('--pct',pct+'%');el.style.display='block'}else{el.style.display='none'}}updateTimer(){const elapsed=Math.floor((Date.now()-this.startTime)/1000);const m=Math.floor(elapsed/60).toString().padStart(2,'0');const s=(elapsed%60).toString().padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`}handleInput(){if(!this.keys['ArrowLeft']&&!this.keys['a']&&!this.keys['A'])this.player.nd='left';if(!this.keys['ArrowRight']&&!this.keys['d']&&!this.keys['D'])this.player.nd='right';if(!this.keys['ArrowUp']&&!this.keys['w']&&!this.keys['W'])this.player.nd='up';if(!this.keys['ArrowDown']&&!this.keys['s']&&!this.keys['S'])this.player.nd='down'}update(dt){if(this.state!=='playing')return;this.handleInput();this.player.update(dt);const coll=this.ghosts.col(this.player);if(coll){if(coll.vul){coll.eat=true;this.score+=C.GS[Math.min(this.ghostScoreCount,3)];this.ghostScoreCount++;S.play('ghost')}else{this.lives--;this.updateLives();if(this.lives<=0){this.gameOver();return}this.player.triggerDeath();this.ghosts.r();this.powerTimer=0}}const collected=this.maze.collect(this.player.x+C.T/2,this.player.y+C.T/2);if(collected){if(collected.type==='dot'){this.score+=collected.pct;S.play('eat')}else{this.score+=collected.pct;this.powerTimer=C.PD;this.mult=2;this.ghosts.vul();S.play('power')}document.getElementById('score').textContent=this.score}if(this.powerTimer>0){this.powerTimer-=dt;if(this.powerTimer<=0){this.powerTimer=0;this.mult=1}this.renderer.updateSR(true)}else{this.renderer.updateSR(false)}if(this.maze.dots<=0){this.win();return}this.updateTimer();this.updatePowerTimer()}render(){this.renderer.clear();this.renderer.renderMaze();this.renderer.renderDots();this.ghosts.gs.forEach(g=>this.renderer.renderGhost(g));this.renderer.renderPlayer(this.player);this.renderer.renderSpotlight(this.player.x+C.T/2,this.player.y+C.T/2,this.player.d);if(this.state==='paused')this.renderer.renderOverlay()}loop(){const now=Date.now();const dt=Math.min(50,now-(this.lastTime||now));this.lastTime=now;this.update(dt);this.render();requestAnimationFrame(()=>this.loop())}}const game=new Game();</script></body></html>
