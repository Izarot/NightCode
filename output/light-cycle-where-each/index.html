<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Light-Cycle Phase</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='60'>🎮</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background:#0a0a0a; overflow:hidden; font-family:'Courier New',monospace; }
    #gameContainer { width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; }
    canvas { width:100%; height:auto; max-width:100%; image-rendering:pixelated; background:#0a0a0a; }
    .hud { position:absolute; top:10px; left:10px; color:#fff; font-size:14px; text-shadow:2px 2px #000; }
    .overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; font-size:24px; text-align:center; }
    button { margin:10px; padding:10px 20px; font-size:16px; cursor:pointer; background:#ff00ff; color:#000; border:none; border-radius:5px; }
    button:hover { background:#00ffff; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div class="hud" id="hud"></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
