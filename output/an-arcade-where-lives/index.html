<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Life Point Arcade Game</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>😀</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div class="top">
    <div class="lc-info">
      <img id="lcPortrait" src="" alt="LC Portrait">
      <span id="lcName">Alex</span>
      <span id="lcLives">Lives: 3/5</span>
      <span id="lcScore">Score: 0</span>
    </div>
    <div id="timer">Time: 00:00</div>
  </div>
  <div class="bottom">
    <div id="healthBar"><div class="fill"></div></div>
    <div id="boostMeter"><div class="fill"></div></div>
    <div id="timeDisplay">02:45</div>
    <div id="controls">WASD: Move | SHIFT: Run | SPACE: Jump | TAB: Swap LC</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
