<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Speedrun</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-color: #050505;
            --accent-cyan: #00f2ff;
            --accent-magenta: #ff00ff;
            --accent-yellow: #ffff00;
            --text-color: #ffffff;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid var(--accent-magenta);
            box-shadow: 0 0 15px var(--accent-magenta);
            pointer-events: auto;
        }
        #timer-display {
            font-size: 24px;
            color: var(--accent-yellow);
            font-weight: bold;
            text-shadow: 0 0 10px var(--accent-yellow);
        }
        #score-display {
            font-size: 18px;
            color: var(--accent-cyan);
        }
        #high-score-display {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: auto;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px var(--accent-cyan);
        }
        p {
            margin: 10px 0;
            color: #ccc;
        }
        button {
            background: var(--accent-magenta);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-magenta);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            button { padding: 12px 30px; font-size: 16px; }
            canvas { border-width: 1px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="hud" style="align-self: flex-start;">
                <div id="timer-display">00:00.00</div>
                <div id="score-display">Target: 0/10</div>
                <div id="high-score-display">Best: --:--.--</div>
            </div>
        </div>
        <div id="overlay">
            <h1>NEON RUN</h1>
            <p>Click the glowing orb 10 times as fast as you can!</p>
            <button id="start-btn">START RUN</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const timerDisplay = document.getElementById('timer-display');
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');

        let width, height;
        let animationId;
        let gameRunning = false;
        let gameFinished = false;
        let startTime = 0;
        let elapsedTime = 0;
        let score = 0;
        const targetScore = 10;
        let highScore = localStorage.getItem('neon_speedrun_best') || null;

        let audioCtx = null;

        const target = {
            x: 0,
            y: 0,
            radius: 30,
            color: '#00f2ff'
        };

        const particles = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(freq, type = 'square', duration = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameRunning && !gameFinished) {
                draw();
            }
        }

        function spawnTarget() {
            const margin = 50;
            target.x = margin + Math.random() * (width - margin * 2);
            target.y = margin + Math.random() * (height - margin * 2);
            target.radius = 25 + Math.random() * 15;
        }

        function createParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#00f2ff' : '#ff00ff'
                });
            }
        }

        function updateTimer() {
            if (!gameRunning || gameFinished) return;
            const now = Date.now();
            elapsedTime = now - startTime;
            const ms = elapsedTime % 1000;
            const seconds = Math.floor((elapsedTime / 1000) % 60);
            const minutes = Math.floor((elapsedTime / (1000 * 60)) % 60);
            timerDisplay.textContent = 
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0') + '.' +
                String(Math.floor(ms / 10)).padStart(2, '0');
        }

        function updateHighScore() {
            if (!highScore || elapsedTime < highScore) {
                highScore = elapsedTime;
                localStorage.setItem('neon_speedrun_best', highScore);
                const ms = highScore % 1000;
                const seconds = Math.floor((highScore / 1000) % 60);
                const minutes = Math.floor((highScore / (1000 * 60)) % 60);
                highScoreDisplay.textContent =
                    'Best: ' +
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0') + '.' +
                    String(Math.floor(ms / 10)).padStart(2, '0');
            }
        }

        function startGame() {
            initAudio();
            score = 0;
            gameRunning = true;
            gameFinished = false;
            startTime = Date.now();
            elapsedTime = 0;
            overlay.classList.add('hidden');
            spawnTarget();
            updateHighScoreDisplay();
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            gameFinished = true;
            updateHighScore();
            overlay.querySelector('h1').textContent = 'RUN COMPLETE!';
            overlay.querySelector('p').textContent = 'Time: ' + timerDisplay.textContent;
            overlay.querySelector('button').textContent = 'RUN AGAIN';
            overlay.classList.remove('hidden');
        }

        function updateHighScoreDisplay() {
            if (highScore) {
                const ms = highScore % 1000;
                const seconds = Math.floor((highScore / 1000) % 60);
                const minutes = Math.floor((highScore / (1000 * 60)) % 60);
                highScoreDisplay.textContent =
                    'Best: ' +
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0') + '.' +
                    String(Math.floor(ms / 10)).padStart(2, '0');
            } else {
                highScoreDisplay.textContent = 'Best: --:--.--';
            }
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw grid
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let i = 0; i < width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
            }
            for (let j = 0; j < height; j += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(width, j);
                ctx.stroke();
            }

            // Draw target
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fillStyle = target.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = target.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw target ring
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                if (p.life <= 0) particles.splice(index, 1);
            });
        }

        function gameLoop() {
            if (!gameRunning) return;
            draw();
            updateTimer();
            animationId = requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e.touches[0]);
        }, {passive: false});

        function handleInput(e) {
            if (!gameRunning || gameFinished) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            const dx = mouseX - target.x;
            const dy = mouseY - target.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < target.radius) {
                score++;
                scoreDisplay.textContent = 'Target: ' + score + '/' + targetScore;
                playSound(800, 'square', 0.1);
                createParticles(target.x, target.y);

                if (score >= targetScore) {
                    endGame();
                } else {
                    spawnTarget();
                }
            } else {
                playSound(100, 'sawtooth', 0.1);
            }
        }

        startBtn.addEventListener('click', startGame);

        window.addEventListener('resize', resize);

        resize();
        updateHighScoreDisplay();
        draw();
    </script>
</body>
</html>
