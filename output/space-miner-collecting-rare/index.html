<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Void Miner: Asteroid Rift</title>
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a001f;color:#00ffcc;font-family:monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:radial-gradient(circle at 30% 40%,#2a0a4a,#0a001f 70%)}.hud{position:fixed;pointer-events:none;text-shadow:0 0 8px #00ffcc}.tl{top:10px;left:10px}.tr{top:10px;right:10px;text-align:right;color:#ffe600}.bl{bottom:10px;left:10px}.br{bottom:10px;right:10px;color:#ff00aa}.bar{width:180px;height:12px;background:#222;border:1px solid #00ffcc;margin:3px 0}.fill{height:100%;background:#00ff66}.shield{background:#00ccff}.heat{background:#ff5500}#shop{position:fixed;inset:15%;background:rgba(10,15,30,.92);border:2px solid #ff00aa;padding:20px;display:none;pointer-events:auto;overflow:auto}#shop button{background:#00ffcc;border:0;padding:6px 10px;cursor:pointer;margin:4px}button:hover{background:#ffe600}#menu{position:fixed;inset:0;background:rgba(10,0,31,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:auto}h1{color:#ff00aa;text-shadow:0 0 20px #ff00aa;font-size:2.2em}button{font-family:monospace}
</style>
</head>
<body>
<canvas id='c'></canvas>
<div class='hud tl'>⛏️ VOID MINER<br><span id='sec'>Sector 1</span> | Asteroids: <span id='ac'>0</span><br>Objective: Mine 3 Void-Ore <span id='obj'>0/3</span></div>
<div class='hud tr'>⏱️ <span id='timer'>00:00.0</span><br>🏆 High: <span id='high'>0</span><br>💎 <span id='score'>0</span></div>
<div class='hud bl'>Hull<div class='bar'><div id='hull' class='fill' style='width:100%'></div></div>Shield<div class='bar'><div id='sh' class='fill shield' style='width:100%'></div></div>Heat<div class='bar'><div id='heat' class='fill heat' style='width:0%'></div></div><span id='cargo'>Cargo 0/20</span></div>
<div class='hud br'>Iron <span id='iron'>0</span> Cobalt <span id='cob'>0</span><br>Void <span id='void'>0</span> Aurum <span id='aur'>0</span><br>[U] Shop [WASD] Fly [SPACE] Laser</div>
<div id='shop'><h2>🛒 UPGRADE SHOP (U to close)</h2><div id='items'></div></div>
<div id='menu'><h1>⛏️ VOID MINER</h1><p>Asteroid Rift - Mine • Upgrade • Survive</p><button onclick='start()'>▶ START</button><p>High Score: <span id='high2'>0</span></p></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H;function rs(){cv.width=innerWidth;cv.height=innerHeight;W=cv.width;H=cv.height}addEventListener('resize',rs);rs();
let AC=null;function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='square';g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
let keys={},mouse=false;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='u')toggleShop();if(e.code=='Space'){mouse=1;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;if(e.code=='Space')mouse=0});addEventListener('mousedown',()=>mouse=1);addEventListener('mouseup',()=>mouse=0);
let ship,asts=[],parts=[],nodes=[],stars=[],state='menu',heat=0,over=0,score=0,t0=0,elapsed=0,voidMined=0;
let inv={iron:0,cob:0,void:0,aur:0},up={hull:0,shield:0,cargo:0,laser:0,prop:0,cool:0};
let high=+localStorage.getItem('vm_high')||0;document.getElementById('high').textContent=high;document.getElementById('high2').textContent=high;
for(let i=0;i<120;i++)stars.push({x:Math.random()*2000,y:Math.random()*2000,s:Math.random()*2+1});
function spawn(){let r=Math.random(),t;if(r<.6)t=0;else if(r<.9)t=1;else if(r<.98)t=2;else t=3;let hp=[50,100,200,500][t],col=['#aaa','#00ccff','#cc00ff','#ffe600'][t],rad=[28,36,48,60][t];asts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,r:rad,hp:hp,max:hp,t:t,col:col,rot:Math.random()*6,pts:Array.from({length:8},()=>.7+Math.random()*.6)})}
function start(){document.getElementById('menu').style.display='none';state='play';ship={x:W/2,y:H/2,vx:0,vy:0,a:-1.57,hp:100,sh:50};asts=[];nodes=[];parts=[];for(let i=0;i<14;i++)spawn();t0=performance.now();beep(660,.15)}
function toggleShop(){if(state=='play'){state='shop';document.getElementById('shop').style.display='block';renderShop()}else if(state=='shop'){state='play';document.getElementById('shop').style.display='none'}}
function cost(l){return 20+l*15}
function renderShop(){let defs=[['hull','❤️ Hull +50'],['shield','🛡️ Shield +20'],['cargo','📦 Cargo +5'],['laser','🔫 Laser +5'],['prop','🚀 Propulsion +10%'],['cool','❄️ Cooling +20%']];document.getElementById('items').innerHTML=defs.map(d=>`<div>${d[1]} LVL ${up[d[0]]}/10 Cost ${cost(up[d[0]])} <button onclick="buy('${d[0]}')">BUY</button></div>`).join('')}
function buy(k){let c=cost(up[k]);if(inv.iron>=c&&up[k]<10){inv.iron-=c;up[k]++;if(k=='hull')ship.hp+=50;beep(880,.2);renderShop()}else beep(200,.2)}
let last=0;function loop(ts){requestAnimationFrame(loop);let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;if(state=='play'){elapsed=(performance.now()-t0)/1000;update(dt)}draw()}
function update(dt){let thrust=400*(1+up.prop*.1),maxv=600*(1+up.prop*.05);if(keys['a']||keys['arrowleft'])ship.a-=4.5*dt;if(keys['d']||keys['arrowright'])ship.a+=4.5*dt;let ax=0,ay=0;if(keys['w']||keys['arrowup']){ax=Math.cos(ship.a)*thrust;ay=Math.sin(ship.a)*thrust;parts.push({x:ship.x-Math.cos(ship.a)*16,y:ship.y-Math.sin(ship.a)*16,vx:-Math.cos(ship.a)*80,vy:-Math.sin(ship.a)*80,l:1,c:'#00ffcc'})}if(keys['s']||keys['arrowdown']){ax-=Math.cos(ship.a)*thrust*.6;ay-=Math.sin(ship.a)*thrust*.6}ship.vx=(ship.vx+ax*dt)*(1-.05*dt);ship.vy=(ship.vy+ay*dt)*(1-.05*dt);let sp=Math.hypot(ship.vx,ship.vy);if(sp>maxv){ship.vx*=maxv/sp;ship.vy*=maxv/sp}ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;ship.x=(ship.x+W)%W;ship.y=(ship.y+H)%H;if(ship.sh<50+up.shield*20)ship.sh+=dt*5;
 if(mouse&&over<=0){heat+=dt*40;if(heat>=100){heat=100;over=2;ship.sh-=10;beep(150,.3)}let dmg=(10+up.laser*5)*dt*10;let best=null,bd=1e9;asts.forEach(a=>{let d=Math.hypot(a.x-ship.x,a.y-ship.y);if(d<bd){bd=d;best=a}});if(best&&bd<400){best.hp-=dmg;parts.push({x:best.x,y:best.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:.5,c:best.col});if(Math.random()<.1)beep(1200,.05);if(best.hp<=0){let y=[10,50,150,400][best.t]+Math.floor(Math.random()*40);nodes.push({x:best.x,y:best.y,t:best.t,v:y});if(best.t==2)voidMined++;asts.splice(asts.indexOf(best),1);for(let i=0;i<4;i++)spawn();beep(500,.2)}}}else{heat=Math.max(0,heat-dt*15*(1+up.cool*.2));if(over>0)over-=dt}
 asts.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.x=(a.x+W)%W;a.y=(a.y+H)%H;let d=Math.hypot(a.x-ship.x,a.y-ship.y);if(d<a.r+14){ship.hp-=dt*10;ship.vx*=.8;ship.vy*=.8;if(ship.hp<=0){state='menu';score+=inv.iron+inv.cob*2+inv.void*5+inv.aur*10;if(score>high){high=score;localStorage.setItem('vm_high',high)}alert('💥 GAME OVER Score '+score);location.reload()}}});
 nodes.forEach(n=>{let d=Math.hypot(n.x-ship.x,n.y-ship.y);if(d<200){n.x+=(ship.x-n.x)*dt*3;n.y+=(ship.y-n.y)*dt*3}if(d<20){let k=['iron','cob','void','aur'][n.t];inv[k]+=n.v;score+=n.v;beep(900,.1);n.dead=1}});nodes=nodes.filter(n=>!n.dead);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 document.getElementById('timer').textContent=new Date(elapsed*1000).toISOString().substr(14,8);document.getElementById('score').textContent=score;document.getElementById('ac').textContent=asts.length;document.getElementById('obj').textContent=Math.min(3,voidMined)+'/3';document.getElementById('hull').style.width=Math.max(0,ship.hp/(100+up.hull*50)*100)+'%';document.getElementById('sh').style.width=Math.max(0,ship.sh/(50+up.shield*20)*100)+'%';document.getElementById('heat').style.width=heat+'%';document.getElementById('iron').textContent=inv.iron;document.getElementById('cob').textContent=inv.cob;document.getElementById('void').textContent=inv.void;document.getElementById('aur').textContent=inv.aur;let used=inv.iron+inv.cob+inv.void*2+inv.aur;document.getElementById('cargo').textContent='Cargo '+used+'/'+(20+up.cargo*5)}
function draw(){x.clearRect(0,0,W,H);stars.forEach(s=>{x.fillStyle='#fff';x.fillRect(s.x%W,s.y%H,s.s,s.s)});if(!ship)return;asts.forEach(a=>{x.save();x.translate(a.x,a.y);x.rotate(a.rot);x.fillStyle=a.col;x.shadowColor=a.col;x.shadowBlur=15;x.beginPath();a.pts.forEach((p,i)=>{let ang=i/8*6.28;x.lineTo(Math.cos(ang)*a.r*p,Math.sin(ang)*a.r*p)});x.closePath();x.fill();x.restore();x.fillStyle='#0f0';x.fillRect(a.x-20,a.y-a.r-10,40*a.hp/a.max,4)});nodes.forEach(n=>{x.fillStyle=['#aaa','#00ccff','#cc00ff','#ffe600'][n.t];x.shadowColor=x.fillStyle;x.shadowBlur=12;x.beginPath();x.arc(n.x,n.y,8,0,6.28);x.fill()});parts.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3);x.globalAlpha=1});if(mouse&&over<=0){x.strokeStyle='#fff';x.shadowColor='#ff00aa';x.shadowBlur=10;x.beginPath();x.moveTo(ship.x,ship.y);x.lineTo(ship.x+Math.cos(ship.a)*300,ship.y+Math.sin(ship.a)*300);x.stroke()}x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);x.fillStyle='#00ffcc';x.shadowColor='#00ffcc';x.shadowBlur=15;x.beginPath();x.moveTo(18,0);x.lineTo(-12,-10);x.lineTo(-6,0);x.lineTo(-12,10);x.closePath();x.fill();x.restore()}
requestAnimationFrame(loop);
</script>
</body>
</html>
