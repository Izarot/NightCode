<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink Cleanse</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; font-family: 'Orbitron', sans-serif; }
    canvas { display: block; background: #0a0a0f; max-width: 100vw; max-height: 100vh; }
    .high-contrast { filter: contrast(200%) brightness(110%); }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"%3E%3Ctext x=\"50\" y=\"65\" font-size=\"80\" text-anchor=\"middle\" fill=\"%23ff2d90\"%3E%F0%9F%92%B2%3C/text%3E%3C/svg%3E">
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module">
    import { Game } from './game.js';
    new Game(document.getElementById('game'));
  </script>
</body>
</html>
