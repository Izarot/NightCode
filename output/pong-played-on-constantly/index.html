<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dodge</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
            <div class="stat">Score: <span id="score">0</span></div>
            <div class="stat">Time: <span id="timer">0.0</span>s</div>
            <div class="stat">Best: <span id="highscore">0</span></div>
        </div>
        <div id="startScreen" class="overlay">
            <h1>NEON DODGE</h1>
            <p>Tap or Arrow Keys to Move</p>
            <button id="startBtn">START RUN</button>
        </div>
        <div id="gameOverScreen" class="overlay hidden">
            <h1>CRASHED</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Time: <span id="finalTime">0.0</span>s</p>
            <button id="restartBtn">TRY AGAIN</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
