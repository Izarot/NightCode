<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GRAV FLIP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: 'Segoe UI', sans-serif; }
    #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; background: radial-gradient(circle at 50% 50%, #0a0a1f, #050510); }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud" id="hud"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
