<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Auto-Swap Soccer</title><link rel='icon' href='data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>'><style>html,body{margin:0;height:100%;background:#0b1026;overflow:hidden}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:100vw;height:100vh;background:#00a86b} #hud{position:fixed;top:10px;left:10px;color:#fff;font:16px monospace} #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}</style></head><body><canvas id='game'></canvas><div id='hud'></div><div id='overlay'><div id='panel'></div></div><script>const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');const score=JSON.parse(localStorage.getItem('autoswap_highscore')||'0');let high=score;const colors={home:'#00e5ff',away:'#ff00a2'};function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();addEventListener('resize',resize);const audioCtx=new (window.AudioContext||window.webkitAudioContext)();function beep(freq,dur,type='sine',vol=0.2){const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}function kickSound(){beep(150,0.1,'square',0.3)}function goalSound(){beep(880,0.4,'sawtooth',0.3);setTimeout(()=>beep(1320,0.6,'sawtooth',0.3),150)}function subSound(){beep(300,0.2,'sine',0.2)}let last=performance.now();function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;ctx.fillStyle='#00a86b';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff';ctx.strokeRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ffffff';ctx.font='20px monospace';ctx.fillText('Speedrun: '+Math.floor(performance.now()/1000)+'s',canvas.width-150,30);ctx.fillText('High: '+high,20,30);kickSound();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
