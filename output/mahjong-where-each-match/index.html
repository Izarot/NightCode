<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Tempest Tiles ⛈️</title><link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛈️</text></svg>'><style>body{margin:0;background:#120826;color:#fff;font-family:sans-serif;text-align:center;overflow-x:hidden}h1{margin:6px;font-size:22px;letter-spacing:2px;color:#00e5ff}canvas{width:100%;max-width:960px;height:auto;image-rendering:pixelated;background:#1a0b2e;border:3px solid #ff2e88;border-radius:12px;touch-action:manipulation;box-shadow:0 0 30px #00e5ff88}button{background:#ff2e88;color:#fff;border:2px solid #00e5ff;border-radius:20px;padding:8px 14px;margin:4px;font-weight:bold;cursor:pointer}button:active{transform:scale(.95)}#bar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px}.slot{background:#ffffff22;border:2px solid #ffffff55;border-radius:10px;padding:4px 8px;font-size:13px}.cur{border-color:#c6ff00;background:#c6ff0033;transform:scale(1.1)}#msg{min-height:20px;color:#ffb300;font-weight:bold}</style></head><body><h1>⛈️ TEMPEST TILES</h1><div id='bar'></div><canvas id='c' width='960' height='640'></canvas><div><button id='shuf'>🔔 Shuffle</button><button id='calm'>🕊️ Calm</button><button id='hint'>💡 Hint</button><button id='restart'>↻ Restart</button></div><div id='msg'>Match free tiles. Survive the weather!</div><div id='hud'></div><script>let c=document.getElementById('c'),x=c.getContext('2d'),W=960,H=640;let tiles=[],parts=[],sel=null,score=0,combo=0,lastMatch=0,chimes=3,pressure=0,invalid=0,calmUsed=0,cleared=0,total=0,start=Date.now(),elapsed=0,locked=0,shake=0,boardOX=0,boardOY=0,quakeT=0,rainT=0,gameOver=false,high=+localStorage.getItem('tempest_highscore')||0;let mouse={x:480,y:320},cur={x:480,y:320,vx:0,vy:0};let WEATHERS=[{n:'Clear',i:'☀️',c:'#c6ff00',d:99},{n:'Gale',i:'🌬️',c:'#00e5ff',d:4},{n:'Rain',i:'🌧️',c:'#4d7cff',d:4},{n:'Lightning',i:'⚡',c:'#ffb300',d:3},{n:'Quake',i:'🌋',c:'#ff2e88',d:3},{n:'Fog',i:'🌫️',c:'#cccccc',d:4},{n:'Heat',i:'🔥',c:'#ff6d00',d:4}];let deck=[],baro=[],curW=WEATHERS[0],wLeft=99,wMatches=0;let TYPES=['🎋','🔴','⚫','🀄','🌺','🍁','🐉','🌙','☀️','⭐','🍀','🔥','💧','⚡','🌸','🍂','🎍','🀙'];let AC=null;function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}function beep(f,d,type,v,slide){try{let a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.value=v||.15;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function sThock(){beep(180,.08,'triangle',.2,90)}function sMatch(){beep(523,.12,'sine',.2);setTimeout(()=>beep(784,.15,'sine',.2),60);setTimeout(()=>beep(1046,.2,'sine',.15),120)}function sBad(){beep(200,.2,'sawtooth',.15,50)}function sWeather(){beep(60,.5,'sawtooth',.25,30);beep(1200,.3,'square',.08,200)}function sShuffle(){beep(300,.3,'triangle',.2,900)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let t=a[i];a[i]=a[j];a[j]=t}return a}function makeDeck(){deck=shuffle(WEATHERS.slice(1).concat(WEATHERS.slice(1)).concat(WEATHERS.slice(1)).concat(WEATHERS.slice(1)).concat(WEATHERS.slice(1)).concat(WEATHERS.slice(1)))}function gen(){tiles=[];parts=[];sel=null;score=0;combo=0;chimes=3;pressure=0;invalid=0;calmUsed=0;cleared=0;gameOver=false;start=Date.now();locked=0;shake=0;makeDeck();baro=[];for(let i=0;i<5;i++)baro.push(deck.pop());curW=WEATHERS[0];wLeft=99;wMatches=0;let pos=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++){if(r==0&&(col<2||col>7))continue;if(r==4&&(col<1||col>8))continue;pos.push({gx:col,gy:r,layer:0})}for(let r=0;r<3;r++)for(let col=0;col<6;col++)pos.push({gx:col+2,gy:r+1,layer:1});for(let r=0;r<2;r++)for(let col=0;col<3;col++)pos.push({gx:col+3,gy:r+2,layer:2});total=pos.length;let bag=[];for(let i=0;i<total/4;i++)for(let k=0;k<4;k++)bag.push(TYPES[i%TYPES.length]);bag=shuffle(bag);pos.forEach((p,i)=>{tiles.push({gx:p.gx,gy:p.gy,layer:p.layer,type:bag[i],removed:false,shake:0,diss:0,fall:0,vy:0})});updateBar();msg('Match free tiles. Survive the weather!')}function tileXY(t){let tw=72,th=48;let ox=80+t.layer*10,oy=150+t.layer*-18;return{x:ox+t.gx*(tw+4),y:oy+t.gy*(th+4)}}function isFree(t){if(t.removed)return false;let top=tiles.some(o=>!o.removed&&o.layer>t.layer&&Math.abs(o.gx-t.gx)<1&&Math.abs(o.gy-t.gy)<1);if(top)return false;let left=tiles.some(o=>!o.removed&&o.layer==t.layer&&o.gy==t.gy&&o.gx==t.gx-1);let right=tiles.some(o=>!o.removed&&o.layer==t.layer&&o.gy==t.gy&&o.gx==t.gx+1);return !left||!right}function hasMoves(){let free=tiles.filter(t=>!t.removed&&isFree(t));let m={};for(let t of free){m[t.type]=(m[t.type]||0)+1;if(m[t.type]>=2)return true}return false}function msg(t){document.getElementById('msg').textContent=t}function updateBar(){let b=document.getElementById('bar');b.innerHTML='';let all=[curW].concat(baro);all.forEach((w,i)=>{let d=document.createElement('div');d.className='slot'+(i==0?' cur':'');d.style.borderColor=w.c;d.textContent=w.i+' '+w.n+(i==0?' ['+wLeft+']':'');b.appendChild(d)})}function advanceBaro(){wMatches++;if(curW.n!='Clear'){wLeft--;if(wLeft<=0){curW=baro.shift();baro.push(deck.pop()||WEATHERS[1]);wLeft=curW.d;sWeather();msg('Weather: '+curW.i+' '+curW.n);shake=.3}}else{curW=baro.shift();baro.push(deck.pop()||WEATHERS[1]);wLeft=curW.d;sWeather();msg('Weather: '+curW.i+' '+curW.n)}updateBar()}function burst(px,py,col){for(let i=0;i<18;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:1,col:col})}function doMatch(a,b){let now=performance.now();if(now-lastMatch<1500)combo=Math.min(combo+1,5);else combo=1;lastMatch=now;let pts=100*combo+(curW.n!='Clear'?500:0);score+=pts;cleared+=2;a.diss=1;b.diss=1;let pa=tileXY(a),pb=tileXY(b);burst(pa.x+36,pa.y+24,'#c6ff00');burst(pb.x+36,pb.y+24,'#00e5ff');sMatch();if(a.type=='🌺'||a.type=='🍁'||a.type=='🌸'||a.type=='🍂'){pressure=Math.min(100,pressure+40);if(baro.length)msg('Special! Barometer reversed');}else if(a.type=='🐉'){pressure=Math.min(100,pressure+30);baro[baro.length-1]=deck.pop()||baro[baro.length-1];updateBar();msg('Dragon! Discarded forecast')}else pressure=Math.min(100,pressure+10);setTimeout(()=>{a.removed=true;b.removed=true;checkEnd()},180);sel=null;advanceBaro();if(curW.n=='Gale'){tiles.forEach(t=>{if(!t.removed)t.fall=4})}updateHUD()}function checkEnd(){if(tiles.every(t=>t.removed)){gameOver=true;let mult=(invalid==0&&chimes==3)?2:1;score*=mult;saveHigh();msg('🏆 YOU CLEARED THE STORM! Score '+score+' x'+mult);sMatch();return}if(!hasMoves()){if(chimes>0)msg('No moves! Use a Wind Chime shuffle 🔔');else{gameOver=true;saveHigh();msg('💀 GAME OVER - No moves. Score '+score)}} }function saveHigh(){if(score>high){high=score;localStorage.setItem('tempest_highscore',high)}}function updateHUD(){document.getElementById('hud').innerHTML='Score: <b>'+score+'</b> | Combo x'+combo+' | High: '+high+' | 🔔 '+chimes+' | Pressure '+pressure+'% | Cleared '+cleared+'/'+total+' | Weather '+curW.i+' '+curW.n;document.getElementById('shuf').textContent='🔔 Shuffle ('+chimes+')';document.getElementById('calm').textContent='🕊️ Calm ('+pressure+'%)'}function pick(mx,my){let best=null,bestL=-1;for(let t of tiles){if(t.removed)continue;let p=tileXY(t);let px=p.x+boardOX,py=p.y+boardOY;if(mx>=px&&mx<=px+72&&my>=py&&my<=py+48&&t.layer>bestL){best=t;bestL=t.layer}}return best}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});c.addEventListener('pointerdown',e=>{if(gameOver)return;if(locked>0){msg('⚡ Stunned by lightning!');return}let r=c.getBoundingClientRect();let mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;let t=pick(mx,my);if(!t)return;if(!isFree(t)){t.shake=1;sBad();invalid++;msg('Blocked tile!');return}if(!sel){sel=t;sThock();return}if(sel==t){sel=null;return}if(sel.type==t.type&&isFree(sel)){doMatch(sel,t)}else{sel.shake=1;t.shake=1;sBad();invalid++;shake=.2;msg('No match!');sel=t}});document.getElementById('shuf').onclick=()=>{if(chimes<=0||gameOver)return;chimes--;let rem=tiles.filter(t=>!t.removed);let types=shuffle(rem.map(t=>t.type));rem.forEach((t,i)=>t.type=types[i]);sel=null;sShuffle();msg('Shuffled!');updateHUD()};document.getElementById('calm').onclick=()=>{if(pressure<100||calmUsed>=1)return;pressure=0;calmUsed++;curW=WEATHERS[0];wLeft=99;sWeather();msg('🕊️ CALM! Weather cleared');updateBar();updateHUD()};document.getElementById('hint').onclick=()=>{let free=tiles.filter(t=>!t.removed&&isFree(t));for(let a of free)for(let b of free)if(a!=b&&a.type==b.type){a.shake=0;burst(tileXY(a).x+36,tileXY(a).y+24,'#ffb300');msg('Hint: '+a.type+' pair glows');return}msg('No hint moves')};document.getElementById('restart').onclick=gen;function fmt(ms){let m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,mm=ms%1000;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(mm).padStart(3,'0')}let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(!gameOver)elapsed=now-start;let stiff=curW.n=='Rain'?30:45,damp=8.5;let drift=curW.n=='Gale'?Math.sin(now*.003)*30:0;cur.vx+=((mouse.x+drift)-cur.x)*stiff*dt;cur.vy+=(mouse.y-cur.y)*stiff*dt;cur.vx*=Math.pow(.001,damp*dt*.1);cur.vy*=Math.pow(.001,damp*dt*.1);cur.x+=cur.vx*dt*10;cur.y+=cur.vy*dt*10;if(curW.n=='Lightning'&&Math.random()<.01)locked=.5+Math.random();if(locked>0)locked-=dt;if(curW.n=='Quake'){quakeT+=dt;shake=Math.max(shake,.15);if(quakeT>3){quakeT=0;boardOX=(Math.random()-.5)*20;boardOY=(Math.random()-.5)*10}}else{boardOX=0;boardOY=0}if(curW.n=='Rain'){rainT+=dt;if(rainT>.05){rainT=0;parts.push({x:Math.random()*W,y:-10,vx:0,vy:400,life:1,col:'#4d7cff'})}}shake=Math.max(0,shake-dt);let sx=(Math.random()-.5)*shake*20,sy=(Math.random()-.5)*shake*20;let g=x.createLinearGradient(0,0,0,H);let cols={Clear:['#1a0b2e','#3a1c71'],Gale:['#0f2027','#2c5364'],Rain:['#0f0c29','#302b63'],Lightning:['#200122','#6f0000'],Quake:['#3a1c71','#d76d77'],Fog:['#232526','#414345'],Heat:['#42275a','#ff9966']};let cc=cols[curW.n]||cols.Clear;g.addColorStop(0,cc[0]);g.addColorStop(1,cc[1]);x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(sx,sy);x.fillStyle='#ffffff22';x.font='28px sans-serif';x.fillText(curW.i+' '+curW.n,20,40);x.fillStyle='#fff';x.font='bold 16px monospace';x.textAlign='right';x.fillText('⏱ '+fmt(elapsed),W-20,30);x.textAlign='left';x.fillText('Score '+score+'  High '+high,20,65);x.fillText('🔔 '+chimes+'  Pressure '+pressure+'%  Combo x'+combo,20,85);let sorted=tiles.slice().sort((a,b)=>a.layer-b.layer);for(let t of sorted){if(t.removed)continue;let p=tileXY(t);let px=p.x+boardOX,py=p.y+boardOY+t.fall;t.fall*= .9;if(t.shake>0)t.shake-=dt*3;let shx=t.shake>0?Math.sin(now*.06)*4*t.shake:0;let free=isFree(t);let isSel=sel==t;let alpha=1;if(curW.n=='Fog'&&sel){let sp=tileXY(sel);if(Math.abs(sp.x-p.x)>150)alpha=.3}if(curW.n=='Rain')alpha*=.9;x.globalAlpha=alpha;x.fillStyle=free?'#fff8e7':'#888888';x.strokeStyle=isSel?'#c6ff00':(free?'#ff2e88':'#555');x.lineWidth=isSel?4:2;let lift=isSel?-15:0;x.beginPath();x.roundRect(px+shx,py+lift,72,48,8);x.fill();x.stroke();x.fillStyle=free?'#120826':'#444';x.font='32px sans-serif';x.textAlign='center';x.fillText(t.type,px+36+shx,py+lift+36);x.textAlign='left';if(t.diss>0){x.fillStyle='#c6ff00';x.fillRect(px,py+lift,72*t.diss,48)}x.globalAlpha=1}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.5;if(p.life<=0){parts.splice(i,1);continue}x.fillStyle=p.col;x.globalAlpha=p.life;x.fillRect(p.x,p.y,4,4);x.globalAlpha=1}x.strokeStyle='#00e5ff';x.lineWidth=3;x.beginPath();x.arc(cur.x,cur.y,14,0,7);x.stroke();x.fillStyle='#c6ff00';x.beginPath();x.arc(cur.x,cur.y,4,0,7);x.fill();if(gameOver){x.fillStyle='#000000aa';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText(tiles.every(t=>t.removed)?'🏆 STORM CLEARED!':'💀 GAME OVER',W/2,H/2);x.font='24px sans-serif';x.fillText('Score '+score+'  Time '+fmt(elapsed)+'  High '+high,W/2,H/2+40);x.fillText('Press Restart to play again',W/2,H/2+80);x.textAlign='left'}x.restore();requestAnimationFrame(loop)}gen();updateHUD();requestAnimationFrame(loop)</script></body></html>
