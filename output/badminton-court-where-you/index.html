<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badminton Court: Clears & Drops</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='70' font-size='70'>🏸</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Roboto', sans-serif; background: #0f0f2a; color: #ffffff; overflow: hidden; }
    #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; object-fit: contain; background: #1a1a3e; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .hud-element { position: absolute; color: #ffffff; font-size: 16px; text-shadow: 1px 1px 2px #000000; pointer-events: none; }
    .top-left { top: 10px; left: 10px; }
    .top-center { top: 10px; left: 50%; transform: translateX(-50); text-align: center; }
    .top-right { top: 10px; right: 10px; }
    .bottom-center { bottom: 10px; left: 50%; transform: translateX(-50); text-align: center; }
    .bottom-right { bottom: 10px; right: 10px; }
    .bottom-left { bottom: 10px; left: 10px; }
    .progress-wheel { width: 60px; height: 60px; border-radius: 50%; border: 6px solid #444; border-top-color: #4caf50; }
    .power-meter { width: 200px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
    .power-fill { height: 100%; width: 0%; background: linear-to-right; }
    .instruction-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
    button { background: #4a90e2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #357abd; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div class="hud">
      <div class="hud-element top-left" id="score">Score: 0 / Accuracy: 0%</div>
      <div class="hud-element top-center" id="drill">Drill: High Clear</div>
      <div class="hud-element top-right" id="timer">Time: 00:30</div>
      <div class="hud-element bottom-left">
        <div class="progress-wheel" id="progressWheel"></div>
      </div>
      <div class="hud-element bottom-center">
        <div class="power-meter"><div class="power-fill" id="powerFill"></div></div>
      </div>
      <div class="hud-element bottom-right" id="speedrun">Speedrun: 00:00.00</div>
    </div>
    <div class="instruction-overlay" id="instructions">
      <h2>Controls</h2>
      <p>WASD / Arrow Keys: Move</p>
      <p>Shift + Forward: Clear</p>
      <p>Space: Drop</p>
      <p>Double Space: Smash</p>
      <button onclick="toggleInstructions()">Got It</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
