<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON DASH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a12; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      overflow: hidden;
      touch-action: none;
    }
    #game-container { 
      position: relative; 
      width: 100%; 
      max-width: 480px; 
      aspect-ratio: 9/16; 
      max-height: 100vh; 
    }
    canvas { 
      display: block; 
      width: 100%; 
      height: 100%; 
      border-radius: 12px; 
      box-shadow: 
        0 0 30px rgba(0, 255, 255, 0.3),
        0 0 60px rgba(255, 0, 128, 0.2),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
      border: 2px solid #00ffff;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-box {
      background: rgba(10, 10, 18, 0.85);
      border: 1px solid #00ffff;
      border-radius: 8px;
      padding: 6px 12px;
      backdrop-filter: blur(10px);
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00ffff;
      opacity: 0.7;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 10px currentColor;
    }
    .stat-value.timer { color: #ff0080; }
    .stat-value.score { color: #00ff88; }
    .stat-value.best { color: #ffcc00; }
    .bottom-controls {
      margin-top: auto;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-bottom: 8px;
    }
    .control-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #00ffff;
      background: rgba(10, 10, 18, 0.9);
      color: #00ffff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
      transition: all 0.1s;
    }
    .control-btn:active {
      background: #00ffff;
      color: #0a0a12;
      transform: scale(0.95);
    }
    #start-screen, #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 18, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border-radius: 12px;
      z-index: 10;
      backdrop-filter: blur(20px);
    }
    #game-over-screen { display: none; }
    .title {
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #00ffff, #ff0080, #00ff88, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      animation: gradientShift 3s ease infinite;
      background-size: 300% 300%;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .subtitle { color: #888; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
    .btn {
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00ffff, #0088ff);
      color: #0a0a12;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
    }
    .btn-primary:active { transform: scale(0.96); box-shadow: 0 0 30px rgba(0, 255, 255, 0.8); }
    .btn-secondary {
      background: transparent;
      color: #00ffff;
      border: 2px solid #00ffff;
    }
    .btn-secondary:active { background: #00ffff; color: #0a0a12; }
    .final-stats { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .final-stat { text-align: center; }
    .final-stat .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .final-stat .value { font-size: 28px; font-weight: 700; font-family: monospace; }
    .instructions { color: #666; font-size: 12px; text-align: center; max-width: 280px; line-height: 1.6; }
    .instructions kbd {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #00ffff;
      padding: 2px 8px;
      border-radius: 4px;
      color: #00ffff;
      font-family: monospace;
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #game-container { max-width: 90vh; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui-overlay">
      <div class="top-bar">
        <div class="stat-box">
          <div class="stat-label">Time</div>
          <div class="stat-value timer" id="timer">0.00s</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div class="stat-value score" id="score">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Best</div>
          <div class="stat-value best" id="best">0</div>
        </div>
      </div>
      <div class="bottom-controls">
        <button class="control-btn" id="btn-left" aria-label="Move Left">◀</button>
        <button class="control-btn" id="btn-right" aria-label="Move Right">▶</button>
      </div>
    </div>
    <div id="start-screen">
      <div class="title">NEON DASH</div>
      <div class="subtitle">SURVIVE THE VOID</div>
      <p class="instructions">Tap <kbd>◀</kbd> <kbd>▶</kbd> or press <kbd>←</kbd> <kbd>→</kbd> to dodge. Collect <span style="color:#00ff88">◆</span> orbs. Speed increases!</p>
      <button class="btn btn-primary" id="start-btn">START RUN</button>
    </div>
    <div id="game-over-screen">
      <div class="title" style="color: #ff0080;">RUN ENDED</div>
      <div class="final-stats">
        <div class="final-stat"><div class="label">Survival Time</div><div class="value timer" id="final-time">0.00s</div></div>
        <div class="final-stat"><div class="label">Orbs Collected</div><div class="value score" id="final-score">0</div></div>
        <div class="final-stat"><div class="label">High Score</div><div class="value best" id="final-best">0</div></div>
      </div>
      <button class="btn btn-primary" id="restart-btn">RUN AGAIN</button>
      <button class="btn btn-secondary" id="menu-btn">MAIN MENU</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
