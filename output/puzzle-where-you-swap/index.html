<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Orbit - Speedrun</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em" font-size=%2290%22>🚀</text></svg>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a12;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 800px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #0a0a12 100%);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stats-top {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: all;
            z-index: 10;
        }
        h1 { font-size: 48px; margin-bottom: 10px; color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
        p { font-size: 18px; margin-bottom: 20px; }
        button {
            padding: 15px 40px;
            font-size: 24px;
            background: transparent;
            color: #00ffcc;
            border: 3px solid #00ffcc;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        button:hover {
            background: #00ffcc;
            color: #0a0a12;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="stats-top">
                <div id="timer">Time: 0.00s</div>
                <div id="highScore">Best: 0</div>
            </div>
        </div>
        <div id="overlay">
            <h1>NEON ORBIT</h1>
            <p>Avoid the red pulses. Survive as long as possible!</p>
            <button id="startBtn">Start Mission</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
