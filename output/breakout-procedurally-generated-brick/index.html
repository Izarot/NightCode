<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e21">
  <meta name="description" content="A deterministic, neon-lit Breakout adventure. One seed. Infinite formations.">
  <title>Procedural Breakout · Neon Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧱%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Procedural Breakout home"><span class="brand-icon">◈</span> NEON <b>ATLAS</b><span class="edition"> / BREAKOUT</span></a>
      <div class="top-actions"><div class="timer"><span>SPEEDRUN</span><strong id="timer">00:00.00</strong></div><button id="pause" class="icon-button" aria-label="Pause game" disabled>Ⅱ</button></div>
    </header>
    <section class="arena" aria-label="Breakout playfield">
      <canvas id="game" width="960" height="720" tabindex="0" aria-label="Breakout. Move with arrow keys, A and D, mouse, or touch. Space launches. P pauses."></canvas>
      <div class="hud" id="hud" hidden>
        <div><span class="hud-label">SCORE <small id="best">BEST 0</small></span><strong id="score">0</strong></div>
        <div class="level-hud"><span class="hud-label" id="level">LEVEL 01</span><div class="progress"><i id="progress"></i></div><small id="remaining">0 targets</small></div>
        <div class="lives-hud"><span class="hud-label">LIVES</span><strong id="lives" aria-label="3 lives">● ● ●</strong></div>
      </div>
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
    <div class="underbar"><div id="effects" class="effects"><span class="pill">SEED-DRIVEN / SKILL-POWERED</span></div><span id="combo" class="combo"></span></div>
    <footer><span><kbd>←</kbd><kbd>→</kbd> MOVE <span class="desktop-hint">· <kbd>SPACE</kbd> LAUNCH · <kbd>P</kbd> PAUSE</span></span><span>DRAG TO AIM <b>·</b> TAP TO LAUNCH</span></footer>
    <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
