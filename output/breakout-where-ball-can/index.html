<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Breakout</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #eee; overflow: hidden; }
        canvas { display: block; max-width: 100vw; max-height: 100vh; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
        .hud { background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        #timer { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        #pauseMenu, #gameOver, #levelComplete { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; text-align: center; display: none; z-index: 20; }
        button { background: #444; color: #eee; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; font-family: inherit; }
        button:hover { background: #666; }
        @media (max-width: 600px) { .hud { font-size: 12px; padding: 3px 6px; } }
    </style>
</head>
<body>
    <div id="ui">
        <div class="hud">Score: <span id="score">0</span></div>
        <div class="hud">Lives: <span id="lives">♥♥♥</span></div>
        <div class="hud">Balls: <span id="balls">1</span></div>
    </div>
    <div id="timer">0:00</span></div>
    <canvas id="gameCanvas"></canvas>
    <div id="pauseMenu">
        <h2>PAUSED</h2>
        <button id="resumeBtn">Resume</button>
        <button id="restartBtn">Restart</button>
    </div>
    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="playAgainBtn">Play Again</button>
    </div>
    <div id="levelComplete">
        <h2>LEVEL COMPLETE!</h2>
        <p>Score: <span id="levelScore">0</span></p>
        <button id="nextLevelBtn">Next Level</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const ballsEl = document.getElementById('balls');
        const timeEl = document.getElementById('time');
        const pauseMenu = document.getElementById('pauseMenu');
        const gameOver = document.getElementById('gameOver');
        const levelComplete = document.getElementById('levelComplete');
        const finalScoreEl = document.getElementById('finalScore');
        const levelScoreEl = document.getElementById('levelScore');
        
        let width, height, scale;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * devicePixelRatio;
            canvas.height = height * devicePixelRatio;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(devicePixelRatio, devicePixelRatio);
            scale = Math.min(width, height) / 800;
        }
        window.addEventListener('resize', resize);
        resize();
        
        const COLORS = ['#ff4444', '#ff8800', '#ffdd00', '#44ff44', '#44ddff', '#8844ff', '#ff44ff'];
        
        let paddle = { x: 0, y: 0, w: 120, h: 16, speed: 600, color: '#fff' };
        let balls = [];
        let bricks = [];
        let particles = [];
        let powerUps = [];
        
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameState = 'playing';
        let startTime = Date.now();
        let pausedTime = 0;
        let pauseStart = 0;
        
        const BRICK_ROWS = 6;
        const BRICK_COLS = 10;
        const BRICK_W = 70;
        const BRICK_H = 24;
        const BRICK_PADDING = 4;
        const BRICK_OFFSET_TOP = 60;
        const BRICK_OFFSET_LEFT = 30;
        
        function initLevel() {
            bricks = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    if (Math.random() > 0.15) {
                        const hits = level > 2 && Math.random() < 0.2 ? 2 : 1;
                        bricks.push({
                            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PADDING),
                            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PADDING),
                            w: BRICK_W,
                            h: BRICK_H,
                            color: COLORS[r % COLORS.length],
                            hits: hits,
                            maxHits: hits,
                            special: Math.random() < 0.08
                        });
                    }
                }
            }
            resetBall();
        }
        
        function resetBall() {
            balls = [{
                x: width / 2,
                y: paddle.y - 10,
                r: 8,
                dx: (Math.random() - 0.5) * 400,
                dy: -350,
                speed: 400,
                trail: []
            }];
            paddle.x = width / 2 - paddle.w / 2;
        }
        
        function spawnBall(x, y, angle) {
            const speed = 400;
            balls.push({
                x: x,
                y: y,
                r: 8,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                speed: speed,
                trail: []
            });
            updateBallsCount();
        }
        
        function updateBallsCount() {
            ballsEl.textContent = balls.length;
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 50;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    size: Math.random() * 4 + 2,
                    color: color
                });
            }
        }
        
        function spawnPowerUp(x, y) {
            const types = ['multi', 'life', 'slow', 'wide', 'laser'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerUps.push({
                x: x,
                y: y,
                w: 24,
                h: 24,
                dy: 80,
                type: type,
                color: type === 'multi' ? '#ff44ff' : type === 'life' ? '#ff4444' : type === 'slow' ? '#44ddff' : type === 'wide' ? '#44ff44' : '#ffdd00'
            });
        }
        
        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Escape') togglePause();
            if (e.code === 'Space' && gameState === 'playing') {}
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        
        canvas.addEventListener('mousemove', e => {
            paddle.x = e.clientX - paddle.w / 2;
            clampPaddle();
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            paddle.x = e.touches[0].clientX - paddle.w / 2;
            clampPaddle();
        }, { passive: false });
        
        function clampPaddle() {
            paddle.x = Math.max(0, Math.min(width - paddle.w, paddle.x));
        }
        
        document.getElementById('resumeBtn').onclick = togglePause;
        document.getElementById('restartBtn').onclick = () => { hideMenus(); resetGame(); };
        document.getElementById('playAgainBtn').onclick = () => { hideMenus(); resetGame(); };
        document.getElementById('nextLevelBtn').onclick = () => { hideMenus(); nextLevel(); };
        
        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                pauseStart = Date.now();
                pauseMenu.style.display = 'block';
            } else if (gameState === 'paused') {
                pausedTime += Date.now() - pauseStart;
                gameState = 'playing';
                pauseMenu.style.display = 'none';
            }
        }
        
        function hideMenus() {
            pauseMenu.style.display = 'none';
            gameOver.style.display = 'none';
            levelComplete.style.display = 'none';
        }
        
        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            startTime = Date.now();
            pausedTime = 0;
            scoreEl.textContent = score;
            livesEl.textContent = '♥♥♥';
            initLevel();
            gameState = 'playing';
        }
        
        function nextLevel() {
            level++;
            startTime = Date.now();
            pausedTime = 0;
            initLevel();
            gameState = 'playing';
        }
        
        function loseLife() {
            lives--;
            livesEl.textContent = '♥'.repeat(lives);
            if (lives <= 0) {
                gameState = 'gameover';
                finalScoreEl.textContent = score;
                gameOver.style.display = 'block';
            } else {
                resetBall();
            }
        }
        
        function checkLevelComplete() {
            if (bricks.every(b => b.hits <= 0)) {
                gameState = 'levelcomplete';
                levelScoreEl.textContent = score;
                levelComplete.style.display = 'block';
            }
        }
        
        function update(dt) {
            if (gameState !== 'playing') return;
            
            if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed * dt;
            if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed * dt;
            clampPaddle();
            
            for (let ball of balls) {
                ball.trail.unshift({ x: ball.x, y: ball.y });
                if (ball.trail.length > 8) ball.trail.pop();
                
                ball.x += ball.dx * dt;
                ball.y += ball.dy * dt;
                
                if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx *= -1; }
                if (ball.x + ball.r > width) { ball.x = width - ball.r; ball.dx *= -1; }
                if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy *= -1; }
                
                if (ball.y + ball.r > height) {
                    const idx = balls.indexOf(ball);
                    balls.splice(idx, 1);
                    updateBallsCount();
                    if (balls.length === 0) loseLife();
                    continue;
                }
                
                if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
                    ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                    ball.y = paddle.y - ball.r;
                    const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
                    ball.dx = hitPos * ball.speed * 1.5;
                    ball.dy = -Math.sqrt(ball.speed * ball.speed - ball.dx * ball.dx);
                }
                
                for (let brick of bricks) {
                    if (brick.hits <= 0) continue;
                    if (ball.x + ball.r > brick.x && ball.x - ball.r < brick.x + brick.w &&
                        ball.y + ball.r > brick.y && ball.y - ball.r < brick.y + brick.h) {
                        
                        const overlapX = Math.min(ball.x + ball.r, brick.x + brick.w) - Math.max(ball.x - ball.r, brick.x);
                        const overlapY = Math.min(ball.y + ball.r, brick.y + brick.h) - Math.max(ball.y - ball.r, brick.y);
                        
                        if (overlapX < overlapY) ball.dx *= -1;
                        else ball.dy *= -1;
                        
                        brick.hits--;
                        score += 10 * (brick.maxHits - brick.hits + 1);
                        scoreEl.textContent = score;
                        createParticles(ball.x, ball.y, brick.color, 8);
                        
                        if (brick.hits <= 0 && brick.special && Math.random() < 0.5) {
                            spawnPowerUp(brick.x + brick.w / 2, brick.y + brick.h / 2);
                        }
                        break;
                    }
                }
            }
            
            for (let p of powerUps) {
                p.y += p.dy * dt;
                if (p.y > height) { p.y = height + 100; continue; }
                if (p.x + p.w > paddle.x && p.x < paddle.x + paddle.w &&
                    p.y + p.h > paddle.y && p.y < paddle.y + paddle.h) {
                    applyPowerUp(p.type);
                    p.y = height + 100;
                }
            }
            powerUps = powerUps.filter(p => p.y < height);
            
            for (let p of particles) {
                p.x += p.dx * dt;
                p.y += p.dy * dt;
                p.dy += 200 * dt;
                p.life -= p.decay;
            }
            particles = particles.filter(p => p.life > 0);
            
            checkLevelComplete();
        }
        
        function applyPowerUp(type) {
            switch (type) {
                case 'multi':
                    const currentBalls = [...balls];
                    for (let ball of currentBalls) {
                        spawnBall(ball.x, ball.y, Math.atan2(ball.dy, ball.dx) + 0.5);
                        spawnBall(ball.x, ball.y, Math.atan2(ball.dy, ball.dx) - 0.5);
                    }
                    break;
                case 'life':
                    if (lives < 5) { lives++; livesEl.textContent = '♥'.repeat(lives); }
                    break;
                case 'slow':
                    for (let ball of balls) {
                        ball.speed *= 0.7;
                        const mag = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                        ball.dx = ball.dx / mag * ball.speed;
                        ball.dy = ball.dy / mag * ball.speed;
                    }
                    break;
                case 'wide':
                    paddle.w = Math.min(200, paddle.w + 30);
                    break;
                case 'laser':
                    break;
            }
        }
        
        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#222';
            for (let i = 0; i < width; i += 40) {
                ctx.fillRect(i, 0, 1, height);
            }
            for (let i = 0; i < height; i += 40) {
                ctx.fillRect(0, i, width, 1);
            }
            
            for (let brick of bricks) {
                if (brick.hits <= 0) continue;
                const alpha = brick.hits / brick.maxHits;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(brick.x, brick.y, brick.w, brick.h);
                if (brick.special) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', brick.x + brick.w / 2, brick.y + brick.h / 2 + 5);
                }
                ctx.globalAlpha = 1;
            }
            
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);
            
            for (let ball of balls) {
                for (let i = 0; i < ball.trail.length; i++) {
                    const t = ball.trail[i];
                    ctx.globalAlpha = (i + 1) / ball.trail.length * 0.3;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, ball.r * (i + 1) / ball.trail.length, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            for (let p of powerUps) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#000';
                ctx.font = '12px Courier New';
                ctx.textAlign = 'center';
                const label = p.type[0].toUpperCase();
                ctx.fillText(label, p.x + p.w / 2, p.y + p.h / 2 + 4);
            }
            
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            const elapsed = (Date.now() - startTime - pausedTime) / 1000;
            const mins = Math.floor(elapsed / 60);
            const secs = Math.floor(elapsed % 60);
            timeEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        let lastTime = 0;
        function loop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }
        
        initLevel();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
