<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake-Cylinder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div id="timer">00:00.0</div>
            <div id="score">Score: 0</div>
            <div id="highscore">Best: 0</div>
        </div>
        <div id="overlay-menu" class="overlay active">
            <h1>SNAKE-CYLINDER</h1>
            <button id="btn-start">START</button>
            <button id="btn-settings">SETTINGS</button>
        </div>
        <div id="overlay-pause" class="overlay">
            <h1>PAUSED</h1>
            <button id="btn-resume">RESUME</button>
            <button id="btn-menu-pause">MENU</button>
        </div>
        <div id="overlay-gameover" class="overlay">
            <h1>GAME OVER</h1>
            <div id="final-score">Score: 0</div>
            <div id="highscore-badge" style="display:none; color: #ffeb3b;">NEW HIGH SCORE!</div>
            <button id="btn-restart">RESTART</button>
            <button id="btn-menu-gameover">MENU</button>
        </div>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
