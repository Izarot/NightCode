<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tail-Runner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.7em' font-size='90' fill='%23ff6b6b'%3E🐍%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg, #0a0a2a 0%, #1a0a3a 50%, #0a0a2a 100%); font-family: 'Press Start 2P', monospace; }
        #gameCanvas { display: block; background: #111; width: 100%; height: 100%; max-width: 1280px; max-height: 720px; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: #fff; flex-direction: column; gap: 20px; }
        .btn { padding: 15px 30px; font-size: 18px; background: #ff6b6b; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Press Start 2P', monospace; }
        .btn:hover { background: #ff8686; }
        .hidden { display: none; }
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none; }
        #score { font-size: 24px; color: #fff; text-shadow: 2px 2px 0 #ff6b6b; }
        #timer { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 10px; font-family: 'Press Start 2P', monospace; color: #fff; }
        #health { position: absolute; top: 10px; right: 150px; display: flex; gap: 5px; }
        .heart { width: 20px; height: 20px; fill: #ff6b6b; }
        #powerup-bar-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; }
        #powerup-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4ecdc4, #ff6b6b); }
        #pause-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 10px; border-radius: 8px; }
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">Score: 0</div>
        <div id="timer">00:00</div>
        <div id="health">
            <svg class="heart" viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>
            <svg class="heart" viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>
            <svg class="heart" viewBox='0 0 24 24'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>
        </div>
    </div>
    <button id="pause-btn">||</button>
    <div id="powerup-bar-container"><div id="powerup-bar"></div></div>
    <div id="game-over" class="overlay hidden">
        <h1>Game Over</h1>
        <p id="final-score">Score: 0</p>
        <p id="high-score-display">High Score: 0</p>
        <button class="btn" id="restart-btn">Play Again</button>
    </div>
    <div id="pause-overlay" class="overlay hidden">
        <h1>Paused</h1>
        <button class="btn" id="resume-btn">Resume</button>
        <button class="btn" id="menu-btn">Main Menu</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
