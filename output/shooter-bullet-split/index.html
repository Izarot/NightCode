<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Bullet Split Shooter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.7em' font-size='90' text-anchor='middle'%3E🔥%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a001a; color: #00ffff; font-family: 'Arial', sans-serif; overflow: hidden; }
        #gameCanvas { display: block; background: linear-gradient(135deg, #1a0033 0%, #0a001a 100%); }
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none; }
        #healthBar { width: 200px; height: 20px; background: #333; border: 2px solid #00ffff; border-radius: 10px; overflow: hidden; }
        #healthFill { height: 100%; width: 100%; background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000); transition: width 0.1s; }
        #score { position: absolute; top: 10px; right: 10px; font-size: 24px; color: #ff0066; font-weight: bold; }
        #timer { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; color: #00ffff; font-size: 18px; }
        #combo { position: absolute; bottom: 10px; right: 10px; background: rgba(255,0,102,0.8); padding: 5px 15px; border-radius: 20px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
        <div id="timer">Time: 00:00</div>
        <div id="healthBar"><div id="healthFill"></div></div>
        <div id="score">Score: 0</div>
        <div id="combo">COMBO: x1</div>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
