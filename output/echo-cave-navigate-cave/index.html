<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Echo Cave</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧈</text></svg>">
    <style>
        :root {
            --bg: #050508;
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
            --ui-text: #00f2ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ui-text);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        .hud {
            position: absolute;
            pointer-events: none;
            color: var(--ui-text);
            text-shadow: 0 0 5px var(--ui-text);
        }
        #timer { top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; letter-spacing: 2px; }
        #high-score { top: 20px; right: 20px; font-size: 18px; text-align: right; }
        #velocity-bar-container {
            top: 0; left: 0; width: 100%; height: 6px;
            background: rgba(0, 242, 255, 0.1);
            position: absolute;
        }
        #velocity-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            transition: width 0.1s;
        }
        #focus-slider-container {
            left: 20px; top: 50%; transform: translateY(-50%);
            width: 6px; height: 200px; background: rgba(0, 242, 255, 0.2);
            position: absolute;
            border-radius: 3px;
        }
        #focus-slider-thumb {
            position: absolute; left: -6px; width: 18px; height: 18px;
            background: var(--neon-cyan); border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan); cursor: pointer;
            top: 50%; transform: translateY(-50%);
        }
        #start-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; color: var(--neon-cyan);
        }
        button {
            background: transparent; border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 15px 30px; font-family: inherit;
            font-size: 20px; cursor: pointer; margin-top: 20px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { background: var(--neon-cyan); color: #000; }
        .controls-hint { margin-top: 10px; font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud" id="timer">00:00.0</div>
    <div class="hud" id="high-score">BEST: --:--.--</div>
    <div id="velocity-bar-container"><div id="velocity-bar"></div></div>
    <div id="focus-slider-container"><div id="focus-slider-thumb"></div></div>
    <div id="start-overlay">
        <h1>ECHO CAVE</h1>
        <p class="controls-hint">MOVE: WASD / Arrows | PING: SPACE</p>
        <button id="start-btn">INITIATE ECHO</button>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const highScoreEl = document.getElementById('high-score');
const velBar = document.getElementById('velocity-bar');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');

// Config
const PLAYER_R = 10;
const WALL_COUNT = 12;
const ECHO_SPEED = 300;
const ECHO_LIFE = 1.5;
const FRICTION = 0.96;
const ACCEL = 0.8;
const MAX_SPEED = 6;

// State
let width, height;
let player = { x: 0, y: 0, vx: 0, vy: 0, angle: 0 };
let walls = [];
let echoes = [];
let particles = [];
let keys = {};
let isPlaying = false;
let startTime = 0;
let lastPingTime = 0;
let focus = 0.5; // 0 to 1
let highScore = localStorage.getItem('echoCaveHighScore') || null;

// Audio
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playPing(type = 'stone') {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'stone') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'player') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    }
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    if (!isPlaying) {
        player.x = width / 2;
        player.y = height / 2;
    }
    generateWalls();
}

function generateWalls() {
    walls = [];
    // Border
    walls.push({x1: 0, y1: 0, x2: width, y2: 0, type: 'stone'});
    walls.push({x1: width, y1: 0, x2: width, y2: height, type: 'stone'});
    walls.push({x1: width, y1: height, x2: 0, y2: height, type: 'stone'});
    walls.push({x1: 0, y1: height, x2: 0, y2: 0, type: 'stone'});
    // Random internal
    for (let i = 0; i < WALL_COUNT; i++) {
        const x1 = Math.random() * (width - 200) + 100;
        const y1 = Math.random() * (height - 200) + 100;
        const len = Math.random() * 150 + 50;
        const ang = Math.random() * Math.PI * 2;
        walls.push({
            x1, y1,
            x2: x1 + Math.cos(ang) * len,
            y2: y1 + Math.sin(ang) * len,
            type: Math.random() > 0.8 ? 'metal' : 'stone'
        });
    }
}

function lineCircleCollision(wx1, wy1, wx2, wy2, cx, cy, r) {
    const dx = wx2 - wx1;
    const dy = wy2 - wy1;
    const t = ((cx - wx1) * dx + (cy - wy1) * dy) / (dx * dx + dy * dy);
    const clamped = Math.max(0, Math.min(1, t));
    const nearestX = wx1 + clamped * dx;
    const nearestY = wy1 + clamped * dy;
    const dist = Math.hypot(cx - nearestX, cy - nearestY);
    return dist < r;
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1,
            color
        });
    }
}

function update(dt) {
    if (!isPlaying) return;

    // Input
    if (keys['ArrowUp'] || keys['w']) { player.vy -= ACCEL; }
    if (keys['ArrowDown'] || keys['s']) { player.vy += ACCEL; }
    if (keys['ArrowLeft'] || keys['a']) { player.vx -= ACCEL; }
    if (keys['ArrowRight'] || keys['d']) { player.vx += ACCEL; }

    // Physics
    player.x += player.vx;
    player.y += player.vy;
    player.vx *= FRICTION;
    player.vy *= FRICTION;

    // Clamp speed
    const speed = Math.hypot(player.vx, player.vy);
    if (speed > MAX_SPEED) {
        const ratio = MAX_SPEED / speed;
        player.vx *= ratio;
        player.vy *= ratio;
    }

    // Wall collision (simple slide)
    for (let w of walls) {
        if (lineCircleCollision(w.x1, w.y1, w.x2, w.y2, player.x, player.y, PLAYER_R)) {
            // Push out roughly
            const nx = w.y2 - w.y1;
            const ny = -(w.x2 - w.x1);
            const mag = Math.hypot(nx, ny);
            const dx = nx / mag;
            const dy = ny / mag;
            player.x += dx * 2;
            player.y += dy * 2;
            player.vx *= 0.2;
            player.vy *= 0.2;
        }
    }

    // Boundaries
    player.x = Math.max(PLAYER_R, Math.min(width - PLAYER_R, player.x));
    player.y = Math.max(PLAYER_R, Math.min(height - PLAYER_R, player.y));

    // Auto ping on move
    const now = Date.now();
    if (speed > 0.5 && now - lastPingTime > 400) {
        emitEcho();
        lastPingTime = now;
    }

    // Update echoes
    for (let i = echoes.length - 1; i >= 0; i--) {
        const e = echoes[i];
        e.radius += ECHO_SPEED * dt;
        e.life -= dt;
        if (e.life <= 0) echoes.splice(i, 1);
        else {
            // Check wall hits for visual spark
            for (let w of walls) {
                // Simplified: check distance from wall segment to circle edge
                // Just check if circle intersects line
                const dx = w.x2 - w.x1;
                const dy = w.y2 - w.y1;
                const t = ((e.x - w.x1) * dx + (e.y - w.y1) * dy) / (dx * dx + dy * dy);
                const clamped = Math.max(0, Math.min(1, t));
                const nx = w.x1 + clamped * dx;
                const ny = w.y1 + clamped * dy;
                const dist = Math.hypot(e.x - nx, e.y - ny);
                if (Math.abs(dist - e.radius) < 5) {
                    spawnParticles(nx, ny, w.type === 'metal' ? '#ffaa00' : '#00f2ff');
                }
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // UI
    const pct = (speed / MAX_SPEED) * 100;
    velBar.style.width = pct + '%';
}

function emitEcho() {
    echoes.push({ x: player.x, y: player.y, radius: 0, life: ECHO_LIFE });
    playPing('player');
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);

    // Draw walls (faint)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let w of walls) {
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
    }
    ctx.stroke();

    // Draw echoes
    for (let e of echoes) {
        const alpha = e.life / ECHO_LIFE;
        ctx.strokeStyle = `rgba(255, 255, 0, ${alpha * 0.6})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Draw particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Draw player
    ctx.fillStyle = '#ff00ff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Direction indicator
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(player.angle) * 15, player.y + Math.sin(player.angle) * 15);
    ctx.stroke();
}

function loop() {
    const dt = 1/60;
    update(dt);
    draw();
    if (isPlaying) {
        const elapsed = Date.now() - startTime;
        const m = Math.floor(elapsed / 60000);
        const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
        const ms = Math.floor((elapsed % 1000) / 10).toString().padStart(2, '0');
        timerEl.textContent = `${m}:${s}.${ms}`;
    }
    requestAnimationFrame(loop);
}

function startGame() {
    initAudio();
    isPlaying = true;
    startTime = Date.now();
    startOverlay.style.display = 'none';
    playPing('player');
}

startBtn.addEventListener('click', startGame);

window.addEventListener('keydown', e => { keys[e.key] = true; if (e.code === 'Space') { e.preventDefault(); emitEcho(); } });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch controls (simple directional zones)
let touchStartX, touchStartY;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    if (!isPlaying) startGame();
    emitEcho();
}, {passive: false});
window.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touchStartX) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    player.vx = dx * 0.2;
    player.vy = dy * 0.2;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, {passive: false});
window.addEventListener('touchend', () => { touchStartX = null; });

// Focus slider UI (visual only for now, affects nothing major but looks cool)
const thumb = document.getElementById('focus-slider-thumb');
thumb.addEventListener('mousedown', () => {
    const move = e => {
        const rect = document.getElementById('focus-slider-container').getBoundingClientRect();
        focus = (e.clientY - rect.top) / rect.height;
        focus = Math.max(0, Math.min(1, focus));
        thumb.style.top = (focus * 100) + '%';
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', () => window.removeEventListener('mousemove', move), {once: true});
});

resize();
window.addEventListener('resize', resize);
loop();
</script>
</body>
</html>
