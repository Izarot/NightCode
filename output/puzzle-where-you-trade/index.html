<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChromaShift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #121212; color: #eee; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; touch-action: none; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 85vh; background: linear-gradient(180deg, #212121, #424242); border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,0.6); cursor: crosshair; }
  #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 10; }
  .panel { pointer-events: auto; background: rgba(20,20,20,0.75); padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); font-weight: 700; font-size: 13px; backdrop-filter: blur(4px); }
  .panel b { display: block; font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  #timer { position: absolute; top:12px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  #score { position: absolute; top: 12px; right: 12px; font-size: 20px; font-weight: 800; }
  .controls { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; pointer-events: none; color: #888; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hud">
    <div class="panel" id="score"><b>Score</b>0</div>
    <div class="panel" id="timer"><b>Time</b>0.0</div>
  </div>
  <div class="controls">Tap / Click to shift color</div>
</div>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  let width, height;
  function resize(){ width = canvas.parentElement.clientWidth; height = canvas.parentElement.clientHeight; canvas.width = width; canvas.height = height; }
  window.addEventListener('resize', resize);
  resize();

  let score = 0;
  let startTime = performance.now();
  let target = { x: 0, y: 0, r: 30, color: '#ff0055', caught: false };
  let playerColor = '#ff0055';
  const colors = ['#ff0055', '#00ff99', '#0099ff', '#ffcc00', '#ff00ff', '#00ffff'];

  function randomTarget(){
    const r = 20 + Math.random() * 40;
    target.x = r + Math.random() * (width - r * 2);
    target.y = r + Math.random() * (height - r * 2);
    target.r = r;
    target.color = colors[Math.floor(Math.random() * colors.length)];
    target.caught = false;
  }
  randomTarget();

  function shiftColor(){
    playerColor = colors[Math.floor(Math.random() * colors.length)];
  }

  function checkCatch(){
    const dx = target.x - width/2;
    const dy = target.y - height/2;
    const dist = Math.hypot(dx, dy);
    if (dist < target.r + 20 && playerColor === target.color) {
      score += 10;
      target.caught = true;
      randomTarget();
    }
  }

  function draw(){
    ctx.fillStyle = '#121212';
    ctx.fillRect(0,0,width,height);

    ctx.strokeStyle = playerColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(width/2, height/2, 20, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(width/2, height/2 - 30); ctx.lineTo(width/2, height/2 - 10);
    ctx.moveTo(width/2, height/2 + 10); ctx.lineTo(width/2, height/2 + 30);
    ctx.moveTo(width/2 - 30, height/2); ctx.lineTo(width/2 - 10, height/2);
    ctx.moveTo(width/2 + 10, height/2); ctx.lineTo(width/2 + 30, height/2);
    ctx.stroke();

    ctx.fillStyle = target.color;
    ctx.globalAlpha = target.caught ? 0.3 : 1;
    ctx.beginPath();
    ctx.arc(target.x, target.y, target.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    scoreEl.innerHTML = '<b>Score</b>' + score;
    const now = (performance.now() - startTime) / 1000;
    timerEl.innerHTML = '<b>Time</b>' + now.toFixed(1);

    requestAnimationFrame(draw);
  }
  draw();

  canvas.addEventListener('mousedown', () => { shiftColor(); checkCatch(); });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shiftColor(); checkCatch(); }, {passive:false});
</script>
</body>
</html>
