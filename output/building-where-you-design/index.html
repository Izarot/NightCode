<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CityBuilder 2D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Roboto', sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
    #game-container { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .panel { background: rgba(20, 20, 40, 0.85); border: 2px solid #00d9ff; border-radius: 8px; padding: 10px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3); }
    #top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    #title-box { font-family: 'Roboto Slab', serif; font-size: 18px; color: #ff6bff; text-shadow: 0 0 10px #ff6bff; }
    #day-counter { font-size: 14px; color: #00d9ff; margin-top: 4px; }
    #timer-box { background: rgba(255, 107, 255, 0.2); border: 2px solid #ff6bff; padding: 6px 12px; border-radius: 6px; font-family: 'Roboto Slab', serif; font-size: 16px; color: #ff6bff; }
    #resource-bar { display: flex; gap: 10px; flex-wrap: wrap; }
    .resource { display: flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; font-size: 13px; border: 1px solid transparent; transition: border 0.3s; }
    .resource.deficit { border-color: #ff4444; animation: pulse-red 1s infinite; }
    @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 5px #ff4444; } 50% { box-shadow: 0 0 15px #ff4444; } }
    #minimap { width: 160px; height: 160px; background: #0a0a1e; border: 2px solid #00d9ff; border-radius: 6px; }
    #bottom-bar { position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    #zone-selector { display: flex; gap: 6px; flex-wrap: wrap; }
    .zone-btn { width: 50px; height: 50px; border-radius: 8px; border: 2px solid #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: transform 0.15s ease-out, box-shadow 0.2s; background: rgba(0,0,0,0.5); }
    .zone-btn:hover, .zone-btn:active { transform: scale(1.05); box-shadow: 0 0 12px currentColor; }
    .zone-btn.active { box-shadow: 0 0 15px currentColor; transform: scale(1.08); }
    #build-queue { display: flex; gap: 4px; flex-wrap: wrap; max-width: 300px; }
    .queue-item { background: rgba(0, 217, 255, 0.2); border: 1px solid #00d9ff; padding: 4px 8px; border-radius: 4px; font-size: 12px; min-width: 50px; text-align: center; }
    .queue-progress { height: 3px; background: #00d9ff; border-radius: 2px; margin-top: 3px; transition: width 0.2s; }
    #action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn { padding: 10px 14px; min-width: 44px; min-height: 44px; background: linear-gradient(135deg, #ff6bff, #00d9ff); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; transition: transform 0.15s ease-out; }
    .action-btn:hover { transform: scale(1.05); }
    #toast-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    .toast { background: rgba(0, 217, 255, 0.9); padding: 8px 16px; border-radius: 20px; font-size: 14px; animation: slide-up 0.4s ease-out, fade-out 0.5s ease-in 2.5s forwards; }
    @keyframes slide-up { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fade-out { to { opacity: 0; transform: translateY(-20px); } }
    #side-panel { position: absolute; right: -320px; top: 50%; transform: translateY(-50%); width: 300px; max-height: 70vh; transition: right 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); overflow-y: auto; }
    #side-panel.open { right: 10px; }
    .panel-title { font-family: 'Roboto Slab', serif; color: #ff6bff; margin-bottom: 8px; font-size: 16px; }
    .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    button { font-family: 'Roboto', sans-serif; }
    @media (max-width: 768px) {
      #title-box { font-size: 14px; }
      #minimap { width: 100px; height: 100px; }
      .zone-btn { width: 44px; height: 44px; font-size: 18px; }
      #side-panel { width: 90%; right: -100%; }
      #side-panel.open { right: 5%; }
      .resource { font-size: 11px; padding: 3px 6px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="top-bar">
        <div class="panel">
          <div id="title-box">🏙️ CityBuilder 2D</div>
          <div id="day-counter">Day: <span id="day-num">1</span></div>
          <div style="font-size:12px;color:#7CFC00;margin-top:4px;">High Score: <span id="high-score">0</span></div>
        </div>
        <div class="panel" id="timer-box">⏱️ <span id="speedrun-timer">00:00</span></div>
        <canvas id="minimap"></canvas>
        <div id="resource-bar">
          <div class="resource" id="res-energy">⚡ <span>100</span></div>
          <div class="resource" id="res-water">💧 <span>100</span></div>
          <div class="resource" id="res-waste">🗑️ <span>0</span></div>
          <div class="resource" id="res-money">💰 <span>500</span></div>
          <div class="resource" id="res-pop">👥 <span>0</span></div>
        </div>
      </div>
      <div id="bottom-bar">
        <div id="zone-selector">
          <div class="zone-btn active" data-zone="road" style="color:#aaa;" title="Road">🛣️</div>
          <div class="zone-btn" data-zone="R" style="color:#5B9BD5;" title="Residential">🏠</div>
          <div class="zone-btn" data-zone="C" style="color:#FFD700;" title="Commercial">🏪</div>
          <div class="zone-btn" data-zone="I" style="color:#9e9e9e;" title="Industrial">🏭</div>
          <div class="zone-btn" data-zone="P" style="color:#7CFC00;" title="Park">🌳</div>
          <div class="zone-btn" data-zone="power" style="color:#ffeb3b;" title="Power Plant">⚡</div>
          <div class="zone-btn" data-zone="water" style="color:#00bcd4;" title="Water Plant">💧</div>
          <div class="zone-btn" data-zone="school" style="color:#FF6B6B;" title="School">🏫</div>
        </div>
        <div id="build-queue"></div>
        <div id="action-buttons">
          <button class="action-btn" id="btn-policies">📜 Policies</button>
          <button class="action-btn" id="btn-save">💾 Save</button>
          <button class="action-btn" id="btn-load">📂 Load</button>
          <button class="action-btn" id="btn-reset">🔄 Reset</button>
        </div>
      </div>
      <div id="side-panel" class="panel">
        <div class="panel-title" id="panel-title">Info</div>
        <div id="panel-content"></div>
      </div>
      <div id="toast-container"></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
