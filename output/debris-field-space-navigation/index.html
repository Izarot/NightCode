<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🚀 Debris Field Navigator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="touchControls" class="touch-controls">

      <div class="stick" id="stick"></div>

    <button class="btn" id="btnThrust" aria-label="Thrust">⬆️</button>
    <button class="btn" id="btnReverse" aria-label="Reverse">⬇️</button>
    <button class="btn" id="btnShield" aria-label="Shield">🛡️</button>
  </div>
  <script src="config.json"></script>
  <script src="game.js"></script>
</body>
</html>
