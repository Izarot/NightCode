<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>" />
<title>🎵 Note Jumper</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Orbitron',sans-serif;color:#fff;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9;background:linear-gradient(180deg,#0a0a12,#1a1a2e);box-shadow:0 0 40px rgba(0,212,255,.3);}
  #hud{position:fixed;top:0;left:0;right:0;height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:14px;background:rgba(10,10,18,.55);backdrop-filter:blur(6px);pointer-events:none;z-index:10;}
  #hud .left,#hud .right,#hud .center{font-family:'JetBrains Mono',monospace;text-shadow:0 0 10px rgba(0,212,255,.5);}
  #hud .center{font-size:18px;color:#00d4ff;}
  #footer{position:fixed;bottom:0;left:0;right:0;height:32px;display:flex;justify-content:center;align-items:center;gap:14px;font-size:12px;background:rgba(10,10,18,.55);backdrop-filter:blur(6px);pointer-events:none;z-index:10;font-family:'JetBrains Mono',monospace;}
  #timer{position:fixed;top:54px;right:18px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#f8b500;text-shadow:0 0 8px rgba(248,181,0,.6);z-index:10;pointer-events:none;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,18,.85);z-index:20;}
  .overlay h1{font-size:48px;background:linear-gradient(90deg,#ff6b9d,#00d4ff,#f8b500);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(0,212,255,.4);}
  .overlay h2{font-size:32px;margin-top:14px;color:#00d4ff;}
  .overlay p{font-size:16px;margin-top:10px;opacity:.85;}
  .btn{margin-top:22px;padding:12px 28px;border:2px solid #00d4ff;background:transparent;color:#00d4ff;font-family:'Orbitron',sans-serif;font-size:18px;cursor:pointer;border-radius:6px;text-shadow:0 0 10px #00d4ff;transition:.2s;}
  .btn:hover{background:#00d4ff;color:#0a0a12;transform:scale(1.05);}
  .song-list{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
  .song-row{padding:10px 18px;border:1px solid rgba(0,212,255,.3);border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:14px;}
  .song-row:hover{border-color:#00d4ff;background:rgba(0,212,255,.1);}
  .hidden{display:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hud">
  <div class="left" id="songName">SONG: ---</div>
  <div class="center" id="combo">COMBO: 0x</div>
  <div class="right" id="score">SCORE: 0</div>
</div>
<div id="timer">⏱ 0:00.00</div>
<div id="footer">A/D MOVE &nbsp;·&nbsp; SPACE JUMP &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; R RESTART &nbsp;·&nbsp; M METRONOME</div>
<div class="overlay" id="titleScreen">
  <h1>🎵 NOTE JUMPER 🎵</h1>
  <p>Platform through music. Each note plays a tone.</p>
  <button class="btn" id="startBtn">PRESS SPACE TO START</button>
  <div class="song-list" id="songList"></div>
</div>
<div class="overlay hidden" id="pauseScreen">
  <h2>PAUSED</h2>
  <p>Press P to Resume</p>
  <button class="btn" id="resumeBtn">RESUME</button>
</div>
<div class="overlay hidden" id="completeScreen">
  <h2 id="completeTitle">SONG COMPLETE!</h2>
  <p id="completeStats"></p>
  <p id="completeHigh"></p>
  <button class="btn" id="nextBtn">NEXT SONG</button>
  <button class="btn" id="retryBtn">RETRY</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
