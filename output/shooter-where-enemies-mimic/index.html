<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'><title>Weapon Mimicry Shooter</title><link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>'></head><body><canvas id='game'></canvas><script>const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');canvas.width=800;canvas.height=600;let score=0;let highScore=0;let player={x:400,y:300,hp:100,w:30,h:30,weapon:'pistol'};let enemies=[];let bullets=[];let particles=[];let lastTime=0;let elapsed=0;function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}window.addEventListener('resize',resize);function loop(t){let dt=Math.min(0.05,(t-lastTime)/1000||0);lastTime=t;update(dt);render();requestAnimationFrame(loop);}function update(dt){elapsed+=dt;player.x+=0;player.y+=0;enemies.forEach(e=>{if(e.hp<=0){e.mimic=true;}});bullets.forEach((b,i)=>{if(b.life<=0){bullets.splice(i,1);}});}function render(){ctx.fillStyle='#0b0033';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00f0ff';ctx.fillRect(0,0,canvas.width,20);ctx.fillStyle='#ff00ff';ctx.fillRect(0,canvas.height-20,canvas.width,20);ctx.fillStyle='#39ff14';ctx.fillRect(0,0,20,canvas.height);ctx.fillStyle='#ff00ff';ctx.fillRect(canvas.width-20,0,20,canvas.height);ctx.fillStyle='#fff';ctx.font='20px monospace';ctx.fillText('Score: '+score,10,30);ctx.fillText('High: '+highScore,10,60);ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,80,80,12);ctx.fillStyle='#0f0';ctx.fillRect(12,82,76,8);ctx.fillStyle='#fff';ctx.fillText('HP: '+player.hp,10,110);ctx.fillStyle='#fff';ctx.fillText('Weapon: '+player.weapon.toUpperCase(),10,140);requestAnimationFrame(loop);}window.onload=()=>{lastTime=performance.now();requestAnimationFrame(loop);};</script></body></html>
