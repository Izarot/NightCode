<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline Silhouette Simulator</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg" width=\"32" height=\"32">
    <path d=\"M16 2C7.27 2 2 7.27 2 16s5.27 14 14 14 14-5.27 14-14S21.73 2 16 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7zm0-6c-2.66 0-4.87 2.21-4.87 4.87s2.21 4.87 4.87 4.87 4.87-2.21 4.87-4.87-2.21-4.87-4.87-4.87z"></path>
  </svg>"
  >
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      background: #000;
    }
    .ui {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    .top-bar {
      background: rgba(255,255,255,0.9);
      padding: 10px;
      display: flex;
      gap: 10px;
    }
    .tool-selector {
      display: flex;
    }
    .layer-panel {
      display: flex;
      flex-wrap: wrap;
    }
    .layer-thumbnail {
      width: 30px;
      height: 30px;
      background: #888;
      border: 1px solid #333;
      cursor: pointer;
    }
    .status-bar {
      background: rgba(255,255,255,0.9);
      padding: 10px;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-between;
    }
    .health-gauge {
      width: 100px;
      height: 100px;
      border: 2px solid #333;
      border-radius: 50%;
      position: relative;
    }
    .health-fill {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      background: #4CAF50;
    }
    .coordinates {
      font-size: 12px;
    }
    .fps {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="top-bar">
      <div class="tool-selector">
        <button onclick="selectTool('pen')">Pen</button>
        <button onclick="selectTool('brush')">Brush</button>
        <button onclick="selectTool('shape')">Shape</button>
        <button onclick="selectTool('stamp')">Stamp</button>
      </div>
      <div class="layer-panel">
        <div class="layer-thumbnail" onclick="selectLayer(0)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(1)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(2)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(3)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(4)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(5)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(6)"></div>
        <div class="layer-thumbnail" onclick="selectLayer(7)"></div>
      </div>
    </div>
    <div class="status-bar">
      <div class="health-gauge"><div class="health-fill"></div></div>
      <div>Coordinates: <span id="coordinates">0, 0</span></div>
      <div>FPS: <span id="fps">60</span></div>
    </div>
  </div>
  <canvas id="gameCanvas" width="1200" height="2000"></canvas>
  <script>
    // Responsive canvas setup
    function resizeCanvas() {
      const canvas = document.getElementById('gameCanvas');
      const scale = Math.min(window.innerWidth / 1200, window.innerHeight / 2000);
      canvas.width = 1200 * scale;
      canvas.height = 2000 * scale;
      canvas.style.width = '1200px';
      canvas.style.height = '2000px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Canvas context and layers
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const layers = Array.from({length: 8}, () => []);
    let activeLayer = 0;
    let currentTool = 'pen';
    let isDrawing = false;
    let lastX, lastY;
    let currentColor = '#000';
    let zoom = 1;
    let offsetX = 0, offsetY = 0;
    let undoStack = [], redoStack = [];
    let cityHealth = 100;
    let isPaused = false;
    let lastPauseTime = 0;
    let cursorX = 0, cursorY = 0;
    let isMobile = /Mobi|Android/i.test(navigator.userAgent);

    // Input handling
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDrawing = true;
        lastX = e.clientX - offsetX;
        lastY = e.clientY - offsetY;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
      }
    });
    canvas.addEventListener('mousemove', (e) => {
      if (isDrawing) {
        const x = e.clientX - offsetX;
        const y = e.clientY - offsetY;
        ctx.lineTo(x, y);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentTool === 'pen' ? 5 : 10;
        ctx.stroke();
        lastX = x;
        lastY = y;
      }
      cursorX = e.clientX - offsetX;
      cursorY = e.clientY - offsetY;
      updateCoordinates();
    });
    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      ctx.closePath();
    });
    canvas.addEventListener('wheel', (e) => {
      zoom = Math.min(Math.max(zoom * (e.deltaY < 0 ? 1.1 : 0.9), 0.25), 2);
      offsetX = canvas.width / 2 - (canvas.width / 2) / zoom;
      offsetY = canvas.height / 2 - (canvas.height / 2) / zoom;
      resizeCanvas();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'f') toggleFreehand();
      if (e.key === 'Tab') cycleLayers();
      if (e.key === 'z' && (navigator.platform !== 'Mac' || e.ctrlKey)) undo();
      if (e.key === 'y' && (navigator.platform !== 'Mac' || e.ctrlKey)) redo();
    });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      isDrawing = true;
      lastX = touch.clientX - offsetX;
      lastY = touch.clientY - offsetY;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const x = touch.clientX - offsetX;
      const y = touch.clientY - offsetY;
      ctx.lineTo(x, y);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentTool === 'pen' ? 5 : 10;
      ctx.stroke();
      lastX = x;
      lastY = y;
    });
    canvas.addEventListener('touchend', () => {
      isDrawing = false;
      ctx.closePath();
    });

    // Layer management
    function selectLayer(index) {
      activeLayer = index;
      updateLayerThumbnails();
    }
    function cycleLayers() {
      activeLayer = (activeLayer + 1) % 8;
      updateLayerThumbnails();
    }
    function updateLayerThumbnails() {
      const thumbnails = document.querySelectorAll('.layer-thumbnail');n
      thumbnails.forEach((thumb, i) => {
        thumb.style.background = i === activeLayer ? '#333' : '#888';
      });
    }

    // Tool selection
    function selectTool(tool) {
      currentTool = tool;
    }
    function toggleFreehand() {
      // Implement freehand mode
    }

    // Undo/Redo
    function undo() {
      if (undoStack.length > 0) {
        redoStack.push([...layers[activeLayer]]);
        layers[activeLayer] = undoStack.pop();
        render();
      }
    }
    function redo() {
      if (redoStack.length > 0) {
        undoStack.push([...layers[activeLayer]]);
        layers[activeLayer] = redoStack.pop();
        render();
      }
    }

    // City health calculation
    function calculateCityHealth() {
      let totalHeight = 0;
      let leftHeight = 0, rightHeight = 0;
      const width = canvas.width;
      for (let x = 0; x < width; x++) {
        let maxY = 0;
        for (let layer of layers) {
          for (let path of layer) {
            // Simplified height calculation
            maxY = Math.max(maxY, path.y);
          }
        }
        totalHeight += maxY;
        if (x < width / 2) leftHeight += maxY;
        else rightHeight += maxY;
      }
      const balance = Math.abs(leftHeight - rightHeight);
      const density = totalHeight / width;
      const variety = layers.filter(layer => layer.length > 0).length;
      cityHealth = 100 - (balance / (width * 2000) * 50) - (density / 100 * 20) - (variety / 8 * 10);
      updateHealthGauge();
    }

    // Health gauge
    function updateHealthGauge() {
      const gauge = document.querySelector('.health-fill');
      gauge.style.background = cityHealth > 80 ? '#4CAF50' : cityHealth > 40 ? '#FFC107' : '#F44336';
      gauge.style.transform = `rotate(${cityHealth * 3.6}deg)`;
    }

    // Render loop
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      layers.forEach((layer, i) => {
        layer.forEach(path => {
          ctx.strokeStyle = i === activeLayer ? '#fff' : '#888';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(path.x, path.y);
          ctx.lineTo(path.x + 10, path.y + 10);
          ctx.stroke();
        });
      });
      requestAnimationFrame(render);
      calculateCityHealth();
      updateFPS();
    }
    render();

    // FPS counter
    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      const now = performance.now();
      if (now - lastTime > 1000) {
        document.getElementById('fps').textContent = Math.round(frameCount / ((now - lastTime) / 1000));
        lastTime = now;
        frameCount = 0;
      }
      frameCount++;
    }

    // Coordinates display
    function updateCoordinates() {
      document.getElementById('coordinates').textContent = `${Math.round(cursorX)}, ${Math.round(cursorY)}`;
    }

    // Sound effects
    function playSound(url) {
      const audio = new Audio(url);
      audio.play();
    }
    // Example: Play sound on tool selection
    document.querySelectorAll('.tool-selector button').forEach(button => {
      button.addEventListener('click', () => {
        playSound('https://example.com/sounds/tool.mp3');
      });
    });

    // Export functionality
    function exportSketch() {
      const sketchData = {
        layers: layers.map(layer => layer.map(path => ({x: path.x, y: path.y}))),
        zoom,
        offsetX,
        offsetY,
        currentColor
      };
      const blob = new Blob([JSON.stringify(sketchData)], {type: 'application/json'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'skyline.sketch';
      link.click();
    }

    // Auto-save
    setInterval(() => {
      localStorage.setItem('skylineState', JSON.stringify({
        layers: layers.map(layer => [...layer]),
        zoom,
        offsetX,
        offsetY,
        currentColor
      }));
    }, 30000);

    // Load state
    if (localStorage.getItem('skylineState')) {
      const state = JSON.parse(localStorage.getItem('skylineState'));
      layers = state.layers.map(layer => [...layer]);
      zoom = state.zoom;
      offsetX = state.offsetX;
      offsetY = state.offsetY;
      currentColor = state.currentColor;
      render();
    }

    // Responsive design
    function handleMobile() {
      if (isMobile) {
        document.body.style.touchAction = 'pan-x pan-y';
      }
    }
    handleMobile();
  </script>
</body>
</html>
