name: Run NightCode Cloud Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * *" # 11:00 PM IST (Night Shift)
    - cron: "30 6 * * *"  # 12:00 PM IST (Midnoon Shift - Fix Only)

permissions:
  contents: write

jobs:
  run-nightcode:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Configure Git & Run Orchestrator
        env:
         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
         RUN_MODE: ${{ github.event.schedule == '30 6 * * *' && 'FIX_ONLY' || 'FULL_RUN' }}
        run: |
          git config --global user.name "NightCode Bot"
          git config --global user.email "nightcode-bot@users.noreply.github.com"
          python code/orchestrator.py
