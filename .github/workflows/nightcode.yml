name: Run NightCode Cloud Workflow

on:
  workflow_dispatch:

jobs:
  run-nightcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Orchestrator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/orchestrator.py

      - name: Commit & Push Generated Code
        run: |
          git config --global user.name "NightCode Bot"
          git config --global user.email "nightcode-bot@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || (git commit -m "chore: auto-generate app in output directory" && git push)